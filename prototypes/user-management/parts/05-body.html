<div class="app">

  <!-- ═════════════ SIDEBAR ═════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="brandmark">CRS</div>
      <div style="min-width:0">
        <div class="sidebar__brandtext">Casino Reporting</div>
        <div class="sidebar__tenant u-truncate" id="tenantLine">Otium Group · Otium Casino</div>
      </div>
    </div>

    <div class="sidebar__search">
      <div class="input-wrap">
        <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="input" id="navSearch" type="search" placeholder="Search modules…" autocomplete="off" aria-label="Search modules">
      </div>
    </div>

    <nav class="sidebar__nav" id="nav" aria-label="Modules"></nav>

    <div class="sidebar__foot">
      <div class="pop usermenu" id="userMenu" role="menu"></div>
      <button class="usercard" id="userCardBtn" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
  </aside>

  <!-- ═════════════ MAIN ═════════════ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__burger" id="burger" aria-label="Open menu"></button>

      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

      <div class="u-spacer"></div>

      <div class="topsearch">
        <div class="input-wrap">
          <svg class="input-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="input" id="globalSearch" type="search" placeholder="Search people, modules…" autocomplete="off" aria-label="Global search">
        </div>
      </div>

      <!-- Permission simulator: re-gates the whole UI as if you held this role -->
      <div style="position:relative">
        <button class="simchip tip tip--left" id="simBtn" data-tip="Preview the UI as another role" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="pop" id="simMenu" role="menu" style="right:0; top:calc(100% + 6px); min-width:246px"></div>
      </div>

      <button class="icon-btn tip tip--left" id="themeBtn" data-tip="Switch theme" aria-label="Switch theme"></button>

      <div style="position:relative">
        <button class="icon-btn tip tip--left" id="bellBtn" data-tip="Notifications" aria-label="Notifications" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="pop" id="bellMenu" role="menu" style="right:0; top:calc(100% + 6px); width:300px"></div>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Quick-view drawer -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="User quick view"></aside>

<!-- Modal host -->
<div class="scrim" id="scrim" role="dialog" aria-modal="true"></div>

<!-- Toasts -->
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Mobile sidebar scrim -->
<div class="drawer-scrim" id="navScrim" style="z-index:200"></div>
