<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost &amp; usage · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  /* Claude Code Desktop spec (brain/design/claude-code-spec.md): two type sizes
     only (13/20 body, 12/16 meta), radii 4/6/8/10/50%, no shadows outside
     popovers, no hue in chrome, letter-spacing 0, weight never above 600. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);letter-spacing:0}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 22px 90px}
  /* §3 — page title is body scale; the spec has no display sizes in chrome. */
  h1{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--cc-text-primary);margin:0 0 4px;font-weight:600;letter-spacing:0}
  .sub{color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono);margin-bottom:20px}
  /* quiet meta pill — no tinted surface, sentence case, no tracking */
  .est{background:var(--cc-bg-control);color:var(--cc-text-muted);border-radius:var(--radius-pill);padding:1px 7px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;letter-spacing:0;text-transform:none;margin-left:8px;vertical-align:middle;display:inline-block}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
  /* §8 card: surface only — no border, no shadow, r8 */
  .tile{background:var(--cc-bg-card);border:0;border-radius:var(--radius-card);padding:12px 14px;box-shadow:none}
  .tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;color:var(--cc-text-primary)}
  .tile .k{color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}
  /* §3 section header: 12px sentence case, no uppercase, no tracking */
  h2{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-muted);font-weight:600;margin:24px 0 8px}
  .chart{background:var(--cc-bg-card);border:0;border-radius:var(--radius-card);padding:16px;box-shadow:none}
  table{width:100%;border-collapse:collapse;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  th{text-align:left;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--cc-border-divider)}
  td{padding:6px 8px;border-bottom:1px solid var(--cc-border-divider);color:var(--cc-text-body);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  td.key{color:var(--cc-text-primary);font-weight:600}
  /* routing flag: neutral surface, hue only on the text inside (§1 semantics) */
  .flag{background:var(--cc-bg-card);border:0;border-radius:var(--radius-btn);padding:8px 12px;margin-bottom:6px;color:var(--cc-text-body);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);box-shadow:none}
  .flag b{color:var(--cc-warning);font-weight:600}
  .empty{color:var(--cc-text-muted);font-style:italic;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  /* §6 button: #313131 → hover #393938 → active #2A2A29, r6, h24, 13px */
  .hbtn{background:var(--cc-bg-control);border:0;color:var(--cc-text-body);border-radius:var(--radius-btn);height:var(--cc-button-h);padding:0 10px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;letter-spacing:0;cursor:pointer;box-shadow:none}
  .hbtn:hover{background:var(--cc-bg-control-strong);color:var(--cc-text-primary)}
  .hbtn:active{background:var(--cc-bg-segment-track)}
  b,strong{font-weight:600} /* §3 — bold runs 600, never 700+ */
  a{color:var(--cc-link);text-decoration:none}
  a:hover{text-decoration:underline}
  /* §2 focus ring is white at 22% — never coloured */
  :focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="empty" style="padding:60px">Loading…</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd=n=>'$'+(+n||0).toFixed(n<1?4:2);
const fmtTok=n=>(+n||0)>=1e6?((n/1e6).toFixed(1)+'M'):(+n||0)>=1e3?((n/1e3).toFixed(1)+'k'):String(n||0);
function trendChart(byDay){
  const days=Object.keys(byDay).sort();
  if(!days.length) return '<div class="empty">No runs logged yet.</div>';
  const vals=days.map(d=>byDay[d].cost);
  const max=Math.max(...vals,0.0001);
  const W=Math.max(320,days.length*54), H=140, pad=24;
  const x=i=>pad+i*((W-2*pad)/Math.max(1,days.length-1));
  const y=v=>H-pad-(v/max)*(H-2*pad);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  const cs=getComputedStyle(document.documentElement);
  // Claude Code Desktop spec §1: chrome carries NO hue, and a cost trend is not a
  // semantic (added/removed/warning) signal — so the series is drawn in the
  // neutral ink ramp, not the accent. Literals below are the dark-theme values of
  // these exact tokens (tokens.css :root — secondary #939393, muted #7F7F7F,
  // divider #343433) and apply only if a var() resolves empty.
  const ser=cs.getPropertyValue('--cc-text-secondary').trim()||'#939393',
        mut=cs.getPropertyValue('--cc-text-muted').trim()||'#7F7F7F',
        lin=cs.getPropertyValue('--cc-border-divider').trim()||'#343433';
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-width:${W}px">`;
  // hairline gridlines + baseline (--cc-border-divider), 1px, no fills
  [0,.5,1].forEach(f=>{ const gy=y(max*f); svg+=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="${lin}" stroke-width="1"/>`; });
  svg+=`<polyline fill="none" stroke="${ser}" stroke-width="1" points="${pts}"/>`;
  vals.forEach((v,i)=>{ svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="2" fill="${ser}"/>`; });
  days.forEach((d,i)=>{ svg+=`<text x="${x(i)}" y="${H-6}" font-size="12" fill="${mut}" text-anchor="middle" font-family="monospace">${esc(d.slice(5))}</text>`; });
  svg+=`<text x="${pad}" y="12" font-size="12" fill="${mut}" font-family="monospace">${fmtUsd(max)}/day peak</text></svg>`;
  return svg;
}
async function load(){
  let d; try{ d=await (await fetch('/api/usage-analytics')).json(); }catch{ $('wrap').innerHTML='<div class="empty" style="padding:60px">Could not load usage.</div>'; return; }
  const t=d.totals, po=d.byPurpose, bm=d.byModel;
  const purposeRows=Object.entries(po).sort((a,b)=>b[1].cost-a[1].cost).map(([k,v])=>`<tr><td class="key">${esc(k)}</td><td class="n">${v.runs}</td><td class="n">${fmtTok(v.in+v.out)}</td><td class="n">${fmtUsd(v.cost)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No runs yet.</td></tr>';
  const modelRows=Object.entries(bm).sort((a,b)=>b[1].cost-a[1].cost).map(([k,v])=>`<tr><td class="key">${esc(k||'?')}</td><td class="n">${v.runs}</td><td class="n">${fmtUsd(v.cost)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">—</td></tr>';
  const win=d.windows;
  $('wrap').innerHTML=`
    <h1>Cost &amp; usage <span class="est">estimated</span></h1>
    <div class="sub">tokens × published rates · verification-subagent tokens run externally &amp; aren't captured</div>
    <div class="tiles">
      <div class="tile"><div class="v">${fmtUsd(t.costUsd)}</div><div class="k">Total spend (est)</div></div>
      <div class="tile"><div class="v">${t.runs}</div><div class="k">Model runs</div></div>
      <div class="tile"><div class="v">${fmtTok(t.in+t.out)}</div><div class="k">Tokens</div></div>
      <div class="tile"><div class="v">${d.costPerOutcome.usdPerVerifiedChunk!=null?fmtUsd(d.costPerOutcome.usdPerVerifiedChunk):'—'}</div><div class="k">Per verified chunk (${d.costPerOutcome.verifiedChunks})</div></div>
      ${win?`<div class="tile"><div class="v">${Math.round((win.five_hour&&win.five_hour.used_percentage)||0)}%</div><div class="k">5-hour window</div></div>
      <div class="tile"><div class="v">${Math.round((win.seven_day&&win.seven_day.used_percentage)||0)}%</div><div class="k">7-day window</div></div>`:''}
    </div>
    <h2>Spend trend (by day)</h2>
    <div class="chart">${trendChart(d.byDay)}</div>
    <h2>By purpose</h2>
    <table><tr><th>Purpose</th><th style="text-align:right">Runs</th><th style="text-align:right">Tokens</th><th style="text-align:right">Cost</th></tr>${purposeRows}</table>
    <h2>By model</h2>
    <table><tr><th>Model</th><th style="text-align:right">Runs</th><th style="text-align:right">Cost</th></tr>${modelRows}</table>
    <h2>Routing audit</h2>
    ${d.routingAudit.length?d.routingAudit.map(s=>`<div class="flag"><b>${esc(s.purpose)}</b> ran on ${esc(s.model)} ×${s.count} — ${esc(s.suggestion)}</div>`).join(''):'<div class="empty">No re-route suggestions — everything ran on an appropriate model.</div>'}
    <div style="margin-top:18px;color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)">${esc(d.note)}</div>
  `;
}
load();
</script>
</body>
</html>
