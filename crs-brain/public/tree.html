<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Tree · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  /* --sans lives in tokens.css — no local font stack here.
     SPEC: brain/design/claude-code-spec.md (Claude Code Desktop 1:1, 2026-08-06).
     Only two type sizes exist — 13px/20px body+titles+buttons, 12px/16px meta.
     Weight never above 600 · letter-spacing 0 everywhere · no uppercase headers ·
     radii 4/6/8/10/50% only · shadows on popovers ONLY · nothing scales or lifts. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  h1{color:var(--primary);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;margin:0}
  .sub{color:var(--muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-top:4px}
  .saved{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--muted);display:flex;align-items:center;gap:6px;min-height:20px}
  .saved.ok{color:var(--good)} .saved.err{color:var(--danger)}
  .summary{margin:16px 0 8px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel);padding:16px}
  /* rollup bar — PTREE.4 palette UNCHANGED: done --good, in-progress --warn, track --bg-tertiary (see COLOR map) */
  .bar{display:flex;height:6px;border-radius:var(--radius-badge);overflow:hidden;background:var(--bg-tertiary);margin-bottom:12px}
  .bar>i{display:block;height:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .d-done{background:var(--good)} .d-in-progress{background:var(--warn)} .d-not-started{background:var(--na)} .d-roadmap{background:var(--accent2)}
  .toolbar{display:flex;gap:8px;align-items:center;margin:16px 0 8px;flex-wrap:wrap}
  .toolbar .hint{color:var(--muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-left:auto}
  /* PTREE.3 — segmented control stays GREYSCALE. Spec segment: track #2A2A29,
     thumb #40403F + 1px #474746 + #E8E6E1 ink. Never a hue, never an accent fill. */
  .seg{display:flex;background:var(--cc-bg-segment-track);border:1px solid var(--line);border-radius:var(--radius-card);padding:2px;gap:2px}
  .seg button{border:1px solid var(--transparent);background:none;color:var(--muted);font-family:inherit;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;padding:3px 10px;border-radius:var(--radius-btn);cursor:pointer;transition:background-color var(--transition-colors),color var(--transition-colors),border-color var(--transition-colors)}
  .seg button:hover{color:var(--primary)}
  .seg button.on{background:var(--cc-bg-segment-thumb);border-color:var(--cc-border-segment);color:var(--cc-text-primary)}
  .seg button:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  /* module rows ARE the spec's nav row: h26 · pitch 28 (26 + 2 gap) · r6 ·
     transparent/#939393 · hover #2A2A29 · open/selected #343433 + #E8E6E1 ink. */
  .list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .sec-label{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--muted);margin:16px 2px 4px}
  .item{border-radius:var(--radius-btn);background:var(--transparent);overflow:hidden;transition:margin-top var(--transition),margin-bottom var(--transition),background-color var(--transition-colors),color var(--transition-colors)}
  .item:hover{background:var(--cc-bg-hover-canvas)}
  .item.open,.item.open:hover{background:var(--cc-bg-selected)}
  .item.open .nm{color:var(--primary)}
  .item.focus-now{outline:1px solid var(--accent-glow);outline-offset:-1px}
  .row{position:relative;display:flex;align-items:center;gap:8px;height:var(--cc-nav-row-h);padding:0 8px;cursor:grab}
  .row.dragging{cursor:grabbing}
  /* whole-row drag: the picked-up row takes the SELECTED surface — no lift, no
     scale, no shadow (spec §MOTION/§SHADOWS); siblings open the gap via margin */
  .item.dragging{background:var(--cc-bg-selected)}
  .item.drop-above{margin-top:16px} .item.drop-below{margin-bottom:16px}
  @keyframes settle{from{opacity:.4}to{opacity:1}}
  .item.settle{animation:settle var(--transition)}
  .ord{font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--muted);width:22px;text-align:right;flex:0 0 auto}
  .body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
  .nm{color:var(--muted);font-weight:600;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0;overflow:hidden;white-space:nowrap}
  .sec-tag{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:var(--radius-pill);padding:0 6px;white-space:nowrap;flex:0 0 auto}
  .doc-tag{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--success);background:var(--success-tint);border-radius:var(--radius-pill);padding:0 6px;white-space:nowrap;flex:0 0 auto}
  .pct{flex:0 0 auto;font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--text-muted);min-width:32px;text-align:right}
  /* status = plain word, semantic hue at text scale only (cycling lives in the ⋮ menu) */
  .stword{flex:0 0 auto;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;white-space:nowrap}
  .stword.done{color:var(--success)}
  .stword.in-progress{color:var(--warning)}
  .stword.not-started{color:var(--text-secondary)}
  .stword.roadmap{color:var(--accent-text)}
  /* hover-revealed row actions — spec icon button: transparent/#7F7F7F, hover
     rgba(255,255,255,.06), radius 4, 24px box */
  .dots{flex:0 0 auto;width:24px;height:24px;border:none;background:none;color:var(--cc-text-muted);border-radius:var(--radius-code);cursor:pointer;font-size:var(--cc-fs-sm);line-height:1;padding:0;font-family:inherit;opacity:0;transition:opacity var(--transition-colors),background-color var(--transition-colors),color var(--transition-colors)}
  .row:hover .dots,.dots:focus-visible,.dots[aria-expanded="true"]{opacity:1}
  .dots:hover{background:var(--cc-border-soft);color:var(--primary)}
  .dots:focus-visible{outline:1px solid var(--accent-glow);outline-offset:-1px}
  /* floating menu — the ONLY shadow in this file (a real popover, not a card) */
  .rowmenu{position:fixed;z-index:320;min-width:176px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-dropdown);padding:4px;display:none}
  .rowmenu.show{display:block}
  .rowmenu button{display:block;width:100%;background:none;border:0;color:var(--text-secondary);padding:4px 10px;border-radius:var(--radius-btn);cursor:pointer;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);text-align:left}
  .rowmenu button:hover:not(:disabled){background:var(--cc-bg-control-strong);color:var(--primary)}
  .rowmenu button:disabled{color:var(--text-disabled);cursor:default}
  /* detail panel */
  .detail{border-top:1px solid var(--line);padding:16px;background:var(--bg-primary);display:none}
  .item.open .detail{display:block}
  .dgrid{display:flex;flex-direction:column;gap:12px}
  /* section headers: 12px sentence case, no uppercase, no tracking (spec §TYPE) */
  .dsec h4{margin:0 0 4px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--text-muted);display:flex;align-items:center;gap:8px}
  .dsec h4 .cnt{color:var(--secondary)}
  .dsec .none{color:var(--muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-style:italic}
  /* raw renderer — the honest source twin */
  .dsec pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-card);padding:8px 12px;font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--secondary);white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}
  .mini{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:var(--radius-btn);font-family:inherit;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;padding:2px 8px;cursor:pointer}
  .mini:hover{color:var(--primary);border-color:var(--line2);background:var(--cc-bg-control-strong)}
  .mini:active{background:var(--cc-bg-hover-canvas)}
  .mini:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  /* executive renderer — parsed md: real tables + clean prose, never a pre fence */
  .xmd{font-size:var(--cc-fs-sm);color:var(--secondary);line-height:var(--cc-lh-sm);max-height:420px;overflow:auto;padding-right:2px}
  .xmd p{margin:0 0 8px}
  .xmd p:last-child,.xmd ul:last-child,.xmd ol:last-child{margin-bottom:0}
  .xmd h5{margin:12px 0 4px;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;color:var(--primary)}
  .xmd h5:first-child{margin-top:0}
  .xmd b{color:var(--primary);font-weight:600}
  .xmd ul,.xmd ol{margin:0 0 8px;padding-left:18px}
  .xmd li{margin:2px 0}
  .xmd .quote{border-left:1px solid var(--line3);background:var(--bg-tertiary);border-radius:0 var(--radius-btn) var(--radius-btn) 0;padding:8px 10px;margin:0 0 8px;color:var(--muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .xmd .quote p{margin:0 0 4px} .xmd .quote p:last-child{margin:0}
  .xmd .vfy{color:var(--warning);background:var(--warning-tint);border-radius:var(--radius-badge);padding:0 5px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;white-space:nowrap}
  .xtblwrap{overflow-x:auto;margin:0 0 8px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel)}
  .xtblwrap:last-child{margin-bottom:0}
  .xtbl{width:100%;border-collapse:collapse;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .xtbl th{text-align:left;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--bg-tertiary);white-space:nowrap}
  .xtbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--secondary)}
  .xtbl tr:last-child td{border-bottom:none}
  /* exec briefing bits */
  .xstrip{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .xstrip .xname{color:var(--primary);font-weight:600;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .xstrip .pct{min-width:0}
  .xstrip .xsent{flex-basis:100%;color:var(--secondary);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .inprog{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--warning);background:var(--warning-tint);border-radius:var(--radius-badge);padding:0 5px;margin-left:6px;white-space:nowrap}
  .donesum{margin-top:8px;border:none;background:none;color:var(--muted);font:inherit;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);cursor:pointer;padding:2px 0;text-align:left;display:block}
  .donesum:hover{color:var(--secondary)}
  .donesum:focus-visible{outline:1px solid var(--accent-glow);outline-offset:2px;border-radius:var(--radius-btn)}
  .donelist{margin-top:8px;opacity:.75}
  .callout{background:var(--warning-tint);color:var(--warning);border-radius:var(--radius-btn);padding:6px 10px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin:0 0 8px}
  .ghost{margin-left:auto;border:1px solid var(--transparent);background:none;color:var(--muted);border-radius:var(--radius-btn);font-family:inherit;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;padding:2px 8px;cursor:pointer}
  .ghost:hover{color:var(--secondary);background:var(--cc-bg-hover-canvas)}
  .ghost:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  .xmd .tcol-tech{display:none}
  .detail.showtech .tcol-tech{display:table-cell}
  .mention{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-bottom:8px}
  .mention b{color:var(--primary);font-weight:600}
  .mention .mline{color:var(--muted);font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);display:block;padding:1px 0 1px 10px;border-left:1px solid var(--line2);margin-left:2px}
  /* links — spec: #6DA7EC (var(--accent-text)), underline on hover */
  .filelinks{display:flex;gap:8px;flex-wrap:wrap;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .filelinks a{color:var(--accent-text);text-decoration:none;border:1px solid var(--line2);border-radius:var(--radius-btn);padding:2px 8px}
  .filelinks a:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  .filelinks a:hover{background:var(--cc-bg-hover-canvas);text-decoration:underline}
  .genbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
  /* button — spec matrix: #313131/#C3C2B7 · hover #393938 · active #2A2A29 · disabled #5F5F5C · h24 */
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-btn);height:var(--cc-button-h);padding:0 10px;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{color:var(--primary);border-color:var(--line2);background:var(--cc-bg-control-strong)}
  .btn:active{background:var(--cc-bg-hover-canvas)}
  .btn:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  /* "primary" = a stronger NEUTRAL surface, never a hue or an accent fill */
  .btn.primary{background:var(--cc-bg-control-strong);border-color:var(--cc-border-segment);color:var(--cc-text-primary)}
  .btn.primary:hover{background:var(--cc-bg-selected);border-color:var(--cc-border-segment)}
  .btn.primary:active{background:var(--cc-bg-hover-canvas)}
  .btn:disabled{color:var(--text-disabled);cursor:default}
  .btn svg{width:13px;height:13px;flex:0 0 auto}
  .promptbox{margin-top:8px;display:none}
  .promptbox.show{display:block}
  /* inputs — spec composer: #2C2C2A + #3D3D3B, focus border = white 22% ring token */
  .promptbox textarea{width:100%;height:230px;background:var(--cc-bg-composer);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--secondary);font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);padding:12px;resize:vertical}
  .promptbox textarea:focus{border-color:var(--accent-glow);outline:none}
  .reqta{width:100%;height:70px;background:var(--cc-bg-composer);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--secondary);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);padding:8px 12px;resize:vertical;margin-bottom:8px}
  .reqta:focus{border-color:var(--accent-glow);outline:none}
  .reqta::placeholder{color:var(--text-disabled)}
  /* checklist */
  .chklist{display:flex;flex-direction:column;gap:4px}
  .chk{display:flex;align-items:center;gap:8px}
  .chk-state{flex:0 0 auto;width:20px;height:20px;border-radius:var(--radius-badge);border:1px solid var(--input-border);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:var(--cc-fs-xs);line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
  .chk-state.partial{color:var(--warning);border-color:var(--input-border);background:var(--warning-tint)}
  .chk-state.done{color:var(--white) /* approved literal — check glyph on the --success fill */;border-color:var(--success);background:var(--success)}
  .chk-state:hover{border-color:var(--line3)}
  .chk-state:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  .chk-label{flex:0 0 auto;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--secondary);width:210px;max-width:46%}
  .chk-detail{flex:1;min-width:0;background:var(--transparent);border:none;border-bottom:1px dashed var(--line2);color:var(--muted);font-family:var(--sans);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);padding:2px}
  .chk-detail:focus{outline:none;border-bottom-color:var(--accent-glow);color:var(--secondary)}
  .chk-detail::placeholder{color:var(--text-disabled)}
  .chkprog{flex:0 0 auto;font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius-badge);padding:0 6px}
  .promptbox .prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .promptbox .plabel{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--muted)}
  select.filt{background:var(--panel2);border:1px solid var(--input-border);color:var(--secondary);border-radius:var(--radius-input);height:var(--cc-button-h);padding:0 8px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:inherit;cursor:pointer}
  select.filt:hover{background:var(--cc-bg-control-strong);color:var(--primary)}
  select.filt:focus{outline:none;border-color:var(--accent-glow)}
  select.filt:focus-visible{outline:1px solid var(--accent-glow);outline-offset:1px}
  input[type=checkbox]{accent-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  a.back{color:var(--accent-text);text-decoration:none;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  a.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="/">← CRS Brain</a>
      <h1>Progress Tree</h1>
      <div class="sub" id="sub">Modules in build-priority order. Drag a row to reorder · click a row to expand its brain detail + generate a Buildprint prompt · ⋮ for move / status.</div>
    </div>
    <div class="saved" id="saved"></div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <select class="filt" id="secFilter" onchange="render()"><option value="">All sections</option></select>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="groupSec" onchange="render()"> group by section
    </label>
    <div class="seg" role="tablist" aria-label="Detail renderer" title="Executive = parsed tables + prose · Raw = source blocks with Copy">
      <button id="seg-exec" role="tab" onclick="setView('exec')">Executive</button>
      <button id="seg-raw" role="tab" onclick="setView('raw')">Raw</button>
    </div>
    <span class="hint" id="focusHint"></span>
  </div>

  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>
<div class="rowmenu" id="rowmenu" role="menu"></div>

<script>
const VOCAB=['done','in-progress','not-started','roadmap'];
const LABEL={'done':'Done','in-progress':'In progress','not-started':'Not started','roadmap':'Roadmap'};
const COLOR={done:'var(--good)','in-progress':'var(--warn)','not-started':'var(--na)',roadmap:'var(--accent2)'};
let DATA={modules:[]}, saveTimer=null, dragId=null, justDragged=false, menuIdx=null;
const expanded=new Set(), detailCache={}, promptCache={}, lastKind={}, editReq={};
const KLABEL={edit:'EDIT prompt — paste into the Buildprint app (applies directly)',sync:'SYNC prompt — read-only, reports back into the brain'};
// single-app rule (override #37): when embedded, files open via the parent app, never a browser tab
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
// Executive ⇄ Raw detail renderer (ptree). Executive = parsed md; Raw = source twin.
let VIEW=localStorage.getItem('crs-tree-view')==='raw'?'raw':'exec';
function setView(v){ VIEW=v; try{localStorage.setItem('crs-tree-view',v);}catch(e){} paintSeg(); render(); }
function paintSeg(){ const ex=document.getElementById('seg-exec'), rw=document.getElementById('seg-raw'); ex.classList.toggle('on',VIEW==='exec'); rw.classList.toggle('on',VIEW==='raw'); ex.setAttribute('aria-selected',VIEW==='exec'); rw.setAttribute('aria-selected',VIEW==='raw'); }

async function load(){
  try{
    const r=await fetch('/api/modules'); DATA=await r.json();
    DATA.modules=(DATA.modules||[]).sort((a,b)=>(a.order||0)-(b.order||0));

/* ── Executive md renderer ─────────────────────────────────────────────
   Parses the known techRef/STATUS heading structures into real tables
   (§20.6) + clean prose. Anything unparseable falls through as prose —
   never a pre fence. */
// Executive-only inline pass: backticks → plain text (no code chips), status
// emoji stripped, VERIFY kept as a quiet chip. Raw view never touches this.
function stripEmoji(s){ return String(s||'').replace(/[✅🟡🔴➖✔❌⚠]/gu,'').replace(/️/g,''); } // exec-only display strip
function execText(s){
  return esc(s)
    .replace(/⚠️?\s*VERIFY/g,'\u0001')
    .replace(/[✅🟡🔴➖✔❌⚠]/gu,'').replace(/️/g,'')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function inlineMd(s){ return execText(s).replace(/\u0001/g,'<span class="vfy">VERIFY</span>'); }
// One amber callout line — ⚠️ VERIFY lines + blockquote warnings, no inline shouting.
function calloutLine(s){ return '<div class="callout">'+execText(s).replace(/\u0001/g,'VERIFY').trim()+'</div>'; }
function mdToHtml(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'); // strip CRLF so $-anchored heading regex survives a CRLF checkout
  const out=[]; let i=0, para=[], firstHead=true;
  const flush=()=>{ if(para.length){ out.push('<p>'+inlineMd(para.join(' '))+'</p>'); para=[]; } };
  const isSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.indexOf('-')>=0;
  const cells=l=>{ let p=l.trim(); if(p.startsWith('|'))p=p.slice(1); if(p.endsWith('|'))p=p.slice(0,-1); return p.split('|').map(c=>c.trim()); };
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|/.test(l)&&i+1<lines.length&&isSep(lines[i+1])){ // md table → real table
      flush();
      const head=cells(l); i+=2; const rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      // implementation columns hide by default in exec; the per-detail ghost toggle reveals them
      const tech=head.map(h=>/internal|_value|^id$/i.test(h.replace(/`|\*\*/g,'').trim()));
      const cls=ci=>tech[ci]?' class="tcol-tech"':'';
      out.push('<div class="xtblwrap"><table class="xtbl"><thead><tr>'+head.map((h,ci)=>'<th'+cls(ci)+'>'+inlineMd(h)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,ci)=>'<td'+cls(ci)+'>'+inlineMd(r[ci]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    const h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); if(firstHead){ firstHead=false; } else out.push('<h5>'+inlineMd(h[2])+'</h5>'); i++; continue; } // first heading = the section title, already shown
    if(/^\s*>/.test(l)){ flush(); const q=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      const qt=q.filter(x=>x.trim()).join(' ');
      if(/^\s*⚠|VERIFY|^\s*\*\*?warning/i.test(qt)){ out.push(calloutLine(qt)); continue; } // blockquote warning → one amber callout line
      out.push('<div class="quote">'+q.map(x=>x.trim()?'<p>'+inlineMd(x)+'</p>':'').join('')+'</div>'); continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ flush(); const ord=/^\s*\d+\./.test(l); const items=[];
      while(i<lines.length&&(/^\s*([-*]|\d+\.)\s+/.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){
        if(/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));
        else if(items.length) items[items.length-1]+=' '+lines[i].trim(); // continuation line
        i++;
      }
      out.push((ord?'<ol>':'<ul>')+items.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+(ord?'</ol>':'</ul>')); continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flush(); i++; continue; } // hr → drop
    if(!l.trim()){ flush(); i++; continue; }
    if(/⚠️?\s*VERIFY/.test(l)){ flush(); out.push(calloutLine(l.trim())); i++; continue; } // VERIFY line → one amber callout
    para.push(l.trim()); i++;
  }
  flush();
  return out.join('');
}

function detailHTML(id){
  const d=detailCache[id];
  if(!d) return '<div class="detail"><div class="dsec none">Loading…</div></div>';
  if(d.error) return `<div class="detail"><div class="dsec none">Could not load detail: ${esc(d.error)}</div></div>`;
  const m0=findMod(id), cl=(m0&&m0.checklist)||[];
  const cdone=cl.filter(c=>c.state==='done').length;
  // one interactive tri-state row — shared by both views so cycleChk/setChkDetail keep working everywhere
  const chkRow=(c,ci,extra)=>`<div class="chk"><button class="chk-state ${c.state}" title="click: todo → partial → done" onclick="cycleChk('${id}',${ci})">${c.state==='done'?'✓':c.state==='partial'?'◐':'○'}</button><span class="chk-label">${esc(VIEW==='exec'?stripEmoji(c.label):c.label)}${extra||''}</span><input class="chk-detail" value="${esc(c.detail||'')}" placeholder="notes… e.g. 128/128 done" oninput="setChkDetail('${id}',${ci},this.value)"></div>`;
  let checklist;
  if(VIEW==='raw'){
    checklist=`<div class="dsec"><h4>Definition of done — <span class="cnt">${cdone}/${cl.length}</span></h4><div class="chklist">${cl.map((c,ci)=>chkRow(c,ci)).join('')}</div></div>`;
  }else{
    // exec: What's left comes first — open items inline (live checklist UI), done items fold to one line
    const left=cl.map((c,ci)=>({c,ci})).filter(x=>x.c.state!=='done');
    const doneItems=cl.map((c,ci)=>({c,ci})).filter(x=>x.c.state==='done');
    const openDone=doneOpen.has(id);
    checklist=`<div class="dsec"><h4>What's left — <span class="cnt">${left.length?left.length+' item'+(left.length>1?'s':''):'none'}</span></h4>`+
      (cl.length
        ?(left.length?`<div class="chklist">${left.map(x=>chkRow(x.c,x.ci,x.c.state==='partial'?' <span class="inprog">in progress</span>':'')).join('')}</div>`:'')+
         (doneItems.length?`<button class="donesum" onclick="toggleDone('${id}')">${cdone} of ${cl.length} complete ✓ — ${openDone?'hide':'show'}</button>${openDone?`<div class="chklist donelist">${doneItems.map(x=>chkRow(x.c,x.ci)).join('')}</div>`:''}`:'')
        :`<div class="none">No definition-of-done checklist yet.</div>`)+
      `</div>`;
  }
  // one section, two renderers: Executive = parsed tables/prose · Raw = source pre + Copy
  const sec=(title,field,empty)=>{
    const body=d[field];
    if(!(body&&body.trim())) return `<div class="dsec"><h4>${title}</h4><div class="none">${empty}</div></div>`;
    if(VIEW==='raw') return `<div class="dsec"><h4>${title}<button class="mini" onclick="copyRaw('${id}','${field}',this)">Copy</button></h4><pre>${esc(body)}</pre></div>`;
    return `<div class="dsec"><h4>${title}</h4><div class="xmd">${mdToHtml(body)}</div></div>`;
  };
  let mentions='';
  if(d.mentions&&d.mentions.length){
    mentions=`<div class="dsec"><h4>Referenced across the brain ledger</h4>`+d.mentions.map(m=>
      `<div class="mention"><b>${esc(m.file)}</b> · ${m.count} mention${m.count>1?'s':''}`+
      m.lines.slice(0,6).map(l=>`<span class="mline">L${l.line}: ${esc(VIEW==='exec'?stripEmoji(l.text):l.text)}</span>`).join('')+
      (m.count>6?`<span class="mline">… +${m.count-6} more</span>`:'')+`</div>`).join('')+`</div>`;
  }
  const flink=(p,label)=>`<a class="flink" href="/api/file?path=${encodeURIComponent(p)}" data-path="${esc(p)}" target="_blank">${label} ↗</a>`;
  const links=[];
  // Entity overview page (Program 3 Phase 3) — everything the brain knows, aggregated.
  links.push(`<a class="flink" href="#" onclick="event.preventDefault();(window.parent&&window.parent.openTarget?window.parent.openTarget('/entity.html#module=${esc(id)}',{title:'${esc(m0?m0.name:id)}'}):location.href='/entity.html#module=${esc(id)}')">Brain overview ↗</a>`);
  if(d.techRef) links.push(flink(d.techRef,'Technical reference'));
  if(d.userManual) links.push(flink(d.userManual,'User manual'));
  links.push(flink('brain/STATUS.md','STATUS.md'));
  // exec skips the STATUS.md prose (briefing, not transcript) — Raw keeps it in full
  const statusSec=VIEW==='raw'
    ?sec('Status detail (brain/STATUS.md)','statusBlock','No expanded status block yet — only the Core-7 row in STATUS.md.')
    :`<div class="dsec"><h4>Status detail (brain/STATUS.md)</h4><div class="none">Full status prose in Raw view.</div></div>`;
  const mdSecs=statusSec+`
    `+sec('Data types & data model','dataModel',d.documented?'—':'Not documented yet. Generate the prompt below and run the Buildprint audit to inventory it.')+`
    `+sec('Option sets','optionSets',d.documented?'—':'Not documented yet.')+`
    `+sec('Permissions','perms',d.documented?'—':'Not documented yet.')+`
    `+sec('Workflows','workflows',d.documented?'—':'Not documented yet.');
  // exec-only top strip: name + status + % + one plain-English sentence generated from the DoD data
  let strip='';
  if(VIEW==='exec'){
    const plain=s=>String(s||'').replace(/[✅🟡🔴➖✔❌⚠`]/gu,'').replace(/️/g,'').trim();
    const pct=cl.length?Math.round(cdone/cl.length*100)+'%':'—';
    const nx=cl.find(c=>c.state!=='done');
    let sent;
    if(!cl.length) sent='No definition-of-done checklist yet.';
    else if(!nx) sent=`All ${cl.length} definition-of-done items complete.`;
    else{ sent=`${cdone} of ${cl.length} done · next: ${plain(nx.label)}.`; const dn=plain(nx.detail); if(dn&&dn.length<=60) sent+=` (${dn})`; }
    const techBtn=mdSecs.indexOf('tcol-tech')>=0?`<button class="ghost" onclick="event.stopPropagation();const d=this.closest('.detail'),on=d.classList.toggle('showtech');this.textContent=(on?'Hide':'Show')+' technical columns'">Show technical columns</button>`:'';
    strip=`<div class="xstrip"><span class="xname">${esc(m0?m0.name:id)}</span>${m0?`<span class="stword ${m0.status}">${LABEL[m0.status]||m0.status}</span>`:''}<span class="pct">${pct}</span>${techBtn}<span class="xsent">${esc(sent)}</span></div>`;
  }
  return `<div class="detail">${strip}<div class="dgrid">
    ${checklist}
    ${mdSecs}
    ${mentions}
    <div class="dsec"><h4>Files</h4><div class="filelinks">${links.join('')}</div></div>
    <div class="dsec"><h4>Buildprint prompts</h4>
      <label class="plabel" style="display:block;margin-bottom:5px">Describe the edit / feature you want — the Brain writes the Buildprint prompt from your words (grounded in this module + the live app):</label>
      <textarea id="req-${id}" class="reqta" spellcheck="true" oninput="editReq['${id}']=this.value" placeholder="e.g. Add a Status filter (Active / Inactive / All) to the user list, wired to the already-loaded list — dark + light, no new searches."></textarea>

        <button class="btn primary" id="gen-${id}" onclick="genEdit('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>Write Buildprint edit prompt</button>
        <button class="btn" onclick="genPrompt('${id}','sync')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5m2-3v5h-5M20 12a8 8 0 0 1-14 5m-2 3v-5h5"/></svg>Read &amp; sync → brain</button>
      </div>
      <div class="plabel" style="margin-top:6px"><b style="color:var(--secondary)">Edit</b> = the Brain turns your text into a ready-to-paste Buildprint prompt (savepoint, Pattern A, tokens, verify — applies directly). <b style="color:var(--secondary)">Sync</b> = read-only audit that reports back into the brain.</div>
      <div class="promptbox" id="pb-${id}">
        <div class="prow"><span class="plabel" id="pl-${id}"></span><div style="display:flex;gap:6px"><button class="btn primary" title="Open the Brain's Buildprint chat with this prompt" onclick="sendToBp(document.getElementById('pt-${id}').value)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Buildprint chat</button><button class="btn" id="cp-${id}" onclick="copyPrompt('${id}')">Copy</button></div></div>
        <textarea id="pt-${id}" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div></div>`;
}

function render(){
  closeMenu(); // indices go stale on re-render
  renderSummary();
  const filt=document.getElementById('secFilter').value;
  const grouped=document.getElementById('groupSec').checked;
  const list=document.getElementById('list'); list.innerHTML='';
  const focusIdx=DATA.modules.findIndex(m=>m.status!=='done'&&m.status!=='roadmap');
  document.getElementById('focusHint').textContent=focusIdx>=0?`Current focus: ${DATA.modules[focusIdx].name}`:'';
  let lastSec=null;
  DATA.modules.forEach((m,idx)=>{
    if(filt&&m.section!==filt) return;
    if(grouped&&m.section!==lastSec){ const h=document.createElement('div');h.className='sec-label';h.textContent=m.section;list.appendChild(h);lastSec=m.section; }
    const open=expanded.has(m.id);
    const item=document.createElement('div');
    item.className='item'+(open?' open':'')+(idx===focusIdx?' focus-now':'');
    item.dataset.idx=idx; item.dataset.mid=m.id;
    const docTag=(detailCache[m.id]&&detailCache[m.id].documented)?'<span class="doc-tag">DOCS</span>':'';
    // % straight from the checklist — empty checklist shows an honest dash, no fake denominator
    const cl=m.checklist||[];
    const cd=cl.filter(c=>c.state==='done').length;
    const pct=cl.length?Math.round(cd/cl.length*100)+'%':'—';
    item.innerHTML=
      `<div class="row" draggable="true">`+
        `<span class="ord">${idx+1}</span>`+
        `<div class="body"><span class="nm">${esc(m.name)}<span class="sec-tag">${esc(m.section)}</span>${docTag}</span></div>`+
        `<span class="pct" title="definition of done: ${cd} of ${cl.length} complete">${pct}</span>`+
        `<span class="stword ${m.status}">${LABEL[m.status]||m.status}</span>`+
        `<button class="dots" title="Row actions" aria-haspopup="menu" onclick="event.stopPropagation();openMenu(event,${idx})">⋮</button>`+
      `</div>`+
      (open?detailHTML(m.id):'');
    const row=item.querySelector('.row');
    // whole row expands — except mid-drag and except the ⋮ / its menu
    row.addEventListener('click',e=>{if(justDragged)return;if(e.target.closest('.dots')||e.target.closest('.rowmenu'))return;toggle(m.id);});
    row.addEventListener('dragstart',e=>{dragId=idx;justDragged=true;item.classList.add('dragging');row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{item.classList.remove('dragging');row.classList.remove('dragging');document.querySelectorAll('.item').forEach(r=>r.classList.remove('drop-above','drop-below'));setTimeout(()=>{justDragged=false;},0);});
    item.addEventListener('dragover',e=>{e.preventDefault();const b=item.getBoundingClientRect();const below=e.clientY>b.top+b.height/2;item.classList.toggle('drop-below',below);item.classList.toggle('drop-above',!below);});
    item.addEventListener('dragleave',()=>item.classList.remove('drop-above','drop-below'));
    item.addEventListener('drop',e=>{e.preventDefault();const to=parseInt(item.dataset.idx);if(dragId===null||dragId===to)return;const b=item.getBoundingClientRect();const below=e.clientY>b.top+b.height/2;let dest=below?to+1:to;const[mm]=DATA.modules.splice(dragId,1);if(dragId<dest)dest--;DATA.modules.splice(dest,0,mm);dragId=null;render();scheduleSave();const el=document.querySelector('.item[data-mid="'+(window.CSS&&CSS.escape?CSS.escape(mm.id):mm.id)+'"]');if(el){el.classList.add('settle');el.addEventListener('animationend',()=>el.classList.remove('settle'),{once:true});}});
    // restore prompt if it was generated
    list.appendChild(item);
    if(open){
      const req=document.getElementById('req-'+m.id); if(req&&editReq[m.id]!==undefined) req.value=editReq[m.id];
      if(lastKind[m.id]){ const k=lastKind[m.id],key=m.id+':'+k; const pb=document.getElementById('pb-'+m.id),pt=document.getElementById('pt-'+m.id),pl=document.getElementById('pl-'+m.id); if(pb&&pt&&promptCache[key]){pb.classList.add('show');pt.value=promptCache[key];if(pl)pl.textContent=KLABEL[k];} }
    }
  });
  if(!list.children.length) list.innerHTML='<div class="empty">No modules for this filter.</div>';
}
// file links: in-app when embedded (parent smartOpen), browser tab only standalone
document.addEventListener('click',e=>{
  const a=e.target.closest('a.flink');
  if(a&&EMBED&&window.parent&&window.parent.smartOpen){ e.preventDefault(); window.parent.smartOpen(a.dataset.path); }
});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
load();
</script>
