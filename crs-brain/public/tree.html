<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Tree · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  :root{ --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  h1{color:var(--primary);font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0}
  .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:20px}
  .saved.ok{color:var(--good)} .saved.err{color:var(--danger)}
  .summary{margin:16px 0 8px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel);padding:18px}
  .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--panel2);margin-bottom:10px}
  .bar>i{display:block;height:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .d-done{background:var(--good)} .d-in-progress{background:var(--warn)} .d-not-started{background:var(--na)} .d-roadmap{background:var(--accent2)}
  .toolbar{display:flex;gap:8px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
  .toolbar .hint{color:var(--muted);font-size:12px;margin-left:auto}
  /* view segmented toggle — greyscale active per user override #36 */
  .seg{display:flex;background:var(--bg-tertiary);border:1px solid var(--line);border-radius:var(--radius-btn);padding:2px;gap:2px}
  .seg button{border:none;background:none;color:var(--text-secondary);font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:calc(var(--radius-btn) - 2px);cursor:pointer;transition:background var(--transition),color var(--transition)}
  .seg button:hover{color:var(--text-primary)}
  .seg button.on{background:var(--bg-elevated);color:var(--text-primary)}
  .seg button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-glow)}
  .list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .sec-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 2px 2px}
  .item{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel);overflow:hidden}
  .item:hover{border-color:var(--line2)}
  .item.open{border-color:var(--line3)}
  .item.focus-now{border-color:var(--accent)}
  .row{position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px 11px}
  .row.dragging{opacity:.45}
  .item.drop-above{box-shadow:0 -2px 0 var(--accent)} .item.drop-below{box-shadow:0 2px 0 var(--accent)}
  /* per-row slim checklist progress bar (ptree) */
  .rowprog{position:absolute;left:12px;right:12px;bottom:4px;height:2px;border-radius:2px;background:var(--bg-tertiary);display:flex;overflow:hidden}
  .rowprog i{display:block;height:100%}
  .rowprog .pd{background:var(--good)} .rowprog .pp{background:var(--warn);opacity:.75}
  .grip{color:var(--muted);cursor:grab;font-size:15px;line-height:1;user-select:none;padding:0 2px}
  .grip:active{cursor:grabbing}
  .ord{font-family:var(--mono);font-size:12px;color:var(--muted);width:22px;text-align:right;flex:0 0 auto}
  .body{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:9px}
  .caret{flex:0 0 auto;color:var(--muted);transition:transform var(--transition);font-size:10px}
  .item.open .caret{transform:rotate(90deg);color:var(--accent2)}
  .bodytext{min-width:0}
  .nm{color:var(--primary);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec-tag{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:var(--radius-badge);padding:1px 6px}
  .doc-tag{font-size:10px;font-weight:600;color:var(--success);background:var(--success-tint);border-radius:var(--radius-badge);padding:1px 5px;letter-spacing:.03em}
  .note{color:var(--secondary);font-size:12px;margin-top:2px;opacity:.9}
  .note:empty{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--transparent);border-radius:var(--radius-badge);padding:3px 11px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:none;font-family:inherit}
  .pill:hover{border-color:var(--border-default)}
  .pill.done{color:var(--success);background:var(--success-tint)}
  .pill.in-progress{color:var(--warning);background:var(--warning-tint)}
  .pill.not-started{color:var(--text-secondary);background:var(--bg-tertiary)}
  .pill.roadmap{color:var(--accent-text);background:var(--accent-tint)}
  .mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  .mv button{width:28px;height:16px;border:none;background:none;color:var(--text-muted);border-radius:var(--radius-btn);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
  .mv button:hover:not(:disabled){color:var(--text-primary);background:var(--bg-tertiary)}
  .mv button:disabled{opacity:.5;cursor:default}
  .mv svg{width:11px;height:11px}
  /* detail panel */
  .detail{border-top:1px solid var(--line);padding:14px 14px 16px;background:var(--bg-primary);display:none}
  .item.open .detail{display:block}
  .dgrid{display:flex;flex-direction:column;gap:12px}
  .dsec h4{margin:0 0 5px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:8px}
  .dsec h4 .cnt{color:var(--secondary)}
  .dsec .none{color:var(--muted);font-size:12px;font-style:italic}
  /* raw renderer — the honest source twin */
  .dsec pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--secondary);white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto}
  .mini{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:var(--radius-btn);font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 8px;cursor:pointer}
  .mini:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  .mini:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-glow)}
  /* executive renderer — parsed md: real tables + clean prose, never a pre fence */
  .xmd{font-size:12.5px;color:var(--secondary);line-height:1.55;max-height:420px;overflow:auto;padding-right:2px}
  .xmd p{margin:0 0 8px}
  .xmd p:last-child,.xmd ul:last-child,.xmd ol:last-child{margin-bottom:0}
  .xmd h5{margin:12px 0 6px;font-size:11.5px;font-weight:700;color:var(--primary);letter-spacing:.01em}
  .xmd h5:first-child{margin-top:0}
  .xmd code{font-family:var(--mono);font-size:11px;background:var(--bg-tertiary);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--primary);word-break:break-word}
  .xmd b{color:var(--primary);font-weight:600}
  .xmd ul,.xmd ol{margin:0 0 8px;padding-left:18px}
  .xmd li{margin:2px 0}
  .xmd .quote{border-left:2px solid var(--line3);background:var(--bg-tertiary);border-radius:0 7px 7px 0;padding:7px 10px;margin:0 0 8px;color:var(--muted);font-size:12px}
  .xmd .quote p{margin:0 0 4px} .xmd .quote p:last-child{margin:0}
  .xmd .vfy{color:var(--warning);background:var(--warning-tint);border-radius:var(--radius-badge);padding:0 5px;font-size:10px;font-weight:700;white-space:nowrap}
  .xtblwrap{overflow-x:auto;margin:0 0 10px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--panel)}
  .xtblwrap:last-child{margin-bottom:0}
  .xtbl{width:100%;border-collapse:collapse;font-size:12px}
  .xtbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);background:var(--bg-tertiary);white-space:nowrap}
  .xtbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--secondary)}
  .xtbl tr:last-child td{border-bottom:none}
  .mention{font-size:11.5px;margin-bottom:6px}
  .mention b{color:var(--primary);font-weight:600}
  .mention .mline{color:var(--muted);font-family:var(--mono);font-size:11px;display:block;padding:1px 0 1px 10px;border-left:1px solid var(--line2);margin-left:2px}
  .filelinks{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
  .filelinks a{color:var(--accent2);text-decoration:none;border:1px solid var(--line2);border-radius:var(--radius-btn);padding:3px 9px}
  .filelinks a:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .filelinks a:hover{background:var(--elev);color:var(--primary)}
  .genbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-btn);padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-glow)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--white) /* approved literal — on-accent text */}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.primary:active{background:var(--accent-active);border-color:var(--accent-active)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn svg{width:13px;height:13px}
  .promptbox{margin-top:10px;display:none}
  .promptbox.show{display:block}
  .promptbox textarea{width:100%;height:230px;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--secondary);font-family:var(--mono);font-size:11.5px;line-height:1.5;padding:11px;resize:vertical}
  .promptbox textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-glow)}
  .reqta{width:100%;height:70px;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--secondary);font-family:var(--sans);font-size:12.5px;line-height:1.5;padding:9px 11px;resize:vertical;margin-bottom:8px}
  .reqta:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-glow)}
  .reqta::placeholder{color:var(--muted)}
  /* checklist */
  .chklist{display:flex;flex-direction:column;gap:5px}
  .chk{display:flex;align-items:center;gap:9px}
  .chk-state{flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:1px solid var(--input-border);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
  .chk-state.partial{color:var(--warning);border-color:var(--input-border);background:var(--warning-tint)}
  .chk-state.done{color:var(--white) /* approved literal — check on --success fill */;border-color:var(--success);background:var(--success)}
  .chk-state:hover{border-color:var(--line3)}
  .chk-label{flex:0 0 auto;font-size:12.5px;color:var(--secondary);width:210px;max-width:46%}
  .chk-detail{flex:1;min-width:0;background:transparent;border:none;border-bottom:1px dashed var(--line2);color:var(--muted);font-family:var(--sans);font-size:11.5px;padding:2px}
  .chk-detail:focus{outline:none;border-bottom-color:var(--accent);color:var(--secondary)}
  .chk-detail::placeholder{color:var(--text-disabled)}
  .chkprog{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius-badge);padding:1px 6px}
  .promptbox .prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .promptbox .plabel{font-size:11px;color:var(--muted)}
  select.filt{background:var(--panel2);border:1px solid var(--input-border);color:var(--secondary);border-radius:var(--radius-input);padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer}
  select.filt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  input[type=checkbox]{accent-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  a.back{color:var(--muted);text-decoration:none;font-size:12px}
  a.back:hover{color:var(--secondary)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="/">← CRS Brain</a>
      <h1>Progress Tree</h1>
      <div class="sub" id="sub">Modules in build-priority order. Drag or ↑↓ to reorder · click a status to cycle · click a name to expand its brain detail + generate a Buildprint prompt.</div>
    </div>
    <div class="saved" id="saved"></div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <select class="filt" id="secFilter" onchange="render()"><option value="">All sections</option></select>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="groupSec" onchange="render()"> group by section
    </label>
    <div class="seg" role="tablist" aria-label="Detail renderer" title="Executive = parsed tables + prose · Raw = source blocks with Copy">
      <button id="seg-exec" role="tab" onclick="setView('exec')">Executive</button>
      <button id="seg-raw" role="tab" onclick="setView('raw')">Raw</button>
    </div>
    <span class="hint" id="focusHint"></span>
  </div>

  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>

<script>
const VOCAB=['done','in-progress','not-started','roadmap'];
const LABEL={'done':'Done','in-progress':'In progress','not-started':'Not started','roadmap':'Roadmap'};
const COLOR={done:'var(--good)','in-progress':'var(--warn)','not-started':'var(--na)',roadmap:'var(--accent2)'};
let DATA={modules:[]}, saveTimer=null, dragId=null;
const expanded=new Set(), detailCache={}, promptCache={}, lastKind={}, editReq={};
const KLABEL={edit:'EDIT prompt — paste into the Buildprint app (applies directly)',sync:'SYNC prompt — read-only, reports back into the brain'};
// single-app rule (override #37): when embedded, files open via the parent app, never a browser tab
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
// Executive ⇄ Raw detail renderer (ptree). Executive = parsed md; Raw = source twin.
let VIEW=localStorage.getItem('crs-tree-view')==='raw'?'raw':'exec';
function setView(v){ VIEW=v; try{localStorage.setItem('crs-tree-view',v);}catch(e){} paintSeg(); render(); }
function paintSeg(){ const ex=document.getElementById('seg-exec'), rw=document.getElementById('seg-raw'); ex.classList.toggle('on',VIEW==='exec'); rw.classList.toggle('on',VIEW==='raw'); ex.setAttribute('aria-selected',VIEW==='exec'); rw.setAttribute('aria-selected',VIEW==='raw'); }

async function load(){
  try{
    const r=await fetch('/api/modules'); DATA=await r.json();
    DATA.modules=(DATA.modules||[]).sort((a,b)=>(a.order||0)-(b.order||0));
    const sel=document.getElementById('secFilter');
    [...new Set(DATA.modules.map(m=>m.section))].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    paintSeg(); render();
    // deep link: /tree.html#module=<id> expands + scrolls to that module
    const mm=location.hash.match(/^#module=(.+)$/);
    if(mm){ const id=decodeURIComponent(mm[1]); if(findMod(id)&&!expanded.has(id)){ await toggle(id); const el=document.querySelector('.item[data-mid="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]'); if(el) el.scrollIntoView({block:'center'}); } }
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">Could not load modules. Is the server running?</div>'; }
}
function setSaved(state,txt){
  const el=document.getElementById('saved'); el.className='saved'+(state?' '+state:'');
  el.innerHTML = state==='ok'?'✓ '+(txt||'Saved'):state==='saving'?'⋯ Saving…':state==='err'?'⚠ '+(txt||'Save failed'):'';
}
function scheduleSave(){ setSaved('saving'); clearTimeout(saveTimer); saveTimer=setTimeout(save,500); }
async function save(){
  DATA.modules.forEach((m,i)=>m.order=i+1);
  try{
    const r=await fetch('/api/modules',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});
    if(!r.ok) throw new Error(await r.text());
    setSaved('ok'); setTimeout(()=>{if(document.getElementById('saved').classList.contains('ok'))setSaved('');},1600);
  }catch(e){ setSaved('err',e.message); }
}
function counts(){ const c={done:0,'in-progress':0,'not-started':0,roadmap:0}; DATA.modules.forEach(m=>c[m.status]=(c[m.status]||0)+1); return c; }
function renderSummary(){
  const c=counts(), t=DATA.modules.length||1;
  document.getElementById('summary').innerHTML=
    `<div class="bar">${VOCAB.map(s=>`<i style="width:${(c[s]/t*100).toFixed(1)}%;background:${COLOR[s]}"></i>`).join('')}</div>`+
    `<div class="legend">${VOCAB.map(s=>`<span><i class="dot d-${s}"></i>${LABEL[s]} <b style="color:var(--primary);font-family:var(--mono);font-weight:600">${c[s]}</b></span>`).join('')}`+
    `<span style="margin-left:auto;color:var(--muted)">${c.done} of ${DATA.modules.length} done · updated ${DATA.updated||'—'}</span></div>`;
}
// Record a user action to the activity log (fire-and-forget).
function logAct(type,summary){ try{ fetch('/api/action-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,summary})}); }catch(e){} }
function move(idx,dir){ const j=idx+dir; if(j<0||j>=DATA.modules.length)return; const[m]=DATA.modules.splice(idx,1); DATA.modules.splice(j,0,m); render(); scheduleSave(); logAct('module-update',`Reordered "${m.name}" ${dir<0?'up':'down'} to build position ${j+1}`); }
function cycle(idx){ const m=DATA.modules[idx]; m.status=VOCAB[(VOCAB.indexOf(m.status)+1)%VOCAB.length]; render(); scheduleSave(); logAct('module-update',`Set "${m.name}" status → ${m.status}`); }
function findMod(id){ return DATA.modules.find(m=>m.id===id); }
function cycleChk(id,ci){ const m=findMod(id); if(!m||!m.checklist||!m.checklist[ci])return; const s=m.checklist[ci].state; m.checklist[ci].state=s==='todo'?'partial':s==='partial'?'done':'todo'; render(); scheduleSave(); }
function setChkDetail(id,ci,v){ const m=findMod(id); if(!m||!m.checklist||!m.checklist[ci])return; m.checklist[ci].detail=v; scheduleSave(); } // no re-render: keeps input focus

async function toggle(id){
  if(expanded.has(id)){ expanded.delete(id); if(location.hash==='#module='+encodeURIComponent(id)&&history.replaceState) history.replaceState(null,'',location.pathname+location.search); }
  else{
    expanded.add(id);
    if(history.replaceState) history.replaceState(null,'',location.pathname+location.search+'#module='+encodeURIComponent(id));
    if(!detailCache[id]){ try{ detailCache[id]=await (await fetch('/api/modules/detail?id='+encodeURIComponent(id))).json(); }catch(e){ detailCache[id]={error:e.message}; } }
  }
  render();
}
// Hand a prompt to the CRS Brain Buildprint chat (opens a new bp chat, pastes it in the composer).
function sendToBp(text){
  if(!text || /^⏳|^⚠|Writing your Buildprint/.test(text)) return false;
  try{ localStorage.setItem('crs_bp_compose', text); }catch(e){}
  if(window.opener && !window.opener.closed){
    try{ window.opener.postMessage({type:'bp-compose'}, location.origin); window.opener.focus(); return true; }catch(e){}
  }
  location.href='/#bp-compose'; return true; // opened directly (no opener) → navigate this window
}
async function genEdit(id){
  const req=document.getElementById('req-'+id), text=(req.value||'').trim();
  if(!text){ req.focus(); return; }
  editReq[id]=text;
  const box=document.getElementById('pb-'+id), ta=document.getElementById('pt-'+id), lbl=document.getElementById('pl-'+id), btn=document.getElementById('gen-'+id);
  box.classList.add('show'); lastKind[id]='edit'; if(lbl) lbl.textContent=KLABEL.edit;
  if(btn){ btn.disabled=true; btn.dataset.html=btn.innerHTML; btn.textContent='Writing…'; }
  const t0=Date.now();
  const tick=setInterval(()=>{ ta.value='⏳ Writing your Buildprint prompt — the model is working ('+Math.round((Date.now()-t0)/1000)+'s). This takes ~10–30s; leave the panel open.'; },300);
  ta.value='⏳ Writing your Buildprint prompt — the model is working (0s).';
  try{
    const r=await fetch('/api/modules/edit-prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,text})});
    const j=await r.json(); clearInterval(tick);
    const out=r.ok&&j.prompt ? j.prompt : ('⚠ '+(j.error||('HTTP '+r.status))); ta.value=out;
    if(r.ok&&j.prompt){ promptCache[id+':edit']=out; logAct('prompt-gen',`Generated Buildprint edit prompt for "${(findMod(id)||{}).name||id}": ${text.slice(0,120)}`); sendToBp(out); } // open the Buildprint chat with it
  }catch(e){ clearInterval(tick); ta.value='⚠ '+e.message; }
  finally{ if(btn){ btn.disabled=false; if(btn.dataset.html) btn.innerHTML=btn.dataset.html; } }
}
async function genPrompt(id,kind){
  const box=document.getElementById('pb-'+id), ta=document.getElementById('pt-'+id), lbl=document.getElementById('pl-'+id);
  box.classList.add('show'); lastKind[id]=kind; if(lbl) lbl.textContent=KLABEL[kind];
  const key=id+':'+kind;
  if(promptCache[key]){ ta.value=promptCache[key]; return; }
  ta.value='Generating…';
  try{
    const r=await fetch('/api/modules/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,kind})});
    const j=await r.json(); promptCache[key]=j.prompt||('error: '+(j.error||'no prompt')); ta.value=promptCache[key];
  }catch(e){ ta.value='error: '+e.message; }
}
function copyPrompt(id){ const ta=document.getElementById('pt-'+id); ta.select(); navigator.clipboard.writeText(ta.value); const b=document.getElementById('cp-'+id); const o=b.textContent; b.textContent='✓ Copied'; setTimeout(()=>b.textContent=o,1400); }
// Raw view: per-block Copy — copies the untouched md source of one section.
function copyRaw(id,field,btn){ const d=detailCache[id]; if(!d)return; navigator.clipboard.writeText(String(d[field]||'')); const o=btn.textContent; btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=o,1400); }

/* ── Executive md renderer ─────────────────────────────────────────────
   Parses the known techRef/STATUS heading structures into real tables
   (§20.6) + clean prose. Anything unparseable falls through as prose —
   never a pre fence. */
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/⚠️?\s*VERIFY/g,'<span class="vfy">⚠ VERIFY</span>');
}
function mdToHtml(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'); // strip CRLF so $-anchored heading regex survives a CRLF checkout
  const out=[]; let i=0, para=[], firstHead=true;
  const flush=()=>{ if(para.length){ out.push('<p>'+inlineMd(para.join(' '))+'</p>'); para=[]; } };
  const isSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.indexOf('-')>=0;
  const cells=l=>{ let p=l.trim(); if(p.startsWith('|'))p=p.slice(1); if(p.endsWith('|'))p=p.slice(0,-1); return p.split('|').map(c=>c.trim()); };
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|/.test(l)&&i+1<lines.length&&isSep(lines[i+1])){ // md table → real table
      flush();
      const head=cells(l); i+=2; const rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="xtblwrap"><table class="xtbl"><thead><tr>'+head.map(h=>'<th>'+inlineMd(h)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,ci)=>'<td>'+inlineMd(r[ci]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    const h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); if(firstHead){ firstHead=false; } else out.push('<h5>'+inlineMd(h[2])+'</h5>'); i++; continue; } // first heading = the section title, already shown
    if(/^\s*>/.test(l)){ flush(); const q=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<div class="quote">'+q.map(x=>x.trim()?'<p>'+inlineMd(x)+'</p>':'').join('')+'</div>'); continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ flush(); const ord=/^\s*\d+\./.test(l); const items=[];
      while(i<lines.length&&(/^\s*([-*]|\d+\.)\s+/.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){
        if(/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));
        else if(items.length) items[items.length-1]+=' '+lines[i].trim(); // continuation line
        i++;
      }
      out.push((ord?'<ol>':'<ul>')+items.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+(ord?'</ol>':'</ul>')); continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ flush(); i++; continue; } // hr → drop
    if(!l.trim()){ flush(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush();
  return out.join('');
}

function detailHTML(id){
  const d=detailCache[id];
  if(!d) return '<div class="detail"><div class="dsec none">Loading…</div></div>';
  if(d.error) return `<div class="detail"><div class="dsec none">Could not load detail: ${esc(d.error)}</div></div>`;
  const m0=findMod(id), cl=(m0&&m0.checklist)||[];
  const cdone=cl.filter(c=>c.state==='done').length;
  const checklist=`<div class="dsec"><h4>Definition of done — <span class="cnt">${cdone}/${cl.length}</span></h4><div class="chklist">${cl.map((c,ci)=>`<div class="chk"><button class="chk-state ${c.state}" title="click: todo → partial → done" onclick="cycleChk('${id}',${ci})">${c.state==='done'?'✓':c.state==='partial'?'◐':'○'}</button><span class="chk-label">${esc(c.label)}</span><input class="chk-detail" value="${esc(c.detail||'')}" placeholder="notes… e.g. 128/128 done" oninput="setChkDetail('${id}',${ci},this.value)"></div>`).join('')}</div></div>`;
  // one section, two renderers: Executive = parsed tables/prose · Raw = source pre + Copy
  const sec=(title,field,empty)=>{
    const body=d[field];
    if(!(body&&body.trim())) return `<div class="dsec"><h4>${title}</h4><div class="none">${empty}</div></div>`;
    if(VIEW==='raw') return `<div class="dsec"><h4>${title}<button class="mini" onclick="copyRaw('${id}','${field}',this)">Copy</button></h4><pre>${esc(body)}</pre></div>`;
    return `<div class="dsec"><h4>${title}</h4><div class="xmd">${mdToHtml(body)}</div></div>`;
  };
  let mentions='';
  if(d.mentions&&d.mentions.length){
    mentions=`<div class="dsec"><h4>Referenced across the brain ledger</h4>`+d.mentions.map(m=>
      `<div class="mention"><b>${esc(m.file)}</b> · ${m.count} mention${m.count>1?'s':''}`+
      m.lines.slice(0,6).map(l=>`<span class="mline">L${l.line}: ${esc(l.text)}</span>`).join('')+
      (m.count>6?`<span class="mline">… +${m.count-6} more</span>`:'')+`</div>`).join('')+`</div>`;
  }
  const flink=(p,label)=>`<a class="flink" href="/api/file?path=${encodeURIComponent(p)}" data-path="${esc(p)}" target="_blank">${label} ↗</a>`;
  const links=[];
  if(d.techRef) links.push(flink(d.techRef,'Technical reference'));
  if(d.userManual) links.push(flink(d.userManual,'User manual'));
  links.push(flink('brain/STATUS.md','STATUS.md'));
  return `<div class="detail"><div class="dgrid">
    ${checklist}
    ${sec('Status detail (brain/STATUS.md)','statusBlock','No expanded status block yet — only the Core-7 row in STATUS.md.')}
    ${sec('Data types & data model','dataModel',d.documented?'—':'Not documented yet. Generate the prompt below and run the Buildprint audit to inventory it.')}
    ${sec('Option sets','optionSets',d.documented?'—':'Not documented yet.')}
    ${sec('Permissions','perms',d.documented?'—':'Not documented yet.')}
    ${sec('Workflows','workflows',d.documented?'—':'Not documented yet.')}
    ${mentions}
    <div class="dsec"><h4>Files</h4><div class="filelinks">${links.join('')}</div></div>
    <div class="dsec"><h4>Buildprint prompts</h4>
      <label class="plabel" style="display:block;margin-bottom:5px">Describe the edit / feature you want — the Brain writes the Buildprint prompt from your words (grounded in this module + the live app):</label>
      <textarea id="req-${id}" class="reqta" spellcheck="true" oninput="editReq['${id}']=this.value" placeholder="e.g. Add a Status filter (Active / Inactive / All) to the user list, wired to the already-loaded list — dark + light, no new searches."></textarea>
      <div class="genbar">
        <button class="btn primary" id="gen-${id}" onclick="genEdit('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>Write Buildprint edit prompt</button>
        <button class="btn" onclick="genPrompt('${id}','sync')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5m2-3v5h-5M20 12a8 8 0 0 1-14 5m-2 3v-5h5"/></svg>Read &amp; sync → brain</button>
      </div>
      <div class="plabel" style="margin-top:6px"><b style="color:var(--secondary)">Edit</b> = the Brain turns your text into a ready-to-paste Buildprint prompt (savepoint, Pattern A, tokens, verify — applies directly). <b style="color:var(--secondary)">Sync</b> = read-only audit that reports back into the brain.</div>
      <div class="promptbox" id="pb-${id}">
        <div class="prow"><span class="plabel" id="pl-${id}"></span><div style="display:flex;gap:6px"><button class="btn primary" title="Open the Brain's Buildprint chat with this prompt" onclick="sendToBp(document.getElementById('pt-${id}').value)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Buildprint chat</button><button class="btn" id="cp-${id}" onclick="copyPrompt('${id}')">Copy</button></div></div>
        <textarea id="pt-${id}" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div></div>`;
}

function render(){
  renderSummary();
  const filt=document.getElementById('secFilter').value;
  const grouped=document.getElementById('groupSec').checked;
  const list=document.getElementById('list'); list.innerHTML='';
  const focusIdx=DATA.modules.findIndex(m=>m.status!=='done'&&m.status!=='roadmap');
  document.getElementById('focusHint').textContent=focusIdx>=0?`Current focus: ${DATA.modules[focusIdx].name}`:'';
  let lastSec=null;
  DATA.modules.forEach((m,idx)=>{
    if(filt&&m.section!==filt) return;
    if(grouped&&m.section!==lastSec){ const h=document.createElement('div');h.className='sec-label';h.textContent=m.section;list.appendChild(h);lastSec=m.section; }
    const open=expanded.has(m.id);
    const item=document.createElement('div');
    item.className='item'+(open?' open':'')+(idx===focusIdx?' focus-now':'');
    item.dataset.idx=idx; item.dataset.mid=m.id;
    const docTag=(detailCache[m.id]&&detailCache[m.id].documented)?'<span class="doc-tag">DOCS</span>':'';
    // slim per-row progress bar from the checklist ratio (done + partial segments)
    const cl=m.checklist||[], ct=cl.length||8;
    const cd=cl.filter(c=>c.state==='done').length, cp=cl.filter(c=>c.state==='partial').length;
    const rowprog=`<span class="rowprog" title="checklist: ${cd} done · ${cp} partial · ${ct} total"><i class="pd" style="width:${(cd/ct*100).toFixed(1)}%"></i><i class="pp" style="width:${(cp/ct*100).toFixed(1)}%"></i></span>`;
    item.innerHTML=
      `<div class="row" draggable="true">`+
        `<span class="grip" title="Drag to reorder">⠿</span>`+
        `<span class="ord">${idx+1}</span>`+
        `<div class="mv">`+
          `<button title="Move up" ${idx===0?'disabled':''} onclick="event.stopPropagation();move(${idx},-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg></button>`+
          `<button title="Move down" ${idx===DATA.modules.length-1?'disabled':''} onclick="event.stopPropagation();move(${idx},1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>`+
        `</div>`+
        `<div class="body" onclick="toggle('${m.id}')"><span class="caret">▶</span><div class="bodytext"><div class="nm">${esc(m.name)}<span class="sec-tag">${esc(m.section)}</span>${docTag}</div><div class="note">${esc(m.note||'')}</div></div></div>`+
        `<span class="chkprog" title="checklist done / total">${cd}/${ct}</span>`+
        `<button class="pill ${m.status}" title="Click to change status" onclick="event.stopPropagation();cycle(${idx})">${LABEL[m.status]||m.status}</button>`+
        rowprog+
      `</div>`+
      (open?detailHTML(m.id):'');
    const row=item.querySelector('.row');
    row.addEventListener('dragstart',e=>{dragId=idx;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('.item').forEach(r=>r.classList.remove('drop-above','drop-below'));});
    item.addEventListener('dragover',e=>{e.preventDefault();const b=item.getBoundingClientRect();const below=e.clientY>b.top+b.height/2;item.classList.toggle('drop-below',below);item.classList.toggle('drop-above',!below);});
    item.addEventListener('dragleave',()=>item.classList.remove('drop-above','drop-below'));
    item.addEventListener('drop',e=>{e.preventDefault();const to=parseInt(item.dataset.idx);if(dragId===null||dragId===to)return;const b=item.getBoundingClientRect();const below=e.clientY>b.top+b.height/2;let dest=below?to+1:to;const[mm]=DATA.modules.splice(dragId,1);if(dragId<dest)dest--;DATA.modules.splice(dest,0,mm);dragId=null;render();scheduleSave();});
    // restore prompt if it was generated
    list.appendChild(item);
    if(open){
      const req=document.getElementById('req-'+m.id); if(req&&editReq[m.id]!==undefined) req.value=editReq[m.id];
      if(lastKind[m.id]){ const k=lastKind[m.id],key=m.id+':'+k; const pb=document.getElementById('pb-'+m.id),pt=document.getElementById('pt-'+m.id),pl=document.getElementById('pl-'+m.id); if(pb&&pt&&promptCache[key]){pb.classList.add('show');pt.value=promptCache[key];if(pl)pl.textContent=KLABEL[k];} }
    }
  });
  if(!list.children.length) list.innerHTML='<div class="empty">No modules for this filter.</div>';
}
// file links: in-app when embedded (parent smartOpen), browser tab only standalone
document.addEventListener('click',e=>{
  const a=e.target.closest('a.flink');
  if(a&&EMBED&&window.parent&&window.parent.smartOpen){ e.preventDefault(); window.parent.smartOpen(a.dataset.path); }
});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
load();
</script>
