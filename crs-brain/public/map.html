<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRS Brain — Map</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  /* Canonical tokens + legacy aliases from tokens.css (§2.10). Surfaces now use
   * the canonical palette (the old #0A0A0C off-palette darks were NON-COMPLIANT). */
  :root{
    /* galaxy constellation category colors — data-viz literals, no canonical token (judgment-calls.md #6) */
    --c-mem1:#8B5CF6; --c-mem2:#C084FC; --c-mem3:#A78BFA; --c-mem4:#D8B4FE; --c-mem5:#7C3AED;
    --c-mem6:#E879F9; --c-mem7:#9333EA; --c-mem8:#C4B5FD;
    --c-skill:#F97316; --c-routine:#EAB308; --c-app:#60A5FA;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --board-w:420px;  /* right board drawer width (user instruction 2026-07-18: right drawer, supersedes the 07-17 bottom-sheet override) */
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
  /* scrollbars → shared /scrollbars.css (sidebar3: invisible until hover/scroll) */
  body{background:var(--bg-primary);font-family:var(--sans);color:var(--text-secondary);font-size:13px;-webkit-font-smoothing:antialiased}
  canvas{display:block;cursor:grab;touch-action:none} canvas.dragging{cursor:grabbing} canvas.pointing{cursor:pointer}

  .brand{position:fixed;top:16px;left:20px;display:flex;align-items:center;gap:10px;z-index:10;pointer-events:none;user-select:none}
  .brand .mark{width:26px;height:26px;border-radius:var(--radius-btn);background:var(--accent);display:flex;align-items:center;justify-content:center}
  .brand .mark svg{width:15px;height:15px;fill:none;stroke:var(--white);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .brand b{color:var(--text-primary);font-weight:700;letter-spacing:2.5px;font-size:13px}
  .brand span{color:var(--text-muted);letter-spacing:2.5px;font-size:13px;font-weight:300}
  .brand .by{position:absolute;top:29px;left:36px;font-size:10px;letter-spacing:1.5px;color:var(--text-muted);opacity:.85}

  .menu-btn{position:fixed;top:16px;right:20px;z-index:12;background:var(--bg-secondary);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-btn);padding:7px 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer;font-family:inherit;transition:transform var(--transition),background-color var(--transition-colors),color var(--transition-colors),border-color var(--transition-colors)}
  .menu-btn:hover{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--border-hover)}
  .menu-btn.on{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-default)}
  /* board open → toolbar buttons slide left of the drawer so BOARD stays reachable/toggleable */
  body.board-open .menu-btn{transform:translateX(calc(-1 * var(--board-w)))}

  .panel{position:fixed;top:52px;right:20px;width:230px;z-index:11;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-dropdown);padding:16px;display:flex;flex-direction:column;gap:10px}
  .panel.hide{display:none}
  .panel input[type=search]{width:100%;height:36px;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--text-primary);padding:0 10px;font-size:12px;font-family:inherit;outline:none}
  .panel input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .panel .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin:2px 0 -4px}
  .seg{display:flex;gap:2px;background:var(--bg-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-btn);padding:2px}
  .seg button{flex:1;background:none;border:none;color:var(--text-secondary);border-radius:5px;padding:6px 0;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--bg-elevated);color:var(--text-primary)}
  .seg button:hover:not(.on){color:var(--text-primary)}
  .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary)}
  .row .val{margin-left:auto;color:var(--text-secondary);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:10.5px}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:14px;background:none;accent-color:var(--accent)}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--bg-tertiary)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:none;margin-top:-4px}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--bg-tertiary)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none}
  .chk{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent)}
  .btns{display:flex;gap:6px}
  .btns button{flex:1;background:var(--bg-tertiary);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-btn);padding:7px 0;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btns button:hover{color:var(--text-primary);border-color:var(--border-hover)}
  .bake{background:var(--accent);border:none;color:var(--white);border-radius:var(--radius-btn);padding:7px 0;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .bake:hover{background:var(--accent-hover)}
  .bake:active{background:var(--accent-active)}

  /* kanban board drawer — right-side panel, full height of the map area; folders/status
     as stacked sections, files as cards. Slides in/out on the 160ms token transition. */
  .board{position:fixed;top:0;right:0;bottom:0;width:var(--board-w);max-width:100vw;z-index:12;background:var(--bg-secondary);border-left:1px solid var(--border-default);transform:translateX(105%);transition:transform var(--transition);display:flex;flex-direction:column}
  .board.open{transform:translateX(0)}
  .board .bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 36px 6px 14px;color:var(--text-primary);font-size:11px}
  .board .bhead .n{color:var(--text-muted);font-weight:400}
  .board .bhead .close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;font-family:inherit}
  .board .bhead .close:hover{color:var(--text-primary)}
  /* columns stack vertically — a 420px drawer reads as one clean flow (§20.6) */
  .board .cols{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;padding:6px 14px 16px}
  .bcol{flex:0 0 auto;width:100%;display:flex;flex-direction:column;background:var(--bg-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-card);overflow:hidden}
  .bcol .chead{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--border-default);font-size:11px;font-weight:600;color:var(--text-secondary);flex:0 0 auto}
  .bcol .chead .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .bcol .chead .cnt{margin-left:auto;color:var(--text-muted);font-weight:600;font-size:10px;font-family:var(--mono);background:var(--na);border-radius:var(--radius-pill);padding:1px 7px}
  .bcol .cards{flex:none;overflow:visible;padding:7px}
  /* card anatomy — §20.7: --radius-card surface, neutral 1px border (no colored stripes),
     folder identity = 6px chip-dot; title Body Strong 13/600, ext = neutral status badge */
  .bcard{display:flex;align-items:center;gap:7px;padding:8px 10px;margin-bottom:5px;background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:var(--radius-card);font-size:13px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;overflow:hidden}
  .bcard:hover{border-color:var(--border-hover)}
  .bcard .cdot{width:6px;height:6px;border-radius:50%;background:var(--cc,var(--border-hover));flex:0 0 6px}
  .bcard .ext{margin-left:auto;font-size:10px;font-weight:600;color:var(--text-secondary);background:var(--na);border-radius:var(--radius-badge);padding:1px 6px;text-transform:uppercase;flex:0 0 auto}
  .bcard .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--text-primary)}
  /* map-node hover → its board card(s) light up (§20.7 Chip-Active border) */
  .bcard.linked,.tile.linked{border-color:var(--accent-border-active)}
  body.board-open .dock{left:calc((100vw - var(--board-w))/2);width:min(720px,calc(100vw - var(--board-w) - 28px))}
  body.board-open .hint{display:none}
  body.board-open .pv{right:calc(var(--board-w) + 12px)}
  body.board-open .panel{right:calc(var(--board-w) + 16px);max-height:calc(100dvh - 70px);overflow-y:auto;z-index:13}
  /* §20.1: ONE segmented-control language for tabs + scope — active = greyscale
     (--bg-elevated + --text-primary), never accent fill (standing user override) */
  .bhead .bseg,.bhead .btabs{display:flex;gap:2px;background:var(--bg-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-btn);padding:2px}
  .bhead .bseg button,.bhead .btabs button{background:none;border:none;color:var(--text-secondary);border-radius:5px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  .bhead .bseg button.on,.bhead .btabs button.on{background:var(--bg-elevated);color:var(--text-primary)}
  .bhead .bseg button:hover:not(.on),.bhead .btabs button:hover:not(.on){color:var(--text-primary)}
  .bhead .bsearch{background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--text-primary);padding:5px 11px;font-size:11px;font-family:inherit;outline:none;width:auto;flex:1 1 120px;min-width:110px}
  .bhead .bsearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .bfilters{display:flex;gap:5px;align-items:center;padding:0 16px 6px;flex-wrap:wrap;flex:0 0 auto}
  .bfilters .fc{background:var(--bg-tertiary);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-pill);padding:2px 11px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.4px}
  .bfilters .fc.on{background:var(--bg-elevated);border-color:var(--border-active);color:var(--text-primary)}
  .bfilters .fl{font-size:9px;letter-spacing:1.2px;color:var(--text-muted);text-transform:uppercase;margin-right:2px}
  /* ideas cards — §20.7: --radius-card, neutral border; priority identity = the .pbadge */
  .icard{background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:8px 10px;margin-bottom:6px;font-size:12.5px;color:var(--text-secondary);line-height:1.45;position:relative}
  .icard:hover{border-color:var(--border-hover)}
  .icard .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .icard .tag{font-size:10px;font-weight:600;color:var(--accent-soft);background:var(--accent-tint);border-radius:var(--radius-badge);padding:1px 7px}
  /* priority badge — §20.7 status-badge tints (status itself = the column) */
  .icard .pbadge{font-size:10px;font-weight:600;border-radius:var(--radius-badge);padding:1px 7px;text-transform:uppercase;letter-spacing:.4px}
  .icard .pbadge.high{background:var(--error-tint);color:var(--error)}
  .icard .pbadge.med{background:var(--warning-tint);color:var(--warning)}
  .icard .pbadge.low{background:var(--na);color:var(--text-muted)}
  .icard .iact{position:absolute;top:5px;right:6px;display:none;gap:3px}
  .icard:hover .iact{display:flex}
  .icard .iact button{background:var(--bg-secondary);border:1px solid var(--border-default);color:var(--text-muted);border-radius:var(--radius-badge);width:19px;height:19px;font-size:10px;cursor:pointer;font-family:inherit;line-height:1}
  .icard .iact button:hover{color:var(--text-primary);border-color:var(--border-hover)}
  .iadd{display:flex;gap:5px;padding:2px}
  .iadd input{flex:1;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--text-primary);padding:6px 9px;font-size:11px;font-family:inherit;outline:none;min-width:0}
  .iadd input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .iadd button{background:var(--accent);border:none;color:var(--white);border-radius:var(--radius-btn);width:26px;font-weight:700;cursor:pointer;font-family:inherit}
  .iadd button:hover{background:var(--accent-hover)}
  /* tile view — sneak-peek thumbnails */
  .bcol.tiles .cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
  /* LIST layout — same data; the drawer already stacks sections vertically, list mode
     just relaxes the tile grid to auto-fill */
  body.blist .bcol.tiles .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{position:relative;aspect-ratio:1;border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--bg-secondary);overflow:hidden;cursor:pointer}
  .tile:hover{border-color:var(--border-hover)}
  .tile iframe{width:520%;height:520%;transform:scale(.192);transform-origin:0 0;border:none;background:var(--bg-primary);pointer-events:none}
  .tile .snip{padding:7px 8px;font-size:6.5px;line-height:1.5;color:var(--text-muted);overflow:hidden;height:100%;word-break:break-word}
  .tile .snip b{color:var(--text-secondary);font-size:7.5px;display:block;margin-bottom:2px}
  .tile img{width:100%;height:100%;object-fit:cover}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg-elevated) 90%,transparent);color:var(--text-secondary);font-size:9px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border-default)}
  /* floating hover focus — big enough to understand, not huge */
  .hpv{position:fixed;width:360px;height:300px;z-index:30;background:var(--bg-elevated);border:1px solid var(--border-hover);border-radius:var(--radius-card);overflow:hidden;display:none;pointer-events:none;box-shadow:var(--shadow-modal)}
  .hpv.show{display:block}
  .hpv iframe{width:250%;height:250%;transform:scale(.4);transform-origin:0 0;border:none;background:var(--bg-primary)}
  .hpv .snip{padding:14px 16px;font-size:10.5px;line-height:1.6;color:var(--text-secondary);overflow:hidden;height:100%}
  .hpv .snip b{color:var(--text-primary);display:block;margin-bottom:6px;font-size:11.5px}
  .hpv img{width:100%;height:100%;object-fit:contain}
  .hpv .hcap{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg-elevated) 90%,transparent);color:var(--text-primary);font-size:10px;padding:4px 10px;border-top:1px solid var(--border-default)}

  /* preview panel — floats left of the board drawer */
  .pv{position:fixed;left:16px;right:16px;top:64px;bottom:16px;z-index:13;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-modal);box-shadow:var(--shadow-modal);display:none;flex-direction:column;overflow:hidden}
  .pv.open{display:flex}
  .pv .pvhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-default);flex:0 0 auto}
  .pv .pvhead .nm{color:var(--text-primary);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv .pvhead .sp{flex:1}
  .pv .pvhead button{background:var(--bg-tertiary);border:1px solid var(--border-default);color:var(--text-secondary);border-radius:var(--radius-btn);padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pv .pvhead button:hover{color:var(--text-primary);border-color:var(--border-hover)}
  .pv .pvhead button.on{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-default)}
  .pv .pvhead .x{border:none;background:none;font-size:15px;color:var(--text-muted)}
  .pv .pvhead .x:hover{color:var(--text-primary)}
  .pv iframe{flex:1;border:none;background:var(--white)}
  .pv iframe.dark{background:#181818} /* approved literal: dark-document preview backdrop, theme-independent (matches dark --bg-primary) */
  .pv .pvbody{flex:1;overflow:auto;padding:18px 26px;display:none}
  .pv .pvbody.show{display:block}
  .pv .pvbody pre.raw{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--text-secondary);margin:0}
  .pv .pvbody img{max-width:100%;border-radius:var(--radius-card);border:1px solid var(--border-default)}
  /* rich md */
  .pv .mdtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-default);flex:0 0 auto}
  .pv .mdtabs.hide,.pv .pvhead .mdonly.hide{display:none}
  .pv .mdtabs button{background:var(--bg-tertiary);border:1px solid var(--border-default);border-left:3px solid var(--tc,var(--purple));color:var(--text-secondary);border-radius:var(--radius-btn);padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  .pv .mdtabs button.on{color:var(--text-primary);background:var(--bg-elevated)}
  .pv .mdtabs input{margin-left:auto;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--text-primary);padding:5px 11px;font-size:11px;font-family:inherit;outline:none;width:180px}
  .pv .mdtabs input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .pv .md{line-height:1.65;font-size:13px;color:var(--text-secondary);max-width:860px}
  .pv .md h1,.pv .md h2,.pv .md h3{color:var(--text-primary);margin:1.2em 0 .5em;line-height:1.3}
  .pv .md h1{font-size:20px}.pv .md h2{font-size:16px;padding-left:10px;border-left:4px solid var(--sc,var(--purple))}.pv .md h3{font-size:13.5px}
  .pv .md p{margin:.5em 0}
  .pv .md strong{color:var(--text-primary)}
  .pv .md code{background:var(--bg-tertiary);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:11.5px;color:var(--accent-text)}
  .pv .md pre{background:var(--bg-primary);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:12px 14px;overflow:auto}
  .pv .md pre code{background:none;color:var(--text-primary)}
  .pv .md table{border-collapse:collapse;margin:.8em 0;font-size:12.5px;width:100%}
  .pv .md th,.pv .md td{border:1px solid var(--border-default);padding:6px 10px;text-align:left}
  .pv .md th{color:var(--text-primary);background:var(--bg-tertiary)}
  .pv .md blockquote{border-left:3px solid var(--sc,var(--accent));margin:.8em 0;padding:2px 0 2px 12px;color:var(--text-muted)}
  .pv .md ul,.pv .md ol{padding-left:20px}
  .pv .md a{color:var(--accent-text);text-decoration:none}
  .pv .md mark{background:var(--warning-tint);color:var(--text-primary);border-radius:3px;padding:0 2px;box-shadow:inset 0 -1px 0 var(--warning)}
  .pv .md .secbadge{display:inline-block;font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--sc);border:1px solid var(--sc);border-radius:var(--radius-pill);padding:1px 9px;margin-bottom:4px;text-transform:uppercase}

  /* dangling-references panel — cited paths that don't exist = broken brain routing */
  .refpanel{position:fixed;left:20px;bottom:16px;width:290px;z-index:11;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-dropdown);overflow:hidden;display:none}
  body:not(.embed) .refpanel{bottom:110px}   /* clear the Ask-the-Brain dock in standalone mode */
  .refpanel.show{display:block}
  .refpanel .rhead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;color:var(--text-primary);font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.1em;padding:9px 12px;cursor:pointer;text-align:left}
  .refpanel .rdot{width:7px;height:7px;border-radius:50%;background:var(--error);flex:0 0 7px}
  .refpanel .rdot.ok{background:var(--success-soft)}
  .refpanel .rn{color:var(--error);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .refpanel .rcaret{margin-left:auto;color:var(--text-muted);font-size:11px}
  .refpanel .rlist{max-height:32vh;overflow-y:auto;padding:0 8px 8px;display:none}
  .refpanel.open .rlist{display:block}
  .refpanel .ritem{border:1px solid var(--border-default);border-left:2px solid var(--error);border-radius:var(--radius-btn);padding:6px 9px;margin-bottom:5px;cursor:pointer;background:var(--bg-tertiary)}
  .refpanel .ritem:hover{border-color:var(--border-hover);border-left-color:var(--error)}
  .refpanel .rpath{color:var(--error);font-size:11px;font-weight:600;word-break:break-all}
  .refpanel .rsrc{color:var(--text-secondary);font-size:10px;margin-top:1px}
  .refpanel .rquote{color:var(--text-muted);font-size:10px;margin-top:3px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .refpanel .rnone{color:var(--text-muted);font-size:11px;padding:2px 4px 6px}

  .tip{position:fixed;pointer-events:none;background:var(--bg-elevated);border:1px solid var(--border-hover);border-radius:var(--radius-btn);box-shadow:var(--shadow-dropdown);padding:7px 11px;font-size:11.5px;color:var(--text-primary);z-index:20;display:none;max-width:300px}
  .tip .sub{color:var(--text-muted);font-size:10px;margin-top:2px}
  .hint{position:fixed;bottom:14px;right:20px;color:var(--text-muted);font-size:10.5px;z-index:10;pointer-events:none;letter-spacing:.3px}

  /* chat dock — ask the brain, it lights up the galaxy */
  /* centered chat-style composer at the bottom */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:min(720px,92vw);z-index:11;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-modal);overflow:hidden;box-shadow:var(--shadow-modal)}
  .dock .dhead{display:flex;align-items:center;gap:8px;padding:8px 14px 4px;color:var(--text-muted);font-size:10.5px;font-weight:700;letter-spacing:.1em}
  .dock .dhead .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .dock .dhead .fold{margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;font-family:inherit}
  .dock .dbody{max-height:230px;overflow:auto;padding:8px 16px 4px;font-size:13px;line-height:1.6;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;display:none}
  .dock .dbody.show{display:block}
  .dock .dbody b{color:var(--text-primary)}
  .dock .dbody .hits{color:var(--accent-text);font-weight:600}
  .dock form{display:flex;gap:8px;padding:8px 10px 11px;align-items:center}
  .dock input{flex:1;height:44px;background:var(--bg-tertiary);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--text-primary);padding:0 16px;font-size:13px;font-family:inherit;outline:none}
  .dock input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .dock button.ask{background:var(--accent);border:none;color:var(--white);border-radius:var(--radius-btn);padding:0 24px;height:44px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .dock button.ask:hover{background:var(--accent-hover)}
  .dock button.ask:active{background:var(--accent-active)}
  .dock button.ask:disabled{opacity:.5}

  /* ── mobile / touch ─────────────────────────────────────────────────────── */
  @media (hover:none){ .tip,.hpv{display:none!important} }   /* no hover previews on touch */
  @media (max-width:720px){
    .hint{display:none}
    .refpanel{display:none!important}     /* bottom-left collides with the dock on phones */
    .brand{top:11px;left:13px}
    .brand span,.brand .by{display:none}
    .brand b{font-size:12px;letter-spacing:1.4px}
    .brand .mark{width:23px;height:23px}
    .menu-btn{top:11px;padding:6px 11px;font-size:11px;letter-spacing:1px}
    #fsBtn{display:none}                        /* fullscreen is awkward on mobile browsers */
    #boardBtn{right:104px!important}
    .menu-btn:not([id]){right:13px!important}
    .panel{top:50px;right:12px;left:auto;width:min(84vw,290px);max-height:calc(100dvh - 140px);overflow-y:auto}
    .dock{left:10px;right:10px;width:auto;bottom:10px;transform:none}
    .dock .dbody{max-height:32vh}
    /* On a phone the drawer takes the full screen (100dvw wide, already full height). */
    .board{width:100dvw}
    /* Full-screen board covers the toolbar — don't slide the buttons offscreen. */
    body.board-open .menu-btn{transform:none}
    /* Embedded on a phone: the kanban/list board fills the screen — no galaxy behind
       it, no floating map chrome. (The app's own header switches views.) transform:none
       pins it full-screen deterministically instead of relying on the slide translate. */
    body.embed.board-open .board{background:var(--bg-primary);border-left:none;width:100dvw;transform:none;transition:none}
    body.embed.board-open .brand,
    body.embed.board-open .menu-btn,
    body.embed.board-open .panel,
    body.embed.board-open .hint{display:none}
    .board .bhead{padding:10px 40px 6px 13px}
    .board .cols{padding:6px 13px 14px}
    .pv{left:10px;right:10px;top:54px;bottom:10px}
    .pv .pvhead{flex-wrap:wrap;gap:8px}
    .pv .pvhead .sp{display:none}
    .pv .pvbody{padding:14px 15px}
  }
</style>
</head>
