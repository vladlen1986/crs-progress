<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRS Brain — Map</title>
<style>
  :root{
    --bg:#0A0A0C; --panel:#141417; --panel2:#1C1C21; --line:#26262C; --line2:#35353D;
    --primary:#E0E0E0; --secondary:#A6A6A6; --muted:#6B6B6B;
    --accent:#3B82F6; --accent2:#60A5FA;
    --c-mem1:#8B5CF6; --c-mem2:#C084FC; --c-mem3:#A78BFA; --c-mem4:#D8B4FE; --c-mem5:#7C3AED;
    --c-skill:#F97316; --c-routine:#EAB308; --c-app:#60A5FA;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
  /* scrollbars — CRS tokens: track panel, thumb border→border-active, accent when dragging */
  *{scrollbar-width:thin;scrollbar-color:#333333 #141417}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--panel);border-radius:10px}
  ::-webkit-scrollbar-thumb{background:#333333;border-radius:10px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:#3D3D3D}
  ::-webkit-scrollbar-thumb:active{background:var(--accent)}
  ::-webkit-scrollbar-corner{background:transparent}
  body{background:var(--bg);font-family:var(--sans);color:var(--secondary);font-size:13px;-webkit-font-smoothing:antialiased}
  canvas{display:block;cursor:grab;touch-action:none} canvas.dragging{cursor:grabbing} canvas.pointing{cursor:pointer}

  .brand{position:fixed;top:16px;left:20px;display:flex;align-items:center;gap:10px;z-index:10;pointer-events:none;user-select:none}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
  .brand .mark svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .brand b{color:var(--primary);font-weight:700;letter-spacing:2.5px;font-size:13px}
  .brand span{color:var(--muted);letter-spacing:2.5px;font-size:13px;font-weight:300}
  .brand .by{position:absolute;top:29px;left:36px;font-size:9.5px;letter-spacing:1.5px;color:var(--c-skill);opacity:.85}

  .menu-btn{position:fixed;top:16px;right:20px;z-index:12;background:var(--panel);border:1px solid var(--line2);color:var(--primary);border-radius:6px;padding:7px 14px;font-size:11.5px;font-weight:700;letter-spacing:1.5px;cursor:pointer;font-family:inherit}
  .menu-btn:hover{border-color:var(--c-skill)}
  .menu-btn.on{color:var(--c-skill);border-color:var(--c-skill)}

  .panel{position:fixed;top:52px;right:20px;width:230px;z-index:11;background:rgba(20,20,23,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:10px}
  .panel.hide{display:none}
  .panel input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--primary);padding:7px 10px;font-size:12px;font-family:inherit;outline:none}
  .panel input[type=search]:focus{border-color:var(--accent)}
  .panel .lbl{font-size:9.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:2px 0 -4px}
  .seg{display:flex;gap:4px}
  .seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 0;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg button:hover:not(.on){color:var(--primary)}
  .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--secondary)}
  .row .val{margin-left:auto;color:var(--c-skill);font-variant-numeric:tabular-nums;font-size:10.5px}
  input[type=range]{flex:1;accent-color:var(--c-skill);height:14px}
  .chk{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent)}
  .btns{display:flex;gap:6px}
  .btns button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:6px;padding:6px 0;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btns button:hover{color:var(--primary);border-color:var(--line2)}
  .bake{background:none;border:1px solid var(--c-skill);color:var(--c-skill);border-radius:6px;padding:6px 0;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .bake:hover{background:rgba(249,115,22,.12)}

  /* kanban board drawer — folders as columns, files as cards */
  .board{position:fixed;left:0;right:0;bottom:0;height:38vh;min-height:230px;z-index:12;background:rgba(16,16,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
  .board.open{transform:translateY(0)}
  .board .bhead{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;color:var(--primary);font-size:11px;font-weight:700;letter-spacing:1.6px}
  .board .bhead .n{color:var(--muted);font-weight:400;letter-spacing:.3px}
  .board .bhead .close{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;font-family:inherit}
  .board .bhead .close:hover{color:var(--primary)}
  .board .cols{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:6px 18px 16px}
  .bcol{flex:0 0 210px;display:flex;flex-direction:column;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bcol .chead{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.8px;flex:0 0 auto}
  .bcol .chead .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;box-shadow:0 0 8px currentColor}
  .bcol .chead .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:1px 7px}
  .bcol .cards{flex:1;overflow-y:auto;padding:7px}
  .bcard{display:flex;align-items:center;gap:7px;padding:7px 9px;margin-bottom:5px;background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--cc,var(--line2));border-radius:7px;font-size:11.5px;color:var(--secondary);cursor:pointer;transition:.12s;white-space:nowrap;overflow:hidden}
  .bcard:hover{color:var(--primary);border-color:var(--line2);border-left-color:var(--cc)}
  .bcard .ext{margin-left:auto;font-size:9px;color:var(--muted);text-transform:uppercase;flex:0 0 auto}
  .bcard .nm{overflow:hidden;text-overflow:ellipsis}
  body.board-open .dock{bottom:calc(38vh + 26px)}
  body.board-open .hint{display:none}
  .bhead .bseg{display:flex;gap:3px;margin-left:14px}
  .bhead .bseg button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.5px}
  .bhead .bseg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bhead .btabs{display:flex;gap:3px}
  .bhead .btabs button{background:none;border:none;color:var(--muted);padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:1.2px;cursor:pointer;font-family:inherit;border-radius:5px}
  .bhead .btabs button.on{color:var(--c-skill);background:rgba(249,115,22,.10)}
  .bhead .bsearch{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--primary);padding:4px 11px;font-size:11px;font-family:inherit;outline:none;width:190px;margin-left:12px}
  .bhead .bsearch:focus{border-color:var(--accent)}
  .bfilters{display:flex;gap:5px;align-items:center;padding:0 18px 6px;flex-wrap:wrap;flex:0 0 auto}
  .bfilters .fc{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:2px 11px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.4px}
  .bfilters .fc.on{background:var(--accent-soft,rgba(59,130,246,.13));border-color:var(--accent);color:var(--primary)}
  .bfilters .fl{font-size:9px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-right:2px}
  /* ideas cards */
  .icard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--pc,#6B6B6B);border-radius:7px;padding:8px 9px;margin-bottom:6px;font-size:11.5px;color:var(--secondary);line-height:1.45;position:relative}
  .icard:hover{border-color:var(--line2);border-left-color:var(--pc)}
  .icard .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
  .icard .tag{font-size:9px;color:#60A5FA;background:rgba(59,130,246,.10);border-radius:9px;padding:1px 7px}
  .icard .iact{position:absolute;top:5px;right:6px;display:none;gap:3px}
  .icard:hover .iact{display:flex}
  .icard .iact button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:4px;width:19px;height:19px;font-size:10px;cursor:pointer;font-family:inherit;line-height:1}
  .icard .iact button:hover{color:var(--primary);border-color:var(--line2)}
  .iadd{display:flex;gap:5px;padding:2px}
  .iadd input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--primary);padding:6px 9px;font-size:11px;font-family:inherit;outline:none;min-width:0}
  .iadd input:focus{border-color:var(--accent)}
  .iadd button{background:var(--accent);border:none;color:#fff;border-radius:6px;width:26px;font-weight:700;cursor:pointer;font-family:inherit}
  /* tile view — sneak-peek thumbnails */
  .bcol.tiles{flex-basis:246px}
  .bcol.tiles .cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
  .tile{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden;cursor:pointer;transition:border-color .15s}
  .tile:hover{border-color:var(--cc,var(--accent))}
  .tile iframe{width:520%;height:520%;transform:scale(.192);transform-origin:0 0;border:none;background:#0f0f12;pointer-events:none}
  .tile .snip{padding:7px 8px;font-size:6.5px;line-height:1.5;color:var(--muted);overflow:hidden;height:100%;word-break:break-word}
  .tile .snip b{color:var(--secondary);font-size:7.5px;display:block;margin-bottom:2px}
  .tile img{width:100%;height:100%;object-fit:cover}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,12,.88);color:var(--secondary);font-size:9px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
  /* floating hover focus — big enough to understand, not huge */
  .hpv{position:fixed;width:360px;height:300px;z-index:30;background:#101014;border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:none;pointer-events:none;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .hpv.show{display:block}
  .hpv iframe{width:250%;height:250%;transform:scale(.4);transform-origin:0 0;border:none;background:#0f0f12}
  .hpv .snip{padding:14px 16px;font-size:10.5px;line-height:1.6;color:var(--secondary);overflow:hidden;height:100%}
  .hpv .snip b{color:var(--primary);display:block;margin-bottom:6px;font-size:11.5px}
  .hpv img{width:100%;height:100%;object-fit:contain}
  .hpv .hcap{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,12,.9);color:var(--primary);font-size:10px;padding:4px 10px;border-top:1px solid var(--line)}

  /* preview panel — floats above the board */
  .pv{position:fixed;left:16px;right:16px;bottom:calc(38vh + 12px);top:64px;z-index:13;background:rgba(14,14,17,.97);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:12px;display:none;flex-direction:column;overflow:hidden}
  .pv.open{display:flex}
  .pv .pvhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .pv .pvhead .nm{color:var(--primary);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv .pvhead .sp{flex:1}
  .pv .pvhead button{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pv .pvhead button:hover{color:var(--primary);border-color:var(--line2)}
  .pv .pvhead button.on{background:var(--accent-soft, rgba(59,130,246,.13));color:var(--primary);border-color:var(--line)}
  .pv .pvhead .x{border:none;background:none;font-size:15px;color:var(--muted)}
  .pv .pvhead .x:hover{color:var(--primary)}
  .pv iframe{flex:1;border:none;background:#fff}
  .pv iframe.dark{background:#181818}
  .pv .pvbody{flex:1;overflow:auto;padding:18px 26px;display:none}
  .pv .pvbody.show{display:block}
  .pv .pvbody pre.raw{white-space:pre-wrap;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;color:var(--secondary);margin:0}
  .pv .pvbody img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
  /* rich md */
  .pv .mdtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .pv .mdtabs.hide,.pv .pvhead .mdonly.hide{display:none}
  .pv .mdtabs button{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--tc,#8B5CF6);color:var(--secondary);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  .pv .mdtabs button.on{color:var(--primary);background:rgba(255,255,255,.07)}
  .pv .mdtabs input{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--primary);padding:5px 11px;font-size:11px;font-family:inherit;outline:none;width:180px}
  .pv .mdtabs input:focus{border-color:var(--accent)}
  .pv .md{line-height:1.65;font-size:13.5px;color:var(--secondary);max-width:860px}
  .pv .md h1,.pv .md h2,.pv .md h3{color:var(--primary);margin:1.2em 0 .5em;line-height:1.3}
  .pv .md h1{font-size:20px}.pv .md h2{font-size:16px;padding-left:10px;border-left:4px solid var(--sc,#8B5CF6)}.pv .md h3{font-size:13.5px}
  .pv .md p{margin:.5em 0}
  .pv .md strong{color:var(--primary)}
  .pv .md code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#60A5FA}
  .pv .md pre{background:#0b0b0e;border:1px solid var(--line);border-radius:9px;padding:12px 14px;overflow:auto}
  .pv .md pre code{background:none;color:#d5d5da}
  .pv .md table{border-collapse:collapse;margin:.8em 0;font-size:12.5px;width:100%}
  .pv .md th,.pv .md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .pv .md th{color:var(--primary);background:var(--panel2)}
  .pv .md blockquote{border-left:3px solid var(--sc,#3B82F6);margin:.8em 0;padding:2px 0 2px 12px;color:var(--muted)}
  .pv .md ul,.pv .md ol{padding-left:20px}
  .pv .md a{color:#60A5FA;text-decoration:none}
  .pv .md mark{background:rgba(249,115,22,.35);color:#fff;border-radius:3px;padding:0 2px}
  .pv .md .secbadge{display:inline-block;font-size:9.5px;letter-spacing:1.2px;font-weight:700;color:var(--sc);border:1px solid var(--sc);border-radius:10px;padding:1px 9px;margin-bottom:4px;text-transform:uppercase}

  .tip{position:fixed;pointer-events:none;background:rgba(20,20,23,.95);border:1px solid var(--line2);border-radius:7px;padding:7px 11px;font-size:11.5px;color:var(--primary);z-index:20;display:none;max-width:300px}
  .tip .sub{color:var(--muted);font-size:10px;margin-top:2px}
  .hint{position:fixed;bottom:14px;right:20px;color:var(--muted);font-size:10.5px;z-index:10;pointer-events:none;letter-spacing:.3px}

  /* chat dock — ask the brain, it lights up the galaxy */
  /* centered chat-style composer at the bottom */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:min(720px,92vw);z-index:11;background:rgba(20,20,23,.94);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 16px 46px rgba(0,0,0,.5)}
  .dock .dhead{display:flex;align-items:center;gap:8px;padding:8px 14px 4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1.4px}
  .dock .dhead .dot{width:6px;height:6px;border-radius:50%;background:var(--c-skill)}
  .dock .dhead .fold{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit}
  .dock .dbody{max-height:230px;overflow:auto;padding:8px 16px 4px;font-size:13px;line-height:1.6;color:var(--secondary);white-space:pre-wrap;word-break:break-word;display:none}
  .dock .dbody.show{display:block}
  .dock .dbody b{color:var(--primary)}
  .dock .dbody .hits{color:var(--c-skill);font-weight:600}
  .dock form{display:flex;gap:8px;padding:8px 10px 11px;align-items:center}
  .dock input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--primary);padding:14px 16px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
  .dock input:focus{border-color:var(--accent)}
  .dock button.ask{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:0 24px;height:48px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .dock button.ask:hover{background:#2563EB}
  .dock button.ask:disabled{opacity:.4}

  /* ── mobile / touch ─────────────────────────────────────────────────────── */
  @media (hover:none){ .tip,.hpv{display:none!important} }   /* no hover previews on touch */
  @media (max-width:720px){
    .hint{display:none}
    .brand{top:11px;left:13px}
    .brand span,.brand .by{display:none}
    .brand b{font-size:12px;letter-spacing:1.4px}
    .brand .mark{width:23px;height:23px}
    .menu-btn{top:11px;padding:6px 11px;font-size:11px;letter-spacing:1px}
    #fsBtn{display:none}                        /* fullscreen is awkward on mobile browsers */
    #boardBtn{right:104px!important}
    .menu-btn:not([id]){right:13px!important}
    .panel{top:50px;right:12px;left:auto;width:min(84vw,290px);max-height:calc(100dvh - 140px);overflow-y:auto}
    .dock{left:10px;right:10px;width:auto;bottom:10px;transform:none}
    .dock .dbody{max-height:32vh}
    body.board-open .dock{bottom:calc(54vh + 18px)}
    .board{height:54vh;min-height:0}
    .board .bhead{flex-wrap:wrap;gap:8px;padding:10px 13px 6px}
    .board .bhead .bseg,.board .bhead .bsearch{margin-left:0}
    .board .bhead .bsearch{width:auto;flex:1 1 120px;min-width:110px}
    .board .cols{padding:6px 13px 14px}
    .bcol,.bcol.tiles{flex-basis:80vw;max-width:88vw}
    .pv{left:10px;right:10px;top:54px;bottom:calc(54vh + 10px)}
    .pv .pvhead{flex-wrap:wrap;gap:8px}
    .pv .pvhead .sp{display:none}
    .pv .pvbody{padding:14px 15px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="brand">
  <div class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.2"/><circle cx="5.5" cy="17" r="2.2"/><circle cx="18.5" cy="17" r="2.2"/><path d="M12 7.7v3.3m0 0l-5 4.2m5-4.2l5 4.2"/></svg></div>
  <div><b>CRS BRAIN</b> <span>SECOND BRAIN</span><div class="by">CASINO REPORTING SUITE</div></div>
</div>
<button class="menu-btn" id="boardBtn" style="right:170px" title="Folder board" onclick="toggleBoard()">▦ BOARD</button>
<button class="menu-btn" id="fsBtn" style="right:118px" title="Fullscreen" onclick="toggleFS()">⛶</button>
<button class="menu-btn" onclick="ui.panel.classList.toggle('hide')">≡ MENU</button>
<div class="board" id="board">
  <div class="bhead">
    <span class="btabs" id="boardTabs">
      <button data-t="files" class="on">▦ FILES</button><button data-t="ideas">💡 IDEAS</button>
    </span>
    <span class="bseg" id="boardSeg">
      <button data-c="all" class="on">ALL</button><button data-c="crs">CRS ONLY</button>
    </span>
    <input class="bsearch" id="boardQ" placeholder="Search…" autocomplete="off">
    <span class="n" id="boardN"></span><button class="close" onclick="toggleBoard()">✕</button></div>
  <div class="bfilters" id="boardFilters"></div>
  <div class="cols" id="boardCols"></div>
</div>
<div class="hpv" id="hpv"></div>
<div class="pv" id="pv">
  <div class="pvhead">
    <span class="nm" id="pvName"></span>
    <span class="sp"></span>
    <button id="pvRendered" class="mdonly on" onclick="pvMode('rendered')">Rendered</button>

  <div class="seg" id="layoutSeg2" style="flex-wrap:wrap">
    <button data-l="orbit">Orbit</button><button data-l="spiral">Spiral</button><button data-l="grid">Grid</button><button data-l="tree">Tree</button><button data-l="sphere">Sphere</button>
  </div>

<script>
'use strict';
// ═══════════════════════════════ CRS BRAIN MAP ═══════════════════════════════
// A live galaxy of the real repo: Memory (files) in department clusters around
// CLAUDE.MD, plus the agentic layers — Applications, Routines, Skills (ARMS).
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ui = { panel: document.getElementById('panel'), tip: document.getElementById('tip'), q: document.getElementById('q') };
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; }
addEventListener('resize',resize); resize();

// ---- settings (bakeable) ----------------------------------------------------
const S = Object.assign({
  layout:'force', view:'departments', content:'all', spin:18, names:false, spring:38, size:50, collapsed:{},
}, JSON.parse(localStorage.getItem('crsmap')||'{}'));

// CRS-only mode: product knowledge only — hide the tool internals & pipeline.
const CRS_DIRS = new Set(['brain','specs','design','data','demos','pricing','audits']);
const CRS_ROOT_FILES = new Set(['CLAUDE.md','decisions.md']);
const MANUAL_DIRS=new Set(['bubble','buildprint']);   // reference manuals — hidden in CRS-only mode
function contentTree(){
  if(!tree || S.content!=='crs') return tree;
  return tree.filter(n => n.type==='dir' ? CRS_DIRS.has(n.name) : CRS_ROOT_FILES.has(n.name))
    .map(n => n.type==='dir'&&n.name==='brain'
      ? {...n, children:n.children.filter(c=>!(c.type==='dir'&&MANUAL_DIRS.has(c.name)))}
      : n);
}
function bake(){ localStorage.setItem('crsmap', JSON.stringify(S)); flash('Settings baked'); }
let flashT=0, flashMsg='';
function flash(m){ flashMsg=m; flashT=performance.now(); }

// ---- palette ----------------------------------------------------------------
const MEMC = ['#8B5CF6','#C084FC','#A78BFA','#D8B4FE','#7C3AED','#E879F9','#9333EA','#C4B5FD'];
const COL = { skill:'#F97316', routine:'#EAB308', app:'#60A5FA', center:'#F97316' };

// ---- the agentic layers (real, from this app + workflow) ---------------------
const APPS = [
  ['Claude Code','C'],['Bubble.io','B'],['Buildprint','BP'],['GitHub','G'],
  ['Node.js','N'],['Excel','X'],['Typesense','T'],
];
const ROUTINES = ['Weekly digest','Auto-commit memory','Live usage tracking','Buildprint → Ingest cycle'];
const SKILLS = ['Ingest & route reports','Grounded retrieval (INDEX-first)','Progress board updates',
  'Open reply as doc','Buildprint prompt writing','Migration planning','Pattern A guardrails'];

// ---- graph state --------------------------------------------------------------
let nodes=[], links=[], hubs=[], byId={}, tree=null, fileCount=0;
let cam={x:0,y:0,k:1}, hover=null, dragN=null, panning=false, ringAngle=0;
const rnd = (seed=>()=> (seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff)(42);

// ---- ambient life: starfield, nebulas, flow particles -------------------------
const STARS=[]; (function(){ for(let i=0;i<260;i++) STARS.push({
  x:(rnd()-0.5)*2600, y:(rnd()-0.5)*2000, z:0.15+rnd()*0.55,        // z<1 → behind, parallax
  r:0.4+rnd()*1.3, tw:rnd()*6.28, ts:0.4+rnd()*1.2 }); })();
const FLOWS=[];              // particles travelling along links toward the center
function ambientSpeed(){ return 0.35+S.spin/40; }                    // Ring-spin slider = life intensity
function spawnFlow(){
  // data exchange on ANY connection, both directions — the universe talks
  const cand=links.filter(l=>{ const a=byId[l.a],b=byId[l.b]; return a&&b&&!a.hidden&&!b.hidden; });
  if(!cand.length) return;
  const l=cand[Math.floor(Math.random()*cand.length)];
  const rev=Math.random()<0.45;
  const from=rev?l.b:l.a, to=rev?l.a:l.b;
  FLOWS.push({a:from,b:to,t:0,sp:0.004+Math.random()*0.008,color:byId[from].color,tail:0.10+Math.random()*0.12});
}
// shooting stars across the deep background
const METEORS=[]; let nextMeteor=0;
function spawnMeteor(now){
  const a=Math.random()*6.28;
  METEORS.push({x:Math.random()*W,y:Math.random()*H*0.7,dx:Math.cos(a)*7,dy:Math.sin(a)*7,t:0});
  nextMeteor=now+2600+Math.random()*4800;
}

function nSize(bytes){ const r=2.2+Math.min(5.5,Math.log10(Math.max(100,bytes||500))-1.6); return r*(0.5+S.size/100); }
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))&0xffffff; return h; }

function addNode(n){ n.x=n.x??(rnd()-0.5)*900; n.y=n.y??(rnd()-0.5)*700; n.vx=0; n.vy=0;
  n.zd = n.kind==='file' ? 0.82+ (hash(n.id)%40)/100 : 1;          // depth for parallax
  n.born = performance.now() + nodes.length*14;                    // entrance stagger
  nodes.push(n); byId[n.id]=n; return n; }
function link(a,b,len,k){ links.push({a,b,len:len||90,k:k||1}); }

function buildGraph(){
  nodes=[]; links=[]; hubs=[]; byId={}; fileCount=0;
  const center = addNode({id:'@center', kind:'center', label:'CLAUDE.MD', r:15, color:COL.center, x:0, y:0});

  // ARMS anchors
  const aSkill = addNode({id:'@skills', kind:'anchor', label:'SKILLS', color:COL.skill, r:12, x:-560, y:340});
  const aRout  = addNode({id:'@routines', kind:'anchor', label:'ROUTINES', color:COL.routine, r:12, x:420, y:420});
  const aApp   = addNode({id:'@apps', kind:'anchor', label:'APPLICATIONS', color:COL.app, r:12, x:-60, y:560});
  link('@center','@skills',330,.4); link('@center','@routines',330,.4); link('@center','@apps',380,.4);
  SKILLS.forEach((s,i)=>{ addNode({id:'sk'+i, kind:'skill', label:s, color:COL.skill, r:5, cluster:'@skills'}); link('sk'+i,'@skills',46+18*rnd(),1); });
  ROUTINES.forEach((s,i)=>{ addNode({id:'rt'+i, kind:'routine', label:s, color:COL.routine, r:6.5, cluster:'@routines'}); link('rt'+i,'@routines',52+16*rnd(),1); });
  APPS.forEach(([s,g],i)=>{ addNode({id:'ap'+i, kind:'app', label:s, glyph:g, color:COL.app, r:11, cluster:'@apps'}); link('ap'+i,'@apps',60+22*rnd(),1); });

  // Memory: department clusters (top-level dirs) or full folder hierarchy
  if(!tree) return;
  const T = contentTree();
  if(S.view==='departments'){
    const PROMOTE=50;   // a subfolder this big (e.g. brain/bubble manual) gets its own cluster
    const cntFiles=(ch)=>{ let n=0; (function w(c){for(const x of c){x.type==='dir'?w(x.children):n++;}})(ch); return n; };
    // department list: promote large subfolders (manuals) out of their parent
    const depts=[]; const rootFiles=[];
    for(const n of T){
      if(n.type!=='dir'){ rootFiles.push(n); continue; }
      const big=[], rest=[];
      for(const c of n.children){ (c.type==='dir'&&cntFiles(c.children)>=PROMOTE ? big : rest).push(c); }
      for(const b of big) depts.push({name:b.name, folder:b.path, children:b.children});
      if(cntFiles(rest)) depts.push({name:n.name, folder:n.path, children:rest});
    }
    if(rootFiles.length) depts.push({name:'root', folder:'', children:rootFiles});
    let gi=0;
    const mkDept=(name,children,folder)=>{
      const files=[]; (function walk(c){ for(const x of c){ x.type==='dir'?walk(x.children):files.push(x); } })(children);
      if(!files.length) return;
      const color=MEMC[gi++%MEMC.length];
      const ang=gi*2.399, R=320+140*rnd();
      const hub=addNode({id:'#'+name, kind:'hub', label:name.toUpperCase(), color, folder, r:Math.min(20,9+files.length*.12), count:files.length,
        x:Math.cos(ang)*R, y:Math.sin(ang)*R-120});
      hubs.push(hub); link(hub.id,'@center',230+90*rnd(),.5);
      // big reference clusters (manuals) open COLLAPSED so they don't flood the map
      if(files.length>=PROMOTE && S.collapsed[hub.id]===undefined) S.collapsed[hub.id]=true;
      files.forEach(f=>{ fileCount++;
        addNode({id:f.path, kind:'file', label:f.name, path:f.path, color, r:nSize(f.size),
          planet:(hash(f.path)%9)===0, cluster:hub.id, hidden:!!S.collapsed[hub.id]});
        link(f.path, hub.id, 26+60*rnd(), .8);
      });
    };
    for(const d of depts) mkDept(d.name, d.children, d.folder);
  } else { // folders: nested hierarchy
    let gi=0;
    const walkDir=(dirNode, parentId, depth, color)=>{
      const myColor = depth===0 ? MEMC[gi++%MEMC.length] : color;
      const files=dirNode.children.filter(c=>c.type==='file');
      const dirs=dirNode.children.filter(c=>c.type==='dir');
      let total=0; (function cnt(c){for(const x of c){x.type==='dir'?cnt(x.children):total++;}})(dirNode.children);
      const hub=addNode({id:'#'+dirNode.path, kind:'hub', label:dirNode.name.toUpperCase(), color:myColor, folder:dirNode.path,
        r:Math.min(18,7+total*.1), count:total, depth});
      hubs.push(hub); link(hub.id, parentId, depth===0?260:110, .6);
      files.forEach(f=>{ fileCount++;
        addNode({id:f.path, kind:'file', label:f.name, path:f.path, color:myColor, r:nSize(f.size),
          planet:(hash(f.path)%9)===0, cluster:hub.id, hidden:!!S.collapsed[hub.id]});
        link(f.path, hub.id, 24+46*rnd(), .8);
      });
      dirs.forEach(d=>walkDir(d, hub.id, depth+1, myColor));
    };
    const rootFiles=T.filter(c=>c.type==='file');
    rootFiles.forEach(f=>{ fileCount++;
      addNode({id:f.path, kind:'file', label:f.name, path:f.path, color:'#C4B5FD', r:nSize(f.size), cluster:'@center'});
      link(f.path,'@center',120,.6);
    });
    T.filter(c=>c.type==='dir').forEach(d=>walkDir(d,'@center',0));
  }
  ui.q.placeholder=`Search ${fileCount.toLocaleString()} files… ( / )`;
  applyLayout(true);
  if(boardOpen) renderBoard();
}

// ---- layouts ------------------------------------------------------------------
function visible(n){ return !n.hidden; }
function applyLayout(scatter){
  for(const n of nodes){ n.fx=undefined; n.fy=undefined; }
  if(S.layout==='force'){ if(scatter) for(const n of nodes){ if(n.kind==='file'){ const h=byId[n.cluster]; if(h){ n.x=h.x+(rnd()-0.5)*160; n.y=h.y+(rnd()-0.5)*160; } } } return; }
  computeTargets();
}
function computeTargets(){
  const vis=nodes.filter(visible);
  if(S.layout==='circle'){
    // hubs on a wide circle; each cluster is a golden-spiral disc around its hub
    const R=Math.min(W,H)*0.62;
    const ring=[...hubs.filter(visible)];
    ring.forEach((h,i)=>{ const a=ringAngle+i*2*Math.PI/ring.length; h.tx=Math.cos(a)*R; h.ty=Math.sin(a)*R*0.72; });
    byId['@center'].tx=0; byId['@center'].ty=0;
    byId['@skills'].tx=-R*0.45; byId['@skills'].ty=R*0.5;
    byId['@routines'].tx=R*0.45; byId['@routines'].ty=R*0.5;
    byId['@apps'].tx=0; byId['@apps'].ty=R*0.78;
    for(const grp of ['@skills','@routines','@apps']){
      const kids=vis.filter(n=>n.cluster===grp);
      kids.forEach((n,i)=>{ const a=i*2.399, r=(10+S.size/6)*Math.sqrt(i+1); n.tx=byId[grp].tx+Math.cos(a)*r; n.ty=byId[grp].ty+Math.sin(a)*r; });
    }
    for(const h of ring){ const kids=vis.filter(n=>n.cluster===h.id);
      kids.forEach((n,i)=>{ const a=i*2.399, r=(9+S.size/7)*Math.sqrt(i+1); n.tx=h.tx+Math.cos(a)*r; n.ty=h.ty+Math.sin(a)*r; }); }
  }
  if(S.layout==='hex'){
    // one big hex lattice, packed cluster by cluster
    const step=(16+S.size*0.36), cols=Math.ceil(Math.sqrt(vis.length*1.9));
    const order=[byId['@center'],...hubs.filter(visible).flatMap(h=>[h,...vis.filter(n=>n.cluster===h.id)]),
      byId['@skills'],...vis.filter(n=>n.cluster==='@skills'), byId['@routines'],...vis.filter(n=>n.cluster==='@routines'),
      byId['@apps'],...vis.filter(n=>n.cluster==='@apps')].filter(Boolean);
    order.forEach((n,i)=>{ const c=i%cols, r=Math.floor(i/cols);
      n.tx=(c-cols/2)*step+(r%2?step/2:0); n.ty=(r-order.length/cols/2)*step*0.87; });
  }
  const hubsV=hubs.filter(visible);
  const filesOf=h=>vis.filter(n=>n.cluster===h.id&&n.kind==='file');
  const grp=k=>vis.filter(n=>n.kind===k);
  if(S.layout==='orbit'){
    // solar system — minimal: each department is a planet on its own orbit
    byId['@center'].tx=0; byId['@center'].ty=0;
    grp('skill').forEach((n,i,arr)=>{ const a=ringAngle*1.1+i*6.283/arr.length; n.tx=Math.cos(a)*82; n.ty=Math.sin(a)*82*0.9; });
    byId['@skills'].tx=0; byId['@skills'].ty=-82;
    hubsV.forEach((h,i)=>{ const R=170+i*56; const a=ringAngle*(0.5+0.9/(i+2))+i*1.9;
      h.tx=Math.cos(a)*R; h.ty=Math.sin(a)*R*0.92;
      const kids=filesOf(h);
      kids.forEach((n,j)=>{ const ma=ringAngle*2+j*6.283/Math.max(6,kids.length); const mr=17+(j%3)*8;
        n.tx=h.tx+Math.cos(ma)*mr*1.35; n.ty=h.ty+Math.sin(ma)*mr; }); });
    const RR=170+hubsV.length*56;
    grp('routine').forEach((n,i,arr)=>{ const a=-ringAngle*0.7+i*6.283/arr.length; n.tx=Math.cos(a)*RR; n.ty=Math.sin(a)*RR*0.92; });
    byId['@routines'].tx=0; byId['@routines'].ty=-RR;
    grp('app').forEach((n,i,arr)=>{ const a=ringAngle*0.4+i*6.283/arr.length; n.tx=Math.cos(a)*(RR+58); n.ty=Math.sin(a)*(RR+58)*0.92; });
    byId['@apps'].tx=0; byId['@apps'].ty=-(RR+58);
  }
  if(S.layout==='spiral'){
    // one galaxy arm — everything flows along a golden spiral out of the core
    byId['@center'].tx=0; byId['@center'].ty=0;
    let idx=0; const put=n=>{ const a=idx*0.43+ringAngle*0.8, r=42+idx*5.1;
      n.tx=Math.cos(a)*r; n.ty=Math.sin(a)*r*0.9; idx++; };
    grp('skill').forEach(put); byId['@skills'].tx=0; byId['@skills'].ty=-40;
    hubsV.forEach(h=>{ const kids=filesOf(h);
      const mid=idx+Math.floor(kids.length/2);
      kids.forEach(put);
      const a=mid*0.43+ringAngle*0.8, r=42+mid*5.1+30;
      h.tx=Math.cos(a)*r; h.ty=Math.sin(a)*r*0.9; });
    grp('routine').forEach(put);
    grp('app').forEach(put);
    const last=idx*0.43+ringAngle*0.8, lr=42+idx*5.1+40;
    byId['@routines'].tx=Math.cos(last)*lr; byId['@routines'].ty=Math.sin(last)*lr*0.9;
    byId['@apps'].tx=Math.cos(last+0.4)*(lr+30); byId['@apps'].ty=Math.sin(last+0.4)*(lr+30)*0.9;
  }
  if(S.layout==='grid'){
    // constellation matrix — clean columns, one per department + ARMS columns
    const groups=[...hubsV.map(h=>({hub:h,items:filesOf(h)})),
      {hub:byId['@skills'],items:grp('skill')},{hub:byId['@routines'],items:grp('routine')},{hub:byId['@apps'],items:grp('app')}];
    const gw=132, x0=-(groups.length-1)/2*gw;
    byId['@center'].tx=0; byId['@center'].ty=-Math.min(H*0.34,300)-64;
    groups.forEach((g,i)=>{ const x=x0+i*gw, top=-Math.min(H*0.34,300)+36;
      if(g.hub){ g.hub.tx=x; g.hub.ty=top-30; }
      g.items.forEach((n,j)=>{ n.tx=x+((j%2)?15:-15); n.ty=top+14+j*25; }); });
  }
  if(S.layout==='tree'){
    // mind map — brain at the left, branches to the right
    byId['@center'].tx=-Math.min(W*0.36,560); byId['@center'].ty=0;
    const branches=[...hubsV.map(h=>({hub:h,items:filesOf(h)})),
      {hub:byId['@skills'],items:grp('skill')},{hub:byId['@routines'],items:grp('routine')},{hub:byId['@apps'],items:grp('app')}];
    const rows=branches.map(b=>Math.max(1,Math.ceil(b.items.length/6)));
    const total=rows.reduce((s,r)=>s+r*30+44,0); let y=-total/2;
    branches.forEach((b,i)=>{ const bh=rows[i]*30+44; const cy=y+bh/2; y+=bh;
      if(b.hub){ b.hub.tx=-190; b.hub.ty=cy; }
      b.items.forEach((n,j)=>{ const col=j%6, row=Math.floor(j/6);
        n.tx=-40+col*52; n.ty=cy+(row-(rows[i]-1)/2)*30; }); });
  }
  if(S.layout==='sphere'){
    // rotating 3D fibonacci sphere — the whole brain as an orb
    byId['@center'].tx=0; byId['@center'].ty=0;
    const items=vis.filter(n=>n.kind!=='center');
    const N=items.length, R=Math.min(W,H)*0.42;
    items.forEach((n,i)=>{ const y=1-2*(i+0.5)/N, rr=Math.sqrt(Math.max(0,1-y*y));
      const th=i*2.399963+ringAngle*1.6;
      n.tx=Math.cos(th)*rr*R; n.ty=y*R*0.86+Math.sin(th)*rr*26; });
  }
  if(S.layout==='rings'){
    // concentric ARMS rings: center → skills → memory arcs → routines → applications
    const R1=120, R2a=185, R2b=330, R3=430, R4=520;
    byId['@center'].tx=0; byId['@center'].ty=0;
    byId['@skills'].tx=0; byId['@skills'].ty=-R1;
    byId['@routines'].tx=0; byId['@routines'].ty=-R3;
    byId['@apps'].tx=0; byId['@apps'].ty=-R4;
    const sk=vis.filter(n=>n.kind==='skill');
    sk.forEach((n,i)=>{ const a=ringAngle*1.4+i*2*Math.PI/sk.length; n.tx=Math.cos(a)*R1; n.ty=Math.sin(a)*R1; });
    const rt=vis.filter(n=>n.kind==='routine');
    rt.forEach((n,i)=>{ const a=-ringAngle+i*2*Math.PI/Math.max(24,rt.length*6); n.tx=Math.cos(a)*R3; n.ty=Math.sin(a)*R3; });
    const ap=vis.filter(n=>n.kind==='app');
    ap.forEach((n,i)=>{ const a=ringAngle*0.6+i*2*Math.PI/Math.max(18,ap.length*2.6); n.tx=Math.cos(a)*R4; n.ty=Math.sin(a)*R4; });
    // memory: each dept is an arc sector of dotted spiral rows between R2a..R2b
    const hs=hubs.filter(visible); let a0=ringAngle*0.5;
    const totalFiles=hs.reduce((s,h)=>s+(h.count||1),0)||1;
    for(const h of hs){
      const span=Math.max(.35, 2*Math.PI*(h.count/totalFiles));
      const kids=vis.filter(n=>n.cluster===h.id);
      const rows=Math.max(2,Math.ceil(kids.length/22));
      h.tx=Math.cos(a0+span/2)*((R2a+R2b)/2); h.ty=Math.sin(a0+span/2)*((R2a+R2b)/2);
      kids.forEach((n,i)=>{ const row=i%rows, j=Math.floor(i/rows), perRow=Math.ceil(kids.length/rows);
        const a=a0+0.06+ (span-0.12)*(j/Math.max(1,perRow-1||1));
        const r=R2a+ (R2b-R2a)*(row/(rows-1||1)) + Math.sin(i*2.7)*4;
        n.tx=Math.cos(a)*r; n.ty=Math.sin(a)*r; });
      a0+=span;
    }
  }
}

// ---- physics -------------------------------------------------------------------
function step(dt){
  const vis=nodes.filter(visible);
  if(S.layout==='force'){
    const springK=S.spring/100;
    // Tiered repulsion — dense clusters (600+ files) would make all-pairs O(n²)
    // explode, so: file↔file is LOCAL only (80px, fine grid); the ~40 non-file
    // nodes (hubs/anchors/skills/…) interact long-range with everything.
    const files=[], big=[];
    for(const n of vis) (n.kind==='file'?files:big).push(n);
    // file↔file: fine grid, 80px cutoff
    const FC=80, fgrid=new Map();
    for(let i=0;i<files.length;i++){ const n=files[i]; n._gi=i;
      const k=Math.floor(n.x/FC)+'|'+Math.floor(n.y/FC);
      let b=fgrid.get(k); if(!b){ b=[]; fgrid.set(k,b); } b.push(n); }
    for(const a of files){
      const cx=Math.floor(a.x/FC), cy=Math.floor(a.y/FC);
      for(let gx=cx-1;gx<=cx+1;gx++) for(let gy=cy-1;gy<=cy+1;gy++){
        const cell=fgrid.get(gx+'|'+gy); if(!cell) continue;
        for(const b of cell){ if(b._gi<=a._gi) continue;
          let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+40; if(d2>6400) continue;
          const f=520/d2, d=Math.sqrt(d2); dx/=d; dy/=d;
          a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
        }}}
    // big↔big and big↔file: long-range (300px), big count is tiny
    for(let i=0;i<big.length;i++){ const a=big[i];
      for(let j=i+1;j<big.length;j++){ const b=big[j];
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+40; if(d2>90000) continue;
        const f=2600/d2, d=Math.sqrt(d2); dx/=d; dy/=d;
        a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
      for(const b of files){
        let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+40; if(d2>90000) continue;
        const f=2600/d2, d=Math.sqrt(d2); dx/=d; dy/=d;
        a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }}
    for(const l of links){ const a=byId[l.a], b=byId[l.b]; if(!a||!b||a.hidden||b.hidden) continue;
      let dx=b.x-a.x, dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-l.len)*0.028*springK*l.k; dx/=d; dy/=d;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    for(const n of vis){
      if(n.id==='@center'){ n.x=0; n.y=0; n.vx=0; n.vy=0; continue; }   // pin the brain dead-center
      n.vx-=n.x*0.00035; n.vy-=n.y*0.00035;   // gentle gravity to origin
      n.vx=Math.max(-14,Math.min(14,n.vx)); n.vy=Math.max(-14,Math.min(14,n.vy));
      if(n!==dragN){ n.x+=n.vx; n.y+=n.vy; } n.vx*=0.86; n.vy*=0.86; }
    // galactic rotation — whole system revolves; files also orbit their hub
    const sp=ambientSpeed();
    const G=0.0000115*sp*dt, cg=Math.cos(G), sg=Math.sin(G);
    for(const n of vis){ if(n===dragN||n.id==='@center') continue;
      const x=n.x, y=n.y; n.x=x*cg-y*sg; n.y=x*sg+y*cg;
      if(n.kind==='file'&&n.cluster){ const h=byId[n.cluster];
        if(h&&!h.hidden){ const w=(0.00006+(hash(n.id)%17)*0.000006)*sp*dt*((hash(n.id)%2)?1:-1);
          const cw=Math.cos(w), sw=Math.sin(w), dx=n.x-h.x, dy=n.y-h.y;
          n.x=h.x+dx*cw-dy*sw; n.y=h.y+dx*sw+dy*cw; } } }
  } else {
    computeTargets();
    for(const n of vis){ if(n.tx===undefined||n===dragN) continue;
      n.x+=(n.tx-n.x)*0.08; n.y+=(n.ty-n.y)*0.08; }
  }
  ringAngle+=(S.spin/100)*dt*0.00025*(S.layout==='force'?0:1);
}

// ---- glow sprites ----------------------------------------------------------------
const sprites={};
function glow(color,r){
  const key=color+'|'+Math.round(r);
  if(sprites[key]) return sprites[key];
  const pad=Math.ceil(r*3.4), s=document.createElement('canvas'); s.width=s.height=pad*2;
  const c=s.getContext('2d'); const g=c.createRadialGradient(pad,pad,0,pad,pad,pad);
  g.addColorStop(0,color+'CC'); g.addColorStop(0.35,color+'55'); g.addColorStop(1,color+'00');
  c.fillStyle=g; c.fillRect(0,0,pad*2,pad*2);
  return sprites[key]=s;
}

// ---- drawing -----------------------------------------------------------------------
function hexPath(x,y,r){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }
function starPath(x,y,r){ ctx.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4-Math.PI/2, rr=i%2?r*0.38:r; const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }

function drawBackdrop(now){
  // faint hex lattice
  ctx.save(); ctx.strokeStyle='rgba(255,255,255,0.016)'; ctx.lineWidth=1;
  const s=46;
  for(let y=-1;y<H/s/0.87+1;y++){ for(let x=-1;x<W/s+1;x++){
    const px=x*s+(y%2?s/2:0), py=y*s*0.87;
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const hx=px+Math.cos(a)*s*0.56, hy=py+Math.sin(a)*s*0.56; i?ctx.lineTo(hx,hy):ctx.moveTo(hx,hy);} ctx.closePath(); ctx.stroke();
  }} ctx.restore();
  // parallax starfield — depth-scaled pan/zoom + twinkle
  const sp=ambientSpeed();
  ctx.save();
  for(const st of STARS){
    const px=W/2 + (st.x*cam.k + cam.x)*st.z;
    const py=H/2 + (st.y*cam.k + cam.y)*st.z;
    if(px<-8||px>W+8||py<-8||py>H+8) continue;
    const tw=0.35+0.65*Math.abs(Math.sin(now*0.0008*st.ts*sp+st.tw));
    ctx.globalAlpha=tw*0.5*st.z*1.4;
    ctx.fillStyle= st.z>0.55 ? '#AEB8D8' : '#6E7690';
    ctx.beginPath(); ctx.arc(px,py,st.r*(0.7+st.z*0.6)*Math.min(1.5,cam.k),0,7); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
  // shooting stars
  if(now>nextMeteor) spawnMeteor(now);
  for(let i=METEORS.length-1;i>=0;i--){ const m=METEORS[i]; m.t+=0.016; m.x+=m.dx*sp; m.y+=m.dy*sp;
    if(m.t>1.4||m.x<-60||m.x>W+60||m.y<-60||m.y>H+60){ METEORS.splice(i,1); continue; }
    const fade=Math.sin(Math.min(1,m.t/1.4)*Math.PI);
    const grad=ctx.createLinearGradient(m.x,m.y,m.x-m.dx*9,m.y-m.dy*9);
    grad.addColorStop(0,'rgba(190,205,255,'+(0.75*fade)+')'); grad.addColorStop(1,'rgba(190,205,255,0)');
    ctx.strokeStyle=grad; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m.x-m.dx*9,m.y-m.dy*9); ctx.stroke();
  }
}

let matches=null;
function draw(){
  const now=performance.now(), sp=ambientSpeed();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0A0A0C'; ctx.fillRect(0,0,W,H);
  drawBackdrop(now);
  ctx.translate(W/2+cam.x, H/2+cam.y); ctx.scale(cam.k,cam.k);
  const dim=(n)=> matches && !matches.has(n.id);

  // nebula fog behind each cluster — slow drift + breathing
  if(!matches) for(const h of hubs){ if(h.hidden) continue;
    const b=0.85+0.15*Math.sin(now*0.00035*sp+hash(h.id));
    const g=glow(h.color, Math.min(20,9+(h.count||4)*.12)*1.7);
    const dx=Math.sin(now*0.00021*sp+hash(h.id))*14, dy=Math.cos(now*0.00017*sp+hash(h.id)*3)*11;
    ctx.globalAlpha=0.34*b;
    const S8=(h.r||14)*8.5;
    ctx.drawImage(g, h.x+dx-S8, h.y+dy-S8, S8*2, S8*2);
  }
  ctx.globalAlpha=1;

  // orbit guides — thin, minimal
  if(S.layout==='orbit'){
    ctx.save(); ctx.lineWidth=1/cam.k; ctx.strokeStyle='rgba(255,255,255,.045)';
    const nH=hubs.filter(h=>!h.hidden).length;
    ctx.beginPath(); ctx.ellipse(0,0,82,82*0.9,0,0,7); ctx.stroke();
    for(let i=0;i<nH;i++){ const R=170+i*56; ctx.beginPath(); ctx.ellipse(0,0,R,R*0.92,0,0,7); ctx.stroke(); }
    const RR=170+nH*56;
    ctx.strokeStyle='rgba(234,179,8,.10)'; ctx.beginPath(); ctx.ellipse(0,0,RR,RR*0.92,0,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(96,165,250,.10)'; ctx.beginPath(); ctx.ellipse(0,0,RR+58,(RR+58)*0.92,0,0,7); ctx.stroke();
    ctx.restore();
  }
  if(S.layout==='sphere'){
    ctx.save(); ctx.lineWidth=1/cam.k; ctx.strokeStyle='rgba(139,92,246,.09)';
    const R=Math.min(W,H)*0.42;
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.86,0,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.03)';
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.28,0,0,7); ctx.stroke();
    ctx.restore();
  }
  // ring guides for rings layout
  if(S.layout==='rings'){
    ctx.save(); ctx.lineWidth=1/cam.k;
    for(const [r,c] of [[120,'rgba(249,115,22,.28)'],[430,'rgba(234,179,8,.30)'],[520,'rgba(96,165,250,.28)']]){
      ctx.strokeStyle=c; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.textAlign='center';
    ctx.font=`600 ${15/cam.k}px Inter,sans-serif`; ctx.letterSpacing='3px';
    ctx.fillStyle='#60A5FA'; ctx.fillText('APPLICATIONS',0,-520-12/cam.k);
    ctx.fillStyle='#EAB308'; ctx.fillText('ROUTINES',0,-430-12/cam.k);
    ctx.fillStyle='#A78BFA'; ctx.fillText('MEMORY',0,-330-12/cam.k);
    ctx.fillStyle='#F97316'; ctx.fillText('SKILLS',0,-120-12/cam.k);
    ctx.restore();
  }

  // links — backbone lines carry marching energy dashes; leaf links batched into
  // two path strokes (dim + normal) so 700+ links cost 2 draw calls, not 700.
  ctx.lineWidth=1/cam.k;
  ctx.beginPath();
  for(const l of links){ const a=byId[l.a], b=byId[l.b]; if(!a||!b||a.hidden||b.hidden) continue;
    if(a.kind!=='file'&&b.kind!=='file') continue;
    if(dim(a)&&dim(b)) continue;
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
  ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.stroke();
  if(matches){ ctx.beginPath();
    for(const l of links){ const a=byId[l.a], b=byId[l.b]; if(!a||!b||a.hidden||b.hidden) continue;
      if(a.kind!=='file'&&b.kind!=='file') continue;
      if(!(dim(a)&&dim(b))) continue;
      ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
    ctx.strokeStyle='rgba(255,255,255,.015)'; ctx.stroke(); }
  for(const l of links){ const a=byId[l.a], b=byId[l.b]; if(!a||!b||a.hidden||b.hidden) continue;
    if(a.kind==='file'||b.kind==='file') continue;              // trunk: hub/anchor/center
    ctx.save();
    ctx.strokeStyle=(dim(a)&&dim(b))?'rgba(255,255,255,.015)':(b.color||a.color)+'2E';
    ctx.lineWidth=1.1/cam.k;
    ctx.setLineDash([3/cam.k,11/cam.k]);
    ctx.lineDashOffset=-(now*0.014*sp)%(14/cam.k);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.restore(); }

  // data pulses with comet tails — every connection exchanges light
  const want=Math.round(44*sp);
  while(FLOWS.length<want && Math.random()<0.5) spawnFlow();
  for(let i=FLOWS.length-1;i>=0;i--){ const f=FLOWS[i];
    const a=byId[f.a], b=byId[f.b];
    if(!a||!b||a.hidden||b.hidden){ FLOWS.splice(i,1); continue; }
    f.t+=f.sp*sp;
    if(f.t>=1){ FLOWS.splice(i,1); continue; }
    const e=f.t*f.t*(3-2*f.t);                                  // smoothstep
    const x=a.x+(b.x-a.x)*e, y=a.y+(b.y-a.y)*e;
    const et=Math.max(0,e-f.tail), tx=a.x+(b.x-a.x)*et, ty=a.y+(b.y-a.y)*et;
    const fade=Math.sin(f.t*Math.PI);
    const A=(matches?0.06:0.6)*fade;
    // tail
    const grad=ctx.createLinearGradient(x,y,tx,ty);
    grad.addColorStop(0,f.color+'B0'); grad.addColorStop(1,f.color+'00');
    ctx.globalAlpha=A; ctx.strokeStyle=grad; ctx.lineWidth=1.6/cam.k;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
    // head
    const g=glow(f.color,3);
    ctx.drawImage(g,x-g.width/2,y-g.height/2);
    ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(x,y,1.15/Math.sqrt(cam.k),0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // nodes — draw files first, structural (hubs/anchors/center) on top so the
  // brain and hubs never get buried under a big cluster like the Bubble manual.
  const _f=[],_s=[];
  for(const n of nodes){ if(n.hidden) continue; (n.kind==='file'?_f:_s).push(n); }
  for(const n of _f.concat(_s)){
    if(S.layout==='rings'&&n.kind==='anchor') continue;   // ring labels replace anchors
    const alpha=dim(n)?0.10:1; ctx.globalAlpha=alpha;
    // entrance: scale in with stagger
    const born=n.born||0; const age=Math.min(1,(now-born)/650);
    const ease=age<1 ? 1-Math.pow(1-age,3) : 1;
    if(ease<=0.02) continue;
    // depth parallax: files sit at slightly different depths
    const z=n.zd||1;
    const ox=(z-1)*cam.x*0.06/cam.k, oy=(z-1)*cam.y*0.06/cam.k;
    const nx=n.x+ox, ny=n.y+oy;
    // breathing glow — LOD: skip glow sprite for subpixel file nodes when zoomed out
    const pulse=1+0.16*Math.sin(now*0.0011*sp+hash(n.id)%628/100);
    const r=n.r*ease*(hover===n?1.28:1);
    if(!(n.kind==='file' && r*cam.k<2.4)){
      const g=glow(n.color, r*1.7*pulse*z);
      ctx.drawImage(g, nx-g.width/2, ny-g.height/2, g.width, g.height);
    }
    ctx.fillStyle=n.color;
    if(n.kind==='skill'){ ctx.save(); ctx.translate(nx,ny); ctx.rotate(now*0.00018*sp*(hash(n.id)%2?1:-1));
      starPath(0,0,r*1.5*pulse); ctx.fill(); ctx.restore(); }
    else if(n.kind==='app'){ hexPath(nx,ny,r); ctx.fillStyle='rgba(30,41,59,.9)'; ctx.fill(); ctx.strokeStyle=n.color; ctx.lineWidth=1.4/cam.k; hexPath(nx,ny,r); ctx.stroke();
      ctx.fillStyle='#DBEAFE'; ctx.font=`700 ${r*0.8}px Inter,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(n.glyph||'?',nx,ny+0.5); }
    else if(n.kind==='routine'){ ctx.beginPath(); ctx.arc(nx,ny,r,0,7); ctx.fillStyle='rgba(234,179,8,.16)'; ctx.fill();
      ctx.strokeStyle=n.color; ctx.lineWidth=1.3/cam.k; ctx.beginPath(); ctx.arc(nx,ny,r,0,7); ctx.stroke();
      ctx.beginPath(); ctx.arc(nx,ny,r*0.4,0,7); ctx.fillStyle=n.color; ctx.fill();
      const oa=now*0.001*sp+hash(n.id); ctx.beginPath(); ctx.arc(nx+Math.cos(oa)*r, ny+Math.sin(oa)*r, 1.6/Math.sqrt(cam.k),0,7); ctx.fill(); }
    else { // center / anchor / hub / file
      ctx.beginPath(); ctx.arc(nx,ny,r,0,7); ctx.fill();
      if(n.planet){ ctx.save(); ctx.translate(nx,ny); ctx.rotate(-0.5+(hash(n.id)%10)/10 + Math.sin(now*0.0003*sp+hash(n.id))*0.1);
        ctx.strokeStyle=n.color+'AA'; ctx.lineWidth=1.1/cam.k; ctx.beginPath(); ctx.ellipse(0,0,r*1.9,r*0.62,0,0,7); ctx.stroke(); ctx.restore(); }
      if(n.kind==='hub'&&!dim(n)){ // one tiny moon orbiting each hub
        const ma=now*0.0005*sp+hash(n.id); const mr=r+7/Math.sqrt(cam.k);
        ctx.globalAlpha=alpha*0.85; ctx.beginPath(); ctx.arc(nx+Math.cos(ma)*mr, ny+Math.sin(ma)*mr*0.5, 1.7/Math.sqrt(cam.k),0,7); ctx.fill(); ctx.globalAlpha=alpha; }
      if(n.kind==='center'){
        ctx.fillStyle='#0A0A0C'; hexPath(nx,ny,r*0.55); ctx.fill();
        // rotating dashed orbit — the brain is thinking. Skip when zoomed out:
        // sub-pixel dashes shimmer/alias, which read as "glitching".
        if(cam.k>0.5){
          ctx.save(); ctx.translate(nx,ny); ctx.rotate(now*0.00028*sp);
          ctx.strokeStyle=n.color+'66'; ctx.lineWidth=1.2/cam.k; ctx.setLineDash([5/cam.k,9/cam.k]);
          ctx.beginPath(); ctx.arc(0,0,r*1.85,0,7); ctx.stroke();
          ctx.rotate(-now*0.0006*sp); ctx.setLineDash([2/cam.k,14/cam.k]);
          ctx.beginPath(); ctx.arc(0,0,r*2.6,0,7); ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle=n.color;
      }
    }
    // hover ripple
    if(n.rippleT && now-n.rippleT<700){ const rt=(now-n.rippleT)/700;
      ctx.strokeStyle=n.color; ctx.globalAlpha=alpha*(1-rt)*0.7; ctx.lineWidth=1.4/cam.k;
      ctx.beginPath(); ctx.arc(nx,ny,r+rt*26/Math.sqrt(cam.k),0,7); ctx.stroke(); ctx.globalAlpha=alpha; }
    // labels
    ctx.textAlign='center'; ctx.textBaseline='top';
    if(n.kind==='hub'||n.kind==='center'||n.kind==='anchor'){
      ctx.font=`700 ${11/cam.k}px Inter,sans-serif`; ctx.fillStyle= dim(n)?'rgba(224,224,224,.15)':'#E0E0E0';
      ctx.fillText(n.label, n.x, n.y+r+5/cam.k);
      if(n.count){ // count badge
        const bw=ctx.measureText(String(n.count)).width+12/cam.k;
        const bx=n.x+r*0.9+10/cam.k, by=n.y-r-14/cam.k;
        ctx.fillStyle='rgba(255,255,255,.08)'; ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1/cam.k;
        ctx.beginPath(); ctx.roundRect(bx-bw/2,by-8/cam.k,bw,16/cam.k,8/cam.k); ctx.fill(); ctx.stroke();
        ctx.fillStyle='#E0E0E0'; ctx.font=`600 ${10/cam.k}px Inter,sans-serif`; ctx.textBaseline='middle'; ctx.fillText(String(n.count),bx,by); ctx.textBaseline='top';
      }
    } else if((S.names&&n.kind==='file'&&cam.k>0.7)||(n.kind!=='file'&&S.layout!=='rings'&&cam.k>0.8&&(n.kind==='skill'||n.kind==='routine'||n.kind==='app'))){
      ctx.font=`400 ${9.5/cam.k}px Inter,sans-serif`; ctx.fillStyle=dim(n)?'rgba(166,166,166,.12)':'rgba(166,166,166,.75)';
      ctx.fillText(n.label, n.x, n.y+r+3.5/cam.k);
    }
    ctx.globalAlpha=1;
  }
  // flash toast
  const ft=performance.now()-flashT;
  if(ft<1600){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalAlpha=Math.min(1,(1600-ft)/400);
    ctx.font='600 12px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#F97316';
    ctx.fillText(flashMsg, W/2, H-26); ctx.globalAlpha=1; }
}

// ---- main loop ----------------------------------------------------------------------
let last=performance.now();
function loop(now){ const dt=Math.min(50,now-last); last=now; step(dt); draw(); requestAnimationFrame(loop); }

// ---- interaction ----------------------------------------------------------------------
function toWorld(px,py){ return { x:(px-W/2-cam.x)/cam.k, y:(py-H/2-cam.y)/cam.k }; }
function pick(px,py){ const p=toWorld(px,py);
  for(let i=nodes.length-1;i>=0;i--){ const n=nodes[i]; if(n.hidden) continue;
    const rr=Math.max(n.r*1.6, 6/cam.k); const dx=p.x-n.x, dy=p.y-n.y;
    if(dx*dx+dy*dy<rr*rr) return n; } return null; }

let downAt=null;
const pointers=new Map();      // live pointers → pinch-zoom on touch
let pinch=null, panLast=null;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){                       // second finger → pinch; cancel any drag/click
    dragN=null; panning=false; downAt=null; panLast=null;
    const p=[...pointers.values()];
    pinch={ d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), cx:(p[0].x+p[1].x)/2, cy:(p[0].y+p[1].y)/2 };
    return; }
  downAt={x:e.clientX,y:e.clientY,moved:false};
  const n=pick(e.clientX,e.clientY);
  if(n && S.layout==='force'){ dragN=n; } else { panning=true; panLast={x:e.clientX,y:e.clientY}; }

cv.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && pointers.size>=2){               // pinch-zoom + two-finger pan
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), cx=(p[0].x+p[1].x)/2, cy=(p[0].y+p[1].y)/2;
    const f=d/(pinch.d||d), k2=Math.min(4,Math.max(0.18,cam.k*f));
    const wp=toWorld(cx,cy);
    cam.x-=wp.x*(k2-cam.k); cam.y-=wp.y*(k2-cam.k); cam.k=k2;
    cam.x+=cx-pinch.cx; cam.y+=cy-pinch.cy;
    pinch.d=d; pinch.cx=cx; pinch.cy=cy; return; }
  if(downAt){ const dx=e.clientX-downAt.x, dy=e.clientY-downAt.y;
    if(Math.abs(dx)+Math.abs(dy)>3) downAt.moved=true;
    if(dragN){ const p=toWorld(e.clientX,e.clientY); dragN.x=p.x; dragN.y=p.y; dragN.vx=0; dragN.vy=0; }
    else if(panning){ cam.x+=e.clientX-panLast.x; cam.y+=e.clientY-panLast.y; panLast={x:e.clientX,y:e.clientY}; }
  } else {
    const prev=hover;
    hover=pick(e.clientX,e.clientY);
    if(hover&&hover!==prev) hover.rippleT=performance.now();
    cv.classList.toggle('pointing', !!hover && (hover.kind==='file'||hover.kind==='hub'));
    if(hover){ ui.tip.style.display='block'; ui.tip.style.left=(e.clientX+14)+'px'; ui.tip.style.top=(e.clientY+12)+'px';
      ui.tip.innerHTML= hover.kind==='file' ? `${hover.label}<div class="sub">${hover.path} · click to open</div>`
        : hover.kind==='hub' ? `${hover.label}<div class="sub">${hover.count} files · double-click to ${S.collapsed[hover.id]?'expand':'collapse'}</div>`
        : `${hover.label}`;
    } else ui.tip.style.display='none';
  }});
function openNode(n){

  }
  if(n.kind!=='file'||!n.path) return;
  if(/\.html?$/i.test(n.path)){ // html → the user's default browser

const escH=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function miniInline(s){
  return escH(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
}
function miniMd(src){
  const L=src.replace(/\r/g,'').split('\n'); let h='',i=0;
  while(i<L.length){ const l=L[i];
    if(/^```/.test(l)){ let c=''; i++; while(i<L.length&&!/^```/.test(L[i])){c+=L[i]+'\n';i++;} i++; h+='<pre><code>'+escH(c)+'</code></pre>'; continue; }
    if(/^#{1,6}\s/.test(l)){ const n=l.match(/^#+/)[0].length; h+=`<h${n}>${miniInline(l.replace(/^#+\s/,''))}</h${n}>`; i++; continue; }
    if(/^\s*>/.test(l)){ let q=''; while(i<L.length&&/^\s*>/.test(L[i])){q+=L[i].replace(/^\s*>\s?/,'')+' ';i++;} h+='<blockquote>'+miniInline(q)+'</blockquote>'; continue; }
    if(/^\s*[-*+]\s/.test(l)){ h+='<ul>'; while(i<L.length&&/^\s*[-*+]\s/.test(L[i])){h+='<li>'+miniInline(L[i].replace(/^\s*[-*+]\s/,''))+'</li>';i++;} h+='</ul>'; continue; }
    if(/^\s*\d+\.\s/.test(l)){ h+='<ol>'; while(i<L.length&&/^\s*\d+\.\s/.test(L[i])){h+='<li>'+miniInline(L[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++;} h+='</ol>'; continue; }
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|[-:\s|]+\|\s*$/.test(L[i+1])){
      const row=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(l); i+=2; let b='';
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){ b+='<tr>'+row(L[i]).map(c=>'<td>'+miniInline(c)+'</td>').join('')+'</tr>'; i++; }
      h+='<table><thead><tr>'+head.map(c=>'<th>'+miniInline(c)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table>'; continue; }
    if(l.trim()===''){ i++; continue; }
    let p=l; i++;
    while(i<L.length&&L[i].trim()!==''&&!/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(L[i])){ p+=' '+L[i]; i++; }
    h+='<p>'+miniInline(p)+'</p>';
  }
  return h;
}
function openPreview(f){ // f: {path,label}

  pv.tabs.classList.add('hide');
  if(html){ pv.frame.style.display=''; pv.body.classList.remove('show');
    pv.frame.src='/api/raw?path='+encodeURIComponent(f.path); return; }
  pv.frame.style.display='none'; pv.frame.src='about:blank'; pv.body.classList.add('show');
  if(img){ pv.body.innerHTML='<img src="/api/raw?path='+encodeURIComponent(f.path)+'">'; return; }
  pv.body.innerHTML='<pre class="raw" style="color:var(--muted)">loading…</pre>';
  fetch('/api/file?path='+encodeURIComponent(f.path)).then(r=>r.json()).then(d=>{
    pvRaw=d.content||'';
    if(md){ pvParseSecs(); pvM='rendered'; pvQ=''; pvRenderMd(); }
    else pv.body.innerHTML='<pre class="raw">'+escH(pvRaw)+'</pre>';
  }).catch(()=>pv.body.innerHTML='<pre class="raw">could not load</pre>');
}
function pvParseSecs(){
  const L=pvRaw.replace(/\r/g,'').split('\n');
  pvSecs=[]; let cur={title:'Top', body:[]};
  for(const l of L){
    if(/^##\s/.test(l)){ if(cur.body.join('').trim()||pvSecs.length===0&&cur.body.length) pvSecs.push(cur);
      cur={title:l.replace(/^##\s/,'').trim(), body:[]}; }
    else cur.body.push(l);
  }
  pvSecs.push(cur);
  pvSecs=pvSecs.filter(s=>s.title==='Top'?s.body.join('').trim():true);
  pvSec=0;
}
function pvHits(s){ return pvQ ? (s.title+'\n'+s.body.join('\n')).toLowerCase().includes(pvQ.toLowerCase()) : true; }
function pvRenderMd(){
  document.getElementById('pvRendered').classList.toggle('on',pvM==='rendered');
  document.getElementById('pvText').classList.toggle('on',pvM==='text');
  if(pvM==='text'){ pv.tabs.classList.add('hide'); pv.body.innerHTML='<pre class="raw">'+escH(pvRaw)+'</pre>'; return; }
  // tabs: one per ## section, colored
  pv.tabs.classList.remove('hide'); pv.tabs.innerHTML='';
  const visible=pvSecs.map((s,i)=>({s,i})).filter(x=>pvHits(x.s));
  if(!visible.find(x=>x.i===pvSec)) pvSec=visible.length?visible[0].i:0;
  visible.forEach(({s,i})=>{
    const b=document.createElement('button'); b.textContent=s.title; b.style.setProperty('--tc',MEMC[i%MEMC.length]);
    b.classList.toggle('on',i===pvSec); b.onclick=()=>{pvSec=i;pvRenderMd();};
    pv.tabs.appendChild(b);
  });
  const inp=document.createElement('input'); inp.placeholder='Search sections…'; inp.value=pvQ;
  inp.oninput=()=>{pvQ=inp.value;pvRenderMd();setTimeout(()=>{const el=pv.tabs.querySelector('input');el&&el.focus();},0)};
  pv.tabs.appendChild(inp);
  const sec=pvSecs[pvSec]||{title:'',body:[]};
  const color=MEMC[pvSec%MEMC.length];
  let html='<div class="md" style="--sc:'+color+'">'
    +(sec.title!=='Top'?'<span class="secbadge">'+escH(sec.title)+'</span>':'')
    +miniMd((sec.title!=='Top'?'## '+sec.title+'\n':'')+sec.body.join('\n'))+'</div>';
  if(pvQ){ const re=new RegExp('('+pvQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    html=html.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(re,'<mark>$1</mark>')+'<'); }
  pv.body.innerHTML=html;
}
function pvMode(m){ pvM=m; pvRenderMd(); }
function pvOpenTab(){ if(pvFile) window.open('/api/raw?path='+encodeURIComponent(pvFile.path),'_blank'); }
function pvOpenBrowser(){ if(pvFile) fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:pvFile.path})}).then(()=>flash('Opened in your browser')); }
function closePv(){ pv.el.classList.remove('open'); pv.frame.src='about:blank'; pvFile=null; }
document.getElementById('boardSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  S.content=b.dataset.c;
  document.querySelectorAll('#boardSeg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('#contentSeg button').forEach(x=>x.classList.toggle('on',x.dataset.c===S.content));
  buildGraph(); });

// ---- chat dock: ask the brain, highlight what it points at ---------------------------
const dockBody=document.getElementById('dockBody'), dockQ=document.getElementById('dockQ'),
      dockSend=document.getElementById('dockSend');
let dockChatId=null, asking=false;
document.getElementById('dockFold').addEventListener('click',()=>dockBody.classList.toggle('show'));
document.getElementById('dockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=dockQ.value.trim(); if(!q||asking) return;
  asking=true; dockSend.disabled=true; dockQ.value='';
  dockBody.classList.add('show'); dockBody.innerHTML='<b>You:</b> '+q.replace(/</g,'&lt;')+'\n\n<i style="color:var(--muted)">thinking…</i>';
  const prompt=q+'\n\n(Answering inside the brain-map view: mention the exact repo-relative paths of every relevant file so the map can highlight them.)';
  let full='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:dockChatId,message:prompt,title:'Map — '+q.slice(0,50)})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf('\n\n'))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='meta') dockChatId=ev.id;
        else if(ev.type==='delta'){ full+=ev.text; dockBody.textContent=full; dockBody.scrollTop=dockBody.scrollHeight; }
        else if(ev.type==='done'){ full=ev.reply||full; dockChatId=ev.id; }
        else if(ev.type==='error'){ full='Error: '+ev.error; }
      } }
  }catch(err){ full='Error: '+err.message; }
  dockBody.textContent=full;
  // light up every node whose path appears in the answer, then fly to the first
  const hits=nodes.filter(n=>n.kind==='file'&&n.path&&full.includes(n.path));
  if(hits.length){
    matches=new Set(hits.map(n=>n.id));
    for(const n of hits){ if(n.cluster){ matches.add(n.cluster); if(S.collapsed[n.cluster]){ S.collapsed[n.cluster]=false; for(const x of nodes) if(x.cluster===n.cluster) x.hidden=false; } } }
    const t=hits[0]; cam.k=Math.max(cam.k,1.1); cam.x=-t.x*cam.k; cam.y=-t.y*cam.k;
    dockBody.innerHTML+='\n\n<span class="hits">◉ '+hits.length+' file'+(hits.length>1?'s':'')+' highlighted on the map — click to open.</span>';
    searchMatches=matches;
  } else { matches=null; searchMatches=null; }
  dockBody.scrollTop=dockBody.scrollHeight;
  asking=false; dockSend.disabled=false;
});

// ---- boot ----------------------------------------------------------------------------
fetch('/api/files').then(r=>r.json()).then(d=>{ tree=d.tree; buildGraph(); requestAnimationFrame(loop); })
  .catch(()=>{ document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#A6A6A6">Could not load the repo tree — is the CRS Brain server running?</div>'); });
</script>
