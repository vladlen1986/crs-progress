let boardOpen=false, searchMatches=null;
let boardTab='files', boardQ='', extFilter=null, tagFilter=null, priFilter=null;
let ideas=null;   // {columns:{inbox,exploring,planned,done}}
// DOM-injected colors reference tokens directly so they theme-flip with the page (§2)
const IDEA_COLS=[['inbox','💡 Inbox','var(--accent-soft)'],['exploring','🔍 Exploring','var(--purple)'],['planned','📌 Planned','var(--warning)'],['done','✅ Done','var(--success)']];
function parseIdea(text){ // native parsing: #tags and !priority
  const tags=[...text.matchAll(/#([\w-]+)/g)].map(m=>m[1]);
  const pri=(text.match(/!(high|med|low)\b/)||[])[1]||null;
  return {tags,pri};
}
function toggleBoard(){ boardOpen=!boardOpen;
  document.getElementById('board').classList.toggle('open',boardOpen);
  document.body.classList.toggle('board-open',boardOpen);
  document.getElementById('boardBtn').classList.toggle('on',boardOpen);
  if(!boardOpen){ boardLink=null; syncBoardHover(); }
  // Tell the host app so it can un-float its composer — the right-side drawer overlaps
  // the composer's corner and it would otherwise sit behind the panel. Covers BOTH the
  // app's Kanban button and this in-map BOARD button.
  if(EMBED && window.parent.setMapBoardOpen){ try{ window.parent.setMapBoardOpen(boardOpen); }catch{} }
  if(boardOpen) renderBoard(); else closePv(); }

// ---- board ↔ map hover link ----------------------------------------------------------
// Hovering a file card draws a temporary routing edge from the drawer edge to the file's
// map node — same curved, low-opacity accent language as the reference-edge overlay —
// and hovering a map node lights up its card(s) in the drawer (.linked, §20.7 border).
let boardLink=null;   // {path, sx, sy, t0} — screen-space start at the drawer’s left edge
function drawBoardLink(now){
  if(!boardLink||!boardOpen) return;
  let t=byId[boardLink.path];
  if(t&&t.hidden&&t.cluster) t=byId[t.cluster];              // collapsed file → its hub
  if(!t||t.hidden) return;
  const a=toWorld(boardLink.sx,boardLink.sy);                // drawer edge → world coords
  const fade=Math.min(1,(now-boardLink.t0)/160);             // §2.8 --transition 160ms
  const [cx,cy]=refCtrl(a,t);                                // reuse the refgraph curve bow
  ctx.save(); ctx.globalAlpha=fade;
  ctx.strokeStyle=COLORS.accent+'66'; ctx.lineWidth=1.6/cam.k;   // low-opacity accent, like refEdges
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(cx,cy,t.x,t.y); ctx.stroke();
  ctx.strokeStyle=COLORS.accent; ctx.lineWidth=1.4/cam.k;        // full-accent ring on the target node
  ctx.beginPath(); ctx.arc(t.x,t.y,(t.r||4)+5/Math.sqrt(cam.k),0,7); ctx.stroke();
  ctx.restore();
}
let linkedEls=[];
function syncBoardHover(){
  for(const el of linkedEls) el.classList.remove('linked');
  linkedEls=[];
  if(!boardOpen||boardTab!=='files'||!hover) return;
  const one=hover.kind==='file'&&hover.path;
  const match= one ? (p=>p===hover.path)
    : (hover.kind==='hub'&&hover.folder) ? (p=>p===hover.folder||p.startsWith(hover.folder+'/')) : null;
  if(!match) return;
  for(const el of document.querySelectorAll('#boardCols [data-path]'))
    if(match(el.dataset.path)){ el.classList.add('linked'); linkedEls.push(el); }
  if(one&&linkedEls.length) linkedEls[0].scrollIntoView({block:'nearest',behavior:'smooth'});
}
// entering the drawer means the map node is no longer hovered — release its card highlight
document.getElementById('board').addEventListener('pointerenter',()=>{
  if(hover){ hover=null; syncBoardHover(); } ui.tip.style.display='none'; });
document.getElementById('boardTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  boardTab=b.dataset.t; document.querySelectorAll('#boardTabs button').forEach(x=>x.classList.toggle('on',x===b));
  boardQ=''; document.getElementById('boardQ').value=''; extFilter=tagFilter=priFilter=null;
  renderBoard(); });
document.getElementById('boardQ').addEventListener('input',e=>{ boardQ=e.target.value.trim().toLowerCase(); renderBoard(true); });
async function loadIdeas(){ if(!ideas){ try{ ideas=await (await fetch('/api/ideas')).json(); }catch{ ideas={columns:{inbox:[],exploring:[],planned:[],done:[]}}; } } return ideas; }
function saveIdeas(){ fetch('/api/ideas',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ideas)}); }
function chip(label,on,cb){ const b=document.createElement('button'); b.className='fc'+(on?' on':''); b.textContent=label; b.onclick=cb; return b; }
function renderBoard(keepFocus){
  linkedEls=[];                       // cards are rebuilt — drop stale hover-link handles
  if(boardTab==='ideas') return renderIdeas(keepFocus);
  renderFiles(); }
const SNIPCACHE={};   // path → first ~400 chars, for md/text tiles
async function snippet(p){
  if(SNIPCACHE[p]!==undefined) return SNIPCACHE[p];
  try{ const d=await (await fetch('/api/file?path='+encodeURIComponent(p))).json();
    return SNIPCACHE[p]=(d.content||'').replace(/[#>*`|-]/g,' ').replace(/\s+/g,' ').trim().slice(0,420); }
  catch{ return SNIPCACHE[p]=''; }
}
const hpv=document.getElementById('hpv');
function showHover(f,x,y){
  const html=/\.html?$/i.test(f.path), img=/\.(png|jpe?g|gif|svg|webp)$/i.test(f.path);
  if(html) hpv.innerHTML='<iframe src="/api/raw?path='+encodeURIComponent(f.path)+'"></iframe>';
  else if(img) hpv.innerHTML='<img src="/api/raw?path='+encodeURIComponent(f.path)+'">';
  else { hpv.innerHTML='<div class="snip"><b>'+f.name.replace(/</g,'&lt;')+'</b>…</div>';
    snippet(f.path).then(s=>{ const el=hpv.querySelector('.snip'); if(el) el.innerHTML='<b>'+f.name.replace(/</g,'&lt;')+'</b>'+s.replace(/</g,'&lt;'); }); }
  hpv.innerHTML+='<div class="hcap">'+f.path.replace(/</g,'&lt;')+'</div>';
  moveHover(x,y); hpv.classList.add('show');
}
function moveHover(x,y){
  // keep the floating preview left of the right drawer so it never covers the hovered card
  const bLeft=boardOpen?document.getElementById('board').getBoundingClientRect().left:innerWidth;
  hpv.style.left=Math.max(10,Math.min(bLeft-372,x+18))+'px';
  hpv.style.top=Math.max(10,Math.min(innerHeight-312,y-310))+'px';
}
function hideHover(){ hpv.classList.remove('show'); hpv.innerHTML=''; }
// lazy-load tile iframes only when scrolled into view
const tileObs=new IntersectionObserver(es=>{ for(const e of es){ if(e.isIntersecting){ const el=e.target;
  if(el.dataset.src&&!el.querySelector('iframe')){ const ifr=document.createElement('iframe'); ifr.loading='lazy'; ifr.src=el.dataset.src; el.prepend(ifr); }
  tileObs.unobserve(el); } } },{root:null,threshold:0.05});
function renderFiles(){
  document.getElementById('boardSeg').style.display='';
  // filter chips: view mode + file extensions (native)
  const fbox=document.getElementById('boardFilters'); fbox.innerHTML='';
  const vl=document.createElement('span'); vl.className='fl'; vl.textContent='view'; fbox.appendChild(vl);
  fbox.appendChild(chip('☰ text', !S.btiles, ()=>{ S.btiles=false; renderBoard(); }));
  fbox.appendChild(chip('▦ tiles', !!S.btiles, ()=>{ S.btiles=true; renderBoard(); }));
  const fl=document.createElement('span'); fl.className='fl'; fl.textContent='type'; fbox.appendChild(fl);
  for(const ext of ['md','html','css','js','py','json','txt']){
    fbox.appendChild(chip('.'+ext, extFilter===ext, ()=>{ extFilter=extFilter===ext?null:ext; renderBoard(); })); }
  const cols=document.getElementById('boardCols'); cols.innerHTML='';
  const T=contentTree()||[]; let total=0;
  const mkCol=(name,files,color)=>{
    files=files.filter(f=> (!extFilter || f.name.toLowerCase().endsWith('.'+extFilter))
      && (!boardQ || (f.path||f.name).toLowerCase().includes(boardQ)));
    if(!files.length) return; total+=files.length;
    const col=document.createElement('div'); col.className='bcol'+(S.btiles?' tiles':'');
    col.innerHTML=`<div class="chead"><span class="dot" style="background:${color};color:${color}"></span>${name}<span class="cnt">${files.length}</span></div><div class="cards"></div>`;
    const cards=col.querySelector('.cards');
    files.sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
      const html=/\.html?$/i.test(f.name), img=/\.(png|jpe?g|gif|svg|webp)$/i.test(f.name);
      let c;
      if(S.btiles){
        c=document.createElement('div'); c.className='tile'; c.style.setProperty('--cc',color);
        if(html){ c.dataset.src='/api/raw?path='+encodeURIComponent(f.path); tileObs.observe(c); }
        else if(img){ c.innerHTML='<img loading="lazy" src="/api/raw?path='+encodeURIComponent(f.path)+'">'; }
        else { c.innerHTML='<div class="snip"><b>'+f.name.replace(/</g,'&lt;')+'</b></div>';
          snippet(f.path).then(s=>{ const el=c.querySelector('.snip'); if(el) el.innerHTML='<b>'+f.name.replace(/</g,'&lt;')+'</b>'+s.replace(/</g,'&lt;'); }); }
        c.innerHTML+='<div class="cap">'+f.name.replace(/</g,'&lt;')+'</div>';
      } else {
        c=document.createElement('div'); c.className='bcard'; c.style.setProperty('--cc',color);
        const ext=(f.name.split('.').pop()||'').slice(0,4);
        c.innerHTML=`<span class="cdot"></span><span class="nm">${f.name.replace(/</g,'&lt;')}</span><span class="ext">${ext}</span>`;
      }
      c.title=f.path+' — click to preview';
      c.dataset.path=f.path;
      c.onclick=()=>openPreview({path:f.path,label:f.name});
      c.onmouseenter=(e)=>{ const n=byId[f.path]; if(n){ matches=new Set([f.path, n.cluster].filter(Boolean)); }
        // curve originates at the drawer's LEFT edge, at the hovered card's vertical center
        const r=c.getBoundingClientRect(), bLeft=document.getElementById('board').getBoundingClientRect().left;
        boardLink={path:f.path, sx:bLeft, sy:r.top+r.height/2, t0:performance.now()};
        showHover({path:f.path,name:f.name},e.clientX,e.clientY); };
      c.onmousemove=(e)=>moveHover(e.clientX,e.clientY);
      c.onmouseleave=()=>{ matches=searchMatches; boardLink=null; hideHover(); };
      cards.appendChild(c);
    });
    cols.appendChild(col);
  };
  // one column per top-level folder (same palette as the galaxy), + root files
  const rootFiles=[];
  let gi=0;
  for(const n of T){
    if(n.type==='dir'){
      const files=[]; (function w(c){ for(const x of c){ x.type==='dir'?w(x.children):files.push(x); } })(n.children);
      const hub=byId['#'+n.name];
      mkCol(n.name, files, hub?hub.color:MEMC[gi%MEMC.length]); gi++;
    } else rootFiles.push(n);
  }
  const rootHub=byId['#root'];
  mkCol('root', rootFiles, rootHub?rootHub.color:MEMC[7]);
  document.getElementById('boardN').textContent='· '+total+' files'+(boardQ||extFilter?' (filtered)':'')+' · click to open · hover to locate';
}
async function renderIdeas(keepFocus){
  document.getElementById('boardSeg').style.display='none';
  await loadIdeas();
  const all=Object.values(ideas.columns).flat();
  // filter chips: tags + priority, auto-collected (native, no AI)
  const fbox=document.getElementById('boardFilters'); fbox.innerHTML='';
  const tags=[...new Set(all.flatMap(i=>parseIdea(i.text).tags))].slice(0,12);
  if(tags.length){ const fl=document.createElement('span'); fl.className='fl'; fl.textContent='tags'; fbox.appendChild(fl);
    for(const t of tags) fbox.appendChild(chip('#'+t, tagFilter===t, ()=>{ tagFilter=tagFilter===t?null:t; renderBoard(); })); }
  const fl2=document.createElement('span'); fl2.className='fl'; fl2.textContent='priority'; fbox.appendChild(fl2);
  for(const p of ['high','med','low']) fbox.appendChild(chip('!'+p, priFilter===p, ()=>{ priFilter=priFilter===p?null:p; renderBoard(); }));
  const hint=document.createElement('span'); hint.className='fl'; hint.style.textTransform='none'; hint.style.letterSpacing='0';
  hint.textContent='· type #tag and !high / !med / !low inside an idea';
  fbox.appendChild(hint);

  const cols=document.getElementById('boardCols'); cols.innerHTML='';
  const keep=i=> (!boardQ || i.text.toLowerCase().includes(boardQ))
    && (!tagFilter || parseIdea(i.text).tags.includes(tagFilter))
    && (!priFilter || parseIdea(i.text).pri===priFilter);
  let shown=0;
  IDEA_COLS.forEach(([key,label,color],ci)=>{
    const items=(ideas.columns[key]||[]).filter(keep); shown+=items.length;
    const col=document.createElement('div'); col.className='bcol';
    col.innerHTML=`<div class="chead"><span class="dot" style="background:${color};color:${color}"></span>${label}<span class="cnt">${items.length}</span></div><div class="cards"></div>`;
    const cards=col.querySelector('.cards');
    items.forEach(it=>{
      const p=parseIdea(it.text);
      const c=document.createElement('div'); c.className='icard';
      const txt=it.text.replace(/</g,'&lt;').replace(/#([\w-]+)/g,'').replace(/!(high|med|low)\b/g,'').trim();
      c.innerHTML=`<div>${txt||'—'}</div>`
        +(p.tags.length||p.pri?`<div class="tags">${p.pri?'<span class="pbadge '+p.pri+'">'+p.pri+'</span>':''}${p.tags.map(t=>'<span class="tag">#'+t+'</span>').join('')}</div>`:'')
        +`<div class="iact">`
        +(ci>0?`<button title="Move left">◀</button>`:'')
        +(ci<IDEA_COLS.length-1?`<button title="Move right">▶</button>`:'')
        +`<button title="Delete">✕</button></div>`;
      const btns=c.querySelectorAll('.iact button');
      let bi=0;
      if(ci>0) btns[bi++].onclick=()=>moveIdea(it.id,key,IDEA_COLS[ci-1][0]);
      if(ci<IDEA_COLS.length-1) btns[bi++].onclick=()=>moveIdea(it.id,key,IDEA_COLS[ci+1][0]);
      btns[bi].onclick=()=>{ if(confirm('Delete this idea?')) delIdea(it.id,key); };
      cards.appendChild(c);
    });
    // add-input at the bottom of each column
    const add=document.createElement('div'); add.className='iadd';
    add.innerHTML=`<input placeholder="Add idea…  (#tag !high)"><button>+</button>`;
    const inp=add.querySelector('input');
    const submit=()=>{ const v=inp.value.trim(); if(!v) return;
      ideas.columns[key].unshift({id:Date.now()+''+Math.floor(Math.random()*999),text:v,ts:new Date().toISOString()});
      inp.value=''; saveIdeas(); renderBoard(); };
    add.querySelector('button').onclick=submit;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
    cards.appendChild(add);
    cols.appendChild(col);
  });
  document.getElementById('boardN').textContent='· '+shown+' ideas'+(boardQ||tagFilter||priFilter?' (filtered)':'')+' · git-versioned, syncs with your repo';
  if(keepFocus){ const q=document.getElementById('boardQ'); q.focus(); }
}
function moveIdea(id,from,to){ const i=ideas.columns[from].findIndex(x=>x.id===id); if(i<0) return;
  const [it]=ideas.columns[from].splice(i,1); ideas.columns[to].unshift(it); saveIdeas(); renderBoard(); }
function delIdea(id,from){ ideas.columns[from]=ideas.columns[from].filter(x=>x.id!==id); saveIdeas(); renderBoard(); }

// ---- preview panel: html iframe · rich md with section tabs · text -------------------
const pv={ el:document.getElementById('pv'), frame:document.getElementById('pvFrame'),
  body:document.getElementById('pvBody'), tabs:document.getElementById('pvTabs'),
  name:document.getElementById('pvName') };
let pvFile=null, pvRaw='', pvSecs=[], pvSec=0, pvQ='', pvM='rendered';
const escH=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function miniInline(s){
  return escH(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,txt,href)=>/^https?:/i.test(href)
      ? '<a href="'+href+'" target="_blank" rel="noopener noreferrer">'+txt+'&#8599;</a>'   /* external — single sanctioned exception */
      : '<a href="#" data-open="'+href+'">'+txt+'</a>');
}
function miniMd(src){
  const L=src.replace(/\r/g,'').split('\n'); let h='',i=0;
  while(i<L.length){ const l=L[i];
    if(/^```/.test(l)){ let c=''; i++; while(i<L.length&&!/^```/.test(L[i])){c+=L[i]+'\n';i++;} i++; h+='<pre><code>'+escH(c)+'</code></pre>'; continue; }
    if(/^#{1,6}\s/.test(l)){ const n=l.match(/^#+/)[0].length; h+=`<h${n}>${miniInline(l.replace(/^#+\s/,''))}</h${n}>`; i++; continue; }
    if(/^\s*>/.test(l)){ let q=''; while(i<L.length&&/^\s*>/.test(L[i])){q+=L[i].replace(/^\s*>\s?/,'')+' ';i++;} h+='<blockquote>'+miniInline(q)+'</blockquote>'; continue; }
    if(/^\s*[-*+]\s/.test(l)){ h+='<ul>'; while(i<L.length&&/^\s*[-*+]\s/.test(L[i])){h+='<li>'+miniInline(L[i].replace(/^\s*[-*+]\s/,''))+'</li>';i++;} h+='</ul>'; continue; }
    if(/^\s*\d+\.\s/.test(l)){ h+='<ol>'; while(i<L.length&&/^\s*\d+\.\s/.test(L[i])){h+='<li>'+miniInline(L[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++;} h+='</ol>'; continue; }
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|[-:\s|]+\|\s*$/.test(L[i+1])){
      const row=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(l); i+=2; let b='';
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){ b+='<tr>'+row(L[i]).map(c=>'<td>'+miniInline(c)+'</td>').join('')+'</tr>'; i++; }
      h+='<table><thead><tr>'+head.map(c=>'<th>'+miniInline(c)+'</th>').join('')+'</tr></thead><tbody>'+b+'</tbody></table>'; continue; }
    if(l.trim()===''){ i++; continue; }
    let p=l; i++;
    while(i<L.length&&L[i].trim()!==''&&!/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(L[i])){ p+=' '+L[i]; i++; }
    h+='<p>'+miniInline(p)+'</p>';
  }
  return h;
}
function openPreview(f){ // f: {path,label}
  if(typeof hideHover==='function') hideHover();
  pvFile=f; pv.el.classList.add('open');
  pv.name.textContent=f.path;
  const html=/\.html?$/i.test(f.path), md=/\.md$/i.test(f.path), img=/\.(png|jpe?g|gif|svg|webp)$/i.test(f.path);
  document.querySelectorAll('.pv .mdonly').forEach(b=>b.classList.toggle('hide',!md));
  document.getElementById('pvBrowser').style.display = html?'':'none';
  pv.tabs.classList.add('hide');
  if(html){ pv.frame.style.display=''; pv.body.classList.remove('show');
    pv.frame.src='/api/raw?path='+encodeURIComponent(f.path); return; }
  pv.frame.style.display='none'; pv.frame.src='about:blank'; pv.body.classList.add('show');
  if(img){ pv.body.innerHTML='<img src="/api/raw?path='+encodeURIComponent(f.path)+'">'; return; }
  pv.body.innerHTML='<pre class="raw" style="color:var(--text-muted)">loading…</pre>';
  fetch('/api/file?path='+encodeURIComponent(f.path)).then(r=>r.json()).then(d=>{
    pvRaw=d.content||'';
    if(md){ pvParseSecs(); pvM='rendered'; pvQ=''; pvRenderMd(); }
    else pv.body.innerHTML='<pre class="raw">'+escH(pvRaw)+'</pre>';
  }).catch(()=>pv.body.innerHTML='<pre class="raw">could not load</pre>');
}
function pvParseSecs(){
  const L=pvRaw.replace(/\r/g,'').split('\n');
  pvSecs=[]; let cur={title:'Top', body:[]};
  for(const l of L){
    if(/^##\s/.test(l)){ if(cur.body.join('').trim()||pvSecs.length===0&&cur.body.length) pvSecs.push(cur);
      cur={title:l.replace(/^##\s/,'').trim(), body:[]}; }
    else cur.body.push(l);
  }
  pvSecs.push(cur);
  pvSecs=pvSecs.filter(s=>s.title==='Top'?s.body.join('').trim():true);
  pvSec=0;
}
function pvHits(s){ return pvQ ? (s.title+'\n'+s.body.join('\n')).toLowerCase().includes(pvQ.toLowerCase()) : true; }
function pvRenderMd(){
  document.getElementById('pvRendered').classList.toggle('on',pvM==='rendered');
  document.getElementById('pvText').classList.toggle('on',pvM==='text');
  if(pvM==='text'){ pv.tabs.classList.add('hide'); pv.body.innerHTML='<pre class="raw">'+escH(pvRaw)+'</pre>'; return; }
  // tabs: one per ## section, colored
  pv.tabs.classList.remove('hide'); pv.tabs.innerHTML='';
  const visible=pvSecs.map((s,i)=>({s,i})).filter(x=>pvHits(x.s));
  if(!visible.find(x=>x.i===pvSec)) pvSec=visible.length?visible[0].i:0;
  visible.forEach(({s,i})=>{
    const b=document.createElement('button'); b.textContent=s.title; b.style.setProperty('--tc',MEMC[i%MEMC.length]);
    b.classList.toggle('on',i===pvSec); b.onclick=()=>{pvSec=i;pvRenderMd();};
    pv.tabs.appendChild(b);
  });
  const inp=document.createElement('input'); inp.placeholder='Search sections…'; inp.value=pvQ;
  inp.oninput=()=>{pvQ=inp.value;pvRenderMd();setTimeout(()=>{const el=pv.tabs.querySelector('input');el&&el.focus();},0)};
  pv.tabs.appendChild(inp);
  const sec=pvSecs[pvSec]||{title:'',body:[]};
  const color=MEMC[pvSec%MEMC.length];
  let html='<div class="md" style="--sc:'+color+'">'
    +(sec.title!=='Top'?'<span class="secbadge">'+escH(sec.title)+'</span>':'')
    +miniMd((sec.title!=='Top'?'## '+sec.title+'\n':'')+sec.body.join('\n'))+'</div>';
  if(pvQ){ const re=new RegExp('('+pvQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    html=html.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(re,'<mark>$1</mark>')+'<'); }
  pv.body.innerHTML=html;
}
function pvMode(m){ pvM=m; pvRenderMd(); }
function pvOpenTab(){ if(!pvFile) return;
  if(EMBED && window.parent.smartOpen){ window.parent.smartOpen(pvFile.path); flash('Opened in app'); return; }
  window.open('/api/raw?path='+encodeURIComponent(pvFile.path),'_blank'); }
// single-app rule: internal doc links in previews open in-app (parent smartOpen), never a browser tab
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-open]'); if(!a) return;
  e.preventDefault();
  let href=a.dataset.open.replace(/^\.\//,'').replace(/#.*$/,''); if(!href) return;
  if(!href.includes('/')&&pvFile&&pvFile.path.includes('/')) href=pvFile.path.replace(/\/[^/]*$/,'/')+href;
  if(EMBED && window.parent.smartOpen){ window.parent.smartOpen(href); }
  else window.open('/#file='+encodeURIComponent(href),'crsbrain');
});
function pvOpenBrowser(){ if(pvFile) fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:pvFile.path})}).then(()=>flash('Opened in your browser')); }
function closePv(){ pv.el.classList.remove('open'); pv.frame.src='about:blank'; pvFile=null; }
document.getElementById('boardSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  S.content=b.dataset.c;
  document.querySelectorAll('#boardSeg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('#contentSeg button').forEach(x=>x.classList.toggle('on',x.dataset.c===S.content));
  buildGraph(); });

// ---- chat dock: ask the brain, highlight what it points at ---------------------------
const dockBody=document.getElementById('dockBody'), dockQ=document.getElementById('dockQ'),
      dockSend=document.getElementById('dockSend');
let dockChatId=null, asking=false;
document.getElementById('dockFold').addEventListener('click',()=>dockBody.classList.toggle('show'));
document.getElementById('dockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=dockQ.value.trim(); if(!q||asking) return;
  asking=true; dockSend.disabled=true; dockQ.value='';
  dockBody.classList.add('show'); dockBody.innerHTML='<b>You:</b> '+q.replace(/</g,'&lt;')+'\n\n<i style="color:var(--text-muted)">thinking…</i>';
  const prompt=q+'\n\n(Answering inside the brain-map view: mention the exact repo-relative paths of every relevant file so the map can highlight them.)';
  let full='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:dockChatId,message:prompt,title:'Map — '+q.slice(0,50)})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf('\n\n'))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='meta') dockChatId=ev.id;
        else if(ev.type==='delta'){ full+=ev.text; dockBody.textContent=full; dockBody.scrollTop=dockBody.scrollHeight; }
        else if(ev.type==='done'){ full=ev.reply||full; dockChatId=ev.id; }
        else if(ev.type==='error'){ full='Error: '+ev.error; }
      } }
  }catch(err){ full='Error: '+err.message; }
  dockBody.textContent=full;
  // light up every node whose path appears in the answer, then fly to the first
  const hits=nodes.filter(n=>n.kind==='file'&&n.path&&full.includes(n.path));
  if(hits.length){
    matches=new Set(hits.map(n=>n.id));
    for(const n of hits){ if(n.cluster){ matches.add(n.cluster); if(S.collapsed[n.cluster]){ S.collapsed[n.cluster]=false; for(const x of nodes) if(x.cluster===n.cluster) x.hidden=false; } } }
    const t=hits[0]; cam.k=Math.max(cam.k,1.1); cam.x=-t.x*cam.k; cam.y=-t.y*cam.k;
    dockBody.innerHTML+='\n\n<span class="hits">◉ '+hits.length+' file'+(hits.length>1?'s':'')+' highlighted on the map — click to open.</span>';
    searchMatches=matches;
  } else { matches=null; searchMatches=null; }
  dockBody.scrollTop=dockBody.scrollHeight;
  asking=false; dockSend.disabled=false;
});

// ---- boot ----------------------------------------------------------------------------
// Embedded in the app: the app's composer is the one chat, so drop the map's own dock.
if(EMBED){ document.body.classList.add('embed'); const dk=document.getElementById('dock'); if(dk) dk.style.display='none'; }
fetch('/api/files').then(r=>r.json()).then(d=>{ tree=d.tree; buildGraph(); loadRefs(); requestAnimationFrame(loop); applyView(modeFromHash()); })
  .catch(()=>{ document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">Could not load the repo tree — is the CRS Brain server running?</div>'); });
// Files-as-a-list vs. columns: same board data, just stack the folder columns vertically.
function setBoardLayout(layout){ document.body.classList.toggle('blist', layout==='list'); }
// Drive the whole view from the host app: 'map' = galaxy (board closed); 'board'/'kanban'
// = files as columns; 'list' = files as one vertical list; 'ideas' = ideas board. Also
// reachable via the URL hash (#board/#list/#ideas) for the initial deep link on boot.
function modeFromHash(){ const h=location.hash; return h==='#list'?'list':h==='#ideas'?'ideas':h==='#board'?'board':'map'; }
function applyView(mode){
  const wantBoard = mode==='board'||mode==='kanban'||mode==='list'||mode==='ideas';
  if(wantBoard){
    const tab = mode==='ideas' ? 'ideas' : 'files';
    boardTab=tab;
    document.querySelectorAll('#boardTabs button').forEach(x=>x.classList.toggle('on', x.dataset.t===tab));
    setBoardLayout(mode==='list' ? 'list' : 'columns');
    if(!boardOpen) toggleBoard(); else renderBoard();
  } else {
    setBoardLayout('columns');
    if(boardOpen) toggleBoard();   // galaxy view: close the board drawer
  }
}
window.applyView = applyView;
window.addEventListener('hashchange', ()=>applyView(modeFromHash()));
</script>
