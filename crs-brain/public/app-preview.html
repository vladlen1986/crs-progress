<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Preview · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  /* Claude Code Desktop spec (brain/design/claude-code-spec.md): two type sizes
     only (13/20 body, 12/16 meta), radii 4/6/8/10/50%, no shadows outside
     popovers, no hue in chrome, letter-spacing 0, weight never above 600. */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);letter-spacing:0;display:flex;flex-direction:column}
  b,strong{font-weight:600} /* §3 — bold runs 600, never 700+ */

  header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--cc-border-divider);flex:none}
  header.top .t{flex:1;min-width:0}
  h1{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--cc-text-primary);margin:0;font-weight:600;letter-spacing:0}
  .sub{color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-top:2px}
  /* §6 button: #313131 → hover #393938 → active #2A2A29, r6, h24, 13px */
  .hbtn{background:var(--cc-bg-control);border:0;color:var(--cc-text-body);border-radius:var(--radius-btn);height:var(--cc-button-h);padding:0 10px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;letter-spacing:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:none}
  .hbtn:hover{background:var(--cc-bg-control-strong);color:var(--cc-text-primary)}
  .hbtn:active{background:var(--cc-bg-segment-track)}

  .body{flex:1;min-height:0;display:flex}

  nav.side{width:256px;flex:none;border-right:1px solid var(--cc-border-divider);overflow-y:auto;padding:8px 0}
  .sec{margin-bottom:2px}
  /* §3 section header: 12px sentence case, no uppercase, no tracking */
  .sec-h{padding:8px 16px 4px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-muted);font-weight:600;position:sticky;top:0;background:var(--bg)}
  /* §5 nav row: h26, pitch 28, r6 — state is background + text only */
  .mod{display:flex;align-items:center;gap:9px;height:var(--cc-nav-row-h);margin:0 8px calc(var(--cc-nav-row-pitch) - var(--cc-nav-row-h));padding:0 8px;border-radius:var(--radius-btn);cursor:pointer;color:var(--cc-text-secondary);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);border:0}
  .mod:hover{background:var(--cc-bg-hover);color:var(--cc-text-body)}
  .mod.active{background:var(--cc-bg-selected);color:var(--cc-text-primary)}
  .mod .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.has{background:var(--cc-success)}
  .dot.no{background:var(--cc-text-faint)}
  .cnt{margin-left:auto;padding-left:8px;color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}

  main.pane{flex:1;min-width:0;display:flex;flex-direction:column}
  .panebar{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--cc-border-divider);flex:none;min-height:38px}
  .panebar .pm{color:var(--cc-text-primary);font-weight:600;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .panebar .ps{color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono)}
  /* quiet status chip: neutral surface, semantic ink only, sentence case, r6 */
  .stchip{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;letter-spacing:0;padding:1px 8px;border-radius:var(--radius-pill);text-transform:none;background:var(--cc-bg-control);color:var(--cc-text-muted)}
  .st-draft{color:var(--cc-text-muted)}
  .st-settled{color:var(--cc-text-body)}
  .st-built{color:var(--cc-success)}
  /* §5 segment control: track r8, thumb r6 + 1px segment border */
  .tabs{display:flex;gap:2px;margin-left:auto;background:var(--cc-bg-segment-track);border-radius:var(--radius-card);padding:2px}
  .tabbtn{background:none;border:1px solid transparent;color:var(--cc-text-secondary);border-radius:var(--radius-btn);padding:1px 10px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:400;letter-spacing:0;cursor:pointer;box-shadow:none}
  .tabbtn:hover{color:var(--cc-text-body)}
  .tabbtn.active{background:var(--cc-bg-segment-thumb);border-color:var(--cc-border-segment);color:var(--cc-text-primary)}
  .frame-wrap{flex:1;min-height:0;position:relative}
  iframe{width:100%;height:100%;border:0;background:var(--bg)}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--cc-text-muted)}
  .empty .big{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--cc-text-faint);opacity:1}
  .empty .tag{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;letter-spacing:0;padding:1px 8px;border-radius:var(--radius-pill);text-transform:none;background:var(--cc-bg-control);color:var(--cc-text-muted);border:0}
  .empty .d{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);max-width:320px;text-align:center;color:var(--cc-text-muted)}
  .empty a{color:var(--cc-link);text-decoration:none}
  .empty a:hover{text-decoration:underline}

  .loading{padding:40px;text-align:center;color:var(--cc-text-muted);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  /* §2 focus ring is white at 22% — never coloured */
  :focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:1px}
</style>
</head>
<body>
  <header class="top">
    <div class="t">
      <h1>App Preview</h1>
      <div class="sub">All 46 modules, real sidebar order — click one to view its design prototype</div>
    </div>
    <button class="hbtn" onclick="(window.parent&&window.parent!==window&&window.parent.surfaceBack)?window.parent.surfaceBack():location.href='/'">Back to app</button>
  </header>

  <div class="body">
    <nav class="side" id="side"><div class="loading">Loading modules…</div></nav>
    <main class="pane">
      <div class="panebar" id="panebar" style="display:none"></div>
      <div class="frame-wrap" id="frameWrap"></div>
    </main>
  </div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SECTION_ORDER=['Admin / Core','Operations','Surveillance','Guests','HR / Employees','Compliance','Communication'];
let MODULES=[],PROTOS_BY_MOD={},ACTIVE_MOD=null,ACTIVE_PROTO=null;

async function api(p){const r=await fetch(p);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}

async function load(){
  try{
    const [md,pr]=await Promise.all([api('/api/modules'),api('/api/protos')]);
    MODULES=(md.modules||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    PROTOS_BY_MOD={};
    for(const p of (pr.protos||[])){ (PROTOS_BY_MOD[p.module]=PROTOS_BY_MOD[p.module]||[]).push(p); }
    renderSide();
    const first=MODULES.find(m=>PROTOS_BY_MOD[m.id]&&PROTOS_BY_MOD[m.id].length)||MODULES[0];
    if(first) selectModule(first.id);
  }catch(e){$('side').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}
}

function renderSide(){
  const bySec={};
  for(const m of MODULES) (bySec[m.section]=bySec[m.section]||[]).push(m);
  const secs=SECTION_ORDER.filter(s=>bySec[s]);
  for(const s of Object.keys(bySec)) if(!secs.includes(s)) secs.push(s);
  $('side').innerHTML=secs.map(s=>{
    const mods=bySec[s];
    return `<div class="sec"><div class="sec-h">${esc(s)}</div>${mods.map(m=>{
      const protos=PROTOS_BY_MOD[m.id]||[];
      const has=protos.length>0;
      return `<div class="mod${m.id===ACTIVE_MOD?' active':''}" onclick="selectModule('${esc(m.id)}')" title="${esc(m.name)}">
        <span class="dot ${has?'has':'no'}"></span>
        <span class="nm">${esc(m.name)}</span>
        ${protos.length>1?`<span class="cnt ps" style="color:var(--cc-text-muted);font-size:var(--cc-fs-xs)">${protos.length}</span>`:''}
      </div>`;
    }).join('')}</div>`;
  }).join('');
}

function selectModule(id){
  ACTIVE_MOD=id;
  const protos=PROTOS_BY_MOD[id]||[];
  ACTIVE_PROTO=protos[0]?protos[0].name:null;
  renderSide();
  renderPane();
}

function selectProto(name){ ACTIVE_PROTO=name; renderPane(); }

function renderPane(){
  const mod=MODULES.find(m=>m.id===ACTIVE_MOD);
  const protos=PROTOS_BY_MOD[ACTIVE_MOD]||[];
  const proto=protos.find(p=>p.name===ACTIVE_PROTO);
  if(!mod){ $('panebar').style.display='none'; $('frameWrap').innerHTML=''; return; }
  $('panebar').style.display='flex';
  $('panebar').innerHTML=`<span class="pm">${esc(mod.name)}</span><span class="ps">${esc(mod.section)} · ${esc(mod.route)}</span>
    ${proto?`<span class="stchip st-${esc(proto.status)}">${esc(proto.status)}</span>`:''}
    ${protos.length>1?`<div class="tabs">${protos.map(p=>`<button class="tabbtn${p.name===ACTIVE_PROTO?' active':''}" onclick="selectProto('${esc(p.name)}')">${esc(p.name)}</button>`).join('')}</div>`:''}`;

  if(!proto){
    $('frameWrap').innerHTML=`<div class="empty">
      <div class="big">◇</div>
      <span class="tag">Coming soon</span>
      <div class="d">No design prototype registered yet for <b style="color:var(--cc-text-body)">${esc(mod.name)}</b>. Register one from the <a href="#" onclick="event.preventDefault();openProtos()" style="color:var(--cc-link)">Prototypes</a> page.</div>
    </div>`;
    return;
  }
  $('frameWrap').innerHTML=`<iframe src="/api/raw?path=${encodeURIComponent(proto.html)}"></iframe>`;
}

function openProtos(){
  if(window.parent&&window.parent!==window&&window.parent.openTarget){ window.parent.openTarget('/protos.html',{title:'Prototypes'}); }
  else location.href='/protos.html';
}

load();
</script>
</body>
</html>
