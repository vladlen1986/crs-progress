<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task queue · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  *{box-sizing:border-box}
  /* §3 TYPE — only two sizes exist: 13/20 body and 12/16 meta. Letter-spacing 0
     everywhere, bold runs 600 and never higher. */
  body{margin:0;background:var(--cc-bg-canvas);color:var(--cc-text-body);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);letter-spacing:0;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 88px}
  header.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
  header.top .t{flex:1;min-width:0}
  h1{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--cc-text-primary);margin:0 0 2px;font-weight:600;letter-spacing:0}
  .sub{color:var(--cc-text-secondary);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .hbtns{display:flex;gap:8px;flex:0 0 auto;align-items:center}
  /* §6 button state matrix: control → control-strong (hover) → segment-track
     (active), body ink, no border, focus = the white 22% ring. */
  .hbtn{background:var(--cc-bg-control);border:1px solid transparent;color:var(--cc-text-body);border-radius:var(--radius-btn);padding:1px 10px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .hbtn:hover{background:var(--cc-bg-control-strong);color:var(--cc-text-primary)}
  .hbtn:active{background:var(--cc-bg-segment-track)}
  .hbtn:focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:0}
  .hbtn.primary{background:var(--cc-bg-control-strong);color:var(--cc-text-primary);font-weight:600}
  .hbtn.primary:hover:not(:disabled){background:var(--cc-bg-segment-thumb)}
  .hbtn.primary:active:not(:disabled){background:var(--cc-bg-control)}
  .hbtn.primary:disabled{background:var(--cc-bg-control);color:var(--cc-text-faint);cursor:default}
  /* §5.4 the banner is a panel, so it keeps its border; hue only when the state
     is genuinely semantic (usage limit = warning), otherwise a neutral surface. */
  .banner{margin:12px 0 4px;padding:8px 12px;border-radius:var(--radius-card);border:1px solid var(--cc-border);background:var(--cc-bg-panel);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);display:none}
  .banner.show{display:block}
  .banner.limit{background:var(--warning-tint);border-color:transparent;color:var(--cc-warning)}
  .banner.running{background:var(--cc-bg-control);border-color:transparent;color:var(--cc-text-body)}
  .add{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  /* §4 RADII — inputs/composer take 10; focus is the white ring, never a glow. */
  .add input,.add textarea{background:var(--cc-bg-composer);border:1px solid var(--cc-border-composer);color:var(--cc-text-primary);border-radius:var(--radius-composer);padding:8px 10px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);outline:none}
  .add input:focus,.add textarea:focus{border-color:var(--cc-focus-ring)}
  .add input::placeholder,.add textarea::placeholder{color:var(--cc-text-placeholder)}
  .add .title{flex:1;min-width:200px}
  .add textarea{flex-basis:100%;min-height:72px;resize:vertical;font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs)}
  .add button{background:var(--cc-bg-control-strong);border:1px solid transparent;color:var(--cc-text-primary);border-radius:var(--radius-btn);padding:8px 16px;font:inherit;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);font-weight:600;cursor:pointer}
  .add button:hover{background:var(--cc-bg-segment-thumb)}
  .add button:active{background:var(--cc-bg-control)}
  .add button:focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:0}
  .sec{margin-top:20px}
  /* §3 SECTION HEADERS — 12px sentence case: no uppercase, no tracking. */
  .sechead{display:flex;align-items:center;gap:8px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-secondary);font-weight:600;margin-bottom:8px}
  .sechead .cnt{color:var(--cc-text-secondary);background:var(--cc-bg-control);border:none;border-radius:var(--radius-pill);padding:2px 8px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono);font-weight:600;letter-spacing:0}
  .sechead .bar{flex:1;height:1px;background:var(--cc-border-divider)}
  /* §5.4 CARDS — filled with --cc-bg-card and NO border, no shadow. Hover is a
     background step, never a hue or an outline. */
  .item{background:var(--cc-bg-card);border:none;border-radius:var(--radius-card);margin-bottom:4px}
  .item:not(.open):hover{background:var(--cc-bg-selected)}
  .irow{display:flex;align-items:flex-start;gap:10px;padding:12px}
  /* §6 STATUS CHIPS — 12px/600/r6 and quiet. The status word is upper-cased by
     the renderer, which this pass may not touch, so the tracking-wider look is
     undone in CSS to match the sentence-case chips elsewhere in the app. */
  .st{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;letter-spacing:0;text-transform:lowercase;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;margin-top:0}
  .st-queued{background:var(--cc-bg-control);color:var(--cc-text-secondary)}
  .st-running{background:var(--cc-bg-control);color:var(--cc-text-body)}
  .st-blocked-limit{background:var(--warning-tint);color:var(--cc-warning)}
  .st-done{background:var(--success-tint);color:var(--cc-success)}
  .st-failed{background:var(--error-tint);color:var(--cc-danger)}
  .ibody{flex:1;min-width:0}
  .ititle{color:var(--cc-text-primary);font-weight:600;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .imeta{color:var(--cc-text-secondary);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:400;margin-top:2px;font-family:var(--mono)}
  .ilog{margin-top:8px;border-top:1px solid var(--cc-border-divider);padding-top:8px;font-family:var(--mono);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--cc-text-secondary);white-space:pre-wrap;word-break:break-word;display:none}
  .item.open .ilog{display:block}
  .iacts{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
  /* §6 icon buttons: transparent → 6% white on hover, radius 4, 24px box. */
  .iacts button{width:var(--cc-button-h);height:var(--cc-button-h);border:none;background:none;color:var(--cc-text-muted);cursor:pointer;border-radius:var(--radius-code);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);display:flex;align-items:center;justify-content:center}
  .iacts button:hover{color:var(--cc-text-primary);background:var(--cc-border-soft)}
  .iacts button:focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:0}
  .empty{color:var(--cc-text-secondary);font-style:normal;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);padding:8px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="t">
      <h1>Task queue</h1>
      <div class="sub">Durable Claude Code task queue — sequential, max 20 open tasks, no auto-retry. If a run hits the usage limit, the queue pauses and auto-resumes 2&nbsp;minutes after the window resets (survives server restarts). Every task runs behind the Buildprint safety gate.</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="load()">Refresh</button>
      <button class="hbtn primary" id="runBtn" onclick="runQ()">Run queue</button>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div class="add">
    <input class="title" id="nTitle" placeholder="Task title…" maxlength="140">
    <button onclick="add()">Add task</button>
    <textarea id="nPrompt" placeholder="The full prompt Claude Code will run for this task…"></textarea>
  </div>
  <div class="sec"><div class="sechead">Open <span class="cnt" id="cntOpen">0</span><span class="bar"></span></div><div id="listOpen"></div></div>
  <div class="sec"><div class="sechead">Finished <span class="cnt" id="cntDone">0</span><span class="bar"></span></div><div id="listDone"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let Q={tasks:[],resumeAt:null,running:false};
let tick=null;
async function api(u,o){ const r=await fetch(u,o); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
function fmtT(iso){ return iso?new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''; }
function cd(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+'h ':'')+(m?m+'m ':'')+x+'s'; }
function banner(){
  const b=$('banner');
  if(Q.resumeAt&&Q.resumeAt>Date.now()){ b.className='banner show limit'; b.textContent='⏸ Paused — usage limit. Auto-resume in '+cd(Q.resumeAt-Date.now())+' ('+new Date(Q.resumeAt).toLocaleTimeString()+').'; }
  else if(Q.running){ b.className='banner show running'; b.textContent='▶ Queue is running…'; }
  else b.className='banner';
}
function row(t,i,open){
  const meta=[t.id, t.started?('started '+fmtT(t.started)):('added '+fmtT(t.created)), t.finished?('finished '+fmtT(t.finished)):''].filter(Boolean).join(' · ');
  const log=(t.log||[]).map(l=>l.ts.slice(11,19)+'  '+esc(l.msg)).join('\n')+(t.result?('\n\n— result —\n'+esc(t.result.slice(0,1500))):'');
  const acts=open?`<button title="Move up" onclick="event.stopPropagation();move('${t.id}',-1)">↑</button><button title="Move down" onclick="event.stopPropagation();move('${t.id}',1)">↓</button><button title="Remove" onclick="event.stopPropagation();del('${t.id}')">✕</button>`:`<button title="Remove" onclick="event.stopPropagation();del('${t.id}')">✕</button>`;
  return `<div class="item" onclick="this.classList.toggle('open')"><div class="irow"><span class="st st-${t.status}">${t.status.toUpperCase()}</span><div class="ibody"><div class="ititle">${esc(t.title)}</div><div class="imeta">${esc(meta)}</div><div class="ilog">${log||'no log yet'}</div></div><div class="iacts">${acts}</div></div></div>`;
}
function render(){
  const open=Q.tasks.filter(t=>t.status!=='done'&&t.status!=='failed');
  const done=Q.tasks.filter(t=>t.status==='done'||t.status==='failed');
  $('cntOpen').textContent=open.length; $('cntDone').textContent=done.length;
  $('listOpen').innerHTML=open.map((t,i)=>row(t,i,true)).join('')||'<div class="empty">Nothing queued. Add a task above.</div>';
  $('listDone').innerHTML=done.map((t,i)=>row(t,i,false)).join('')||'<div class="empty">Nothing finished yet.</div>';
  $('runBtn').disabled=Q.running||!Q.tasks.some(t=>t.status==='queued'||t.status==='blocked-limit');
  banner();
}
async function load(){ try{ Q=await api('/api/queue'); render(); }catch(e){} }
async function add(){
  const title=$('nTitle').value.trim(), prompt=$('nPrompt').value.trim();
  if(!title||!prompt) return alert('Title and prompt are both required.');
  try{ await api('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,prompt})}); $('nTitle').value=''; $('nPrompt').value=''; load(); }
  catch(e){ alert(e.message); }
}
async function del(id){ try{ await api('/api/queue/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); load(); }catch(e){ alert(e.message); } }
async function move(id,dir){
  const ids=Q.tasks.map(t=>t.id); const i=ids.indexOf(id); const j=i+dir;
  const openIds=new Set(Q.tasks.filter(t=>t.status!=='done'&&t.status!=='failed').map(t=>t.id));
  if(j<0||j>=ids.length||!openIds.has(ids[j])) return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  try{ await api('/api/queue/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}); load(); }catch(e){ alert(e.message); }
}
async function runQ(){ try{ await api('/api/queue/run',{method:'POST'}); load(); }catch(e){ alert(e.message); } }
load();
setInterval(load,3000);
setInterval(banner,1000);
</script>
</body>
</html>
