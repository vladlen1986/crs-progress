<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  /* Claude Code Desktop spec (brain/design/claude-code-spec.md): two type sizes
     only (13/20 body, 12/16 meta), radii 4/6/8/10/50%, no shadows outside
     popovers, no hue in chrome — semantics live in TEXT colour only. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);letter-spacing:0}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 22px 90px;display:grid;grid-template-columns:1fr 260px;gap:28px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .main{min-width:0}
  h1{font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);color:var(--cc-text-primary);margin:0 0 4px;font-weight:600;letter-spacing:0}
  .sub{color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono)}
  /* quiet status chip: neutral surface, semantic ink, sentence case, r6 */
  .statusword{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;text-transform:none;letter-spacing:0;padding:1px 8px;border-radius:var(--radius-pill);margin-left:8px;background:var(--cc-bg-control);color:var(--cc-text-secondary);display:inline-block;vertical-align:middle}
  .st-done{color:var(--cc-success)} .st-in-progress{color:var(--cc-warning)}
  .st-not-started,.st-roadmap{color:var(--cc-text-muted)}
  .pct{font-family:var(--mono);color:var(--cc-text-muted);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);margin-left:8px}
  /* §3 section header: 12px sentence case, no uppercase, no tracking */
  h2{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-muted);font-weight:600;margin:24px 0 8px;border-bottom:1px solid var(--cc-border-divider);padding-bottom:6px}
  .sec-empty{color:var(--cc-text-muted);font-style:italic;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .row{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid var(--cc-border-divider)}
  .row:last-child{border-bottom:none}
  .row .t{flex:1;min-width:0;color:var(--cc-text-body);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);overflow:hidden;text-overflow:ellipsis}
  .row .t b{color:var(--cc-text-primary);font-weight:600}
  /* quiet chip button — surface + text change only, no border */
  .src{background:var(--cc-bg-control);border:0;color:var(--cc-text-secondary);border-radius:var(--radius-pill);padding:1px 8px;font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono);cursor:pointer;white-space:nowrap;box-shadow:none}
  .src:hover{background:var(--cc-bg-control-strong);color:var(--cc-text-primary)}
  .src:active{background:var(--cc-bg-segment-track)}
  .badge{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-weight:600;text-transform:none;letter-spacing:0;padding:1px 7px;border-radius:var(--radius-pill);background:var(--cc-bg-control);color:var(--cc-text-muted)}
  .b-open{color:var(--cc-warning)} .b-locked{color:var(--cc-text-muted)}
  .b-sent{color:var(--cc-link)} .b-verified{color:var(--cc-success)} .b-pending{color:var(--cc-text-muted)} .b-failed{color:var(--cc-danger)}
  .rail{align-self:start;position:sticky;top:20px}
  .rail h3{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);text-transform:none;letter-spacing:0;color:var(--cc-text-muted);font-weight:600;margin:0 0 8px}
  /* backlink chips: quiet chips, r6, control surface + secondary ink, no border */
  .rail .bl{display:block;padding:4px 8px;border:0;border-radius:var(--radius-pill);margin-bottom:4px;background:var(--cc-bg-control);color:var(--cc-text-secondary);font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);font-family:var(--mono);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:none}
  .rail .bl:hover{background:var(--cc-bg-control-strong);color:var(--cc-text-primary)}
  .rail .blk{font-size:var(--cc-fs-xs);line-height:var(--cc-lh-xs);color:var(--cc-text-muted);text-transform:none;margin-right:6px}
  /* orphan marker is TEXT, never a coloured surface or border (§1) */
  .orphan{background:none;color:var(--cc-warning);border:0;border-radius:0;padding:2px 0;font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .dod{display:flex;align-items:center;gap:8px;padding:4px 2px}
  .dod .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dod.done .dot{background:var(--cc-success)} .dod.partial .dot{background:var(--cc-warning)} .dod.todo .dot{background:var(--cc-text-faint)}
  .empty-big{text-align:center;color:var(--cc-text-muted);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm);padding:60px 20px}
  b,strong{font-weight:600} /* §3 — bold runs 600, never 700+ */
  .dod .t{color:var(--cc-text-body);font-size:var(--cc-fs-sm);line-height:var(--cc-lh-sm)}
  .dod .t b{color:var(--cc-text-primary)}
  a{color:var(--cc-link);text-decoration:none}
  a:hover{text-decoration:underline}
  /* §2 focus ring is white at 22% — never coloured */
  :focus-visible{outline:1px solid var(--cc-focus-ring);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="main"><div class="empty-big">Loading…</div></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMBED=window.parent&&window.parent!==window;
function openSrc(ref){
  if(!ref) return;
  if(EMBED&&window.parent.openDocWindow){ if(ref==='wishlist'){ window.parent.openTarget('/wishlist.html',{title:'Wishlist'}); } else if(ref.startsWith('chat:')){ window.parent.openChat(ref.slice(5)); } else if(ref.startsWith('module:')){ window.parent.openTarget('/entity.html#module='+ref.slice(7),{title:'Module'}); } else window.parent.openDocWindow(ref); }
  else location.href='/api/raw?path='+encodeURIComponent(ref);
}
async function load(){
  const id=(location.hash.match(/#module=([a-z0-9_]+)/)||[])[1];
  if(!id){ $('wrap').innerHTML='<div class="main"><div class="empty-big">No module specified.</div></div>'; return; }
  let e, bl={links:[],orphan:true};
  try{ e=await (await fetch('/api/entity?module='+encodeURIComponent(id))).json(); }catch{ $('wrap').innerHTML='<div class="main"><div class="empty-big">Module not found.</div></div>'; return; }
  if(e.error){ $('wrap').innerHTML='<div class="main"><div class="empty-big">'+esc(e.error)+'</div></div>'; return; }
  try{ bl=await (await fetch('/api/backlinks?ref=module:'+encodeURIComponent(id))).json(); }catch{}
  const m=e.module, cl=m.checklist||[]; const done=cl.filter(c=>c.state==='done').length; const pct=cl.length?Math.round(done/cl.length*100)+'%':'—';
  const open=cl.filter(c=>c.state!=='done');
  const sec=(title,items,render)=>`<h2>${title} <span style="color:var(--cc-text-faint)">${items.length||''}</span></h2>`+(items.length?items.map(render).join(''):'<div class="sec-empty">None.</div>');
  document.title=m.name+' · CRS Brain';
  $('wrap').innerHTML=`
  <div class="main">
    <h1>${esc(m.name)}<span class="statusword st-${esc(m.status)}">${esc(m.status)}</span><span class="pct">${pct}</span></h1>
    <div class="sub">${esc(m.section)} · ${esc(id)}${e.detail.documented?' · DOCS':''}</div>
    ${sec("What's left (DoD)",open,c=>`<div class="dod ${esc(c.state)}"><span class="dot"></span><span class="t"><b>${esc(c.label)}</b>${c.detail?' — '+esc(c.detail):''}</span></div>`)}
    ${sec('Decisions',e.decisions,d=>`<div class="row"><span class="badge ${d.open?'b-open':'b-locked'}">${d.open?'open':'locked'}</span><span class="t">${esc(d.title)}</span><button class="src" onclick="openSrc('decisions.md')">decisions.md</button></div>`)}
    ${sec('Chunks &amp; reports',e.chunks,c=>`<div class="row"><span class="badge b-${esc(c.status)}">${esc(c.status)}</span><span class="t"><b>${esc(c.proto)}/${esc(c.id)}</b> — ${esc(c.title)}</span><button class="src" onclick="openSrc('${esc(c.ref)}')">prompt</button>${c.report?`<button class="src" onclick="openSrc('${esc(c.report)}')">report</button>`:''}</div>`)}
    ${sec('Prompts generated',e.prompts,p=>`<div class="row"><span class="t">${esc(p.label)}</span><button class="src" onclick="openSrc('${esc(p.ref)}')">open</button></div>`)}
    ${sec('Linked todos',e.todos,t=>`<div class="row"><span class="badge b-pending">${esc(t.status)}</span><span class="t">${esc(t.title)}</span></div>`)}
    ${sec('Feedback',e.feedback,f=>`<div class="row"><span class="badge b-pending">${esc(f.status)}</span><span class="t">${esc(f.title)}</span><button class="src" onclick="openSrc('wishlist')">wishlist</button></div>`)}
    ${sec('Checklist rows',e.checklist,r=>`<div class="row"><span class="t" style="font-family:var(--mono)">${esc(r.id)}</span><button class="src" onclick="openSrc('brain/qa/master-checklist.md')">checklist</button></div>`)}
  </div>
  <div class="rail">
    <h3>Referenced by ${bl.links.length}</h3>
    ${bl.orphan?'<div class="orphan">Orphan — nothing in the brain references this module, so it cannot be routed to from anywhere.</div>':bl.links.slice(0,30).map(l=>`<div class="bl" onclick="openSrc('${esc(l.from)}')"><span class="blk">${esc(l.kind)}</span>${esc(l.from.replace(/^chat:/,'chat '))}</div>`).join('')}
  </div>`;
}
addEventListener('hashchange',load); load();
</script>
</body>
</html>
