<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module · CRS Brain</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/scrollbars.css">
<script src="/js/scrollbars.js" defer></script>
<script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||localStorage.getItem("crs-theme")||"dark");addEventListener("storage",e=>{if(e.key==="crs-theme"&&e.newValue)document.documentElement.setAttribute("data-theme",e.newValue)});</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--secondary);font-family:var(--sans);font-size:13px;line-height:1.55}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 22px 90px;display:grid;grid-template-columns:1fr 260px;gap:28px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .main{min-width:0}
  h1{font-size:22px;color:var(--primary);margin:0 0 3px;font-weight:700;letter-spacing:-.03em}
  .sub{color:var(--muted);font-size:12px;font-family:var(--mono)}
  .statusword{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 9px;border-radius:var(--radius-pill);margin-left:8px}
  .st-done{background:var(--success-tint);color:var(--success)} .st-in-progress{background:var(--warning-tint);color:var(--warning)}
  .st-not-started,.st-roadmap{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pct{font-family:var(--mono);color:var(--muted);font-size:12px;margin-left:8px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sec-empty{color:var(--muted);font-style:italic;font-size:12.5px}
  .row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .t{flex:1;min-width:0;color:var(--secondary);overflow:hidden;text-overflow:ellipsis}
  .row .t b{color:var(--primary);font-weight:600}
  .src{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-badge);padding:2px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap}
  .src:hover{color:var(--primary);border-color:var(--line2)}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:1px 7px;border-radius:var(--radius-badge)}
  .b-open{background:var(--warning-tint);color:var(--warning)} .b-locked{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .b-sent{background:var(--accent-tint);color:var(--accent-text)} .b-verified{background:var(--success-tint);color:var(--success)} .b-pending{background:var(--panel2);color:var(--muted)} .b-failed{background:var(--error-tint);color:var(--error-soft)}
  .rail{align-self:start;position:sticky;top:20px}
  .rail h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0 0 8px}
  .rail .bl{display:block;padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius-btn);margin-bottom:5px;color:var(--secondary);font-size:11.5px;font-family:var(--mono);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .bl:hover{color:var(--primary);border-color:var(--line2)}
  .rail .blk{font-size:9.5px;color:var(--muted);text-transform:uppercase;margin-right:6px}
  .orphan{background:var(--warning-tint);color:var(--warning);border:1px solid var(--line);border-radius:var(--radius-btn);padding:8px 10px;font-size:12px}
  .dod{display:flex;align-items:center;gap:8px;padding:5px 2px}
  .dod .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dod.done .dot{background:var(--success)} .dod.partial .dot{background:var(--warning)} .dod.todo .dot{background:var(--border-active)}
  .empty-big{text-align:center;color:var(--muted);padding:60px 20px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="main"><div class="empty-big">Loading…</div></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMBED=window.parent&&window.parent!==window;
function openSrc(ref){
  if(!ref) return;
  if(EMBED&&window.parent.openDocWindow){ if(ref==='wishlist'){ window.parent.openTarget('/wishlist.html',{title:'Wishlist'}); } else if(ref.startsWith('chat:')){ window.parent.openChat(ref.slice(5)); } else if(ref.startsWith('module:')){ window.parent.openTarget('/entity.html#module='+ref.slice(7),{title:'Module'}); } else window.parent.openDocWindow(ref); }
  else location.href='/api/raw?path='+encodeURIComponent(ref);
}
async function load(){
  const id=(location.hash.match(/#module=([a-z0-9_]+)/)||[])[1];
  if(!id){ $('wrap').innerHTML='<div class="main"><div class="empty-big">No module specified.</div></div>'; return; }
  let e, bl={links:[],orphan:true};
  try{ e=await (await fetch('/api/entity?module='+encodeURIComponent(id))).json(); }catch{ $('wrap').innerHTML='<div class="main"><div class="empty-big">Module not found.</div></div>'; return; }
  if(e.error){ $('wrap').innerHTML='<div class="main"><div class="empty-big">'+esc(e.error)+'</div></div>'; return; }
  try{ bl=await (await fetch('/api/backlinks?ref=module:'+encodeURIComponent(id))).json(); }catch{}
  const m=e.module, cl=m.checklist||[]; const done=cl.filter(c=>c.state==='done').length; const pct=cl.length?Math.round(done/cl.length*100)+'%':'—';
  const open=cl.filter(c=>c.state!=='done');
  const sec=(title,items,render)=>`<h2>${title} <span style="color:var(--muted)">${items.length||''}</span></h2>`+(items.length?items.map(render).join(''):'<div class="sec-empty">None.</div>');
  document.title=m.name+' · CRS Brain';
  $('wrap').innerHTML=`
  <div class="main">
    <h1>${esc(m.name)}<span class="statusword st-${esc(m.status)}">${esc(m.status)}</span><span class="pct">${pct}</span></h1>
    <div class="sub">${esc(m.section)} · ${esc(id)}${e.detail.documented?' · DOCS':''}</div>
    ${sec("What's left (DoD)",open,c=>`<div class="dod ${esc(c.state)}"><span class="dot"></span><span class="t"><b>${esc(c.label)}</b>${c.detail?' — '+esc(c.detail):''}</span></div>`)}
    ${sec('Decisions',e.decisions,d=>`<div class="row"><span class="badge ${d.open?'b-open':'b-locked'}">${d.open?'open':'locked'}</span><span class="t">${esc(d.title)}</span><button class="src" onclick="openSrc('decisions.md')">decisions.md</button></div>`)}
    ${sec('Chunks &amp; reports',e.chunks,c=>`<div class="row"><span class="badge b-${esc(c.status)}">${esc(c.status)}</span><span class="t"><b>${esc(c.proto)}/${esc(c.id)}</b> — ${esc(c.title)}</span><button class="src" onclick="openSrc('${esc(c.ref)}')">prompt</button>${c.report?`<button class="src" onclick="openSrc('${esc(c.report)}')">report</button>`:''}</div>`)}
    ${sec('Prompts generated',e.prompts,p=>`<div class="row"><span class="t">${esc(p.label)}</span><button class="src" onclick="openSrc('${esc(p.ref)}')">open</button></div>`)}
    ${sec('Linked todos',e.todos,t=>`<div class="row"><span class="badge b-pending">${esc(t.status)}</span><span class="t">${esc(t.title)}</span></div>`)}
    ${sec('Feedback',e.feedback,f=>`<div class="row"><span class="badge b-pending">${esc(f.status)}</span><span class="t">${esc(f.title)}</span><button class="src" onclick="openSrc('wishlist')">wishlist</button></div>`)}
    ${sec('Checklist rows',e.checklist,r=>`<div class="row"><span class="t" style="font-family:var(--mono)">${esc(r.id)}</span><button class="src" onclick="openSrc('brain/qa/master-checklist.md')">checklist</button></div>`)}
  </div>
  <div class="rail">
    <h3>Referenced by ${bl.links.length}</h3>
    ${bl.orphan?'<div class="orphan">Orphan — nothing in the brain references this module, so it cannot be routed to from anywhere.</div>':bl.links.slice(0,30).map(l=>`<div class="bl" onclick="openSrc('${esc(l.from)}')"><span class="blk">${esc(l.kind)}</span>${esc(l.from.replace(/^chat:/,'chat '))}</div>`).join('')}
  </div>`;
}
addEventListener('hashchange',load); load();
</script>
</body>
</html>
