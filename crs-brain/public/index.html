<script>
const $ = (id) => document.getElementById(id);
const svg = (name,cls) => `<svg class="ic ${cls||''}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${name}"/></svg>`;
let state = { tab:'chats', chatId:null, filePath:null, editing:false, sending:false, pending:[], queue:[], populating:false, abort:null, stopped:false, viewGen:0, live:null };
// Called whenever the center view changes (open a chat/file/dashboard). Lets an
// in-flight stream detect it's no longer the active view, and frees the composer.
function bumpView(){ state.viewGen++; if(!(state.live && !state.live.done)) return; state.sending=false; if(typeof setGenerating==='function') setGenerating(false); }
function setGenerating(on){
  const s=$('sendBtn'), st=$('stopBtn'), ig=$('ingestBtn');
  if(s) s.style.display = on?'none':'';
  if(st) st.style.display = on?'':'none';
  if(ig) ig.style.opacity = on?'.4':'';
  if(ig) ig.style.pointerEvents = on?'none':'';
}
function stopGen(){ if(state.abort){ state.stopped=true; try{ state.abort.abort(); }catch{} } }

// ---------- tiny markdown renderer (no external deps) ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const FILE_RE=/(^|[\s>(])((?:[\w][\w.-]*\/)+[\w][\w.-]*\.(?:md|html|css|js|py|json|txt|csv|ya?ml|png|jpe?g|gif|svg|webp|xlsx))(?=[\s)<.,;:!?]|$)/g;
function mdInline(s){
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,src)=>`<img class="md-img" alt="${alt}" src="${/^https?:/.test(src)?src:'/api/raw?path='+encodeURIComponent(src)}">`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,href)=>/^https?:/.test(href)
      ?`<a href="${href}" target="_blank" rel="noreferrer">${t}</a>`
      :`<a href="#" data-path="${href}">${t}</a>`)
    .replace(FILE_RE,'$1<a href="#" data-path="$2">$2</a>');
}
function renderMd(src){
  const lines = src.replace(/\r/g,'').split('\n');
  let html='', i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){ let code=''; i++; while(i<lines.length && !/^```/.test(lines[i])){code+=lines[i]+'\n';i++;} i++; html+='<pre><code>'+esc(code)+'</code></pre>'; continue; }
    if(/^#{1,6}\s/.test(l)){ const n=l.match(/^#+/)[0].length; html+=`<h${n}>${mdInline(l.replace(/^#+\s/,''))}</h${n}>`; i++; continue; }
    if(/^\s*>/.test(l)){ let q=''; while(i<lines.length && /^\s*>/.test(lines[i])){q+=lines[i].replace(/^\s*>\s?/,'')+' ';i++;} html+='<blockquote>'+mdInline(q)+'</blockquote>'; continue; }
    if(/^\s*[-*+]\s/.test(l)){ html+='<ul>'; while(i<lines.length && /^\s*[-*+]\s/.test(lines[i])){html+='<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s/,''))+'</li>';i++;} html+='</ul>'; continue; }
    if(/^\s*\d+\.\s/.test(l)){ html+='<ol>'; while(i<lines.length && /^\s*\d+\.\s/.test(lines[i])){html+='<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++;} html+='</ol>'; continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i+1])){
      const row=(x)=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(l); i+=2; let body='';
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ body+='<tr>'+row(lines[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>'; i++; }
      html+='<div class="md-tbl"><table><thead><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>'; continue;
    }
    if(l.trim()===''){ i++; continue; }
    let para=l; i++;
    while(i<lines.length && lines[i].trim()!=='' && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>)/.test(lines[i])){ para+=' '+lines[i]; i++; }
    html+='<p>'+mdInline(para)+'</p>';
  }
  return html;
}

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
async function api(path,opts){ const r=await fetch(path,opts); if(!r.ok){const e=await r.json().catch(()=>({error:r.status})); throw new Error(e.error||'error');} return r.json(); }
const isHtml=p=>/\.html?$/i.test(p), isImg=p=>/\.(png|jpe?g|gif|svg|webp)$/i.test(p);
// Open with the OS default app (html → default browser).
async function apiOpen(p){ if(!p) return;
  try{ await api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})}); toast('Opened in your browser  ·  '+p.split('/').pop()); }
  catch(e){ toast('Could not open: '+e.message); } }
// Route any file reference to the right opener.
function smartOpen(p){ if(isHtml(p)) apiOpen(p); else { setTab('files'); openFile(p); } }
// Open the embedded galaxy map straight to the folder kanban board.
function openKanban(){ showMap('board'); }
// ---------- resizable left sidebar ----------
(function(){
  const root=document.documentElement, saved=localStorage.leftW;
  if(saved) root.style.setProperty('--left-w',saved);
  const rz=document.getElementById('lresizer'); if(!rz) return;
  let dragging=false;
  const clamp=x=>Math.max(210,Math.min(480,x));
  rz.addEventListener('pointerdown',e=>{ dragging=true; rz.classList.add('drag'); rz.setPointerCapture(e.pointerId); e.preventDefault(); });
  rz.addEventListener('pointermove',e=>{ if(!dragging) return;
    const w=clamp(e.clientX)+'px'; root.style.setProperty('--left-w',w); localStorage.leftW=w; });
  rz.addEventListener('pointerup',e=>{ dragging=false; rz.classList.remove('drag'); try{ rz.releasePointerCapture(e.pointerId); }catch{} });
})();
// Clickable file paths inside chat replies and rendered docs.
document.addEventListener('click',(e)=>{ const a=e.target.closest('a[data-path]'); if(!a) return;
  e.preventDefault(); smartOpen(a.dataset.path); });

// ---------- mobile drawers ----------
function mob(side){
  const L=document.querySelector('.col.left'), R=document.querySelector('.col.right');
  const openL = side==='left' && L && !L.classList.contains('show');
  const openR = side==='right' && R && !R.classList.contains('show');
  if(L) L.classList.toggle('show', openL);
  if(R) R.classList.toggle('show', openR);
  $('mscrim').classList.toggle('show', openL||openR);
}
// ---------- desktop sidebar collapse ----------
function toggleCol(side){
  const cls = side==='left' ? 'lcol' : 'rcol';
  const app = document.querySelector('.app');
  const collapsed = app.classList.toggle(cls);
  localStorage.setItem('collapse_'+side, collapsed?'1':'0');
}
// Rail button → expand the panel back to full width.
function railExpand(side){
  document.querySelector('.app').classList.remove(side==='left'?'lcol':'rcol');
  localStorage.setItem('collapse_'+side, '0');
}
// Rail tab button → expand the sidebar, then switch to that tab.
function railTab(t){ railExpand('left'); setTab(t); }
(function restoreCols(){
  const app = document.querySelector('.app');
  if(localStorage.getItem('collapse_left')==='1') app.classList.add('lcol');
  if(localStorage.getItem('collapse_right')==='1') app.classList.add('rcol');
})();
// picking a chat/file on mobile closes the drawer
document.addEventListener('click',e=>{
  if(innerWidth>900) return;
  if(e.target.closest('.item')||e.target.closest('.tree .file')) setTimeout(()=>mob(null),150);
});

// ---------- tabs ----------
function setTab(t){ if(t==='buildprint') t='chats';   // buildprint is now a composer mode, not a sidebar tab
  state.tab=t;
  $('tabChats').classList.toggle('on',t==='chats'); $('tabFiles').classList.toggle('on',t==='files');
  $('paneChats').classList.toggle('hide',t!=='chats'); $('paneFiles').classList.toggle('hide',t!=='files');
  $('chatActions').style.display = t==='chats' ? '' : 'none';
  $('fileFilter').style.display = t==='files' ? '' : 'none';
  // Clicking Conversations while a file/dashboard is open → return to where you were.
  if(t==='chats' && $('chatView').style.display==='none'){ state.chatId ? openChat(state.chatId) : newChat(); }
}

// ---------- Project-only file filter ----------
// Project view (default): the CRS product files you actually work on.
// Hidden: the app that runs the brain (crs-brain/), build scripts, README/CLAUDE
// (the brain reads those, you don't), and the reference manuals inside brain/.
const CRS_DIRS=new Set(['brain','specs','design','data','demos','pricing','audits']);
const CRS_ROOT_FILES=new Set(['decisions.md']);        // README.md / CLAUDE.md are for the brain, not you
const MANUAL_DIRS=new Set(['bubble','buildprint','bubble-forum']);   // reference manuals — hidden in project view
state.crsOnly = localStorage.getItem('crsOnly')!=='0';  // default ON
function setFileFilter(crs){ state.crsOnly=crs; localStorage.setItem('crsOnly',crs?'1':'0');
  $('ffCrs').classList.toggle('on',crs); $('ffAll').classList.toggle('on',!crs); loadFiles(); }
function filterTree(tree){ if(!state.crsOnly) return tree;
  return tree.filter(n=> n.type==='dir' ? CRS_DIRS.has(n.name) : CRS_ROOT_FILES.has(n.name))
    .map(n=> n.type==='dir'&&n.name==='brain'
      ? {...n, children:n.children.filter(c=>!(c.type==='dir'&&MANUAL_DIRS.has(c.name)))}
      : n); }

// ---------- chats ----------
function chatItemEl(c){
  const d=document.createElement('div'); d.className='item'+(c.id===state.chatId?' on':'');
  d.innerHTML=`${c.bp?`<svg class="ic sm bpi" viewBox="0 0 24 24" title="Buildprint"><use href="#i-terminal"/></svg>`:''}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'Untitled')}</span><span class="meta">${c.count}</span><span class="x" title="Delete">${svg('i-x','sm')}</span>`;
  d.onclick=(e)=>{ if(e.target.closest('.x')){delChat(c.id);return;} openChat(c.id); };
  return d;
}
// ---------- chat search (sidebar) ----------
let chatSearchT=null;
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark class="hl">'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function onChatSearch(q){ clearTimeout(chatSearchT);
  chatSearchT=setTimeout(async()=>{ q=q.trim();
    if(!q){ loadChats(); return; }
    try{ const {chats}=await api('/api/search-chats?q='+encodeURIComponent(q));
      const box=$('paneChats');
      box.innerHTML = chats.length? '' : '<div class="empty" style="padding:12px">No conversations match “'+esc(q)+'”.</div>';
      for(const c of chats){ const d=document.createElement('div'); d.className='item'+(c.id===state.chatId?' on':'');
        d.style.flexDirection='column'; d.style.alignItems='stretch';
        d.innerHTML=`<div style="display:flex;gap:8px;align-items:center">${c.bp?`<svg class="ic sm bpi" viewBox="0 0 24 24"><use href="#i-terminal"/></svg>`:''}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hl(c.title||'Untitled',q)}</span><span class="meta">${c.count}</span></div>`+(c.snippet?`<span class="snip">${hl(c.snippet,q)}</span>`:'');
        d.onclick=()=>openChat(c.id); box.appendChild(d); }
    }catch{}
  }, 180);
}

async function loadChats(){
  const {chats}=await api('/api/chats');
  state.chatList=chats;
  // unified list — Buildprint tasks marked with a terminal glyph (mode is a composer switch now)
  $('paneChats').innerHTML = chats.length? '' : '<div class="empty" style="padding:12px">No conversations yet.</div>';
  for(const c of chats) $('paneChats').appendChild(chatItemEl(c));
}
// mode-aware chat starter templates — clicking a card seeds the input
const TEMPLATES={
  chat:[
    {i:'i-gauge',t:'What changed recently?',d:'Recent commits + brain updates',s:'What changed in the CRS project recently?'},
    {i:'i-alert',t:'What’s blocking?',d:'Open decisions & blockers',s:'What is blocking the next module, and which decisions are still open?'},
    {i:'i-file',t:'Explain a decision',d:'Locked architecture rationale',s:'Explain the Pattern A multi-tenant decision and its trade-offs.'},
    {i:'i-check',t:'What’s missing?',d:'Gaps vs the spec',s:'What is missing for Pattern A privacy rules across the business data types?'},
  ],
  bp:[
    {i:'i-search',t:'Audit a module (read-only)',d:'Report state, change nothing',s:'Run a READ-ONLY audit of a module: report its data types, privacy rules, and workflows. Do not change anything.'},
    {i:'i-terminal',t:'Write a build prompt for…',d:'Draft a guardrailed prompt',s:'Write a Buildprint prompt to add company + property fields and a Pattern A privacy rule to a module — plan first, test branch only.'},
    {i:'i-alert',t:'List DTs with no privacy rule',d:'Security gap scan',s:'List all data types that have no privacy rule, or whose rule does not check both company AND property.'},
    {i:'i-check',t:'Fix pass (plan-first)',d:'Savepoint → apply → check',s:'Do a fix pass on the current module: state the plan, take a savepoint, apply ONE change, run check. Stop if check fails.'},
  ],
};
function seedInput(text){ const inp=$('input'); if(!inp)return; inp.value=text; inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,260)+'px'; inp.focus(); }
function seedTpl(mode,idx){ const t=(TEMPLATES[mode]||[])[idx]; if(t) seedInput(t.s); }
function heroCards(mode){ return '<div class="tcards">'+(TEMPLATES[mode]||[]).map((t,i)=>`<button class="tcard" onclick="seedTpl('${mode}',${i})"><span class="tct">${svg(t.i,'sm')} ${esc(t.t)}</span><span class="tcd">${esc(t.d)}</span></button>`).join('')+'</div>'; }
function heroHtml(){ return '<div class="hero"><div class="hero-mark">'+svg('i-logo')+'</div><div class="hero-t">CRS Brain</div><div class="hero-s">Ask about progress, decisions, what\'s next, or what\'s missing — answers are grounded in <b style="color:var(--primary)">brain/</b>, the living map of the CRS infrastructure.</div>'+heroCards('chat')+'</div>'; }
function bpHeroHtml(){ return '<div class="hero"><div class="hero-mark" style="background:var(--accent)">'+svg('i-terminal')+'</div><div class="hero-t">Buildprint task</div><div class="hero-s">Operate your CRS Bubble app on the <b style="color:var(--primary)">test</b> branch — plan → apply → check, logged to the brain, never live.</div>'+heroCards('bp')+'</div>'; }
// reflect state.bp into the composer mode switch + placeholder
function reflectMode(){ document.querySelectorAll('#chatMode .seg2 button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='bp')===(state.bp===true))); const inp=$('input'); if(inp) inp.placeholder=state.bp?bpPh:normPh; }
function setChatMode(bp){ state.bp=!!bp; reflectMode();
  const log=$('chatLog'); if(log && log.querySelector('.hero')){ log.innerHTML=bp?bpHeroHtml():heroHtml(); if(!state.chatId) $('centerTitle').textContent=bp?'New Buildprint task':'New conversation'; }
  if(bp) bpStatus(); }
function newChat(){ bumpView(); state.chatId=null; state.bp=false; showChat(); $('chatLog').innerHTML=heroHtml(); $('centerTitle').textContent='New conversation'; reflectMode(); loadChats(); $('input').focus(); }
function newBpChat(){ bumpView(); state.chatId=null; state.bp=true; setTab('chats'); showChat(); $('chatLog').innerHTML=bpHeroHtml(); $('centerTitle').textContent='New Buildprint task'; reflectMode(); bpStatus(); loadChats(); $('input').focus(); }
const bpPh='Tell Buildprint what to do on the test branch…', normPh='Ask about your CRS project…  (Enter to send · Shift+Enter for newline)';
async function openChat(id){
  bumpView();
  // Returning to a chat that's still generating? Re-attach the live stream so it
  // keeps typing right where it left off (instead of a blank view + stuck Stop).
  if(state.live && !state.live.done && state.live.chatId===id){
    const live=state.live; live.gen=state.viewGen; state.chatId=id; state.bp=live.bp; showChat();
    const log=$('chatLog'); log.innerHTML=''; log.appendChild(userMsgEl(live.userText, live.atts)); log.appendChild(live.node);
    $('centerTitle').textContent=(state.bp?'🔨 ':'')+((state.chatList||[]).find(c=>c.id===id)?.title||'Conversation');
    reflectMode(); state.sending=true; setGenerating(true);
    log.scrollTop=log.scrollHeight; loadChats(); return;
  }
  state.chatId=id; showChat(); const chat=await api('/api/chat?id='+id); state.bp=chat.bp===true;
  $('centerTitle').textContent=(state.bp?'🔨 ':'')+(chat.title||'Conversation');
  reflectMode();
  renderChat(chat.messages); loadChats(); }
async function delChat(id){
  const t=(state.chatList||[]).find(c=>c.id===id)?.title||'this chat';
  if(!confirm('Delete "'+t+'"? This cannot be undone.')) return;
  await api('/api/chat?id='+id,{method:'DELETE'}); if(state.chatId===id) newChat(); else loadChats(); }

function attsHtml(atts){
  if(!atts||!atts.length) return '';
  return `<div class="msg-atts">${atts.map(x=>{
    const p=(''+x), name=p.split('/').pop();
    return `<span class="matt" title="${esc(name)}">${svg('i-clip','sm')}<span class="matt-name">${esc(name)}</span>`
      +`<a class="matt-dl" href="/api/raw?path=${encodeURIComponent(p)}" download="${esc(name)}" title="Download ${esc(name)}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></a></span>`;
  }).join('')}</div>`;
}
function userMsgEl(content, atts){
  const el=document.createElement('div'); el.className='msg user';
  const body=content?esc(content).replace(/\n/g,'<br>'):'<span class="dim">(files attached)</span>';
  el.innerHTML=`<div class="avatar you">${svg('i-user')}</div><div class="content"><div class="bubble">${attsHtml(atts)}${body}</div></div>`;
  return el;
}
function botMsgEl(){
  const el=document.createElement('div'); el.className='msg assistant';
  el.innerHTML=`<div class="avatar bot">${svg('i-logo')}</div><div class="content"><div class="body md"></div></div>`;
  return el;
}
function renderChat(messages){
  const log=$('chatLog'); log.innerHTML='';
  let lastBot=null, lastBotMsg=null;
  for(const m of messages){
    if(m.role==='user'){ log.appendChild(userMsgEl(m.content, m.attachments)); lastBot=null; }
    else{
      const el=botMsgEl(); el.querySelector('.body').innerHTML=renderMd(m.content||'');
      if(m.content) addReplyActions(el, m.content);
      log.appendChild(el); lastBot=el; lastBotMsg=m;
    }
  }
  // Reopened chats keep their controls: Try again on the final reply, and
  // Continue when it was stopped mid-stream (persisted as partial:true).
  if(lastBot) addRetryBar(lastBot, !!(lastBotMsg&&lastBotMsg.partial));
  log.scrollTop=log.scrollHeight;
}

// Action bar under each assistant reply: save it as a .md doc and open it, or copy.
function addReplyActions(msgEl, text){
  const host=msgEl.querySelector('.content')||msgEl;
  const acts=document.createElement('div'); acts.className='msg-acts';

  function finalizeCard(){   // finalize the whole active group (name kept for call sites)
    endStep();
    if(group){ if(group.run){ group.run=false; group.el.classList.remove('run'); group.labelEl.textContent='Worked for '+fmtDur(performance.now()-group.start); } group=null; }
  }
  function ensureGroup(){
    if(group) return;
    clearDots();
    const el=document.createElement('div'); el.className='wgroup run open';
    el.innerHTML='<button class="wghead" type="button"><svg class="wgchev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="wglabel">Working</span></button><div class="wsteps"></div>';
    el.querySelector('.wghead').onclick=()=>el.classList.toggle('open');
    blocksEl.appendChild(el);
    group={el,labelEl:el.querySelector('.wglabel'),stepsEl:el.querySelector('.wsteps'),start:performance.now(),run:true};
    if(nearBottom()) log.scrollTop=log.scrollHeight;
  }
  function startCard(kind,tool){   // start a NEW step within the current group (name kept for call sites)
    endStep(); ensureGroup();
    const el=document.createElement('div'); el.className='wstep run';
    el.innerHTML='<div class="wstep-head"><span class="wstep-ico">'+stepIco(kind,tool)+'</span><span class="wstep-lbl">'+esc(wLabel(kind,tool))+'</span><svg class="wstep-exp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div><div class="wstep-body"></div>';
    el.querySelector('.wstep-head').onclick=()=>{ if(el.classList.contains('has-body')) el.classList.toggle('open'); };
    group.stepsEl.appendChild(el);
    activeStep={el,icoEl:el.querySelector('.wstep-ico'),labelEl:el.querySelector('.wstep-lbl'),bodyEl:el.querySelector('.wstep-body'),kind,text:''};
    if(nearBottom()) log.scrollTop=log.scrollHeight;
  }
  function setStepBody(t){
    if(!activeStep) return;
    activeStep.text=t; activeStep.bodyEl.textContent=t;
    activeStep.el.classList.toggle('has-body', !!t.trim());
    if(activeStep.el.classList.contains('open')&&nearBottom()) log.scrollTop=log.scrollHeight;
  }
  function appendThink(t){
    if(!activeStep||activeStep.kind!=='thinking') startCard('thinking');
    setStepBody(activeStep.text+t);
  }

  // ---- answer typewriter reveal (into answerEl); setTimeout survives hidden tabs ----
  let full='', revealed=0, streamDone=false, errored=false, started=false, finalized=false, stoppedReply=false;
  const caret=document.createElement('span'); caret.className='caret';
  function pump(){
    if(errored||finalized) return;
    if(!started && full.length){ clearDots(); finalizeCard(); answerEl.innerHTML=''; answerEl.appendChild(caret); started=true; }
    if(revealed<full.length){
      const remaining=full.length-revealed;
      const step = remaining>240 ? remaining-200 : 3;   // steady typing; catch up only if far behind
      const slice=full.slice(revealed, revealed+step); revealed+=slice.length;
      const frag=document.createDocumentFragment();
      slice.split(/(\s+)/).forEach(t=>{ if(t===''){return;} const s=document.createElement('span'); s.className='tok'; s.textContent=t; frag.appendChild(s); });
      answerEl.insertBefore(frag, caret);
      if(nearBottom()) log.scrollTop=log.scrollHeight;
    }
    if(streamDone && revealed>=full.length){ return finalize(); }
    setTimeout(pump, 16);
  }
  function finalize(){
    if(errored||finalized) return; finalized=true;
    finalizeCard(); clearInterval(timerIv);
    answerEl.classList.remove('streaming');
    if(stoppedReply && !full.trim()){
      answerEl.innerHTML='<span class="stopped-note">Stopped before any output.</span>';
    }else{
      answerEl.style.opacity='0'; answerEl.innerHTML=renderMd(full);
      setTimeout(()=>{ answerEl.style.transition='opacity .28s ease'; answerEl.style.opacity='1'; }, 20);
    }
    if(stoppedReply && full.trim()){ const n=document.createElement('div'); n.className='stopped-note'; n.textContent='⏹ Stopped'; answerEl.after(n); }
    if(full.trim()) addReplyActions(a, full);
    addRetryBar(a, stoppedReply);
    if(nearBottom()) log.scrollTop=log.scrollHeight;
  }
  setTimeout(pump, 16);

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.chatId,message:text,title:opts.title,attachments:opts.attachments||[],ingest:opts.ingest===true,regenerate:opts.regenerate===true,bp:state.bp===true,model:$('modelSel')?.value,effort:$('effortSel')?.value}),signal:ac.signal});
    if(!res.body) throw new Error('no stream');
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='meta'){ live.chatId=ev.id; if(mine()){ state.chatId=ev.id; if(ev.title) $('centerTitle').textContent=(live.bp?'🔨 ':'')+ev.title; }
          if(live.bp && state.planRef) markPlanPrompted(ev.id); }   // link plan step → this bp chat
        else if(ev.type==='block'){ startCard(ev.kind, ev.tool); }
        else if(ev.type==='think'){ appendThink(ev.text||''); }
        else if(ev.type==='label'){ if(activeStep&&ev.text){ activeStep.labelEl.textContent=ev.text; activeStep.icoEl.innerHTML=stepIco(activeStep.kind, ev.text); } }
        else if(ev.type==='detail'){ if(activeStep){ setStepBody(activeStep.text + (activeStep.text?'\n':'') + (ev.text||'')); } }
        else if(ev.type==='status'){ /* superseded by work blocks */ }
        else if(ev.type==='memory-saved'){ const n=(ev.entries||[]).length; if(n){ const first=ev.entries[0]; toast('🧠 Saved to memory — '+first.category+': '+first.title+(n>1?`  (+${n-1} more)`:'')); } }
        else if(ev.type==='usage'){ genIn=ev.in||genIn; genOut=ev.out||genOut; paintMeter(); }
        else if(ev.type==='delta'){ if(group) finalizeCard(); full+=ev.text; }
        else if(ev.type==='done'){ live.chatId=ev.id; full=ev.reply||full; streamDone=true; if(mine()){ state.chatId=ev.id; if(ev.title) $('centerTitle').textContent=(live.bp?'🔨 ':'')+ev.title; } }
        else if(ev.type==='stopped'){ live.chatId=ev.id; full=ev.reply||full; stoppedReply=true; streamDone=true; if(mine()) state.chatId=ev.id; }
        else if(ev.type==='error'){ errored=true; clearInterval(timerIv); finalizeCard(); body.classList.add('err'); answerEl.remove(); const em=document.createElement('div'); em.innerHTML=svg('i-alert','sm')+'  '+esc(ev.error); body.appendChild(em); addRetryBar(a,false); }
      }
    }
    streamDone=true;
  }catch(e){
    if(e.name==='AbortError' || state.stopped){
      stoppedReply=true; streamDone=true;   // Stop button: keep partial, let pump finalize
    }else if(!errored){
      errored=true; clearInterval(timerIv); finalizeCard(); body.classList.add('err');
      answerEl.remove(); const em=document.createElement('div'); em.innerHTML=svg('i-alert','sm')+'  '+esc(e.message); body.appendChild(em); addRetryBar(a,false);
    }
  }finally{
    live.done=true; clearInterval(timerIv); clearInterval(meterIv); if(gm&&mine()) gm.classList.remove('show');
    // Only touch the composer/queue if this stream still owns the active view —
    // otherwise the user has moved on and a different stream (or none) is in charge.
    if(mine()){ state.sending=false; state.abort=null; setGenerating(false); dequeue(); }
    // Outcome notification (bell + sound; toast only for failures — success is visible in the log).
    const elapsed=fmtDur(performance.now()-genStart);
    if(errored){ notify({type:'generation',level:'error',title:'Generation failed',body:'The last request errored — you can retry from the reply.'}); }
    else if(stoppedReply){ notify({type:'generation',level:'warning',title:'Generation stopped',body:'Stopped after '+elapsed+'.',toast:false}); }
    else { notify({type:'generation',level:'success',title:(live.bp?'Buildprint task complete':'Response ready'),body:elapsed+(genOut?' · ↓ '+fmtTok(genOut)+' tokens out':''),toast:false}); }
    loadChats(); loadProgress(); loadPlan();
    // Ingest & Buildprint chats write files into brain/ — refresh the tree,
    // Cmd+K index, and Recently-edited so new files appear without a reload.
    if(opts.ingest || live.bp){ loadFiles(); loadRecentEdited(); }
  }
}

// Weekly digest — pull recent git commits + progress board, ask the Brain to synthesize.
async function runDigest(){
  if(state.sending) return;
  newChat();
  toast('Gathering recent changes…');
  try{
    const ctx=await api('/api/digest-context?days=7');
    const prog=JSON.stringify(ctx.progress,null,2);
    const msg=`Weekly digest. Use ONLY the context provided below — do not read repo files (keep this fast). Tell me:\n`+
      `1) What changed in the last ${ctx.days} days\n2) What's in progress now\n3) What's next\n4) Anything missing, stalled, or at risk.\n`+
      `Be concise and specific.\n\n`+
      `## Git commits (last ${ctx.days} days)\n${ctx.log||'(none)'}\n\n## Progress board\n\`\`\`json\n${prog}\n\`\`\``;
    streamChat(msg,{title:'Weekly digest — '+new Date().toISOString().slice(0,10)});
  }catch(e){ toast('Digest failed: '+e.message); }
}

async function loadFiles(){
  const {root,tree}=await api('/api/files'); $('repoName').textContent=root; state.repoName=root;
  const shown=filterTree(tree);
  const box=$('paneFiles'); box.innerHTML=''; box.appendChild(renderTree(shown,true));
  state.allFiles=[]; (function flat(ns){ for(const n of ns){ n.type==='dir'?flat(n.children):state.allFiles.push(n.path); } })(shown);

function renderTree(nodes,open){
  const wrap=document.createElement('div');
  for(const n of nodes){
    if(n.type==='dir'){
      const d=document.createElement('div'); d.className='node dir';
      d.innerHTML=`<span class="chev${open?' open':''}">${svg('i-chevron','sm')}</span>${svg('i-folder','sm')}${esc(n.name)}`;
      const kids=renderTree(n.children,false); kids.className='children'; kids.style.display=open?'block':'none';
      d.onclick=(e)=>{e.stopPropagation(); const vis=kids.style.display!=='none'; kids.style.display=vis?'none':'block'; d.querySelector('.chev').classList.toggle('open',!vis);};
      wrap.appendChild(d); wrap.appendChild(kids);
    }else{
      const f=document.createElement('div'); f.className='node file'; f.dataset.path=n.path;
      f.innerHTML=`${svg('i-doc-sm','sm')}${esc(n.name)}${isHtml(n.name)?' <span style="color:var(--muted);font-size:10px">↗</span>':''}`;
      f.onclick=()=>isHtml(n.path)?apiOpen(n.path):openFile(n.path);   // html → default browser
      wrap.appendChild(f);
    }
  }
  return wrap;
}

function agoTxt(ms){ const s=Math.round((Date.now()-ms)/1000); if(s<60)return s+'s'; const m=Math.round(s/60); if(m<60)return m+'m'; const h=Math.round(m/60); if(h<24)return h+'h'; return Math.round(h/24)+'d'; }
function rfEl(pth, ago){ const d=document.createElement('div'); d.className='rf'; d.title=pth;
  const nm=pth.split('/').pop();
  d.innerHTML=`${fileTileFor(pth)}<span class="nm">${esc(nm)}</span>${ago?`<span class="ago">${ago}</span>`:''}`;
  d.onclick=()=>{ if(isHtml(pth)) apiOpen(pth); else openFile(pth); };
  return d; }
function pushRecentOpened(p){ let a=[]; try{ a=JSON.parse(localStorage.getItem('recentOpened')||'[]'); }catch{}
  a=a.filter(x=>x!==p); a.unshift(p); a=a.slice(0,12); localStorage.setItem('recentOpened',JSON.stringify(a)); }
function loadRecentOpened(){ const box=$('recentOpened'); if(!box) return;

async function loadRecentEdited(){ const box=$('recentEdited'); if(!box) return;

const EXT_COLOR={md:'#8B5CF6',html:'#F97316',htm:'#F97316',css:'#3B82F6',js:'#EAB308',ts:'#3178C6',py:'#22C55E',json:'#9CA3AF',csv:'#16A34A',xlsx:'#16A34A',xls:'#16A34A',pdf:'#EF4444',png:'#EC4899',jpg:'#EC4899',jpeg:'#EC4899',gif:'#EC4899',svg:'#EC4899',webp:'#EC4899',txt:'#6B7280',yml:'#06B6D4',yaml:'#06B6D4'};
function extOf(name){ return (name.split('.').pop()||'').toLowerCase(); }
function fileTileFor(pth, big){ const name=pth.split('/').pop(); const cls='ftile'+(big?' lg':'');
  if(isImg(name)) return `<span class="${cls}"><img loading="lazy" src="/api/raw?path=${encodeURIComponent(pth)}"></span>`;
  const ext=extOf(name); return `<span class="${cls}" style="background:${EXT_COLOR[ext]||'#565656'}">${(ext.slice(0,4).toUpperCase())||'?'}</span>`; }

// ---------- Finder/Explorer-style file browser ----------
let explTree=[], explPath='', explAll=false;
async function openExpl(dir){ try{ explTree=(await api('/api/files')).tree; }catch{ explTree=[]; }
  explPath=dir||'';
  // Dashboard tiles link into reference dirs (brain/bubble, crs-brain/data/docs…)
  // that the project filter hides — auto-show everything for those, else the
  // explorer opens dead empty. Project dirs keep the normal filtered view.
  explAll = !!explPath && !nodeExistsIn(filterTree(explTree), explPath) && nodeExistsIn(explTree, explPath);
  $('explWrap').classList.add('show'); renderExpl(); }
function nodeExistsIn(root, pathStr){ let nodes=root;
  for(const part of pathStr.split('/')){ const n=(nodes||[]).find(x=>x.type==='dir'&&x.name===part); if(!n) return false; nodes=n.children; }
  return true; }
function closeExpl(){ $('explWrap').classList.remove('show'); }
function explGoto(p){ explPath=p; renderExpl(); }
function explNodeAt(pathStr){ const root=explAll?explTree:filterTree(explTree);
  if(!pathStr) return {children:root};
  let nodes=root, node=null;
  for(const part of pathStr.split('/')){ node=(nodes||[]).find(n=>n.type==='dir'&&n.name===part); if(!node) return {children:[]}; nodes=node.children; }
  return node; }
function dateGroup(ms){ if(!ms) return 'Older'; const d=Date.now()-ms, day=864e5; if(d<day)return 'Today'; if(d<2*day)return 'Yesterday'; if(d<7*day)return 'This week'; if(d<30*day)return 'This month'; return 'Older'; }
function explOpen(p){ if(isHtml(p)){ closeExpl(); apiOpen(p); return; } state.explReturn=explPath; closeExpl(); openFile(p); }
function renderExpl(){
  const node=explNodeAt(explPath), grid=$('explGrid'); grid.innerHTML='';
  const crumb=$('explCrumb'); const parts=explPath?explPath.split('/'):[];
  crumb.innerHTML=`<a onclick="explGoto('')">${esc(state.repoName||'Project')}</a>`; let acc='';
  parts.forEach((p,i)=>{ acc=acc?acc+'/'+p:p; crumb.innerHTML+=`<span class="sep">›</span>`+(i===parts.length-1?`<b>${esc(p)}</b>`:`<a onclick="explGoto('${acc.replace(/'/g,"")}')">${esc(p)}</a>`); });
  const kids=(node&&node.children)||[];
  const dirs=kids.filter(c=>c.type==='dir').sort((a,b)=>a.name.localeCompare(b.name));
  let files=kids.filter(c=>c.type==='file'); const sort=$('explSort').value;
  if(sort==='date') files.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
  else if(sort==='type') files.sort((a,b)=>extOf(a.name).localeCompare(extOf(b.name))||a.name.localeCompare(b.name));
  else files.sort((a,b)=>a.name.localeCompare(b.name));
  if(!dirs.length&&!files.length){ grid.innerHTML='<div class="expl-empty">This folder is empty.</div>'; return; }
  const add=(html)=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); grid.appendChild(t.content.firstChild); };
  for(const d of dirs) add(`<div class="expl-item" onclick="explGoto('${d.path.replace(/'/g,"")}')" title="${esc(d.path)}">${folderTile(true)}<span class="nm">${esc(d.name)}</span></div>`);
  const gk = sort==='type'? (f=>extOf(f.name).toUpperCase()||'FILE') : sort==='date'? (f=>dateGroup(f.mtime)) : null;
  let lastG=null;
  for(const f of files){ if(gk){ const g=gk(f); if(g!==lastG){ const gd=document.createElement('div'); gd.className='expl-group'; gd.textContent=g; grid.appendChild(gd); lastG=g; } }
    add(`<div class="expl-item" onclick="explOpen('${f.path.replace(/'/g,"\\'")}')" title="${esc(f.path)}">${fileTileFor(f.path,true)}<span class="nm">${esc(f.name)}</span></div>`); }
}

async function openFile(p){
  if(currentView()!=='file') state.beforeFile=currentView();
  // Opened from the Finder explorer? Remember its folder so Back returns to it
  // (the explorer is an overlay currentView() can't see).
  if(state.explReturn!=null){ state.beforeFile='expl'; state.beforeExplPath=state.explReturn; state.explReturn=null; }
  bumpView();
  pushRecentOpened(p); loadRecentOpened();
  state.filePath=p; state.editing=false;
  $('backBtn').style.display=''; $('downloadBtn').style.display='';
  document.querySelectorAll('.tree .file').forEach(el=>el.classList.toggle('on',el.dataset.path===p));
  $('chatView').style.display='none'; $('dashView').style.display='none'; $('mapView').style.display='none'; $('kanbanView').style.display='none'; $('bubbleView').style.display='none'; $('fileView').style.display='flex'; $('centerCol').classList.remove('map-mode'); $('centerCol').classList.add('no-composer'); markView('');
  $('centerTitle').textContent=p;
  $('openExt').style.display = (isHtml(p)||isImg(p)) ? '' : 'none';
  const doc=$('fileDoc');
  if(isImg(p)){ // images render directly, no text fetch
    $('editToggle').style.display='none'; $('saveBtn').style.display='none';
    doc.className='doc'; doc.style.display='block'; $('fileEdit').style.display='none';
    doc.innerHTML='<img class="md-img" style="max-width:100%" src="/api/raw?path='+encodeURIComponent(p)+'" alt="'+esc(p)+'">';
    return;
  }
  const isMd=/\.md$/i.test(p);
  $('editToggle').style.display = /\.(md|txt|json|css|js|py|csv|ya?ml|html)$/i.test(p) ? '' : 'none';
  $('editToggle').classList.remove('on'); $('saveBtn').style.display='none';
  const {content}=await api('/api/file?path='+encodeURIComponent(p));
  $('fileEdit').value=content;
  doc.className = isMd ? 'doc md' : 'doc';
  doc.style.display='block'; $('fileEdit').style.display='none';
  doc.innerHTML = isMd ? renderMd(content) : '<pre style="white-space:pre-wrap;font-family:var(--mono);font-size:13px;color:var(--secondary)">'+esc(content)+'</pre>';
}
function toggleEdit(){

// Which center view is showing right now (used to return there via Back).

// ---------- quick-open palette (Cmd/Ctrl+K) ----------
let palIdx=0, palItems=[];
function openPal(){ $('palWrap').classList.add('show'); $('palQ').value=''; palFilter(''); $('palQ').focus(); }
function closePal(){ $('palWrap').classList.remove('show'); }
function palFilter(q){
  q=q.toLowerCase();
  const files=(state.allFiles||[]).filter(p=>p.toLowerCase().includes(q)).slice(0,10)
    .map(p=>({kind:'file',label:p,go:()=>{closePal();smartOpen(p);}}));
  const chats=(state.chatList||[]).filter(c=>(c.title||'').toLowerCase().includes(q)).slice(0,5)
    .map(c=>({kind:'chat',label:c.title||'Untitled',go:()=>{closePal();openChat(c.id);}}));
  palItems=[...files,...chats]; palIdx=0; palRender();
}
function palRender(){
  const box=$('palRes');
  if(!palItems.length){ box.innerHTML='<div class="none">No matches</div>'; return; }
  box.innerHTML='';
  palItems.forEach((it,i)=>{ const d=document.createElement('div'); d.className='res'+(i===palIdx?' on':'');
    d.innerHTML=`${svg(it.kind==='file'?'i-doc-sm':'i-sparkle','sm')} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label)}</span><span class="k">${it.kind}</span>`;
    d.onclick=it.go; d.onmousemove=()=>{palIdx=i;palRender();}; box.appendChild(d); });
}
$('palQ').addEventListener('input',e=>palFilter(e.target.value));
$('palQ').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palItems.length-1,palIdx+1);palRender();}
  if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(0,palIdx-1);palRender();}
  if(e.key==='Enter'&&palItems[palIdx])palItems[palIdx].go();
  if(e.key==='Escape')closePal();
});
addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPal(); } });

// ---------- build plan: packets → Buildprint prompts ----------
// A packet = one module's ordered, one-session-sized build steps. Each step can be
// expanded into a guardrail-hardened Buildprint prompt that prefills a bp chat.
let plansCache=null;
const STEP_ORDER=['pending','prompted','applied','verified','ingested'];
async function loadPlan(){
  // plansCache still feeds the dashboard "Next build step" card even though the
  // old right-rail #planPanel is gone — so always fetch; renderPlan() self-guards.
  try{ plansCache=await api('/api/plans'); }catch{ const b=$('planPanel'); if(b) b.innerHTML='<div class="pempty">Could not load the build plan.</div>'; return; }
  renderPlan();
}
function activePacket(){
  if(!plansCache||!plansCache.packets||!plansCache.packets.length) return null;
  return plansCache.packets.find(p=>p.id===plansCache.activePacket) || plansCache.packets[plansCache.packets.length-1];
}
function renderPlan(){
  const box=$('planPanel'); if(!box) return;
  const pk=activePacket();
  if(!pk){ box.innerHTML='<div class="pempty">No build packets yet. On the dashboard, type a module name and hit <b>Generate packet</b> — the brain drafts one-session build steps grounded in brain/.</div>'; return; }
  const done=pk.steps.filter(s=>s.status==='verified'||s.status==='ingested').length;
  const firstPending=pk.steps.find(s=>s.status==='pending');
  let html='';
  if(plansCache.packets.length>1){
    html+=`<select class="pksel" onchange="switchPacket(this.value)">${plansCache.packets.map(p=>`<option value="${p.id}"${p.id===pk.id?' selected':''}>${esc(p.module)} — ${esc(p.title||'').slice(0,40)}</option>`).join('')}</select>`;
  }
  html+=`<div class="pkt-head">${esc(pk.module)}<span class="cnt">${done}/${pk.steps.length} done</span></div>`;
  html+=pk.steps.map(s=>{
    const cls=(s.status==='verified'||s.status==='ingested')?'done':(s===firstPending?'active':'');
    return `<div class="pstep ${cls}" onclick="this.classList.toggle('open')">
      <span class="pdot"></span>
      <span class="pt">${esc(s.title)}
        <div class="pdetail">${esc(s.detail||'')}${s.entities?`<br><b>Entities:</b> ${esc(s.entities)}`:''}${s.verify?`<br><b>Verify:</b> ${esc(s.verify)}`:''}${s.chatId?`<br><a href="#" onclick="event.stopPropagation();openChat('${s.chatId}');return false">→ open its Buildprint chat</a>`:''}</div>
        ${s===firstPending?`<br><button class="pdraft" onclick="event.stopPropagation();draftStepPrompt('${pk.id}','${s.id}')">${svg('i-send','sm')} Draft Buildprint prompt</button>`:''}
      </span>
      <span class="pst" title="Click to advance status · shift-click to revert" onclick="event.stopPropagation();cycleStep('${pk.id}','${s.id}',event.shiftKey)">${s.status}</span>
    </div>`;
  }).join('');
  box.innerHTML=html;
}
function switchPacket(id){ if(!plansCache) return; plansCache.activePacket=id; putPlans(); renderPlan(); }
async function putPlans(){ try{ await api('/api/plans',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(plansCache)}); }catch(e){ toast('Plan save failed: '+e.message); } }
function cycleStep(pkId,stId,back){
  const pk=plansCache.packets.find(p=>p.id===pkId); const st=pk&&pk.steps.find(s=>s.id===stId); if(!st) return;
  const i=STEP_ORDER.indexOf(st.status);
  st.status=STEP_ORDER[Math.max(0,Math.min(STEP_ORDER.length-1, i+(back?-1:1)))];
  pk.updatedAt=new Date().toISOString();
  putPlans(); renderPlan();
}
// Draft the guardrailed prompt for a step and prefill a NEW Buildprint chat.
// Never auto-send — Vlad reviewing the prompt IS the plan-before-apply gate.
async function draftStepPrompt(pkId,stId){
  let r; try{ r=await api('/api/plans/step-prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packetId:pkId,stepId:stId})}); }
  catch(e){ return toast('Could not draft: '+e.message); }
  state.planRef={packetId:pkId,stepId:stId};
  newBpChat();
  const inp=$('input'); inp.value=r.prompt; inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,260)+'px'; inp.focus();
  toast('Review the prompt, then send — sending marks the step as prompted.');
}
// Once the bp chat actually starts (meta returns its id), link the step to it.
function markPlanPrompted(chatId){
  const ref=state.planRef; if(!ref) return; state.planRef=null;
  const pk=((plansCache&&plansCache.packets)||[]).find(p=>p.id===ref.packetId); const st=pk&&pk.steps.find(s=>s.id===ref.stepId); if(!st) return;
  if(st.status==='pending') st.status='prompted';
  st.chatId=chatId||st.chatId; st.promptedAt=new Date().toISOString(); pk.updatedAt=st.promptedAt;
  putPlans(); renderPlan();
}
// Generate a packet for a module (dashboard card) — takes 1-3 min, grounded in brain/.
async function genPacket(){
  const inp=$('npModule'); const module=((inp&&inp.value)||'').trim();
  if(!module) return toast('Type the module name first (exactly as locked)');
  document.querySelectorAll('.np-gen .pdraft').forEach(b=>{ b.disabled=true; b.textContent='Generating… (1–3 min)'; });
  try{
    const r=await api('/api/plans/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module})});
    toast('Packet ready — '+r.packet.steps.length+' steps for '+module);
    await loadPlan(); renderDashboard();
  }catch(e){
    toast('Generate failed: '+e.message);
    document.querySelectorAll('.np-gen .pdraft').forEach(b=>{ b.disabled=false; b.textContent='Generate packet'; });
  }
}

// ---------- live usage / limits ----------
function fmtAgo(ms){ const s=Math.max(0,Math.round((Date.now()-ms)/1000)); if(s<60)return s+'s ago'; const m=Math.round(s/60); if(m<60)return m+'m ago'; const h=Math.round(m/60); return h+'h ago'; }
function fmtReset(sec){ const ms=sec*1000-Date.now(); if(ms<=0) return 'resetting…'; const m=Math.round(ms/60000); if(m<60) return 'resets in '+m+'m'; const h=Math.floor(m/60), mm=m%60; if(h<24) return 'resets in '+h+'h '+mm+'m'; const d=Math.floor(h/24); return 'resets in '+d+'d '+(h%24)+'h'; }
function barColor(p){ return p>=90?'#EF4444':p>=70?'#F59E0B':'#22C55E'; }
function usageRow(label, w){
  const p=Math.min(100,Math.max(0,w.used_percentage||0));

    `<div class="bar"><span style="width:${p}%;background:${barColor(p)}"></span></div>`+
    `<div class="sub"><span class="reset">${w.resets_at?fmtReset(w.resets_at):''}</span></div></div>`;
}
// header usage chip + popover (usage moved out of the removed right rail)
function setUsageChip(html, cls){ const el=$('usageChipTxt'); if(el){ el.innerHTML=html; el.classList.remove('dim'); } const chip=$('usageChip'); if(chip){ chip.classList.remove('warn','crit'); if(cls) chip.classList.add(cls); } }
function toggleUsagePop(e, force){ if(e&&e.stopPropagation) e.stopPropagation(); const p=$('usagePop'); if(!p) return; const show = force===undefined ? !p.classList.contains('show') : !!force; p.classList.toggle('show', show); if(show){ loadUsage(); setTimeout(()=>document.addEventListener('click', closeUsageOnOut),0); } else document.removeEventListener('click', closeUsageOnOut); }
function closeUsageOnOut(ev){ const p=$('usagePop'), c=$('usageChip'); if(p && !p.contains(ev.target) && c && !c.contains(ev.target)){ p.classList.remove('show'); document.removeEventListener('click', closeUsageOnOut); } }
async function loadUsage(){
  const box=$('usage'); if(!box) return;
  if(state.populating){
    box.innerHTML=`<div class="ucard"><div class="off"><span class="spin"></span> Fetching your limits… <span class="dim">(~20s)</span></div>`+
      `<div class="note">Running a quick Claude Code session to read your session &amp; weekly limits.</div></div>`;
    return;
  }
  let u; try{ u=await api('/api/usage'); }catch{ return; }
  if(!u.enabled){
    setUsageChip('Usage off','');
    box.innerHTML=`<div class="ucard"><div class="off">${svg('i-gauge')} Live usage tracking is off</div>`+
      `<button class="enable" onclick="enableUsage()">${svg('i-gauge')} Enable live usage</button>`+
      `<div class="note">Adds a status line to your Claude Code that reports your 5-hour &amp; weekly limits. Enabling fetches your first reading automatically.</div></div>`;
    return;
  }
  const d=u.data;
  if(!d){
    box.innerHTML=`<div class="ucard"><div class="off">${svg('i-gauge')} No reading yet</div>`+
      `<div class="note">Use Claude Code interactively once (any session) and your usage appears here.</div>`+
      `<button class="enable" onclick="fetchFreshUsage()">${svg('i-refresh')} Fetch now</button>`+
      `<button class="disable" onclick="disableUsage()">Turn off tracking</button></div>`;
    return;
  }
  let rows='';
  // rate_limits (5h session + 7d weekly) show for subscribers once a reading was
  // captured after an API response; context window + cost render alongside/below.
  if(d.rate_limits){
    if(d.rate_limits.five_hour) rows+=usageRow('Session · 5h', d.rate_limits.five_hour);
    if(d.rate_limits.seven_day) rows+=usageRow('Weekly · 7d', d.rate_limits.seven_day);
  }
  const cw=d.context_window;
  if(cw){
    const pct = cw.used_percentage!=null ? Math.round(cw.used_percentage) : (cw.total_input_tokens&&cw.context_window_size ? Math.round(100*cw.total_input_tokens/cw.context_window_size) : 0);
    const winK = cw.context_window_size ? Math.round(cw.context_window_size/1000)+'K' : '';
    rows+=`<div class="urow"><div class="ulabel"><b>Context window</b><span class="pctv">${pct}%</span></div>`+
      `<div class="bar"><span style="width:${Math.min(100,pct)}%;background:${barColor(pct)}"></span></div>`+
      `<div class="sub"><span class="reset">${(cw.total_input_tokens||0).toLocaleString()} in · ${(cw.total_output_tokens||0).toLocaleString()} out · ${winK}</span></div></div>`;
  }
  if(d.cost && (d.cost.total_lines_added||d.cost.total_lines_removed||d.cost.total_cost_usd)){
    rows+=`<div class="sub" style="margin-top:8px">Session: ${d.cost.total_cost_usd?('$'+d.cost.total_cost_usd.toFixed(2)+' · '):''}+${d.cost.total_lines_added||0}/-${d.cost.total_lines_removed||0} lines</div>`;
  }
  if(!rows) rows='<div class="note">Waiting for your next Claude Code render…</div>';
  // For the 5h/7d bars the meaningful timestamp is when the limits were read, which
  // can trail the last render (limits carry forward until a fresh post-response read).
  // header chip summary: session 5h % · weekly 7d %
  const sessP = d.rate_limits&&d.rate_limits.five_hour ? Math.round(d.rate_limits.five_hour.used_percentage||0) : null;
  const wkP = d.rate_limits&&d.rate_limits.seven_day ? Math.round(d.rate_limits.seven_day.used_percentage||0) : null;
  const chipHtml = [sessP!=null?`<span class="uv">${sessP}%</span> 5h`:'', wkP!=null?`<span class="uv">${wkP}%</span> 7d`:''].filter(Boolean).join('<span class="usep"></span>');
  const maxP = Math.max(sessP||0, wkP||0);
  setUsageChip(chipHtml||'Usage', maxP>=90?'crit':maxP>=75?'warn':'');
  const stamp = d.rate_limits ? (d.rate_limits_at||d.at) : d.at;
  const stampLbl = d.rate_limits ? 'Limits read' : 'Updated';
  box.innerHTML=`<div class="ucard">${d.model?`<div class="sub" style="margin-bottom:8px;color:var(--secondary)">${esc(d.model)}</div>`:''}${rows}<div class="updated">${svg('i-refresh','sm')} ${stampLbl} ${fmtAgo(stamp)}</div>`+
    `<button class="enable" style="margin-top:10px" onclick="fetchFreshUsage()">${svg('i-refresh')} Fetch fresh reading</button>`+
    `<button class="disable" onclick="disableUsage()">Turn off tracking</button></div>`;
}
// Header ↻ — instant re-read of the cached reading.
async function refreshUsage(btn){
  const ic=btn&&btn.querySelector('.ic'); if(ic) ic.classList.add('spinning');
  await loadUsage();
  if(ic) setTimeout(()=>ic.classList.remove('spinning'),400);
}
// Drive a brief interactive Claude session to get a brand-new reading.
async function fetchFreshUsage(){
  if(state.populating) return;
  state.populating=true; loadUsage();
  try{
    const r=await api('/api/usage/populate',{method:'POST'});
    if(r.ok) toast('Usage updated');
    else toast('Could not fetch: '+(r.error||'unknown'));
  }catch(e){ toast('Fetch failed: '+e.message); }
  state.populating=false; loadUsage();
}
async function enableUsage(){
  try{ await api('/api/usage/enable',{method:'POST'}); }catch(e){ toast('Failed: '+e.message); return loadUsage(); }
  toast('Live usage enabled — fetching your first reading…');
  fetchFreshUsage();
}
async function disableUsage(){ try{ await api('/api/usage/disable',{method:'POST'}); toast('Usage tracking turned off'); }catch(e){} loadUsage(); }

// ---------- Buildprint connection status (sidebar) ----------
async function bpStatus(){
  const el=$('bpConn'); if(!el) return;
  try{ const s=await api('/api/bp/status');
    el.innerHTML = s.ready
      ? `<span class="bp-ok"></span> ${esc(s.app)} · ${esc(s.branch)} branch`
      : '<span class="bp-off"></span> not connected — link the CLI first';
  }catch{ el.textContent='offline'; }
}
// ---------- Sync from Buildprint → update the brain ledger ----------
async function bpTrack(){
  if(state.sending) return;
  bumpView();
  bubChanged=null;   // the ingest owns these changes now — clear the Bubble-data banner
  state.bp=true; state.chatId=null; setTab('buildprint'); showChat();
  const log=$('chatLog'); log.innerHTML='';
  $('centerTitle').textContent='🔨 Buildprint sync';
  log.appendChild(userMsgEl('Sync changes from Buildprint into the brain.'));
  const a=botMsgEl(); const body=a.querySelector('.body'); body.classList.add('md');
  body.innerHTML='<span class="dim">syncing from Bubble…</span>'; log.appendChild(a); log.scrollTop=log.scrollHeight;
  state.sending=true; $('sendBtn').disabled=true;
  let full='';
  try{
    const res=await fetch('/api/bp/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('modelSel')?.value,effort:$('effortSel')?.value})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){ const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='status'){ if(!full) body.innerHTML=`<span class="dim">${esc(ev.text)}…</span>`; }
        else if(ev.type==='delta'){ full+=ev.text; body.innerHTML=renderMd(full); log.scrollTop=log.scrollHeight; }
        else if(ev.type==='done'){ full=ev.reply||full; body.innerHTML=renderMd(full); if(ev.id) state.chatId=ev.id; }
        else if(ev.type==='error'){ body.classList.add('err'); body.textContent='⚠ '+ev.error; }
      }
    }
    if(full && !body.classList.contains('err')) body.innerHTML=renderMd(full);
    loadChats(); loadProgress(); loadFiles();
  }catch(e){ body.classList.add('err'); body.textContent='⚠ '+e.message; }
  finally{ state.sending=false; $('sendBtn').disabled=false; log.scrollTop=log.scrollHeight; }
}

// ---------- boot ----------
// Deep link: /#file=<path> opens that file (used by the Map's click-to-open).
function openFromHash(){
  if(location.hash.startsWith('#file=')){
    const p=decodeURIComponent(location.hash.slice(6));
    setTab('files'); openFile(p);
  } else if(location.hash.startsWith('#explore=')){
    openExpl(decodeURIComponent(location.hash.slice(9)));
  } else if(location.hash==='#bp-compose'){
    consumeBpCompose();
  }
}
// A prompt handed off from the Progress Tree: open a NEW Buildprint chat with it
// pre-filled in the composer, ready for the user to review + send.
function consumeBpCompose(){
  let p=''; try{ p=localStorage.getItem('crs_bp_compose')||''; }catch(e){}
  if(!p) return;
  try{ localStorage.removeItem('crs_bp_compose'); }catch(e){}
  if(history.replaceState) history.replaceState(null,'',location.pathname+location.search); // drop #bp-compose
  newBpChat();
  const inp=$('input'); if(inp){ inp.value=p; inp.dispatchEvent(new Event('input')); inp.focus(); inp.setSelectionRange(0,0); inp.scrollTop=0; }
}
// Cross-window handoff: the Tree (a separate window) posts this to its opener (this app).
addEventListener('message',e=>{ if(e.origin===location.origin && e.data && e.data.type==='bp-compose') consumeBpCompose(); });
addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('explWrap').classList.contains('show')) closeExpl(); });
addEventListener('hashchange',openFromHash);
// ===================== settings · theme · notifications =====================
let SETTINGS=null;
function themeParam(){ try{ return new URLSearchParams(location.search).get('theme'); }catch{ return null; } }
try{ document.documentElement.setAttribute('data-theme', themeParam()||localStorage.getItem('crs-theme')||'dark'); }catch{}
function applyTheme(t){ const th=(t==='light')?'light':'dark'; document.documentElement.setAttribute('data-theme',th); try{ localStorage.setItem('crs-theme',th); }catch{} }
async function loadSettingsCache(){ try{ SETTINGS=await api('/api/settings'); }catch{ SETTINGS={theme:'dark',notify:{inApp:true,sound:true,soundName:'ping',email:false,emailTo:''}}; } applyTheme(themeParam()||SETTINGS.theme); return SETTINGS; }
async function saveSettingsPatch(patch){ try{ SETTINGS=await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)}); }catch(e){ toast('Save failed: '+e.message); } return SETTINGS; }

// ---- notification sound (Web Audio — no asset files) ----
let _ac=null;
function playSound(name){ if(!name||name==='none')return; try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const ac=_ac; if(ac.state==='suspended')ac.resume();
  const seq = name==='chime'?[[660,0],[880,.09],[1175,.18]] : name==='pop'?[[520,0]] : name==='alert'?[[520,0],[392,.14]] : name==='blip'?[[1320,0]] : [[880,0],[1175,.08]];
  seq.forEach(([f,t])=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=f; const st=ac.currentTime+t; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.18,st+.012); g.gain.exponentialRampToValueAtTime(0.0001,st+.17); o.start(st); o.stop(st+.2); }); }catch{} }

// ---- central notify: toast + sound + persistent store + bell badge ----
async function notify(o){ o=o||{}; const level=o.level||'info';
  if(o.toast!==false) toast((o.title||'')+(o.title&&o.body?' — ':'')+(o.body||''));
  const np=(SETTINGS&&SETTINGS.notify)||{inApp:true,sound:true,soundName:'ping'};
  if(np.inApp!==false){
    if(np.sound!==false && o.sound!==false) playSound(np.soundName||'ping');
    try{ await api('/api/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:o.type||'general',title:o.title||'',body:o.body||'',level})}); }catch{}
    loadNotifications();
  }
}
let NOTIFS={items:[],unread:0,readAt:0};
async function loadNotifications(){ try{ NOTIFS=await api('/api/notifications'); }catch{ return; } renderNotifBadge(); const bx=$('ninbox'); if(bx&&bx.classList.contains('show')) renderInbox(); }
function renderNotifBadge(){ const b=$('notifBadge'); if(!b)return; if(NOTIFS.unread>0){ b.textContent=NOTIFS.unread>99?'99+':NOTIFS.unread; b.classList.add('show'); } else b.classList.remove('show'); }
const NCOLOR={info:'var(--accent2)',success:'var(--good)',warning:'var(--warn)',error:'var(--danger)'};
function renderInbox(){ const box=$('ninbox'); const readAt=NOTIFS.readAt||0;
  const list=(NOTIFS.items||[]).map(n=>{ const unread=new Date(n.ts).getTime()>readAt; return `<div class="nitem${unread?' unread':''}"><span class="ndot" style="background:${NCOLOR[n.level]||'var(--muted)'}"></span><div class="ntxt"><div class="nt">${esc(n.title||n.type)}</div>${n.body?`<div class="nb">${esc(n.body)}</div>`:''}<div class="nm">${fmtAgo(new Date(n.ts).getTime())}</div></div></div>`; }).join('')||'<div class="ninbox-empty">You’re all caught up — no notifications yet.</div>';
  box.innerHTML=`<div class="ninbox-head">Notifications<span style="flex:1"></span><button class="act" onclick="markNotifRead()">Mark read</button><button class="act" onclick="clearNotifs()">Clear</button></div><div class="ninbox-list">${list}</div>`;
}
function toggleNotif(e){ if(e)e.stopPropagation(); const box=$('ninbox'); const show=!box.classList.contains('show'); box.classList.toggle('show',show); if(show){ renderInbox(); setTimeout(()=>document.addEventListener('click',closeNotifOut),0); markNotifRead(); } else document.removeEventListener('click',closeNotifOut); }
function closeNotifOut(ev){ const box=$('ninbox'),b=$('notifBell'); if(box&&!box.contains(ev.target)&&b&&!b.contains(ev.target)){ box.classList.remove('show'); document.removeEventListener('click',closeNotifOut); } }
async function markNotifRead(){ try{ await api('/api/notifications/read',{method:'POST'}); }catch{} NOTIFS.readAt=Date.now(); NOTIFS.unread=0; renderNotifBadge(); }
async function clearNotifs(){ try{ await api('/api/notifications/clear',{method:'POST'}); }catch{} await loadNotifications(); renderInbox(); }

// ---- connection watchers → notifications ----
function initConnWatch(){
  window.addEventListener('online', ()=>notify({type:'connection',level:'success',title:'Back online',body:'Internet connection restored.'}));
  window.addEventListener('offline', ()=>notify({type:'connection',level:'error',title:'No internet connection',body:'You are offline — the brain can’t reach Claude until you reconnect.'}));
}

// ===================== settings modal =====================
const SOUND_OPTS=[['ping','Ping'],['chime','Chime'],['pop','Pop'],['alert','Alert'],['blip','Blip'],['none','Silent']];
let settingsTab='appearance';
function openSettings(t){ if(t)settingsTab=t; $('settingsWrap').classList.add('show'); renderSettings(); }
function closeSettings(){ $('settingsWrap').classList.remove('show'); }
function setSettingsTab(t){ settingsTab=t; renderSettings(); }
function setTheme(t){ applyTheme(t); if(SETTINGS)SETTINGS.theme=t; saveSettingsPatch({theme:t}); renderSettings(); }
function setNotifPref(k,v){ SETTINGS.notify=Object.assign({},SETTINGS.notify,{[k]:v}); saveSettingsPatch({notify:{[k]:v}}); if(k==='soundName')playSound(v); renderSettings(); }
function saveEmail(){ const v=($('setEmail')||{}).value||''; setNotifPref('emailTo',v.trim()); toast('Email saved'); }
async function renderSettings(){
  const s=SETTINGS||await loadSettingsCache(); const n=s.notify||{};
  const nav=[['appearance','i-sun','Appearance'],['notifications','i-bell','Notifications'],['connections','i-plug','Connections'],['about','i-cog','About']];
  const sw=(on,onclick)=>`<label class="switch"><input type="checkbox" ${on?'checked':''} onchange="${onclick}"><span class="sl"></span></label>`;
  let pane='';
  if(settingsTab==='appearance'){
    pane=`<div class="msec-title">Theme</div>
      <div class="mrow"><div class="mlbl"><b>Appearance</b><span>Switch between dark and light. Applies instantly across the app.</span></div>
      <div class="mctl"><div class="seg"><button class="${s.theme!=='light'?'on':''}" onclick="setTheme('dark')">${svg('i-moon')} Dark</button><button class="${s.theme==='light'?'on':''}" onclick="setTheme('light')">${svg('i-sun')} Light</button></div></div></div>`;
  } else if(settingsTab==='notifications'){
    pane=`<div class="msec-title">In-app</div>
      <div class="mrow"><div class="mlbl"><b>In-app notifications</b><span>Show toasts and collect events in the bell inbox.</span></div><div class="mctl">${sw(n.inApp!==false,"setNotifPref('inApp',this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Sound</b><span>Play a sound when a notification arrives.</span></div><div class="mctl">${sw(n.sound!==false,"setNotifPref('sound',this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Notification sound</b><span>Pick the alert tone. Selecting one plays a preview.</span></div>
        <div class="mctl"><select class="sel" onchange="setNotifPref('soundName',this.value)">${SOUND_OPTS.map(([v,l])=>`<option value="${v}"${(n.soundName||'ping')===v?' selected':''}>${l}</option>`).join('')}</select>
        <button class="mbtn2" onclick="playSound((SETTINGS.notify&&SETTINGS.notify.soundName)||'ping')">${svg('i-volume','sm')} Test</button></div></div>
      <div class="msec-title" style="margin-top:16px">Email</div>
      <div class="mrow"><div class="mlbl"><b>Email notifications</b><span>Also send notifications to your email (best-effort — needs a local mail relay / sendmail).</span></div><div class="mctl">${sw(!!n.email,"setNotifPref('email',this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Email address</b><span>Where to send them.</span></div><div class="mctl"><input class="tinput" id="setEmail" placeholder="you@example.com" value="${esc(n.emailTo||'')}"><button class="mbtn2 primary" onclick="saveEmail()">Save</button></div></div>`;
  } else if(settingsTab==='connections'){
    pane=`<div class="msec-title">Claude (subscription)</div>
      <div class="mrow"><div class="mlbl"><b>Claude Code</b><span id="connClaudeSub">Checking…</span></div><div class="mctl"><span class="mstat" id="connClaude">…</span><button class="mbtn2" id="connClaudeBtn" onclick="connClaudeAction()">…</button></div></div>
      <div class="msec-title" style="margin-top:16px">Buildprint CLI</div>
      <div class="mrow"><div class="mlbl"><b>Buildprint link</b><span id="connBpSub">Paste your Buildprint token to link this machine. Runs <code>buildprint link</code> — the token is stored by Buildprint, not in the brain.</span></div><div class="mctl"><span class="mstat" id="connBp">…</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Token</b><span>From your Buildprint account.</span></div><div class="mctl"><input class="tinput" id="bpToken" type="password" placeholder="buildprint token…" autocomplete="off"><button class="mbtn2 primary" onclick="linkBuildprint()">Link</button></div></div>`;
  } else {
    pane=`<div class="msec-title">About</div>
      <div class="mrow"><div class="mlbl"><b>CRS Brain</b><span>Local build console for the CRS Bubble project — one place to chat, operate Buildprint, browse the brain, and track progress. Runs on your Claude Max subscription.</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Theme &amp; tokens</b><span>Styled on the CRS design system (design/tokens.css). Dark + Light.</span></div></div>`;
  }
  $('settingsBox').innerHTML=`<div class="modal-head"><h2>${svg('i-cog')} Settings</h2><button class="mx" onclick="closeSettings()">✕</button></div>
    <div class="modal-body"><div class="modal-nav">${nav.map(([k,ic,l])=>`<button class="${k===settingsTab?'on':''}" onclick="setSettingsTab('${k}')">${svg(ic)} ${l}</button>`).join('')}</div>
    <div class="modal-pane">${pane}</div></div>`;
  if(settingsTab==='connections') refreshConnStatus();
}
async function refreshConnStatus(){
  try{ const a=await api('/api/auth/status'); const el=$('connClaude'),sub=$('connClaudeSub'),btn=$('connClaudeBtn'); if(el){ if(a.loggedIn){ el.textContent='Connected'; el.className='mstat ok'; if(sub)sub.textContent=`${a.email||'signed in'} · ${a.subscriptionType||a.authMethod||''}`; if(btn)btn.textContent='Sign out'; } else { el.textContent='Not connected'; el.className='mstat off'; if(sub)sub.textContent='Sign in to Claude to use the brain.'; if(btn)btn.textContent='Sign in'; } } }catch{}
  try{ const b=await api('/api/bp/status'); const el=$('connBp'); if(el){ const linked=b&&(b.linked||b.ok||b.workspace); el.textContent=linked?'Linked':'Not linked'; el.className='mstat '+(linked?'ok':'off'); } }catch{ const el=$('connBp'); if(el){ el.textContent='Unknown'; el.className='mstat warn'; } }
}
function connClaudeAction(){ const btn=$('connClaudeBtn'); if(btn&&/out/i.test(btn.textContent)){ api('/api/auth/logout',{method:'POST'}).then(()=>{ notify({type:'connection',level:'warning',title:'Signed out of Claude'}); refreshConnStatus(); }); } else { api('/api/auth/login',{method:'POST'}); toast('Opening Claude sign-in…'); } }
async function linkBuildprint(){ const inp=$('bpToken'); const tok=(inp&&inp.value||'').trim(); if(!tok)return toast('Paste your Buildprint token first'); toast('Linking Buildprint…');
  try{ const r=await api('/api/connections/buildprint-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})}); if(r&&r.ok){ notify({type:'connection',level:'success',title:'Buildprint linked'}); if(inp)inp.value=''; refreshConnStatus(); } else notify({type:'connection',level:'error',title:'Buildprint link failed',body:(r&&r.error)||''}); }
  catch(e){ notify({type:'connection',level:'error',title:'Buildprint link failed',body:e.message}); } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSettings(); const bx=$('ninbox'); if(bx)bx.classList.remove('show'); } });

(async function(){ await loadSettingsCache(); loadNotifications(); initConnWatch(); loadAuth(); loadModelSettings(); loadUsage(); bpStatus(); loadRecentOpened(); loadRecentEdited(); await loadChats(); await loadFiles(); await loadProgress(); await loadPlan(); if(location.hash==='#bp-compose') consumeBpCompose(); else if(location.hash.startsWith('#file=')||location.hash.startsWith('#explore=')) openFromHash(); else if(location.hash.startsWith('#view=')){ const _v=location.hash.slice(6); _v==='kanban'?showKanban('board'):_v==='list'?showKanban('list'):_v==='map'?showMap():_v==='bubble'?showBubble():showDashboard(); } else showDashboard(); })();
setInterval(loadUsage, 30000);
