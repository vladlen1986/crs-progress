// ---------- build plan: packets → Buildprint prompts ----------
// A packet = one module's ordered, one-session-sized build steps. Each step can be
// expanded into a guardrail-hardened Buildprint prompt that prefills a bp chat.
let plansCache=null;
const STEP_ORDER=['pending','prompted','applied','verified','ingested'];
async function loadPlan(){
  // plansCache still feeds the dashboard "Next build step" card even though the
  // old right-rail #planPanel is gone — so always fetch; renderPlan() self-guards.
  try{ plansCache=await api('/api/plans'); }catch{ const b=$('planPanel'); if(b) b.innerHTML='<div class="pempty">Could not load the build plan.</div>'; return; }
  renderPlan();
}
function activePacket(){
  if(!plansCache||!plansCache.packets||!plansCache.packets.length) return null;
  return plansCache.packets.find(p=>p.id===plansCache.activePacket) || plansCache.packets[plansCache.packets.length-1];
}
function renderPlan(){
  const box=$('planPanel'); if(!box) return;
  const pk=activePacket();
  if(!pk){ box.innerHTML='<div class="pempty">No build packets yet. On the dashboard, type a module name and hit <b>Generate packet</b> — the brain drafts one-session build steps grounded in brain/.</div>'; return; }
  const done=pk.steps.filter(s=>s.status==='verified'||s.status==='ingested').length;
  const firstPending=pk.steps.find(s=>s.status==='pending');
  let html='';
  if(plansCache.packets.length>1){
    html+=`<select class="pksel" onchange="switchPacket(this.value)">${plansCache.packets.map(p=>`<option value="${p.id}"${p.id===pk.id?' selected':''}>${esc(p.module)} — ${esc(p.title||'').slice(0,40)}</option>`).join('')}</select>`;
  }
  html+=`<div class="pkt-head">${esc(pk.module)}<span class="cnt">${done}/${pk.steps.length} done</span></div>`;
  html+=pk.steps.map(s=>{
    const cls=(s.status==='verified'||s.status==='ingested')?'done':(s===firstPending?'active':'');
    return `<div class="pstep ${cls}" onclick="this.classList.toggle('open')">
      <span class="pdot"></span>
      <span class="pt">${esc(s.title)}
        <div class="pdetail">${esc(s.detail||'')}${s.entities?`<br><b>Entities:</b> ${esc(s.entities)}`:''}${s.verify?`<br><b>Verify:</b> ${esc(s.verify)}`:''}${s.chatId?`<br><a href="#" onclick="event.stopPropagation();openChat('${s.chatId}');return false">→ open its Buildprint chat</a>`:''}</div>
        ${s===firstPending?`<br><button class="pdraft" onclick="event.stopPropagation();draftStepPrompt('${pk.id}','${s.id}')">${svg('i-send','sm')} Draft Buildprint prompt</button>`:''}
      </span>
      <span class="pst" title="Click to advance status · shift-click to revert" onclick="event.stopPropagation();cycleStep('${pk.id}','${s.id}',event.shiftKey)">${s.status}</span>
    </div>`;
  }).join('');
  box.innerHTML=html;
}
function switchPacket(id){ if(!plansCache) return; plansCache.activePacket=id; putPlans(); renderPlan(); }
async function putPlans(){ try{ await api('/api/plans',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(plansCache)}); }catch(e){ toast('Plan save failed: '+e.message); } }
function cycleStep(pkId,stId,back){
  const pk=plansCache.packets.find(p=>p.id===pkId); const st=pk&&pk.steps.find(s=>s.id===stId); if(!st) return;
  const i=STEP_ORDER.indexOf(st.status);
  st.status=STEP_ORDER[Math.max(0,Math.min(STEP_ORDER.length-1, i+(back?-1:1)))];
  pk.updatedAt=new Date().toISOString();
  putPlans(); renderPlan();
}
// Draft the guardrailed prompt for a step and prefill a NEW Buildprint chat.
// Never auto-send — Vlad reviewing the prompt IS the plan-before-apply gate.
async function draftStepPrompt(pkId,stId){

// Once the bp chat actually starts (meta returns its id), link the step to it.
function markPlanPrompted(chatId){
  const ref=state.planRef; if(!ref) return; state.planRef=null;
  const pk=((plansCache&&plansCache.packets)||[]).find(p=>p.id===ref.packetId); const st=pk&&pk.steps.find(s=>s.id===ref.stepId); if(!st) return;
  if(st.status==='pending') st.status='prompted';
  st.chatId=chatId||st.chatId; st.promptedAt=new Date().toISOString(); pk.updatedAt=st.promptedAt;
  putPlans(); renderPlan();
}

function fmtAgo(ms){ const s=Math.max(0,Math.round((Date.now()-ms)/1000)); if(s<60)return s+'s ago'; const m=Math.round(s/60); if(m<60)return m+'m ago'; const h=Math.round(m/60); if(h<48)return h+'h ago'; return Math.round(h/24)+'d ago'; }
function fmtReset(sec){ const ms=sec*1000-Date.now(); if(ms<=0) return 'resetting…'; const m=Math.round(ms/60000); if(m<60) return 'resets in '+m+'m'; const h=Math.floor(m/60), mm=m%60; if(h<24) return 'resets in '+h+'h '+mm+'m'; const d=Math.floor(h/24); return 'resets in '+d+'d '+(h%24)+'h'; }
function barColor(p){ return p>=90?'var(--danger)':p>=70?'var(--warn)':'var(--good)'; }

function toggleUsagePop(e, force){ if(e&&e.stopPropagation) e.stopPropagation(); const p=$('usagePop'); if(!p) return; const show = force===undefined ? !p.classList.contains('show') : !!force; p.classList.toggle('show', show); if(show){ renderAcctInfo(); loadAuth(); loadUsage(); setTimeout(()=>document.addEventListener('click', closeUsageOnOut),0); } else document.removeEventListener('click', closeUsageOnOut); }
function closeUsageOnOut(ev){ const p=$('usagePop'), c=$('usageChip'); if(p && !p.contains(ev.target) && c && !c.contains(ev.target)){ p.classList.remove('show'); document.removeEventListener('click', closeUsageOnOut); } }
async function loadUsage(){
  const box=$('usage'); if(!box) return;
  if(state.populating){
    box.innerHTML=`<div class="ucard"><div class="off"><span class="spin"></span> Fetching your limits… <span class="dim">(~20s)</span></div>`+
      `<div class="note">Running a quick Claude Code session to read your session &amp; weekly limits.</div></div>`;
    return;
  }
  let u; try{ u=await api('/api/usage'); }catch{ return; }
  if(!u.enabled){
    setUsageChip('—','');
    box.innerHTML=`<div class="ucard"><div class="off">${svg('i-gauge')} Live usage tracking is off</div>`+
      `<button class="enable" onclick="enableUsage()">${svg('i-gauge')} Enable live usage</button>`+
      `<div class="note">Adds a status line to your Claude Code that reports your 5-hour &amp; weekly limits. Enabling fetches your first reading automatically.</div></div>`;
    return;
  }
  const d=u.data;
  if(!d){
    box.innerHTML=`<div class="ucard"><div class="off">${svg('i-gauge')} No reading yet</div>`+
      `<div class="note">Use Claude Code interactively once (any session) and your usage appears here.</div>`+
      `<button class="enable" onclick="fetchFreshUsage()">${svg('i-refresh')} Fetch now</button>`+

  }
  let rows='';

    const winK = cw.context_window_size ? Math.round(cw.context_window_size/1000)+'K' : '';
    rows+=`<div class="urow"><div class="ulabel"><b>Context window</b><span class="pctv">${pct}%</span></div>`+
      `<div class="bar"><span style="width:${Math.min(100,pct)}%;background:${barColor(pct)}"></span></div>`+
      `<div class="sub"><span class="reset">${(cw.total_input_tokens||0).toLocaleString()} in · ${(cw.total_output_tokens||0).toLocaleString()} out · ${winK}</span></div></div>`;
  }
  if(d.cost && (d.cost.total_lines_added||d.cost.total_lines_removed||d.cost.total_cost_usd)){

  }

  // For the 5h/7d bars the meaningful timestamp is when the limits were read, which
  // can trail the last render (limits carry forward until a fresh post-response read).
  // header account chip: just the 5-hour session % (the active window); the popover

  const sessP = d.rate_limits&&d.rate_limits.five_hour ? Math.round(d.rate_limits.five_hour.used_percentage||0) : null;
  const wkP = d.rate_limits&&d.rate_limits.seven_day ? Math.round(d.rate_limits.seven_day.used_percentage||0) : null;
  const maxP = Math.max(sessP||0, wkP||0);
  setUsageChip(sessP!=null ? sessP+'%' : (wkP!=null ? wkP+'%' : '—'));

    `<button class="enable" style="margin-top:10px" onclick="fetchFreshUsage()">${svg('i-refresh')} Fetch fresh reading</button>`+
    `<button class="disable" onclick="disableUsage()">Turn off tracking</button></div>`;
}

// ---------- Sync from Buildprint → update the brain ledger ----------
async function bpTrack(){
  if(state.sending) return;
  bumpView();
  bubChanged=null;   // the ingest owns these changes now — clear the Bubble-data banner
  state.chatId=null; setTab('chats'); showChat();
  const log=$('chatLog'); log.innerHTML='';
  $('centerTitle').textContent='🔨 Buildprint sync';
  const turn=newTurn(log); turn.appendChild(userMsgEl('Sync changes from Buildprint into the brain.'));
  const a=botMsgEl(); const body=a.querySelector('.body'); body.classList.add('md');
  body.innerHTML='<span class="dim">syncing from Bubble…</span>'; turn.appendChild(a); log.scrollTop=log.scrollHeight;
  state.sending=true; $('sendBtn').disabled=true;
  let full='';
  try{
    const res=await fetch('/api/bp/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('modelSel')?.value,effort:$('effortSel')?.value})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){ const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='status'){ if(!full) body.innerHTML=`<span class="dim">${esc(ev.text)}…</span>`; }
        else if(ev.type==='delta'){ full+=ev.text; body.innerHTML=renderMd(full); log.scrollTop=log.scrollHeight; }

// ---------- boot ----------
// Cache-bust safety net (paired with no-store on the shell in server.js). If the
// server's front-end code advances while this tab is open — or a stale shell got
// bfcache-restored — surface a one-click "App updated" reload banner. It NEVER
// auto-reloads: a silent reload could abort an in-flight generation/upload or drop
// unsaved composer text, so the user always decides when. Loop-safe: a fresh load
// stamps window.__APP_VERSION__ === the server version, so this only acts on a real
// divergence; `shownFor` stops it re-nagging for the same version once dismissed.
(function versionGuard(){
  const mine=window.__APP_VERSION__;
  if(!mine) return;   // shell served without a stamp — nothing to compare against
  let banner=null, shownFor=null;
  function reload(){
    // respect the app's unsaved-edits convention (mirrors dwClose) before discarding
    const dirty=(typeof DW!=='undefined'&&DW.wins&&[...DW.wins.values()].some(w=>w.dirty));
    if(dirty&&typeof crsConfirm==='function'){ crsConfirm({title:'Reload now?',body:'An open window has unsaved changes. Reload and lose them?'}).then(ok=>{ if(ok) location.reload(); }); return; }
    location.reload();
  }
  function showBanner(v){
    shownFor=v;
    if(banner&&document.body.contains(banner)) return;
    banner=document.createElement('div'); banner.className='ver-banner';
    banner.append('App updated. ');
    const b=document.createElement('button'); b.type='button'; b.textContent='Reload'; b.onclick=reload;
    const x=document.createElement('button'); x.type='button'; x.className='ver-x'; x.title='Dismiss'; x.textContent='✕'; x.onclick=()=>{ if(banner) banner.remove(); };
    banner.appendChild(b); banner.appendChild(x); document.body.appendChild(banner);
  }
  async function check(){
    try{
      const r=await fetch('/api/version',{cache:'no-store'}); if(!r.ok) return;
      const j=await r.json(); const v=j&&j.version; if(!v||v===mine) return;   // in sync → nothing (loop-safe)
      if(shownFor===v) return;                                                  // already offered this version → don't re-nag
      showBanner(v);
    }catch(e){}
  }
  setInterval(check, 15000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  addEventListener('pageshow',(e)=>{ if(e.persisted) check(); });   // bfcache restore → re-check (no-store isn't enough on Chrome 123+)
})();

// ---- connection watchers: internet + brain server → header dot, toasts, sounds ----
// Two layers: the app is localhost (survives net loss) but Claude/agent work
// needs internet; a crashed server is a distinct failure while the tab lives on.
const CONN={net:true,srv:true,netFails:0,srvFails:0};
function connState(){ return !CONN.srv?['err','Brain server unreachable']:!CONN.net?['warn','No internet — local app still works']:['ok','Online']; }
function connDot(){ const st=connState(); const d=$('usageDot'); if(d) d.className='acct-dot'+(st[0]==='ok'?'':' '+st[0]); const chip=$('usageChip'); if(chip) chip.title='Account · usage · '+st[1]; const p=$('usagePop'); if(p&&p.classList.contains('show')) renderAcctInfo(); }
async function _probe(url,opts){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000); try{ await fetch(url,Object.assign({cache:'no-store',signal:c.signal},opts)); return true; }catch{ return false; }finally{ clearTimeout(t); } }
function setNet(up){ if(up===CONN.net){ connDot(); return; } CONN.net=up; connDot();
  if(up) notifyT('connection-restored',{title:'Connection restored',message:'Internet is back.'});
  else notifyT('connection-lost',{title:'Internet connection lost',message:'The brain still runs locally, but Claude/agent work will fail until you reconnect.'});
}
function setSrv(up){ if(up===CONN.srv){ connDot(); return; } CONN.srv=up; connDot();
  if(up) notifyT('connection-restored',{title:'Brain server back',message:'Reconnected to the local server.'});
  else notifyT('server-unreachable',{title:'Brain server unreachable',message:'The local server stopped responding.',bell:false});   // server down — nowhere to persist the bell record
}
async function connHeartbeat(){
  // 2 consecutive fails = down, 1 success = up (debounces flapping links).
  const netOk=await _probe('https://www.gstatic.com/generate_204',{mode:'no-cors'});
  CONN.netFails=netOk?0:CONN.netFails+1; if(netOk)setNet(true); else if(CONN.netFails>=2)setNet(false);
  const srvOk=await _probe('/api/ping');
  CONN.srvFails=srvOk?0:CONN.srvFails+1; if(srvOk)setSrv(true); else if(CONN.srvFails>=2)setSrv(false);
}
function initConnWatch(){
  window.addEventListener('online', ()=>{ CONN.netFails=0; setNet(true); });
  window.addEventListener('offline', ()=>setNet(false));
  connDot(); setTimeout(connHeartbeat,3000); setInterval(connHeartbeat,30000);
}

        <div class="mctl"><button class="mbtn2" onclick="bubbleCheckNow('forum-check','Forum',this)">Check forum</button><button class="mbtn2" onclick="bubbleCheckNow('relnotes-check','Release notes',this)">Check releases</button></div></div>
      <div class="mrow"><div class="mlbl"><b>Bubble issue check (read-only)</b><span>Runs buildprint sync + check on the test branch and writes a dated report with PROPOSED fixes to brain/bubble/issue-reports/ — never applies anything. Also runs daily.</span><span class="sync-stamp" id="syncStamp-issues">…</span></div>
        <div class="mctl"><button class="mbtn2" onclick="bubbleCheckNow('issue-check','Issue check',this)">Check issues</button></div></div>
      <div class="msec-title" style="margin-top:16px">Voice</div>
      <div class="mrow"><div class="mlbl"><b>Google AI key (free, aistudio.google.com)</b><span>Only used to transcribe dictation from a non-default microphone (Gemini). Kept in a gitignored local file and always shown masked${s.googleAiKeySet?' — currently '+esc(s.googleAiKey||''):''}.</span></div>
        <div class="mctl"><input class="tinput" id="setGoogleKey" type="password" autocomplete="off" placeholder="${s.googleAiKeySet?'saved — paste to replace, save blank to clear':'AIza…'}"><button class="mbtn2 primary" onclick="saveGoogleKeyUI()">Save</button></div></div>`;
  } else if(settingsTab==='appearance'){
    pane=`<div class="msec-title">Theme</div>
      <div class="mrow"><div class="mlbl"><b>Appearance</b><span>Switch between dark and light. Applies instantly across the app.</span></div>
      <div class="mctl"><div class="seg"><button class="${s.theme!=='light'?'on':''}" onclick="setTheme('dark')">${svg('i-moon')} Dark</button><button class="${s.theme==='light'?'on':''}" onclick="setTheme('light')">${svg('i-sun')} Light</button></div></div></div>`;
  } else if(settingsTab==='notifications'){
    // v2 (Phase 10): global DND + banner duration + per-TYPE channel matrix.
    // Types/defaults come from notify-registry.js; overrides live in
    // settings.notifyPrefs. §4 overline category headers, §20.2 switches.
    const np=s.notifyPrefs||{dnd:false,bannerSec:4,types:{}};
    const scats=['notif','done','warn','err','info'];
    const opts=id=>`<option value="none"${id==='none'?' selected':''}>None</option>`+scats.map(c=>`<optgroup label="${SOUNDS_SYNTH.catLabel[c]}">${SOUNDS_SYNTH.list.filter(x=>x.cat===c).map(x=>`<option value="${x.id}"${id===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
    const swCh=(id,lbl,ch,on)=>`<div class="chctl"><span>${lbl}</span><label class="switch sm"><input type="checkbox" ${on?'checked':''} onchange="setTypeChannel('${id}','${ch}',this.checked)"><span class="sl"></span></label></div>`;
    const typeRows=cat=>NOTIFY_ORDER.filter(id=>NOTIFY_TYPES[id].category===cat).map(id=>{
      const t=NOTIFY_TYPES[id], p=notifPref(id);
      return `<div class="mrow ntype"><div class="mlbl"><b>${esc(t.name)}</b><span>${esc(t.description)}</span></div>
        <div class="mctl">${swCh(id,'Banner','banner',p.banner)}${swCh(id,'Sound','sound',p.sound)}${swCh(id,'Bell','bell',p.bell)}
          <select class="sel" onchange="setTypeSound('${id}',this.value)">${opts(p.soundId)}</select>
          <button class="mbtn2 tbtn28" onclick="testNotifType('${id}')">Test</button>
          <button class="mbtn2 tbtn28" title="Reset this type to its defaults" onclick="resetTypePrefs('${id}')">↺</button></div></div>`;
    }).join('');
    pane=`<div class="msec-title">Global</div>
      <div class="mrow"><div class="mlbl"><b>Do Not Disturb</b><span>Silences banners and sounds everywhere. The bell keeps collecting, so nothing is lost.</span></div><div class="mctl">${sw(!!np.dnd,"setDnd(this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Banner duration</b><span>How long toast banners stay on screen.</span></div>
        <div class="mctl"><input type="range" min="2" max="10" step="1" value="${np.bannerSec||4}" style="width:160px" oninput="setBannerSec(this.value,false)" onchange="setBannerSec(this.value,true)"><span class="dim" id="bannerSecLbl" style="min-width:28px;text-align:right">${np.bannerSec||4}s</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Question re-notify</b><span>An unanswered session question knocks again once after this many minutes.</span></div>
        <div class="mctl"><input class="tinput" type="number" min="1" max="120" style="width:70px" value="${(np.askRenotifyMin||10)}" onchange="setAskRenotify(this.value)"><span class="dim">min</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Volume &amp; sound library</b><span>Master volume, the 26-sound library, and regeneration live in the Sounds tab.</span></div><div class="mctl"><button class="mbtn2" onclick="setSettingsTab('sounds')">${svg('i-volume','sm')} Open Sounds</button></div></div>
      <div class="mrow"><div class="mlbl"><b>Test</b><span>Fire a real notification through your current preferences.</span></div><div class="mctl"><button class="mbtn2" onclick="sendTestNotif()">Send test notification</button></div></div>
      ${NOTIFY_CATEGORIES.map(c=>`<div class="msec-title" style="margin-top:16px">${esc(c.name)}</div>${typeRows(c.id)}`).join('')}
      <div class="mrow"><div class="mlbl"><b>Reset all</b><span>Return every notification type to its default channels and sound.</span></div><div class="mctl"><button class="mbtn2" onclick="resetAllTypePrefs()">Reset all</button></div></div>
      <div class="msec-title" style="margin-top:16px">Email</div>
      <div class="mrow"><div class="mlbl"><b>Email notifications</b><span>Also send notifications to your email (best-effort — needs a local mail relay / sendmail).</span></div><div class="mctl">${sw(!!n.email,"setNotifPref('email',this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Email address</b><span>Where to send them.</span></div><div class="mctl"><input class="tinput" id="setEmail" placeholder="you@example.com" value="${esc(n.emailTo||'')}"><button class="mbtn2 primary" onclick="saveEmail()">Save</button></div></div>`;
  } else if(settingsTab==='sounds'){
    const snd=s.sounds||{volume:80,events:Object.assign({},SOUNDS.defaults)};
    const cats=['notif','done','warn','err','info'];
    pane=`<div class="msec-title">Volume</div>
      <div class="mrow"><div class="mlbl"><b>Master volume</b><span>Applies to every sound. Release the slider to save + preview.</span></div>
        <div class="mctl"><input type="range" min="0" max="100" value="${snd.volume!=null?snd.volume:80}" style="width:160px" oninput="setSoundVolume(this.value,false)" onchange="setSoundVolume(this.value,true)"><span class="dim" style="min-width:32px;text-align:right">${snd.volume!=null?snd.volume:80}</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Learning sounds (apply/learn chimes)</b><span>Magical chimes when the brain applies knowledge (⚡ Spark shimmer) or saves a lesson (🧠 Mind bloom). DND mutes them too.</span></div>
        <div class="mctl">${sw(snd.learnSounds!==false,"setLearnSounds(this.checked)")}</div></div>
      <div class="mrow"><div class="mlbl"><b>Per-type sounds</b><span>Sound assignment moved — each notification type picks its sound in the Notifications tab.</span></div>
        <div class="mctl"><button class="mbtn2" onclick="setSettingsTab('notifications')">${svg('i-bell','sm')} Open Notifications</button></div></div>
      <div class="msec-title" style="margin-top:16px">Sound files</div>
      <div class="mrow"><div class="mlbl"><b>Regenerate sound files</b><span>Re-renders all 26 WAVs into data/sounds/ (they auto-regenerate on load if missing).</span></div><div class="mctl"><button class="mbtn2" onclick="regenSounds()">Regenerate</button></div></div>
      <div class="msec-title" style="margin-top:16px">Library — all 26</div>
      ${cats.map(c=>`<div class="msec-title" style="margin-top:10px;font-size:11px;opacity:.7">${SOUNDS_SYNTH.catLabel[c]}</div>`+SOUNDS_SYNTH.list.filter(x=>x.cat===c).map(x=>`<div class="mrow"><div class="mlbl"><b>${esc(x.name)}</b><span>${esc(x.desc)}</span></div><div class="mctl"><button class="mbtn2" onclick="SOUNDS.playSound('${x.id}')">${svg('i-volume','sm')} Play</button></div></div>`).join('')).join('')}`;
  } else if(settingsTab==='connections'){
    pane=`<div class="msec-title">Claude (subscription)</div>
      <div class="mrow"><div class="mlbl"><b>Claude Code</b><span id="connClaudeSub">Checking…</span></div><div class="mctl"><span class="mstat" id="connClaude">…</span><button class="mbtn2" id="connClaudeBtn" onclick="connClaudeAction()">…</button></div></div>
      <div class="msec-title" style="margin-top:16px">Buildprint CLI</div>
      <div class="mrow"><div class="mlbl"><b>Buildprint link</b><span id="connBpSub">Paste your Buildprint token to link this machine. Runs <code>buildprint link</code> — the token is stored by Buildprint, not in the brain.</span></div><div class="mctl"><span class="mstat" id="connBp">…</span></div></div>
      <div class="mrow" id="bpTokenRow"><div class="mlbl"><b>Token</b><span>From your Buildprint account.</span></div><div class="mctl"><input class="tinput" id="bpToken" type="password" placeholder="buildprint token…" autocomplete="off"><button class="mbtn2 primary" onclick="linkBuildprint()">Link</button></div></div>
      <div class="mrow" id="bpLinkedRow" style="display:none"><div class="mlbl"><b>This machine</b><span id="bpLinkedSub">Linked.</span></div><div class="mctl"><button class="mbtn2" onclick="revokeBuildprint()">Unlink</button></div></div>
      <div class="msec-title" style="margin-top:16px">Email (SMTP)</div>
      <div class="mrow"><div class="mlbl"><b>SMTP server</b><span id="connSmtpSub">For email notifications. Stored in a gitignored local file — never committed.</span></div><div class="mctl"><span class="mstat" id="connSmtp">…</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Host & port</b></div><div class="mctl"><input class="tinput" id="smtpHost" placeholder="smtp.example.com" autocomplete="off" style="min-width:150px"><input class="tinput" id="smtpPort" placeholder="587" autocomplete="off" style="min-width:70px"></div></div>
      <div class="mrow"><div class="mlbl"><b>Username</b></div><div class="mctl"><input class="tinput" id="smtpUser" placeholder="user@example.com" autocomplete="off"></div></div>
      <div class="mrow"><div class="mlbl"><b>Password</b></div><div class="mctl"><input class="tinput" id="smtpPass" type="password" placeholder="••••••••" autocomplete="new-password"></div></div>
      <div class="mrow"><div class="mlbl"><b>From address</b></div><div class="mctl"><input class="tinput" id="smtpFrom" placeholder="CRS Brain <noreply@example.com>" autocomplete="off"></div></div>
      <div class="mrow"><div class="mlbl"></div><div class="mctl"><button class="mbtn2" onclick="testSmtp()">Test connection</button><button class="mbtn2 primary" onclick="saveSmtp()">Save</button></div></div>`;
  } else {
    pane=`<div class="msec-title">About</div>
      <div class="mrow"><div class="mlbl"><b>CRS Brain</b><span>Local build console for the CRS Bubble project — one place to chat, operate Buildprint, browse the brain, and track progress. Runs on your Claude Max subscription.</span></div></div>
      <div class="mrow"><div class="mlbl"><b>Theme &amp; tokens</b><span>Styled on the CRS design system (design/tokens.css). Dark + Light.</span></div></div>`;
  }
  $('settingsBox').innerHTML=`<div class="modal-head"><h2>${svg('i-cog')} Settings</h2><button class="mx" onclick="closeSettings()">✕</button></div>
    <div class="modal-body"><div class="modal-nav">${nav.map(([k,ic,l])=>`<button class="${k===settingsTab?'on':''}" onclick="setSettingsTab('${k}')">${svg(ic)} ${l}</button>`).join('')}</div>
    <div class="modal-pane">${pane}</div></div>`;
  if(settingsTab==='connections') refreshConnStatus();
  if(settingsTab==='general') loadSyncStatus();
}
async function refreshConnStatus(){
  try{ const a=await api('/api/auth/status'); const el=$('connClaude'),sub=$('connClaudeSub'),btn=$('connClaudeBtn'); if(el){ if(a.loggedIn){ el.textContent='Connected'; el.className='mstat ok'; if(sub)sub.textContent=`${a.email||'signed in'} · ${a.subscriptionType||a.authMethod||''}`; if(btn)btn.textContent='Sign out'; } else { el.textContent='Not connected'; el.className='mstat off'; if(sub)sub.textContent='Sign in to Claude to use the brain.'; if(btn)btn.textContent='Sign in'; } } }catch{}
  try{ const b=await api('/api/bp/status'); const el=$('connBp'); if(el){ const linked=b&&b.linked===true; el.textContent=linked?'Linked':'Not linked'; el.className='mstat '+(linked?'ok':'off');
    const tokRow=$('bpTokenRow'),lnkRow=$('bpLinkedRow'),sub=$('bpLinkedSub');
    if(tokRow)tokRow.style.display=linked?'none':'';
    if(lnkRow)lnkRow.style.display=linked?'':'none';
    if(sub&&linked)sub.textContent='Linked'+(b.account?' as '+b.account:'')+(b.app?' · workspace '+b.app+(b.branch?' ('+b.branch+')':''):'')+'. Unlink removes the CLI auth on this machine only.';
  } }catch{ const el=$('connBp'); if(el){ el.textContent='Unknown'; el.className='mstat warn'; } }
  try{ const sm=await api('/api/connections/smtp'); const el=$('connSmtp'); if(el){ el.textContent=sm.configured?'Configured':'Not set'; el.className='mstat '+(sm.configured?'ok':'off'); }
    if($('smtpHost')){ $('smtpHost').value=sm.host||''; $('smtpPort').value=sm.port||''; $('smtpUser').value=sm.user||''; $('smtpFrom').value=sm.from||''; if(sm.configured&&$('smtpPass')) $('smtpPass').placeholder='•••••••• (saved — leave blank to keep)'; } }catch{}
}
function connClaudeAction(){ const btn=$('connClaudeBtn'); if(btn&&/out/i.test(btn.textContent)){ api('/api/auth/logout',{method:'POST'}).then(()=>{ notifyT('warning',{title:'Signed out of Claude'}); refreshConnStatus(); }); } else { api('/api/auth/login',{method:'POST'}); toast('Opening Claude sign-in…'); } }
async function linkBuildprint(){ const inp=$('bpToken'); const tok=(inp&&inp.value||'').trim(); if(!tok)return toast('Paste your Buildprint token first'); toast('Linking Buildprint…');
  try{ const r=await api('/api/connections/buildprint-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})}); if(r&&r.ok){ notifyT('success',{title:'Buildprint linked',banner:true,bell:false}); if(inp)inp.value=''; refreshConnStatus(); } else notifyT('error',{title:'Buildprint link failed',message:(r&&r.error)||''}); }
  catch(e){ notifyT('error',{title:'Buildprint link failed',message:e.message}); } }
async function revokeBuildprint(){ const ok=await crsConfirm({title:'Unlink Buildprint?',body:'Removes the CLI auth on this machine. Your token stays valid in Buildprint — you can re-link any time.'}); if(!ok)return;
  try{ const r=await api('/api/connections/buildprint-revoke',{method:'POST'}); if(r&&r.ok){ notifyT('warning',{title:'Buildprint unlinked on this machine'}); refreshConnStatus(); } else notifyT('error',{title:'Unlink failed',message:(r&&r.error)||''}); }
  catch(e){ notifyT('error',{title:'Unlink failed',message:e.message}); } }
async function saveSmtp(){ const body={host:($('smtpHost').value||'').trim(),port:($('smtpPort').value||'').trim(),user:($('smtpUser').value||'').trim(),pass:($('smtpPass').value||''),from:($('smtpFrom').value||'').trim()};
  try{ const r=await api('/api/connections/smtp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(r&&r.ok){ notifyT('success',{title:'SMTP settings saved'}); if($('smtpPass'))$('smtpPass').value=''; refreshConnStatus(); } else toast('Save failed'); }catch(e){ toast('Save failed: '+e.message); } }
async function testSmtp(){ const el=$('connSmtp'); if(el){el.textContent='Testing…';el.className='mstat';} try{ const r=await api('/api/connections/smtp-test',{method:'POST'}); if(el){ el.textContent=r.ok?'Reachable':('Unreachable'+(r.error?' · '+r.error:'')); el.className='mstat '+(r.ok?'ok':'warn'); } }catch(e){ if(el){el.textContent='Test failed';el.className='mstat warn';} } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSettings(); const bx=$('ninbox'); if(bx)bx.classList.remove('show'); const up=$('usagePop'); if(up){ up.classList.remove('show'); document.removeEventListener('click', closeUsageOnOut); } } });

(async function(){ await loadSettingsCache(); ensureSoundFiles().then(()=>SOUNDS.preload()); loadNotifications(); initConnWatch(); loadAuth(); loadModelSettings(); loadUsage(); loadRecentOpened(); loadRecentEdited(); loadEntities(); await loadChats(); await loadFiles(); await loadProgress(); await loadPlan(); if(location.hash==='#bp-compose') consumeBpCompose(); else if(location.hash.startsWith('#file=')||location.hash.startsWith('#explore=')) openFromHash(); else if(location.hash.startsWith('#view=')){ const _v=location.hash.slice(6); _v==='kanban'?showMap('board'):_v==='list'?showMap('list'):_v==='map'?showMap():_v==='bubble'?showBubble():_v==='chat'?newChat():_v==='bp'?newBpChat():showDashboard(); } else if(location.hash.startsWith('#settings=')){ showDashboard(); openSettings(location.hash.slice(10)||'general'); } else showDashboard(); })();
setInterval(loadUsage, 30000);
</script>
<script src="js/livemap.js"></script>
<script src="js/palette.js"></script>
