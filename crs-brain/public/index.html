<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRS Brain</title>
<style>
  /* CRS design tokens — mirrors design/tokens.css (source of truth). */
  :root{
    --bg:#181818; --panel:#1E1E1E; --panel2:#242424; --elev:#2A2A2A;
    --line:#242424; --line2:#333333; --line3:#3D3D3D;
    --primary:#E0E0E0; --secondary:#A6A6A6; --muted:#6B6B6B;
    --accent:#3B82F6; --accent2:#60A5FA; --accent-soft:rgba(59,130,246,.13); --accent-tint:rgba(59,130,246,.08);
    --good:#22C55E; --warn:#F59E0B; --danger:#EF4444;
    --grad:#3B82F6; /* flat — CRS is border-only, no gradients or glows */
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    /* themeable veils (were hardcoded rgba-white) so light mode reads correctly */
    --veil:rgba(255,255,255,.05); --veil-2:rgba(255,255,255,.03); --code-bg:#0b0b0e; --code-fg:var(--code-fg);
    --head-bg:rgba(24,24,24,.62); --prose:var(--prose);
  }
  /* ── Light theme (design.md §3: Soft-Grey light; accent kept, accent-text darkens for AA) ── */
  :root[data-theme="light"]{
    --bg:#F4F4F3; --panel:#FFFFFF; --panel2:#F1F1F0; --elev:#E9E9E7;
    --line:#E4E4E2; --line2:#D6D6D3; --line3:#C4C4C1;
    --primary:#1A1A1A; --secondary:#4B4B4B; --muted:#8A8A88;
    --accent:#3B82F6; --accent2:#1D4ED8; --accent-soft:rgba(59,130,246,.12); --accent-tint:rgba(59,130,246,.08);
    --good:#16A34A; --warn:#D97706; --danger:#DC2626; --grad:#3B82F6;
    --veil:rgba(0,0,0,.04); --veil-2:rgba(0,0,0,.025); --code-bg:#F5F5F3; --code-fg:#2A2A2A;
    --head-bg:rgba(250,250,249,.78); --prose:#232323;
  }
  :root[data-theme="light"] body{ -webkit-font-smoothing:auto }
  html{transition:background-color .2s ease}
  body,.col,.center-head,.composer,.card,.action,.kpi,.tool,.dcard,.stat,.item,.upop,.modal-box{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
  *{box-sizing:border-box}
  .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex:0 0 auto}
  .ic.sm{width:13px;height:13px}
  .ic.spinning{animation:sp .7s linear infinite}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--secondary);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  /* scrollbars — CRS tokens: track surface-1, thumb border→border-active, accent when dragging */
  *{scrollbar-width:thin;scrollbar-color:var(--line3) var(--panel)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--panel);border-radius:10px}
  ::-webkit-scrollbar-thumb{background:var(--line3);border-radius:10px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  ::-webkit-scrollbar-thumb:active{background:var(--accent)}
  ::-webkit-scrollbar-corner{background:transparent}

  .app{display:grid;grid-template-columns:var(--left-w,274px) 1fr;height:100vh}
  .col{overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .col.left{border-right:1px solid var(--line);background:var(--panel)}
  .col.right{border-left:1px solid var(--line);background:var(--panel)}
  .col.center{background:transparent;position:relative}
  /* swappable views (chat/dashboard/file/map) fill the space above the persistent composer */
  .content-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .content-area > *{min-height:0}
  /* map mode: let the galaxy background fill the whole area, with the composer floating over its bottom */
  .col.center.map-mode .composer-wrap{position:absolute;left:0;right:0;bottom:0;z-index:5;background:transparent;pointer-events:none}
  .col.center.map-mode .composer-wrap > *{pointer-events:auto}

  /* sidebar collapse (desktop only) — collapses to a narrow icon rail, not hidden */
  @media (min-width:901px){
    .app.lcol{grid-template-columns:54px 1fr}
    /* hide the full panel content, reveal its icon rail */
    .app.lcol .col.left > :not(.side-rail){display:none}
    .app.lcol .col.left .side-rail{display:flex}
  }
  /* narrow icon rail shown when a panel is collapsed */
  .side-rail{display:none;flex-direction:column;align-items:center;gap:5px;padding:12px 0;overflow:hidden}
  .side-rail button{width:38px;height:38px;border-radius:9px;background:none;border:1px solid transparent;color:var(--secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex:0 0 auto;font-family:inherit}
  .side-rail button:hover{color:var(--primary);background:var(--panel2);border-color:var(--line)}
  .side-rail button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-rail .rsep{width:22px;height:1px;background:var(--line);margin:5px 0;flex:0 0 auto}
  .side-rail .rspring{flex:1;min-height:6px}
  .col-collapse{margin-left:auto;background:var(--elev);border:1px solid var(--line2);color:var(--secondary);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:.15s;padding:0}
  .col-collapse:hover{color:var(--primary);border-color:var(--accent);background:var(--panel2)}
  .col-collapse svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .expand-handle{display:none;position:absolute;top:14px;z-index:20;background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:24px;height:32px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .expand-handle:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  .expand-handle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .expand-handle.left{left:10px}
  .expand-handle.right{right:10px}

  /* brand */
  .brand{padding:16px 16px 12px;display:flex;align-items:center;gap:11px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:0 0 30px}
  .brand h1{font-size:15px;margin:0;color:var(--primary);font-weight:650;letter-spacing:.2px}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px}

  /* account */
  .account{display:flex;align-items:center;gap:9px;margin:2px 12px 6px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;font-size:12px}
  .account .adot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 8px}
  .account .adot.on{background:var(--good);box-shadow:0 0 9px var(--good)}
  .account .ainfo{min-width:0}
  .account .aemail{color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .account .aplan{color:var(--muted);font-size:11px}
  .account .alink{margin-left:auto;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;transition:.15s}
  .account .alink:hover{color:var(--primary)}
  .account .connect{width:100%;background:var(--grad);border:none;color:#fff;font-weight:650;border-radius:6px;padding:9px;font-size:12.5px;cursor:pointer;transition:.15s}
  .account .connect:hover{background:#2563EB}

  /* tabs (segmented) */
  .tabs{display:flex;gap:3px;margin:6px 12px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:7px;font-size:12px;font-weight:600;border-radius:8px;transition:.15s}
  .tabs button.on{color:var(--primary);background:var(--elev)}
  .pane{flex:1;overflow:auto;padding:4px 12px 12px}
  .pane.hide{display:none}

  .newbtn{margin:0 12px 6px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--secondary);border-radius:11px;font-size:12.5px;font-weight:500;width:calc(100% - 24px);text-align:left;display:flex;align-items:center;gap:8px;transition:.15s}
  .newbtn:hover{border-color:var(--line3);color:var(--primary);background:var(--elev)}

  .item{padding:9px 11px;border-radius:9px;color:var(--secondary);font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;transition:.12s;margin:1px 0}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--accent-soft);color:var(--primary)}
  .item .meta{margin-left:auto;color:var(--muted);font-size:11px;background:var(--veil);border-radius:20px;padding:0 7px;line-height:17px}
  .item .bpi{color:var(--accent2);flex:0 0 auto;width:14px;height:14px}
  .item .x{opacity:0;color:var(--muted);font-size:13px;transition:.15s}
  .item:hover .x{opacity:.7}
  .item .x:hover{color:var(--danger)}

  .tree .node{padding:4px 7px;border-radius:7px;font-size:13px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center;transition:.1s}
  .tree .node:hover{background:var(--panel2)}
  .tree .node.file.on{background:var(--accent-soft);color:var(--primary)}
  .tree .dir{color:var(--primary);font-weight:600}
  .tree .children{margin-left:11px;border-left:1px solid var(--line);padding-left:5px}
  .tree .chev{display:inline-flex;color:var(--muted);transition:transform .15s;flex:0 0 auto}
  .tree .chev.open{transform:rotate(90deg)}
  .tree .file .ic{color:var(--muted)}
  .tree .dir .ic{color:var(--secondary)}

  /* center header */
  .center-head{padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:58px;flex:0 0 58px;background:var(--head-bg);backdrop-filter:blur(10px)}
  .center-head .title{color:var(--primary);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .center-head .spacer{margin-left:auto}
  /* view switcher: Chat · Map · Kanban · List */
  .viewseg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:1px;flex:0 0 auto}
  .viewseg button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .viewseg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .viewseg button:hover{color:var(--secondary)}
  .viewseg button.on{background:var(--accent);color:#fff}
  .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 13px;font-size:12px;transition:.15s}
  .ghost:hover{border-color:var(--line3);color:var(--primary)}
  .ghost.on{color:var(--primary);background:var(--accent-soft)} /* active = bg+text only (CRS rule) */
  .sel{background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%236c6c78" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 9px center;border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 26px 6px 10px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;-webkit-appearance:none;appearance:none}
  .sel:hover{border-color:var(--line3);color:var(--primary)}
  .sel:focus{outline:none;border-color:var(--accent)}
  .sel option{background:var(--panel2);color:var(--primary)}

  /* header usage chip + popover (moved out of the old right rail) */
  .uchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;flex:0 0 auto;white-space:nowrap}
  .uchip:hover{border-color:var(--line3);color:var(--primary)}
  .uchip .ic{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
  .uchip .uv{color:var(--primary);font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600}
  .uchip .usep{width:1px;height:12px;background:var(--line3);display:inline-block;margin:0 4px}
  .uchip.warn{border-color:rgba(245,158,11,.35)} .uchip.warn .ic{color:var(--warn)}
  .uchip.crit{border-color:rgba(239,68,68,.4)} .uchip.crit .ic{color:var(--danger)}
  .upop{position:absolute;top:50px;right:16px;width:326px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:45;display:none;overflow:hidden}
  .upop.show{display:block;animation:msgIn .16s ease both}
  .upop-head{display:flex;align-items:center;gap:8px;padding:12px 14px 11px;border-bottom:1px solid var(--line);color:var(--primary);font-size:12.5px;font-weight:600}
  .upop-head .hx{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px;transition:.15s}
  .upop-head .hx:hover{color:var(--primary);background:var(--panel2)}
  .upop .usage{padding:14px 15px}
  /* composer is chat-only now — hidden on dashboard / files / map / bubble */
  .col.center.no-composer .composer-wrap{display:none}

  /* header icon buttons (bell, settings) + notification badge */
  .hicon{position:relative;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex:0 0 auto}
  .hicon:hover{border-color:var(--line3);color:var(--primary)}
  .hicon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nbadge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;font-family:var(--mono);border:2px solid var(--panel)}
  .nbadge.show{display:inline-flex}
  /* notifications inbox */
  .ninbox{position:absolute;top:50px;right:16px;width:370px;max-width:calc(100vw - 32px);max-height:72vh;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:46;display:none;flex-direction:column;overflow:hidden}
  .ninbox.show{display:flex;animation:msgIn .16s ease both}
  .ninbox-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--primary);font-size:12.5px;font-weight:600}
  .ninbox-head .act{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:3px 7px;border-radius:6px;font-family:inherit}
  .ninbox-head .act:hover{color:var(--accent2);background:var(--panel2)}
  .ninbox-list{overflow:auto;padding:6px}
  .nitem{display:flex;gap:10px;padding:10px 11px;border-radius:8px;transition:.12s}
  .nitem:hover{background:var(--panel2)}
  .nitem .ndot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px}
  .nitem .ntxt{min-width:0;flex:1}
  .nitem .nt{color:var(--primary);font-size:12.5px;font-weight:600}
  .nitem .nb{color:var(--secondary);font-size:12px;line-height:1.45;margin-top:2px;word-break:break-word}
  .nitem .nm{color:var(--muted);font-size:10.5px;margin-top:3px;font-family:var(--mono)}
  .nitem.unread{background:var(--accent-tint)}
  .ninbox-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 16px}

  /* generic modal (settings) */
  .modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
  .modal-wrap.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:740px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:16px;color:var(--primary);font-weight:650;flex:1}
  .modal-head .mx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;width:30px;height:30px;border-radius:8px;transition:.15s}
  .modal-head .mx:hover{color:var(--primary);background:var(--panel2)}
  .modal-body{display:flex;min-height:0;flex:1}
  .modal-nav{flex:0 0 180px;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--panel2)}
  .modal-nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--secondary);text-align:left;padding:9px 11px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.12s}
  .modal-nav button:hover{background:var(--elev);color:var(--primary)}
  .modal-nav button.on{background:var(--accent-soft);color:var(--primary)}
  .modal-nav button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--muted);flex:0 0 16px}
  .modal-nav button.on svg{color:var(--accent2)}
  .modal-pane{flex:1;overflow:auto;padding:18px 24px 24px}
  .mpane{display:none}.mpane.on{display:block}
  .msec-title{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 0 2px}
  .mrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .mlbl{flex:1;min-width:0}
  .mrow .mlbl b{color:var(--primary);font-size:13px;font-weight:600;display:block}
  .mrow .mlbl span{color:var(--muted);font-size:11.5px;line-height:1.5;display:block;margin-top:3px}
  .mrow .mctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  /* switch */
  .switch{position:relative;width:38px;height:22px;flex:0 0 auto;display:inline-block}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .sl{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;cursor:pointer;transition:.18s}
  .switch .sl::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.18s}
  .switch input:checked+.sl{background:var(--accent);border-color:var(--accent)}
  .switch input:checked+.sl::before{transform:translateX(16px);background:#fff}
  /* segmented control */
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:1px}
  .seg button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .seg button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
  .seg button.on{background:var(--elev);color:var(--primary)}
  .tinput{background:var(--panel2);border:1px solid var(--line2);color:var(--primary);border-radius:8px;padding:8px 11px;font:inherit;font-size:12.5px;outline:none;min-width:210px}
  .tinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .mbtn2{background:var(--panel2);border:1px solid var(--line2);color:var(--secondary);border-radius:8px;padding:8px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
  .mbtn2:hover{border-color:var(--line3);color:var(--primary)}
  .mbtn2.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mbtn2.primary:hover{background:var(--accent-hover,#2563EB)}
  .mstat{font-size:11.5px;font-weight:600}
  .mstat.ok{color:var(--good)} .mstat.off{color:var(--muted)} .mstat.warn{color:var(--warn)}

  /* chat */
  .chat{flex:1;overflow:auto;padding:28px 18px 12px}
  /* Claude-style: no avatars, a tighter reading column, airy spacing */
  .msg{display:block;max-width:744px;margin:0 auto 26px;animation:msgIn .4s cubic-bezier(.2,.7,.2,1) both}
  .avatar{display:none}
  .content{min-width:0}
  /* user turn = subtle rounded bubble, right-aligned, content-width */
  .msg.user .content{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--panel2);border:none;border-radius:16px;padding:10px 15px;color:var(--primary);display:inline-block;max-width:88%;font-size:15px;line-height:1.6;text-align:left}
  /* assistant turn = clean bright prose, no bubble */
  .body{color:var(--secondary)}
  .msg.assistant .body{color:var(--prose);font-size:15px;line-height:1.72}
  .dim{color:var(--muted)}

  /* streaming reveal */
  .streaming{white-space:pre-wrap;word-break:break-word}
  .tok{opacity:0;animation:tokIn .5s ease forwards}
  .caret{display:inline-block;width:7px;height:1.02em;background:var(--accent);border-radius:2px;vertical-align:text-bottom;margin-left:1px;animation:blink 1.05s steps(1) infinite}
  .statusnote{color:var(--muted);font-style:italic;margin-left:7px;font-size:13px}
  .dots{display:inline-flex;gap:5px;align-items:center;height:20px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  .body.err{color:#e8938b}

  /* work blocks — Buildprint-style grouped activity: one "Worked for Xs" header
     folds a run of steps; each step is a clean icon+label row, expandable for detail */
  .wblocks{display:flex;flex-direction:column;gap:16px;margin-bottom:8px}
  .wblocks:empty{display:none}
  .wgroup{border:none;background:none}
  .wghead{display:inline-flex;align-items:center;gap:8px;background:none;border:none;padding:2px 0;color:var(--secondary);font:inherit;font-size:13px;text-align:left;cursor:pointer}
  .wghead:hover .wglabel{color:var(--primary)}
  .wgchev{width:13px;height:13px;flex:0 0 auto;color:var(--muted);transition:transform .18s}
  .wgroup.open .wgchev{transform:rotate(90deg)}
  .wglabel{font-weight:500;letter-spacing:.1px;font-variant-numeric:tabular-nums}
  .wgroup.run .wglabel{color:var(--accent2,#60A5FA);animation:wpulse 1.5s ease-in-out infinite}
  @keyframes wpulse{0%,100%{opacity:1}50%{opacity:.5}}
  .wsteps{display:none;flex-direction:column;gap:1px;margin:7px 0 1px;padding-left:5px;border-left:1px solid var(--line2)}
  .wgroup.open .wsteps{display:flex}
  .wstep{display:flex;flex-direction:column}
  .wstep-head{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:7px;color:var(--secondary);font-size:12.5px;line-height:1.45;cursor:default}
  .wstep.has-body .wstep-head{cursor:pointer}
  .wstep.has-body .wstep-head:hover{background:var(--veil)}
  .wstep-ico{width:15px;height:15px;flex:0 0 auto;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .wstep-ico svg{width:15px;height:15px}
  .wstep-lbl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wstep.run .wstep-lbl,.wstep.run .wstep-ico{color:var(--accent2,#60A5FA)}
  .wstep.run .wstep-lbl{animation:wpulse 1.5s ease-in-out infinite}
  .wstep-exp{width:11px;height:11px;flex:0 0 auto;color:var(--muted);opacity:0;transition:transform .15s}
  .wstep.has-body .wstep-exp{opacity:.55}
  .wstep.open .wstep-exp{transform:rotate(90deg)}
  .wstep-body{display:none;white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:12px;line-height:1.62;padding:3px 8px 9px 33px}
  .wstep.open .wstep-body{display:block}

  /* prompt queue strip */
  .queue-strip{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:0 22px 8px;max-width:830px;margin:0 auto;width:100%}
  .queue-strip:empty{display:none}
  .queue-strip .ql{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .qchip{display:flex;align-items:center;justify-content:space-between;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 8px 6px 12px;font-size:12px;color:var(--secondary);width:100%}
  .qchip .qtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qchip .qx{cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;border-radius:50%}
  .qchip .qx:hover{color:var(--danger)}

  /* chat mode switch (Chat · Buildprint) — sits above the composer */
  .chatmode{display:flex;justify-content:center;margin:0 auto 10px;max-width:830px}
  .col.center.no-composer .chatmode{display:none}
  .seg2{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
  .seg2 button{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:6px 18px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .seg2 button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
  .seg2 button.on{background:var(--accent);color:#fff}
  .seg2 button:not(.on):hover{color:var(--secondary)}
  /* chat starter template cards (mode-aware) */
  .tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:580px;margin:24px auto 0}
  .tcard{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;transition:.15s;font-family:inherit}
  .tcard:hover{border-color:var(--line3);background:var(--elev)}
  .tcard .tct{color:var(--primary);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:9px}
  .tcard .tct svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--accent2);flex:0 0 16px}
  .tcard .tcd{color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.45}
  @media (max-width:560px){.tcards{grid-template-columns:1fr}}

  /* live generation meter — elapsed + running input/output tokens */
  .genmeter{display:none;align-items:center;gap:10px;max-width:830px;margin:0 auto 8px;padding:6px 13px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;font-size:11.5px;color:var(--secondary);width:max-content}
  .genmeter.show{display:inline-flex}
  .genmeter .gm-live{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:wpulse 1.2s ease-in-out infinite;flex:0 0 7px}
  .genmeter .gm-t{font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--primary);font-weight:600}
  .genmeter .gm-sep{width:1px;height:11px;background:var(--line3)}
  .genmeter .gm-tok{font-family:var(--mono);color:var(--muted)}
  .genmeter .gm-tok b{color:var(--secondary);font-weight:600}

  /* ───── full-window kanban / list board ───── */
  .kb-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .kb-search{flex:1;min-width:120px;max-width:340px;background:var(--panel2);border:1px solid var(--line2);color:var(--primary);border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;outline:none}
  .kb-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .kb-count{margin-left:auto;color:var(--muted);font-size:11.5px;font-family:var(--mono);flex:0 0 auto}
  .kb-toolbar .seg2 button svg{width:14px;height:14px}
  .kb-board{flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:16px 20px 20px;align-items:stretch}
  .kb-board.list{display:block;overflow-y:auto;overflow-x:hidden;max-width:920px;margin:0 auto;width:100%;padding:16px 20px 28px}
  .kb-col{flex:0 0 300px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;max-height:100%;overflow:hidden}
  .kb-col-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .kb-col-head .kn{color:var(--primary);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb-col-head .kc{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;flex:0 0 auto}
  .kb-cards{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .kb-card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.12s;text-align:left;font-family:inherit;width:100%}
  .kb-card:hover{border-color:var(--accent);background:var(--elev)}
  .kb-card .kf{width:15px;height:15px;flex:0 0 15px;color:var(--muted)}
  .kb-card .knm{flex:1;min-width:0;color:var(--secondary);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb-card:hover .knm{color:var(--primary)}
  .kb-card .kbadge{flex:0 0 auto;color:var(--muted);font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
  .kb-empty{color:var(--muted);font-size:12px;text-align:center;padding:18px 12px;font-style:italic}
  .kb-loading{color:var(--muted);font-size:13px;padding:34px;text-align:center}
  .kb-sec-head{display:flex;align-items:center;gap:8px;padding:16px 4px 9px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
  .kb-sec-head .kc{color:var(--muted);font-family:var(--mono);font-size:10.5px}
  .kb-board.list .kb-card{margin-bottom:7px}

  /* composer */
  .composer-wrap{padding:12px 18px 30px}
  /* Map view: let the galaxy iframe fill the whole center (incl. behind the composer) and float the
     composer on top so its dark background extends below the chat input — no seam. */
  .col.center.map-mode .composer-wrap{position:absolute;left:0;right:0;bottom:0;background:transparent;z-index:10;pointer-events:none}
  .col.center.map-mode .composer-wrap > *{pointer-events:auto}
  /* Claude-app-style composer: text on top, controls row beneath */
  .composer{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:12px 12px 9px;transition:border-color .15s,box-shadow .15s;max-width:830px;margin:0 auto}
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .composer textarea{width:100%;resize:none;background:none;border:none;color:var(--primary);padding:2px 4px;font-family:inherit;font-size:15px;max-height:260px;min-height:48px;line-height:1.55}
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--muted)}
  .composer-row{display:flex;align-items:center;gap:6px}
  .composer-row .sel.mini{height:30px;padding:5px 22px 5px 9px;font-size:11.5px;max-width:118px;background-position:right 7px center}
  .attach-btn{background:none;border:none;color:var(--muted);width:38px;height:38px;border-radius:11px;font-size:16px;flex:0 0 auto;transition:.15s}
  .attach-btn:hover{background:var(--elev);color:var(--primary)}
  .send{background:var(--grad);border:none;color:#fff;font-weight:700;border-radius:8px;width:38px;height:38px;font-size:17px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.15s}
  .send:hover{background:#2563EB}
  .send:disabled{opacity:.4;cursor:default}
  .send.stop{background:var(--panel2);border:1px solid var(--line3);color:var(--danger)}
  .send.stop:hover{background:var(--elev);border-color:var(--danger)}
  /* retry / continue bar under the latest reply */
  .retry-bar{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .retry-bar button{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--secondary);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s}
  .retry-bar button:hover{border-color:var(--accent);color:var(--primary);background:var(--elev)}
  .retry-bar button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .stopped-note{color:var(--muted);font-size:12px;font-style:italic;margin-top:6px}
  .ingest-btn{display:none;align-items:center;gap:7px;background:var(--accent-tint);border:1px solid var(--line2);color:var(--accent2);font-weight:600;border-radius:8px;height:38px;padding:0 14px;font-size:12.5px;flex:0 0 auto;transition:.15s;white-space:nowrap}
  .ingest-btn.show{display:inline-flex}
  .ingest-btn:hover{background:var(--accent-soft);color:var(--primary)}
  .ingest-btn:disabled{opacity:.4;cursor:default}
  .attach-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 22px 10px;max-width:830px;margin:0 auto}
  .attach-chips:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--secondary)}
  .chip .rm{cursor:pointer;color:var(--muted);font-weight:700}
  .chip .rm:hover{color:var(--danger)}
  .chip.up{opacity:.6}

  .msg-atts{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
  .matt{font-size:11px;background:var(--veil);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--primary)}
  .msg-acts{display:flex;gap:8px;margin-top:10px;opacity:0;transition:opacity .2s}
  .msg:hover .msg-acts{opacity:1}
  .msg-acts button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 11px;font-size:11px;cursor:pointer;transition:.15s}
  .msg-acts button:hover{border-color:var(--line3);color:var(--primary);background:var(--panel2)}

  /* hero / empty */
  .hero{max-width:460px;margin:12vh auto 0;text-align:center;animation:msgIn .5s ease both}
  .hero-mark{width:54px;height:54px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 18px}
  .hero-t{color:var(--primary);font-size:20px;font-weight:650;margin-bottom:8px}
  .hero-s{color:var(--muted);font-size:13.5px;line-height:1.6}

  /* file editor */
  .editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .editor textarea{flex:1;background:var(--bg);color:var(--primary);border:none;padding:20px 24px;font-family:var(--mono);font-size:13px;line-height:1.65;resize:none}
  .editor textarea:focus{outline:none}
  .doc{flex:1;overflow:auto;padding:26px 34px;max-width:940px}

  /* markdown */
  .md{line-height:1.62}
  .md>*:first-child{margin-top:0}
  .md h1,.md h2,.md h3{color:var(--primary);line-height:1.3;margin:1.3em 0 .5em;font-weight:650}
  .md h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:.3em}
  .md h2{font-size:18px}.md h3{font-size:15px}
  .md p,.md li{color:var(--secondary)}
  .md strong{color:var(--primary)}
  .md code{background:var(--veil);padding:1.5px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px;color:var(--accent2)}
  .md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:11px;padding:14px 16px;overflow:auto;margin:.9em 0}
  .md pre code{background:none;padding:0;color:var(--code-fg)}
  .md a{color:var(--accent2);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md-tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:10px;margin:1.1em 0}
  .md-tbl table{border-collapse:collapse;width:100%;font-size:13.5px;margin:0}
  .md th,.md td{padding:9px 14px;text-align:left;vertical-align:top}
  .md thead th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);white-space:nowrap}
  .md tbody td{border-top:1px solid var(--line);color:var(--secondary)}
  .md tbody tr:first-child td{border-top:none}
  .md tbody tr:nth-child(even) td{background:var(--veil-2)}
  .md tbody tr:hover td{background:var(--veil)}
  .md blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:2px 0 2px 14px;color:var(--muted)}
  .md ul,.md ol{padding-left:22px}
  .md li{margin:.25em 0}
  .md .md-img,.doc .md-img{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:.5em 0;display:block}
  .md a[data-path]{color:var(--accent2);border-bottom:1px dashed rgba(96,165,250,.4)}
  .md a[data-path]:hover{border-bottom-style:solid;text-decoration:none}

  /* Claude-style chat prose — brighter, airier than the file viewer; scoped to chat */
  .hbackleft{margin-right:8px}
  .msg.assistant .body p,.msg.assistant .body li{color:var(--prose)}
  .msg.assistant .body p{margin:0 0 1em}
  .msg.assistant .body>*:last-child{margin-bottom:0}
  .msg.assistant .body h1,.msg.assistant .body h2,.msg.assistant .body h3{margin:1.15em 0 .5em;border:none;padding:0}
  .msg.assistant .body h1{font-size:19px}
  .msg.assistant .body h2{font-size:16.5px}
  .msg.assistant .body h3{font-size:14.5px}
  .msg.assistant .body ul,.msg.assistant .body ol{margin:.55em 0;padding-left:24px}
  .msg.assistant .body li{margin:.32em 0}
  .msg.assistant .body pre{border-radius:10px;background:var(--code-bg);margin:1em 0}
  .msg.assistant .body code{font-size:13px}
  .msg.assistant .body>hr{border:none;border-top:1px solid var(--line);margin:1.4em 0}
  .msg.assistant .body tbody td{color:var(--prose)}
  .msg.assistant .body .md-tbl{border-color:var(--line3)}

  /* file chips in chat: show a download button on hover */
  .matt{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;color:var(--primary);text-decoration:none}
  .matt .matt-name{color:var(--primary)}
  .matt-dl{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:var(--muted);opacity:0;transition:.15s;flex:0 0 auto}
  .matt:hover .matt-dl{opacity:1}
  .matt-dl:hover{background:var(--elev);color:var(--primary)}
  .matt-dl svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* quick-open palette (Cmd/Ctrl+K) */
  .pal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
  .pal-wrap.show{display:flex}
  .pal{width:520px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
  .pal input{width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:var(--primary);padding:14px 16px;font-size:14px;font-family:inherit;outline:none}
  .pal .results{max-height:46vh;overflow:auto;padding:6px}
  .pal .res{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--secondary)}
  .pal .res .k{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .pal .res.on{background:var(--accent-soft);color:var(--primary)}
  .pal .none{padding:14px;color:var(--muted);font-size:12.5px;text-align:center}

  .composer.dropping{border-color:var(--accent);background:var(--accent-tint)}

  /* ───── dashboard (home) ───── */
  .brand-home{display:flex;align-items:center;gap:11px;cursor:pointer;flex:1;min-width:0;border-radius:8px;transition:.12s}
  .brand-home:hover{opacity:.85}
  .dash{flex:1;overflow:auto;padding:32px 40px 48px}
  .dash-inner{max-width:1120px;margin:0 auto}
  .dash-head{margin-bottom:30px}
  .dash h2{color:var(--primary);font-size:24px;font-weight:680;letter-spacing:-.02em;margin:0 0 4px}
  .dash .subline{color:var(--muted);font-size:13px}
  .dash section{margin-bottom:30px}
  .dash .lbl{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 13px}
  /* KPI row — even grid, calm monochrome numbers, thin accent bar per metric */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:15px 16px;position:relative;overflow:hidden;transition:.15s;text-align:left;font-family:inherit;cursor:pointer}
  .kpi:hover{border-color:var(--line2);background:var(--elev)}
  .kpi::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2.5px;border-radius:2px;background:var(--kc,var(--accent))}
  .kpi .v{color:var(--primary);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-family:var(--mono)}
  .kpi .k{color:var(--muted);font-size:11.5px;margin-top:7px;font-weight:500}
  /* Quick actions — DISTINCT per-action color so the eye catches the icon, not the label */
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .action{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:16px 17px;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:flex-start;gap:13px;font-family:inherit}
  .action:hover{border-color:var(--qc,var(--line3));background:var(--elev)}
  .action .ai{width:38px;height:38px;border-radius:10px;background:var(--qc-bg,var(--accent-tint));display:flex;align-items:center;justify-content:center;color:var(--qc,var(--accent2));flex:0 0 38px;transition:.15s}
  .action .ai .ic{width:19px;height:19px;stroke-width:1.9}
  .action .atxt{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
  .action .at{color:var(--primary);font-size:13.5px;font-weight:600}
  .action .ad{font-size:11.5px;color:var(--muted);line-height:1.45}
  /* Secondary tools — compact pills, distinct icon tint */
  .tools{display:flex;flex-wrap:wrap;gap:9px}
  .tool{display:inline-flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 14px 9px 11px;color:var(--secondary);font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:.15s}
  .tool:hover{border-color:var(--line3);color:var(--primary);background:var(--elev)}
  .tool .ti{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qc-bg,var(--accent-tint));color:var(--qc,var(--accent2));flex:0 0 26px}
  .tool .ti .ic{width:15px;height:15px}
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  /* min-width:0 lets grid items shrink below their nowrap content (long chat titles) */
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;min-width:0}
  .drow .rt{min-width:0}
  .dcard h3{color:var(--primary);font-size:12.5px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .dcard h3 .ic{color:var(--muted)}
  .dcard h3 .cnt{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500;font-family:var(--mono)}
  .dcard .seeall{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
  .dcard .seeall:hover{color:var(--accent2)}
  .drow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--secondary);cursor:pointer}
  .drow.static{cursor:default}
  .drow:hover:not(.static){color:var(--primary)}
  .drow .pill{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .drow .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .rmeta{margin-left:auto;color:var(--muted);font-size:11px;flex:0 0 auto;font-family:var(--mono)}
  .np-mod{color:var(--accent2);font-size:11px;font-weight:600;margin:2px 0 3px}
  .np-title{color:var(--primary);font-size:13px;font-weight:600;line-height:1.4}
  .np-verify{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.45}
  .np-draft{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:var(--accent-tint);border:1px solid rgba(59,130,246,.25);color:var(--accent2);border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .np-draft:hover{background:var(--accent-soft);color:#fff;border-color:var(--accent)}
  .dempty{color:var(--muted);font-size:12px;padding:9px 0;font-style:italic}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}}
  @media (max-width:760px){.dash{padding:22px 16px}.dash-cols,.actions{grid-template-columns:1fr}}

  /* ───── Buildprint copilot (right panel) ───── */
  .rtabs{display:flex;gap:3px;padding:10px 12px 8px;align-items:center;border-bottom:1px solid var(--line)}
  .rtabs button{background:none;border:none;color:var(--muted);padding:5px 10px;font-size:11.5px;font-weight:700;letter-spacing:.4px;border-radius:6px;cursor:pointer;font-family:inherit}
  .rtabs button.on{color:var(--primary);background:var(--panel2)}
  .rtabs .col-collapse{margin-left:auto}
  .bp-panel{flex:1;display:flex;flex-direction:column;min-height:0}
  .bp-head{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .bp-head .bp-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 7px}
  .bp-head .bp-dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .bp-head #bpWs{color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bp-head .refresh{margin-left:auto}
  .bp-log{flex:1;overflow:auto;padding:12px 12px 6px;min-height:0}
  .bp-msg{margin-bottom:14px;font-size:12.5px;line-height:1.55}
  .bp-msg.user{background:var(--accent-tint);border:1px solid var(--line2);border-radius:4px 10px 10px 10px;padding:8px 11px;color:var(--primary)}
  .bp-msg.bot .who{font-size:9.5px;letter-spacing:1px;color:var(--accent2);font-weight:700;margin-bottom:4px;text-transform:uppercase}
  .bp-msg.bot .body{color:var(--secondary)}
  .bp-msg.bot .body.err{color:#e8938b}
  .bp-status{color:var(--muted);font-style:italic;font-size:11.5px;padding:2px 0}
  .bp-hero{color:var(--muted);font-size:12px;line-height:1.6;padding:14px 6px;text-align:center}
  .bp-hero b{color:var(--secondary)}
  .bp-hero .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;margin:4px 3px 0;color:var(--secondary);cursor:pointer;font-size:11px;text-align:left}
  .bp-hero .chip:hover{border-color:var(--line2);color:var(--primary)}
  .bp-composer{display:flex;gap:6px;align-items:flex-end;padding:9px 11px 12px;border-top:1px solid var(--line)}
  .bp-composer textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--primary);padding:9px 11px;font-family:inherit;font-size:13px;max-height:120px;min-height:20px;line-height:1.5;outline:none}
  .bp-composer textarea:focus{border-color:var(--accent)}
  .bp-conn{font-size:10.5px;color:var(--muted);padding:2px 14px 8px;display:flex;align-items:center;gap:6px}
  .bp-conn .bp-ok,.bp-conn .bp-off{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .bp-conn .bp-ok{background:var(--good);box-shadow:0 0 7px var(--good)}
  .bp-conn .bp-off{background:var(--muted)}
  /* right panel scroll + recent files */
  .col.right .rscroll{flex:1;overflow:auto;min-height:0}
  .col.right .rscroll .cols{flex:none;overflow:visible;min-height:0}
  .recent{padding:0 12px 4px}
  .recent .rf{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--secondary);cursor:pointer;white-space:nowrap;overflow:hidden}
  .recent .rf:hover{background:var(--panel2);color:var(--primary)}
  .recent .rf .ic{color:var(--muted);flex:0 0 auto}
  .recent .rf .nm{overflow:hidden;text-overflow:ellipsis}
  .recent .rf .ago{margin-left:auto;color:var(--muted);font-size:10px;flex:0 0 auto}
  .recent .rempty{color:var(--muted);font-size:11.5px;padding:5px 8px;font-style:italic}

  /* file-type icon tiles */
  .ftile{display:inline-flex;align-items:center;justify-content:center;width:18px;height:22px;border-radius:3px;font-size:7px;font-weight:800;color:#fff;letter-spacing:.2px;flex:0 0 auto;line-height:1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
  .ftile.lg{width:46px;height:56px;border-radius:7px;font-size:13px}
  .ftile.folder{background:none;box-shadow:none;color:var(--accent2)}
  .ftile.folder svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
  .ftile.lg.folder svg{stroke-width:1.3}
  .ftile img{width:100%;height:100%;object-fit:cover;border-radius:inherit}

  /* Finder/Explorer-style modal */
  .expl-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:center;justify-content:center}
  .expl-wrap.show{display:flex}
  .expl{width:min(860px,94vw);height:min(600px,88vh);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
  .expl-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .expl-crumb{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--secondary);overflow:hidden;flex:1;flex-wrap:wrap}
  .expl-crumb b{color:var(--primary)}
  .expl-crumb a{color:var(--accent2);cursor:pointer}
  .expl-crumb .sep{color:var(--muted)}
  .expl-head .sel{font-size:11.5px}
  .expl-x{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);width:30px;height:30px;border-radius:7px;font-size:14px;cursor:pointer;flex:0 0 auto}
  .expl-x:hover{color:var(--primary);border-color:var(--line2)}
  .expl-grid{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
  .expl-group{grid-column:1/-1;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 2px 0;padding-top:6px;border-top:1px solid var(--line)}
  .expl-group:first-child{border-top:none;padding-top:0;margin-top:0}
  .expl-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:9px;cursor:pointer;text-align:center;transition:.12s}
  .expl-item:hover{background:var(--panel2)}
  .expl-item .nm{font-size:11px;color:var(--secondary);line-height:1.3;word-break:break-word;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .expl-item:hover .nm{color:var(--primary)}
  .expl-empty{grid-column:1/-1;color:var(--muted);font-size:12.5px;padding:30px;text-align:center}
  /* chat search */
  .chat-search{display:block;width:calc(100% - 24px);margin:0 12px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--primary);padding:8px 11px;font-size:12.5px;font-family:inherit;outline:none}
  .chat-search:focus{border-color:var(--accent)}
  .item .snip{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  mark.hl{background:rgba(249,115,22,.35);color:var(--primary);border-radius:2px;padding:0 1px}

  /* ───── mobile (≤900px): columns become slide-in drawers ───── */
  .mbtn{display:none;background:none;border:1px solid var(--line);color:var(--secondary);border-radius:6px;width:34px;height:34px;font-size:15px;flex:0 0 auto}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .col.left,.col.right{position:fixed;top:0;bottom:0;width:min(84vw,320px);z-index:40;transition:transform .25s ease;box-shadow:0 0 60px rgba(0,0,0,.55)}
    .col.left{left:0;transform:translateX(-105%);border-right:1px solid var(--line2)}
    .col.right{right:0;transform:translateX(105%);border-left:1px solid var(--line2)}
    .col.left.show,.col.right.show{transform:translateX(0)}
    .mbtn{display:inline-flex;align-items:center;justify-content:center}
    .col-collapse,.expand-handle{display:none!important}
    .center-head{padding:0 10px;gap:8px}
    .center-head .title{font-size:13px;min-width:0}
    /* icon-only view switcher on phones so the header fits */
    .viewseg .vlbl{display:none}
    .viewseg button{padding:6px 9px}
    .sel{padding:6px 20px 6px 6px;font-size:11px;max-width:86px}
    .chat{padding:16px 10px 10px}
    .composer-wrap{padding:8px 10px 12px}
    .ingest-btn.show{padding:0 10px;font-size:11px}
    .doc{padding:16px 14px}
    .mscrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
    .mscrim.show{display:block}
  }

  /* progress */
  .right h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0;padding:18px 16px 10px;display:flex;align-items:center;font-weight:700}
  .cols{padding:0 14px 14px;overflow:auto;flex:1;min-height:0}
  .right h2:first-child{padding-top:16px}
  .pcol{margin-bottom:16px}
  .pcol .hdr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--primary);margin:8px 2px}
  .pcol .hdr .cnt{color:var(--muted);font-weight:500;background:var(--veil);border-radius:20px;padding:0 7px;line-height:17px;font-size:11px}
  .pcol .pill{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--cardc,var(--line2));border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13px;color:var(--secondary);transition:.15s}
  .card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .card .t{color:var(--primary)}
  .card .n{color:var(--muted);font-size:12px;margin-top:2px}
  .missing .card{--cardc:#EF4444}
  .empty{color:var(--muted);font-size:12px;padding:5px 4px;font-style:italic}
  .refresh{background:none;border:none;color:var(--muted);font-size:13px;margin-left:auto;cursor:pointer;transition:.15s;border-radius:6px;width:24px;height:24px}
  .refresh:hover{color:var(--primary);background:var(--panel2)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--elev);border:1px solid var(--line2);color:var(--primary);padding:10px 18px;border-radius:11px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}

  /* icon + text alignment */
  .msg-acts button{display:inline-flex;align-items:center;gap:6px}
  .account .connect{display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .matt{display:inline-flex;align-items:center;gap:5px}
  .item .x{display:inline-flex;align-items:center}
  .newbtn .ic{opacity:.8}
  .avatar .ic{width:16px;height:16px}
  .brand .logo .ic{width:17px;height:17px}
  .hero-mark .ic{width:26px;height:26px}

  /* usage panel */
  .usage{padding:0 14px 6px}
  .usage .ucard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:12px}
  .usage .urow{margin-bottom:12px}
  .usage .urow:last-child{margin-bottom:0}
  .usage .ulabel{display:flex;align-items:center;gap:6px;color:var(--secondary);margin-bottom:6px}
  .usage .ulabel b{color:var(--primary);font-weight:600}
  .usage .ulabel .pctv{margin-left:auto;color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums}
  .usage .bar{height:7px;border-radius:20px;background:var(--veil);overflow:hidden}
  .usage .bar span{display:block;height:100%;border-radius:20px;transition:width .5s ease}
  .usage .sub{color:var(--muted);font-size:11px;margin-top:5px;display:flex}
  .usage .sub .reset{margin-left:auto}
  .usage .updated{color:var(--muted);font-size:11px;margin-top:10px;display:flex;align-items:center;gap:6px}
  .usage .enable{width:100%;background:var(--grad);border:none;color:#fff;font-weight:650;border-radius:6px;padding:9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .usage .enable:hover{background:#2563EB}
  .usage .note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:9px}
  .usage .off{color:var(--secondary);display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .usage .disable{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:9px}
  .usage .disable:hover{color:var(--primary)}

  /* build-plan panel (right column) — packet steps → Buildprint prompts */
  .plan{padding:0 14px 6px}
  .plan .pkt-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--primary);font-weight:600;margin:2px 0 5px}
  .plan .pkt-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:10.5px}
  .plan .pksel{width:100%;margin:0 0 8px;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:7px;padding:6px 8px;font-size:11.5px;font-family:inherit}
  .plan .pstep{display:flex;align-items:flex-start;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .plan .pstep:last-child{border-bottom:none}
  .plan .pdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line3);margin-top:4px;flex:0 0 8px}
  .plan .pstep.active .pdot{background:var(--accent);border-color:var(--accent)}
  .plan .pstep.done .pdot{background:var(--good);border-color:var(--good)}
  .plan .pt{flex:1;font-size:12px;color:var(--secondary);line-height:1.45;min-width:0}
  .plan .pstep.active .pt{color:var(--primary)}
  .plan .pdetail{display:none;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .plan .pstep.open .pdetail{display:block}
  .plan .pst{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:2px 6px;border:1px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:2px}
  .plan .pst:hover{color:var(--primary);border-color:var(--line3)}
  .plan .pempty{color:var(--muted);font-size:11.5px;line-height:1.55;padding:4px 0 8px}
  .pdraft{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:var(--accent);border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .pdraft:hover{background:#2563EB}
  .pdraft:disabled{opacity:.5;cursor:default}
  /* dashboard build-plan card bits */
  .np-mod{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
  .np-title{font-size:13px;color:var(--primary);font-weight:600;line-height:1.45;margin-bottom:4px}
  .np-verify{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:2px}
  .np-gen{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .np-gen input{flex:1;margin:0;background:var(--panel2);border:1px solid var(--line);color:var(--primary);border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;min-width:0}
  .np-gen input:focus{border-color:var(--accent)}
  .np-gen .pdraft{margin-top:0}

  /* Bubble data view — live app structure from the Buildprint workspace */
  .bub-head{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
  .bub-tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:1px}
  .bub-tabs button{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .bub-tabs button:hover{color:var(--secondary)}
  .bub-tabs button.on{background:var(--accent);color:#fff}
  .bub-q{flex:1;min-width:110px;max-width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--primary);padding:6px 9px;font-size:12px;font-family:inherit;outline:none}
  .bub-q:focus{border-color:var(--accent)}
  .bub-del{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;cursor:pointer;user-select:none}
  .bub-meta{padding:8px 18px 0;color:var(--muted);font-size:11.5px;flex:0 0 auto}
  .bub-banner{margin:10px 18px 0;border:1px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--secondary);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
  .bub-banner .pdraft{margin-top:0}
  .bub-body{flex:1;overflow:auto;padding:12px 18px 30px}
  .bdt{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .bdt .bd-row{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
  .bdt .bd-row:hover{background:var(--panel2)}
  .bdt .nm{color:var(--primary);font-weight:600;font-size:12.5px}
  .bdt.deleted .nm{color:var(--muted);text-decoration:none;opacity:.75}
  .bdt .slug{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
  .bdt .sp{margin-left:auto}
  .badge{font-size:9.5px;letter-spacing:.4px;padding:2px 7px;border:1px solid var(--line);border-radius:10px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .badge.ok{color:var(--good);border-color:rgba(34,197,94,.35)}
  .badge.bad{color:var(--danger);border-color:rgba(239,68,68,.35)}
  .badge.warn{color:var(--warn);border-color:rgba(245,158,11,.35)}
  .bdt .bd-detail{display:none;border-top:1px solid var(--line);padding:10px 12px 12px}
  .bdt.open .bd-detail{display:block}
  .bd-detail table{width:100%;border-collapse:collapse;font-size:11.5px}
  .bd-detail td{padding:4px 10px 4px 0;border-bottom:1px solid var(--line);color:var(--secondary);vertical-align:top}
  .bd-detail tr:last-child td{border-bottom:none}
  .bd-detail td.ft{color:var(--muted);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .bd-detail .dlbl{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
  .oschip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:0 5px 5px 0;font-size:11px;color:var(--secondary)}
  .oschip .db{color:var(--muted);font-family:var(--mono);font-size:9.5px}
  @media (max-width:900px){
    .bub-head{padding:10px 10px 8px;gap:7px}
    .bub-meta,.bub-banner{padding-left:10px;padding-right:10px;margin-left:10px;margin-right:10px}
    .bub-banner{margin-left:0;margin-right:0}
    .bub-body{padding:10px 10px 24px}
    .bub-q{max-width:none}
  }

  /* sidebar nav (Map / Kanban) */
  .sidenav{display:flex;gap:6px;margin:2px 12px 8px}
  .sidenav button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .sidenav button:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  /* sidebar resizer (desktop only — on mobile .col.left is a fixed off-canvas drawer,
     so scoping position:relative here keeps it from overriding that and stealing a grid row) */
  @media (min-width:901px){ .col.left{position:relative} }
  .lresizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:25}
  .lresizer:hover,.lresizer.drag{background:var(--accent-tint)}
  /* equal-height controls inside the composer row */
  .composer-row button,.composer-row .sel{height:34px}
  .composer-row .attach-btn,.composer-row .send{width:34px}
  /* clickable dashboard cards */
  .stat.clk,.dcard.clk{cursor:pointer;transition:.15s}
  .stat.clk:hover,.dcard.clk:hover{border-color:var(--line2);background:var(--elev)}

  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes tokIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  @keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

      </div>

        <div class="doc md" id="fileDoc"></div>

      </div>
      <!-- embedded galaxy map (was a separate /map page; now lives above the chat input) -->

        <iframe id="mapFrame" title="Galaxy map" style="width:100%;height:100%;border:0;display:block"></iframe>
      </div>
      <!-- Bubble app data — live structure parsed from the cloned Buildprint workspace -->
      <div id="bubbleView" style="display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden">
        <div class="bub-head">
          <div class="bub-tabs" id="bubTabs">
            <button data-t="dataTypes" class="on" onclick="bubTab('dataTypes')">Data types</button>
            <button data-t="optionSets" onclick="bubTab('optionSets')">Option sets</button>

          <button class="ghost" id="bubRefresh" onclick="refreshBubble()" title="buildprint sync — pull the latest snapshot from Bubble">⟳ Refresh from Bubble</button>

        <div class="bub-meta" id="bubMeta"></div>
        <div class="bub-banner" id="bubBanner" style="display:none"></div>
        <div class="bub-body" id="bubBody"></div>
      </div>

        <div class="kb-toolbar">
          <div class="seg2">
            <button data-k="board" class="on" onclick="showKanban('board')"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg> Board</button>
            <button data-k="list" onclick="showKanban('list')"><svg viewBox="0 0 24 24"><use href="#i-list"/></svg> List</button>
