<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRS Brain</title>
<style>
  :root{
    --bg:#0e0e12; --panel:#131318; --panel2:#1a1a21; --elev:#23232c;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
    --primary:#ECECEF; --secondary:#A6A6A6; --muted:#6c6c78;
    --accent:#5b87ff; --accent2:#49b6ff; --accent-soft:rgba(91,135,255,.14);
    --good:#4ec98a; --warn:#e0b84a; --danger:#e8746b;
    --grad:linear-gradient(135deg,#6a7dff,#49b6ff);
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1100px 560px at 72% -12%, rgba(91,135,255,.07), transparent), var(--bg);
    color:var(--secondary);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

  .app{display:grid;grid-template-columns:274px 1fr 330px;height:100vh}
  .col{overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .col.left{border-right:1px solid var(--line);background:var(--panel)}
  .col.right{border-left:1px solid var(--line);background:var(--panel)}
  .col.center{background:transparent}

  /* brand */
  .brand{padding:16px 16px 12px;display:flex;align-items:center;gap:11px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 4px 14px rgba(91,135,255,.42);flex:0 0 30px}
  .brand h1{font-size:15px;margin:0;color:var(--primary);font-weight:650;letter-spacing:.2px}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px}

  /* account */
  .account{display:flex;align-items:center;gap:9px;margin:2px 12px 6px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;font-size:12px}
  .account .adot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 8px}
  .account .adot.on{background:var(--good);box-shadow:0 0 9px var(--good)}
  .account .ainfo{min-width:0}
  .account .aemail{color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .account .aplan{color:var(--muted);font-size:11px}
  .account .alink{margin-left:auto;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;transition:.15s}
  .account .alink:hover{color:var(--primary)}
  .account .connect{width:100%;background:var(--grad);border:none;color:#fff;font-weight:650;border-radius:9px;padding:9px;font-size:12.5px;cursor:pointer;box-shadow:0 3px 12px rgba(91,135,255,.3);transition:.15s}
  .account .connect:hover{filter:brightness(1.07)}

  /* tabs (segmented) */
  .tabs{display:flex;gap:3px;margin:6px 12px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:7px;font-size:12px;font-weight:600;border-radius:8px;transition:.15s}
  .tabs button.on{color:var(--primary);background:var(--elev)}
  .pane{flex:1;overflow:auto;padding:4px 12px 12px}
  .pane.hide{display:none}

  .newbtn{margin:0 12px 6px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--secondary);border-radius:11px;font-size:12.5px;font-weight:500;width:calc(100% - 24px);text-align:left;display:flex;align-items:center;gap:8px;transition:.15s}
  .newbtn:hover{border-color:rgba(91,135,255,.45);color:var(--primary);background:var(--elev)}

  .item{padding:9px 11px;border-radius:9px;color:var(--secondary);font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;transition:.12s;margin:1px 0}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--accent-soft);color:var(--primary)}
  .item .meta{margin-left:auto;color:var(--muted);font-size:11px;background:rgba(255,255,255,.05);border-radius:20px;padding:0 7px;line-height:17px}
  .item .x{opacity:0;color:var(--muted);font-size:13px;transition:.15s}
  .item:hover .x{opacity:.7}
  .item .x:hover{color:var(--danger)}

  .tree .node{padding:4px 7px;border-radius:7px;font-size:13px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center;transition:.1s}
  .tree .node:hover{background:var(--panel2)}
  .tree .node.file.on{background:var(--accent-soft);color:var(--primary)}
  .tree .dir{color:var(--primary);font-weight:600}
  .tree .children{margin-left:11px;border-left:1px solid var(--line);padding-left:5px}
  .tree .ic{color:var(--muted);width:13px;text-align:center;flex:0 0 13px;font-size:11px}

  /* center header */
  .center-head{padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:58px;flex:0 0 58px;background:rgba(19,19,24,.55);backdrop-filter:blur(10px)}
  .center-head .title{color:var(--primary);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .center-head .spacer{margin-left:auto}
  .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 13px;font-size:12px;transition:.15s}
  .ghost:hover{border-color:rgba(91,135,255,.45);color:var(--primary)}
  .ghost.on{border-color:var(--accent);color:var(--primary);background:var(--accent-soft)}

  /* chat */
  .chat{flex:1;overflow:auto;padding:26px 18px 10px}
  .msg{display:flex;gap:14px;max-width:830px;margin:0 auto 22px;animation:msgIn .45s cubic-bezier(.2,.7,.2,1) both}
  .avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:1px}
  .avatar.bot{background:var(--grad);color:#fff;font-size:14px;box-shadow:0 3px 12px rgba(91,135,255,.35)}
  .avatar.you{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
  .content{min-width:0;flex:1}
  .msg.user .bubble{background:var(--accent-soft);border:1px solid rgba(91,135,255,.2);border-radius:5px 14px 14px 14px;padding:10px 14px;color:var(--primary);display:inline-block;max-width:100%}
  .body{color:var(--secondary)}
  .dim{color:var(--muted)}

  /* streaming reveal */
  .streaming{white-space:pre-wrap;word-break:break-word}
  .tok{opacity:0;animation:tokIn .5s ease forwards}
  .caret{display:inline-block;width:7px;height:1.02em;background:var(--accent);border-radius:2px;vertical-align:text-bottom;margin-left:1px;animation:blink 1.05s steps(1) infinite}
  .statusnote{color:var(--muted);font-style:italic;margin-left:7px;font-size:13px}
  .dots{display:inline-flex;gap:5px;align-items:center;height:20px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  .body.err{color:#e8938b}

  /* composer */
  .composer-wrap{padding:12px 18px 18px}
  .composer{display:flex;gap:6px;align-items:flex-end;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:7px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:border-color .15s,box-shadow .15s;max-width:830px;margin:0 auto}
  .composer:focus-within{border-color:rgba(91,135,255,.55);box-shadow:0 8px 32px rgba(91,135,255,.13)}
  .composer textarea{flex:1;resize:none;background:none;border:none;color:var(--primary);padding:9px 6px;font-family:inherit;font-size:14.5px;max-height:200px;min-height:26px;line-height:1.5}
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--muted)}
  .attach-btn{background:none;border:none;color:var(--muted);width:38px;height:38px;border-radius:11px;font-size:16px;flex:0 0 auto;transition:.15s}
  .attach-btn:hover{background:var(--elev);color:var(--primary)}
  .send{background:var(--grad);border:none;color:#fff;font-weight:700;border-radius:12px;width:38px;height:38px;font-size:17px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 3px 12px rgba(91,135,255,.32)}
  .send:hover{filter:brightness(1.08)}
  .send:disabled{opacity:.4;box-shadow:none;cursor:default}
  .attach-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 22px 10px;max-width:830px;margin:0 auto}
  .attach-chips:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--secondary)}
  .chip .rm{cursor:pointer;color:var(--muted);font-weight:700}
  .chip .rm:hover{color:var(--danger)}
  .chip.up{opacity:.6}

  .msg-atts{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
  .matt{font-size:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--primary)}
  .msg-acts{display:flex;gap:8px;margin-top:10px;opacity:0;transition:opacity .2s}
  .msg:hover .msg-acts{opacity:1}
  .msg-acts button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 11px;font-size:11px;cursor:pointer;transition:.15s}
  .msg-acts button:hover{border-color:rgba(91,135,255,.45);color:var(--primary);background:var(--panel2)}

  /* hero / empty */
  .hero{max-width:460px;margin:12vh auto 0;text-align:center;animation:msgIn .5s ease both}
  .hero-mark{width:54px;height:54px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 18px;box-shadow:0 8px 28px rgba(91,135,255,.4)}
  .hero-t{color:var(--primary);font-size:20px;font-weight:650;margin-bottom:8px}
  .hero-s{color:var(--muted);font-size:13.5px;line-height:1.6}

  /* file editor */
  .editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .editor textarea{flex:1;background:var(--bg);color:var(--primary);border:none;padding:20px 24px;font-family:var(--mono);font-size:13px;line-height:1.65;resize:none}
  .editor textarea:focus{outline:none}
  .doc{flex:1;overflow:auto;padding:26px 34px;max-width:940px}

  /* markdown */
  .md{line-height:1.62}
  .md>*:first-child{margin-top:0}
  .md h1,.md h2,.md h3{color:var(--primary);line-height:1.3;margin:1.3em 0 .5em;font-weight:650}
  .md h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:.3em}
  .md h2{font-size:18px}.md h3{font-size:15px}
  .md p,.md li{color:var(--secondary)}
  .md strong{color:var(--primary)}
  .md code{background:rgba(255,255,255,.07);padding:1.5px 6px;border-radius:5px;font-family:var(--mono);font-size:12.5px;color:#e0b088}
  .md pre{background:#0b0b0e;border:1px solid var(--line);border-radius:11px;padding:14px 16px;overflow:auto;margin:.9em 0}
  .md pre code{background:none;padding:0;color:#d5d5da}
  .md a{color:var(--accent2);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md table{border-collapse:collapse;margin:1em 0;font-size:13px;width:100%}
  .md th,.md td{border:1px solid var(--line);padding:7px 11px;text-align:left}
  .md th{color:var(--primary);background:var(--panel2)}
  .md blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:2px 0 2px 14px;color:var(--muted)}
  .md ul,.md ol{padding-left:22px}
  .md li{margin:.25em 0}

  /* progress */
  .right h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0;padding:18px 16px 10px;display:flex;align-items:center;font-weight:700}
  .cols{padding:0 14px 14px;overflow:auto}
  .pcol{margin-bottom:16px}
  .pcol .hdr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--primary);margin:8px 2px}
  .pcol .hdr .cnt{color:var(--muted);font-weight:500;background:rgba(255,255,255,.05);border-radius:20px;padding:0 7px;line-height:17px;font-size:11px}
  .pcol .pill{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--cardc,var(--line2));border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13px;color:var(--secondary);transition:.15s}
  .card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .card .t{color:var(--primary)}
  .card .n{color:var(--muted);font-size:12px;margin-top:2px}
  .missing .card{--cardc:#c9633b}
  .empty{color:var(--muted);font-size:12px;padding:5px 4px;font-style:italic}
  .refresh{background:none;border:none;color:var(--muted);font-size:13px;margin-left:auto;cursor:pointer;transition:.15s;border-radius:6px;width:24px;height:24px}
  .refresh:hover{color:var(--primary);background:var(--panel2)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--elev);border:1px solid var(--line2);color:var(--primary);padding:10px 18px;border-radius:11px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}

  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes tokIn{from{opacity:0}to{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  @keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <div class="col left">
    <div class="brand"><div class="logo">✦</div><div><h1>CRS Brain</h1><div class="sub" id="repoName"></div></div></div>
    <div class="account" id="account"><span class="aplan">checking connection…</span></div>
    <div class="tabs">
      <button id="tabChats" class="on" onclick="setTab('chats')">Chats</button>
      <button id="tabFiles" onclick="setTab('files')">Files</button>
    </div>
    <div id="chatActions">
      <button class="newbtn" onclick="newChat()">＋ New conversation</button>
      <button class="newbtn" onclick="runDigest()">✨ Weekly digest</button>
    </div>
    <div class="pane" id="paneChats"></div>
    <div class="pane hide tree" id="paneFiles"></div>
  </div>

  <!-- CENTER -->
  <div class="col center">
    <div class="center-head">
      <span class="title" id="centerTitle">New conversation</span>
      <span class="spacer"></span>
      <button class="ghost" id="editToggle" style="display:none" onclick="toggleEdit()">Edit</button>
      <button class="ghost" id="saveBtn" style="display:none" onclick="saveFile()">Save</button>
    </div>
    <!-- chat view -->
    <div id="chatView" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="chat" id="chatLog"></div>
      <div class="composer-wrap">
        <div class="attach-chips" id="attachChips"></div>
        <div class="composer">
          <button class="attach-btn" id="attachBtn" title="Attach files" onclick="pickFiles()">📎</button>
          <textarea id="input" placeholder="Ask about your CRS project…  (Enter to send · Shift+Enter for newline)" rows="1"></textarea>
          <button class="send" id="sendBtn" title="Send" onclick="sendMsg()">↑</button>
        </div>
        <input type="file" id="fileInput" multiple style="display:none" onchange="onFilesPicked(event)">
      </div>
    </div>
    <!-- file view -->
    <div id="fileView" class="editor" style="display:none">
      <div class="doc md" id="fileDoc"></div>
      <textarea id="fileEdit" style="display:none"></textarea>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="col right">
    <h2>Progress <button class="refresh" onclick="loadProgress()" title="Reload">↻</button></h2>
    <div class="cols" id="progress"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = { tab:'chats', chatId:null, filePath:null, editing:false, sending:false, pending:[] };

// ---------- tiny markdown renderer (no external deps) ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
function renderMd(src){
  const lines = src.replace(/\r/g,'').split('\n');
  let html='', i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){ let code=''; i++; while(i<lines.length && !/^```/.test(lines[i])){code+=lines[i]+'\n';i++;} i++; html+='<pre><code>'+esc(code)+'</code></pre>'; continue; }
    if(/^#{1,6}\s/.test(l)){ const n=l.match(/^#+/)[0].length; html+=`<h${n}>${mdInline(l.replace(/^#+\s/,''))}</h${n}>`; i++; continue; }
    if(/^\s*>/.test(l)){ let q=''; while(i<lines.length && /^\s*>/.test(lines[i])){q+=lines[i].replace(/^\s*>\s?/,'')+' ';i++;} html+='<blockquote>'+mdInline(q)+'</blockquote>'; continue; }
    if(/^\s*[-*+]\s/.test(l)){ html+='<ul>'; while(i<lines.length && /^\s*[-*+]\s/.test(lines[i])){html+='<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s/,''))+'</li>';i++;} html+='</ul>'; continue; }
    if(/^\s*\d+\.\s/.test(l)){ html+='<ol>'; while(i<lines.length && /^\s*\d+\.\s/.test(lines[i])){html+='<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++;} html+='</ol>'; continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i+1])){
      const row=(x)=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(l); i+=2; let body='';
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ body+='<tr>'+row(lines[i]).map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>'; i++; }
      html+='<table><thead><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table>'; continue;
    }
    if(l.trim()===''){ i++; continue; }
    let para=l; i++;
    while(i<lines.length && lines[i].trim()!=='' && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>)/.test(lines[i])){ para+=' '+lines[i]; i++; }
    html+='<p>'+mdInline(para)+'</p>';
  }
  return html;
}

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
async function api(path,opts){ const r=await fetch(path,opts); if(!r.ok){const e=await r.json().catch(()=>({error:r.status})); throw new Error(e.error||'error');} return r.json(); }

// ---------- tabs ----------
function setTab(t){ state.tab=t;
  $('tabChats').classList.toggle('on',t==='chats'); $('tabFiles').classList.toggle('on',t==='files');
  $('paneChats').classList.toggle('hide',t!=='chats'); $('paneFiles').classList.toggle('hide',t!=='files');
  $('chatActions').style.display = t==='chats' ? '' : 'none';
}

// ---------- chats ----------
async function loadChats(){
  const {chats}=await api('/api/chats');
  $('paneChats').innerHTML = chats.length? '' : '<div class="empty" style="padding:12px">No conversations yet.</div>';
  for(const c of chats){
    const d=document.createElement('div'); d.className='item'+(c.id===state.chatId?' on':'');
    d.innerHTML=`<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'Untitled')}</span><span class="meta">${c.count}</span><span class="x" title="Delete">✕</span>`;
    d.onclick=(e)=>{ if(e.target.classList.contains('x')){delChat(c.id);return;} openChat(c.id); };
    $('paneChats').appendChild(d);
  }
}
function heroHtml(){ return '<div class="hero"><div class="hero-mark">✦</div><div class="hero-t">CRS Brain</div><div class="hero-s">Ask about progress, decisions, what\'s next, or what\'s missing. Attach files with 📎, or ask for anything in markdown and open it as a document.</div></div>'; }
function newChat(){ state.chatId=null; showChat(); $('chatLog').innerHTML=heroHtml(); $('centerTitle').textContent='New conversation'; loadChats(); $('input').focus(); }
async function openChat(id){ state.chatId=id; showChat(); const chat=await api('/api/chat?id='+id); $('centerTitle').textContent=chat.title||'Conversation'; renderChat(chat.messages); loadChats(); }
async function delChat(id){ await api('/api/chat?id='+id,{method:'DELETE'}); if(state.chatId===id) newChat(); else loadChats(); }

function attsHtml(atts){ return atts&&atts.length?`<div class="msg-atts">${atts.map(x=>`<span class="matt">📎 ${esc((''+x).split('/').pop())}</span>`).join('')}</div>`:''; }
function userMsgEl(content, atts){
  const el=document.createElement('div'); el.className='msg user';
  const body=content?esc(content).replace(/\n/g,'<br>'):'<span class="dim">(files attached)</span>';
  el.innerHTML=`<div class="avatar you">You</div><div class="content"><div class="bubble">${attsHtml(atts)}${body}</div></div>`;
  return el;
}
function botMsgEl(){
  const el=document.createElement('div'); el.className='msg assistant';
  el.innerHTML=`<div class="avatar bot">✦</div><div class="content"><div class="body md"></div></div>`;
  return el;
}
function renderChat(messages){
  const log=$('chatLog'); log.innerHTML='';
  for(const m of messages){
    if(m.role==='user'){ log.appendChild(userMsgEl(m.content, m.attachments)); }
    else{
      const el=botMsgEl(); el.querySelector('.body').innerHTML=renderMd(m.content||'');
      if(m.content) addReplyActions(el, m.content);
      log.appendChild(el);
    }
  }
  log.scrollTop=log.scrollHeight;
}

// Action bar under each assistant reply: save it as a .md doc and open it, or copy.
function addReplyActions(msgEl, text){
  const host=msgEl.querySelector('.content')||msgEl;
  const acts=document.createElement('div'); acts.className='msg-acts';
  const b1=document.createElement('button'); b1.textContent='📄 Open as doc';
  b1.onclick=()=>openReplyDoc(text, $('centerTitle').textContent);
  const b2=document.createElement('button'); b2.textContent='⧉ Copy';
  b2.onclick=()=>{ navigator.clipboard.writeText(text).then(()=>toast('Copied')); };
  acts.appendChild(b1); acts.appendChild(b2); host.appendChild(acts);
}
async function openReplyDoc(text, title){
  try{
    const r=await api('/api/savedoc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title||'brain-doc',content:text})});
    await loadFiles(); setTab('files'); openFile(r.path); toast('Saved & opened  ·  '+r.path);
  }catch(e){ toast('Could not save: '+e.message); }
}
function showChat(){ $('chatView').style.display='flex'; $('fileView').style.display='none'; $('editToggle').style.display='none'; $('saveBtn').style.display='none'; }

function sendMsg(){
  const input=$('input'); const text=input.value.trim();
  const atts=(state.pending||[]).filter(a=>a.path);
  if((!text && !atts.length)||state.sending) return;
  input.value=''; input.style.height='auto';
  const attachments=atts.map(a=>a.path); const attachmentNames=atts.map(a=>a.name);
  state.pending=[]; renderChips();
  streamChat(text,{attachments,attachmentNames});
}

// ---------- attachments ----------
function pickFiles(){ $('fileInput').click(); }
function renderChips(){
  const box=$('attachChips'); box.innerHTML='';
  (state.pending||[]).forEach((a,i)=>{
    const c=document.createElement('span'); c.className='chip'+(a.path?'':' up');
    c.innerHTML=`📎 ${esc(a.name)} ${a.path?`<span class="rm" title="Remove">✕</span>`:'<span class="spin"></span>'}`;
    if(a.path) c.querySelector('.rm').onclick=()=>{ state.pending.splice(i,1); renderChips(); };
    box.appendChild(c);
  });
}
async function onFilesPicked(ev){
  const files=[...ev.target.files]; ev.target.value='';
  if(!state.pending) state.pending=[];
  for(const f of files){
    const entry={name:f.name,path:null}; state.pending.push(entry); renderChips();
    try{
      const dataBase64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });
      const out=await api('/api/attach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,dataBase64})});
      entry.path=out.path;
    }catch(e){ toast('Attach failed: '+e.message); state.pending=state.pending.filter(x=>x!==entry); }
    renderChips();
  }
}

// ---------- streaming chat with smooth typewriter reveal ----------
async function streamChat(text, opts={}){
  if(state.sending) return;
  showChat();
  const log=$('chatLog');
  if(log.querySelector('.hero')||log.querySelector('.empty')) log.innerHTML='';
  log.appendChild(userMsgEl(text, opts.attachmentNames));
  const a=botMsgEl(); const body=a.querySelector('.body');
  body.classList.add('streaming');
  body.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  log.appendChild(a);
  log.scrollTop=log.scrollHeight;
  state.sending=true; $('sendBtn').disabled=true;

  // reveal machinery — decoupled from network chunk size for a smooth flow.
  // Uses setTimeout (not requestAnimationFrame): rAF is fully paused in hidden
  // tabs, which would strand the reply on the loading dots. setTimeout still
  // fires (throttled) so the final render is always guaranteed.
  let full='', revealed=0, streamDone=false, errored=false, started=false, finalized=false;
  const caret=document.createElement('span'); caret.className='caret';
  const nearBottom=()=> log.scrollHeight-log.scrollTop-log.clientHeight < 150;
  function pump(){
    if(errored||finalized) return;
    if(!started && full.length){ body.innerHTML=''; body.appendChild(caret); started=true; }
    if(revealed<full.length){
      const remaining=full.length-revealed;
      const step = remaining>240 ? remaining-200 : 3;   // steady typing; catch up only if far behind
      const slice=full.slice(revealed, revealed+step); revealed+=slice.length;
      const frag=document.createDocumentFragment();
      slice.split(/(\s+)/).forEach(t=>{ if(t===''){return;} const s=document.createElement('span'); s.className='tok'; s.textContent=t; frag.appendChild(s); });
      body.insertBefore(frag, caret);
      if(nearBottom()) log.scrollTop=log.scrollHeight;
    }
    if(streamDone && revealed>=full.length){ return finalize(); }
    setTimeout(pump, 16);
  }
  function finalize(){
    if(errored||finalized) return; finalized=true;
    body.classList.remove('streaming');
    body.style.opacity='0'; body.innerHTML=renderMd(full);
    setTimeout(()=>{ body.style.transition='opacity .28s ease'; body.style.opacity='1'; }, 20);
    addReplyActions(a, full);
    if(nearBottom()) log.scrollTop=log.scrollHeight;
  }
  setTimeout(pump, 16);

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.chatId,message:text,title:opts.title,attachments:opts.attachments||[]})});
    if(!res.body) throw new Error('no stream');
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='meta'){ state.chatId=ev.id; if(ev.title) $('centerTitle').textContent=ev.title; }
        else if(ev.type==='status'){ if(!full && !started){ body.innerHTML=`<span class="dots"><i></i><i></i><i></i></span><span class="statusnote">${esc(ev.text)}…</span>`; } }
        else if(ev.type==='delta'){ full+=ev.text; }
        else if(ev.type==='done'){ state.chatId=ev.id; full=ev.reply||full; streamDone=true; if(ev.title) $('centerTitle').textContent=ev.title; }
        else if(ev.type==='error'){ errored=true; body.classList.remove('streaming'); body.classList.add('err'); body.innerHTML='⚠  '+esc(ev.error); }
      }
    }
    streamDone=true;
    loadChats(); loadProgress();
  }catch(e){
    if(!errored){ errored=true; body.classList.remove('streaming'); body.classList.add('err'); body.innerHTML='⚠  '+esc(e.message); }
  }finally{
    state.sending=false; $('sendBtn').disabled=false;
  }
}

// Weekly digest — pull recent git commits + progress board, ask the Brain to synthesize.
async function runDigest(){
  if(state.sending) return;
  newChat();
  toast('Gathering recent changes…');
  try{
    const ctx=await api('/api/digest-context?days=7');
    const prog=JSON.stringify(ctx.progress,null,2);
    const msg=`Weekly digest. Use ONLY the context provided below — do not read repo files (keep this fast). Tell me:\n`+
      `1) What changed in the last ${ctx.days} days\n2) What's in progress now\n3) What's next\n4) Anything missing, stalled, or at risk.\n`+
      `Be concise and specific.\n\n`+
      `## Git commits (last ${ctx.days} days)\n${ctx.log||'(none)'}\n\n## Progress board\n\`\`\`json\n${prog}\n\`\`\``;
    streamChat(msg,{title:'Weekly digest — '+new Date().toISOString().slice(0,10)});
  }catch(e){ toast('Digest failed: '+e.message); }
}

// ---------- files ----------
async function loadFiles(){
  const {root,tree}=await api('/api/files'); $('repoName').textContent=root;
  const box=$('paneFiles'); box.innerHTML=''; box.appendChild(renderTree(tree,true));
}
function renderTree(nodes,open){
  const wrap=document.createElement('div');
  for(const n of nodes){
    if(n.type==='dir'){
      const d=document.createElement('div'); d.className='node dir';
      d.innerHTML=`<span class="ic">▸</span>${esc(n.name)}`;
      const kids=renderTree(n.children,false); kids.className='children'; kids.style.display=open?'block':'none';
      if(open) d.querySelector('.ic').textContent='▾';
      d.onclick=(e)=>{e.stopPropagation(); const vis=kids.style.display!=='none'; kids.style.display=vis?'none':'block'; d.querySelector('.ic').textContent=vis?'▸':'▾';};
      wrap.appendChild(d); wrap.appendChild(kids);
    }else{
      const f=document.createElement('div'); f.className='node file'; f.dataset.path=n.path;
      f.innerHTML=`<span class="ic">·</span>${esc(n.name)}`;
      f.onclick=()=>openFile(n.path);
      wrap.appendChild(f);
    }
  }
  return wrap;
}
async function openFile(p){
  state.filePath=p; state.editing=false;
  document.querySelectorAll('.tree .file').forEach(el=>el.classList.toggle('on',el.dataset.path===p));
  $('chatView').style.display='none'; $('fileView').style.display='flex';
  $('centerTitle').textContent=p;
  const isMd=/\.md$/i.test(p);
  $('editToggle').style.display = /\.(md|txt|json|css|js|py|csv|ya?ml|html)$/i.test(p) ? '' : 'none';
  $('editToggle').classList.remove('on'); $('saveBtn').style.display='none';
  const {content}=await api('/api/file?path='+encodeURIComponent(p));
  $('fileEdit').value=content;
  const doc=$('fileDoc');
  doc.className = isMd ? 'doc md' : 'doc';
  doc.style.display='block'; $('fileEdit').style.display='none';
  doc.innerHTML = isMd ? renderMd(content) : '<pre style="white-space:pre-wrap;font-family:var(--mono);font-size:13px;color:var(--secondary)">'+esc(content)+'</pre>';
}
function toggleEdit(){
  state.editing=!state.editing;
  $('editToggle').classList.toggle('on',state.editing);
  $('saveBtn').style.display=state.editing?'':'none';
  $('fileDoc').style.display=state.editing?'none':'block';
  $('fileEdit').style.display=state.editing?'block':'none';
  if(!state.editing) openFile(state.filePath);
}
async function saveFile(){
  await api('/api/file',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:state.filePath,content:$('fileEdit').value})});
  toast('Saved  ·  '+state.filePath); state.editing=false; $('saveBtn').style.display='none'; $('editToggle').classList.remove('on'); openFile(state.filePath);
}

// ---------- progress ----------
const COLS=[['now','Now','#5b87ff'],['next','Next','#e0b84a'],['later','Later','#6c6c78'],['done','Done','#4ec98a']];
async function loadProgress(){
  const p=await api('/api/progress'); const box=$('progress'); box.innerHTML='';
  for(const [key,label,color] of COLS){
    const items=(p.columns&&p.columns[key])||[];
    const col=document.createElement('div'); col.className='pcol';
    col.innerHTML=`<div class="hdr"><span class="pill" style="background:${color}"></span>${label}<span class="cnt">${items.length}</span></div>`;
    if(!items.length) col.innerHTML+='<div class="empty">—</div>';
    for(const it of items){ const c=document.createElement('div'); c.className='card'; c.style.setProperty('--cardc',color); c.innerHTML=`<div class="t">${esc(it.title||'')}</div>${it.note?`<div class="n">${esc(it.note)}</div>`:''}`; col.appendChild(c); }
    box.appendChild(col);
  }
  const missing=(p.missing||[]);
  const m=document.createElement('div'); m.className='pcol missing';
  m.innerHTML=`<div class="hdr"><span class="pill" style="background:#c9633b"></span>Missing / gaps<span class="cnt">${missing.length}</span></div>`;
  if(!missing.length) m.innerHTML+='<div class="empty">—</div>';
  for(const x of missing){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<div class="t">${esc(typeof x==='string'?x:(x.title||''))}</div>`; m.appendChild(c); }
  box.appendChild(m);
}

// ---------- input UX ----------
const inp=$('input');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';});
inp.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });

// ---------- account / connection ----------
async function loadAuth(){
  const box=$('account');
  try{
    const a=await api('/api/auth/status');
    if(a.loggedIn){
      const plan=(a.subscriptionType||'').replace(/^\w/,c=>c.toUpperCase());
      const method=a.authMethod==='claude.ai'?'subscription':(a.authMethod||'');
      box.innerHTML=`<span class="adot on"></span><div class="ainfo"><div class="aemail" title="${esc(a.email||'')}">${esc(a.email||'Connected')}</div><div class="aplan">${esc(plan||'Claude')} · ${esc(method)}</div></div><button class="alink" onclick="logoutClaude()">Disconnect</button>`;
    }else{
      box.innerHTML=`<button class="connect" onclick="connectClaude()">🔗 Connect Claude account</button>`;
    }
  }catch(e){
    box.innerHTML=`<button class="connect" onclick="connectClaude()">🔗 Connect Claude account</button>`;
  }
}
async function connectClaude(){
  $('account').innerHTML=`<span class="aplan">opening sign-in window…</span>`;
  try{ await api('/api/auth/login',{method:'POST'}); }catch(e){ toast('Could not start login: '+e.message); return loadAuth(); }
  toast('A sign-in window opened — finish in your browser.');
  let tries=0; const iv=setInterval(async()=>{
    tries++;
    try{ const a=await api('/api/auth/status'); if(a.loggedIn){ clearInterval(iv); loadAuth(); toast('Connected as '+a.email); } }catch{}
    if(tries>80){ clearInterval(iv); loadAuth(); }
  },3000);
}
async function logoutClaude(){
  if(!confirm('Disconnect your Claude account? Chat will stop working until you reconnect.')) return;
  try{ await api('/api/auth/logout',{method:'POST'}); }catch{}
  loadAuth(); toast('Disconnected');
}

// ---------- boot ----------
(async function(){ loadAuth(); await loadChats(); await loadFiles(); await loadProgress(); newChat(); })();
</script>
