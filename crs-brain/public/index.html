  .expl-tree .en .tn{overflow:hidden;text-overflow:ellipsis}
  .expl-tree .kids{display:none}
  .expl-tree .kids.open{display:block}
  .expl-main{grid-area:main;overflow:auto;position:relative;outline:none}
  .expl-main.grid{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px;align-content:start}
  .expl-lh{display:grid;grid-template-columns:1fr 128px 78px 74px;gap:10px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;z-index:2}
  .expl-lh span{cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none}
  .expl-lh span:hover{color:var(--secondary)}
  .expl-lh .ar{font-size:8px}
  .expl-list{padding-bottom:20px}
  .expl-row{display:grid;grid-template-columns:1fr 128px 78px 74px;gap:10px;align-items:center;padding:5px 14px;font-size:13px;color:var(--secondary);cursor:default}

  .expl-row .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .expl-row .cmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* flat OS selection: background tint ONLY — no transform, no border, no transition */
  .expl-row,.expl-item{transition:none;transform:none}
  .expl-row:hover,.expl-item:hover{background:var(--panel2)}
  .expl-row.xsel,.expl-item.xsel{background:var(--accent-tint)}
  .expl-row.xsel .rn,.expl-item.xsel .nm{color:var(--primary)}

  .iv.show-ui .iv-ui{opacity:1;pointer-events:auto}
  .iv-ctl{display:flex;align-items:center;gap:2px;background:rgba(18,18,22,.85);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:4px;backdrop-filter:blur(6px)}
  .iv-ctl button,.iv-ctl a{width:28px;height:28px;border-radius:7px;background:none;border:0;color:#A6A6A6;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:13px;text-decoration:none;transition:background .16s ease-in-out,color .16s ease-in-out}
  .iv-ctl button:hover,.iv-ctl a:hover{background:rgba(255,255,255,.09);color:#E0E0E0}
  .iv-ctl .iv-pct{min-width:48px;text-align:center;color:#E0E0E0;font-family:var(--mono);font-size:11px}
  .iv-ctl .txt{width:auto;padding:0 9px;font-size:11px;font-weight:600}
  /* immersive fullscreen for image windows: chrome hidden, image only + ✕ (Esc exits) */
  .docwin.dw-imgfs{border-radius:0;border:none}
  .docwin.dw-imgfs .dp-head{display:none}
  /* native browser fullscreen: beat the inline rect styles so the element truly
     covers the monitor (inline width/height would otherwise win over UA styles) */
  .docwin.dw-imgfs:fullscreen{left:0 !important;top:0 !important;width:100vw !important;height:100vh !important}
  .iv-close{display:none;position:absolute;top:14px;right:16px;z-index:5;width:40px;height:40px;border:0;border-radius:10px;background:rgba(18,18,22,.6);color:#E0E0E0;cursor:pointer;align-items:center;justify-content:center;transition:background .16s ease-in-out}
  .iv-close:hover{background:rgba(18,18,22,.92)}
  .docwin.dw-imgfs .iv-close{display:flex}
  .iv-chev{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:56px;border:0;border-radius:9px;background:rgba(18,18,22,.6);color:#E0E0E0;font-size:22px;line-height:1;cursor:pointer;opacity:0;transition:opacity .16s ease-in-out;pointer-events:none;z-index:2}
  .iv.show-ui .iv-chev{opacity:.85;pointer-events:auto}
  .iv-chev:hover{background:rgba(18,18,22,.92)}
  .iv-chev.prev{left:10px}.iv-chev.next{right:10px}
  .iv-chev:disabled{opacity:.15!important;pointer-events:none}
  .iv-strip{display:flex;gap:6px;max-width:92%;overflow-x:auto;padding:5px;background:rgba(18,18,22,.85);border:1px solid rgba(255,255,255,.09);border-radius:10px;backdrop-filter:blur(6px)}
  .iv-th{width:56px;height:42px;flex:0 0 auto;border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#000;padding:0}
  .iv-th img{width:100%;height:100%;object-fit:cover;display:block}
  .iv-th.on{border-color:var(--accent)}   /* border-only current marker — thumbnails have no text to tint */
  .iv-cnt{color:var(--muted);font-size:11px;font-family:var(--mono);flex:0 0 auto}
  /* in-app page windows (single-app rule — tool pages never open a browser tab) */
  .dp-page{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  /* fullscreen HTML overlay (sandboxed) */
  .htmlfull{position:fixed;inset:0;z-index:350;background:var(--bg);display:none;flex-direction:column}
  .htmlfull.show{display:flex}
  .htmlfull .hf-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .htmlfull .hf-name{color:var(--primary);font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .htmlfull .hf-bar button{width:30px;height:30px;border-radius:7px;background:none;border:1px solid transparent;color:var(--secondary);cursor:pointer}
  .htmlfull .hf-bar button:hover{background:var(--panel2);color:var(--primary);border-color:var(--line)}
  .htmlfull iframe{flex:1;border:0;background:#fff}
  /* prototype-studio chrome on the fullscreen bar (parent chrome — the sandboxed iframe can't host it) */
  .htmlfull .hf-bar button.hf-pbtn{width:auto;padding:0 11px;font:inherit;font-size:12px;font-weight:600;height:30px}
  /* sidebar3: overlay-scoped control — quieter ghost so it can't read as an app-header toggle */
  .htmlfull .hf-bar button.hf-pbtn.hf-scoped{font-size:11px;font-weight:500;height:26px;padding:0 9px;color:var(--muted)}
  .htmlfull .hf-bar button.hf-pbtn.hf-scoped:hover{color:var(--primary)}
  .hf-proto{display:flex;align-items:center;gap:7px}
  .hf-chip{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:var(--radius-pill);text-transform:uppercase}
  .hf-chip.st-draft{background:var(--panel2);color:var(--secondary);border:1px solid var(--line)}
  .hf-chip.st-settled{background:var(--accent-tint);color:var(--accent2);border:1px solid var(--accent-border-active)}
  .hf-chip.st-built{background:var(--success-tint);color:var(--success);border:1px solid var(--success)}
  /* undo toast (interactive, unlike .toast) */
  .utoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--elev);border:1px solid var(--line2);color:var(--primary);padding:9px 10px 9px 16px;border-radius:11px;font-size:13px;display:none;align-items:center;gap:12px;z-index:370;box-shadow:var(--shadow-dropdown)}
  .utoast.show{display:flex}
  .utoast button{background:var(--accent);border:0;color:#fff;border-radius:7px;padding:6px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .utoast button:hover{background:var(--accent-hover)}
  /* properties popup */
  .proppop{position:fixed;inset:0;z-index:360;background:var(--overlay);display:none;align-items:center;justify-content:center}
  .proppop.show{display:flex}
  .proppop .pp-box{width:360px;background:var(--panel);border:1px solid var(--line2);border-radius:13px;box-shadow:var(--shadow-modal);overflow:hidden}
  .proppop .pp-head{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
  .proppop .pp-head .tico{width:34px;height:34px}.proppop .pp-head .tico svg{width:34px;height:34px}
  .proppop .pp-name{color:var(--primary);font-weight:600;font-size:14px;word-break:break-all;flex:1}
  .proppop .pp-x{width:26px;height:26px;border-radius:6px;background:none;border:0;color:var(--muted);cursor:pointer;flex:0 0 auto}
  .proppop .pp-x:hover{background:var(--panel2);color:var(--primary)}
  .proppop .pp-rows{padding:4px 16px 16px;display:flex;flex-direction:column;gap:7px}
  .proppop .pp-row{display:flex;gap:10px;font-size:12.5px;align-items:baseline}
  .proppop .pp-row .k{color:var(--muted);width:74px;flex:0 0 auto}
  .proppop .pp-row .v{color:var(--secondary);word-break:break-all;flex:1}
  .proppop .pp-row .cp{border:1px solid var(--line2);background:none;color:var(--muted);border-radius:5px;font-size:10.5px;padding:1px 7px;cursor:pointer;flex:0 0 auto}
  .proppop .pp-row .cp:hover{color:var(--primary);border-color:var(--line3)}
  /* chat search */
  /* sidebar3: one row = search (flex) + 32px icon-ghost "+" (new conversation) */
  #chatActions{display:flex;align-items:center;gap:6px;margin:0 12px 8px}
  .chat-search{display:block;flex:1 1 auto;min-width:0;background:var(--panel2);border:1px solid var(--input-border);border-radius:var(--radius-input);color:var(--primary);padding:8px 11px;font-size:12.5px;font-family:inherit;outline:none}
  .chat-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .chat-new{flex:0 0 32px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;border-radius:8px;color:var(--muted);cursor:pointer;padding:0;transition:var(--transition)}
  .chat-new:hover{background:var(--veil);color:var(--primary)}
  .chat-new .ic{width:16px;height:16px}
  .item .snip{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  mark.hl{background:rgba(249,115,22,.35);color:var(--primary);border-radius:2px;padding:0 1px}

  /* ───── mobile (≤900px): columns become slide-in drawers ───── */
  .mbtn{display:none;background:none;border:1px solid var(--line);color:var(--secondary);border-radius:6px;width:34px;height:34px;font-size:15px;flex:0 0 auto}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .col.left,.col.right{position:fixed;top:0;bottom:0;width:min(84vw,320px);z-index:40;transition:transform .25s ease;box-shadow:var(--shadow-dropdown)}
    .col.left{left:0;transform:translateX(-105%);border-right:1px solid var(--line2)}
    .col.right{right:0;transform:translateX(105%);border-left:1px solid var(--line2)}
    .col.left.show,.col.right.show{transform:translateX(0)}
    .mbtn{display:inline-flex;align-items:center;justify-content:center}
    .col-collapse,.expand-handle{display:none!important}
    .center-head{padding:0 10px;gap:8px}
    .center-head .title{font-size:13px;min-width:0}
    /* icon-only view switcher on phones so the header fits */
    .viewseg .vlbl{display:none}
    .viewseg button{padding:6px 9px}
    .sel{padding:6px 20px 6px 6px;font-size:11px;max-width:86px}
    .chat{padding:16px 10px 10px}
    .composer-wrap{padding:8px 10px 12px}
    .ingest-btn.show{padding:0 10px;font-size:11px}
    .doc{padding:16px 14px}
    .mscrim{display:none;position:fixed;inset:0;background:var(--overlay);z-index:35}
    .mscrim.show{display:block}
  }

  /* progress */
  .right h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0;padding:18px 16px 10px;display:flex;align-items:center;font-weight:700}
  .cols{padding:0 14px 14px;overflow:auto;flex:1;min-height:0}
  .right h2:first-child{padding-top:16px}
  .pcol{margin-bottom:16px}
  .pcol .hdr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--primary);margin:8px 2px}
  .pcol .hdr .cnt{color:var(--muted);font-weight:500;background:var(--veil);border-radius:20px;padding:0 7px;line-height:17px;font-size:11px}
  .pcol .pill{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--cardc,var(--line2));border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13px;color:var(--secondary);transition:var(--transition)}
  .card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .card .t{color:var(--primary)}
  .card .n{color:var(--muted);font-size:12px;margin-top:2px}
  .missing .card{--cardc:var(--error)}
  .empty{color:var(--muted);font-size:12px;padding:5px 4px;font-style:italic}
  .refresh{background:none;border:none;color:var(--muted);font-size:13px;margin-left:auto;cursor:pointer;transition:var(--transition);border-radius:6px;width:24px;height:24px}
  .refresh:hover{color:var(--primary);background:var(--panel2)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--elev);border:1px solid var(--line2);color:var(--primary);padding:10px 18px;border-radius:var(--radius-card);font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:400;box-shadow:var(--shadow-dropdown)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}

  /* icon + text alignment */
  .matt{display:inline-flex;align-items:center;gap:5px}
  .avatar .ic{width:16px;height:16px}
  .hero-mark .ic{width:26px;height:26px}

  /* usage panel */
  .usage{padding:0 14px 6px}
  .usage .ucard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-card);padding:12px 13px;font-size:12px}
  .usage .urow{margin-bottom:12px}
  .usage .urow:last-child{margin-bottom:0}
  .usage .ulabel{display:flex;align-items:center;gap:6px;color:var(--secondary);margin-bottom:6px}
  .usage .ulabel b{color:var(--primary);font-weight:600}
  .usage .ulabel .pctv{margin-left:auto;color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums}
  .usage .bar{height:7px;border-radius:20px;background:var(--veil);overflow:hidden}
  .usage .bar span{display:block;height:100%;border-radius:20px;transition:width .5s ease}
  .usage .sub{color:var(--muted);font-size:11px;margin-top:5px;display:flex}
  .usage .sub .reset{margin-left:auto}
  .usage .updated{color:var(--muted);font-size:11px;margin-top:10px;display:flex;align-items:center;gap:6px}
  .usage .enable{width:100%;background:var(--grad);border:none;color:#fff;font-weight:650;border-radius:6px;padding:9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .usage .enable:hover{background:var(--accent-hover)}
  .usage .note{color:var(--muted);font-size:11px;line-height:1.5;margin-top:9px}
  .usage .off{color:var(--secondary);display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .usage .disable{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-top:9px}
  .usage .disable:hover{color:var(--primary)}

  /* build-plan panel (right column) — packet steps → Buildprint prompts */
  .plan{padding:0 14px 6px}
  .plan .pkt-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--primary);font-weight:600;margin:2px 0 5px}
  .plan .pkt-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:10.5px}
  .plan .pksel{width:100%;margin:0 0 8px;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:7px;padding:6px 8px;font-size:11.5px;font-family:inherit}
  .plan .pstep{display:flex;align-items:flex-start;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .plan .pstep:last-child{border-bottom:none}
  .plan .pdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line3);margin-top:4px;flex:0 0 8px}
  .plan .pstep.active .pdot{background:var(--accent);border-color:var(--accent)}
  .plan .pstep.done .pdot{background:var(--good);border-color:var(--good)}
  .plan .pt{flex:1;font-size:12px;color:var(--secondary);line-height:1.45;min-width:0}
  .plan .pstep.active .pt{color:var(--primary)}
  .plan .pdetail{display:none;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .plan .pstep.open .pdetail{display:block}
  .plan .pst{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:2px 6px;border:1px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:2px}
  .plan .pst:hover{color:var(--primary);border-color:var(--line3)}
  .plan .pempty{color:var(--muted);font-size:11.5px;line-height:1.55;padding:4px 0 8px}
  .pdraft{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:var(--accent);border:none;color:#fff;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--transition)}
  .pdraft:hover{background:var(--accent-hover)}
  .pdraft:disabled{opacity:.5;cursor:default}
  /* dashboard build-plan card bits */
  .np-mod{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
  .np-title{font-size:13px;color:var(--primary);font-weight:600;line-height:1.45;margin-bottom:4px}
  .np-gen{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .np-gen input{flex:1;margin:0;background:var(--panel2);border:1px solid var(--line);color:var(--primary);border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;min-width:0}
  .np-gen input:focus{border-color:var(--accent)}
  .np-gen .pdraft{margin-top:0}

  /* Bubble data view — live app structure from the Buildprint workspace */
  .bub-head{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
  .bub-tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:1px}
  .bub-tabs button{background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:var(--transition);white-space:nowrap}
  .bub-tabs button:hover{color:var(--secondary)}
  .bub-tabs button.on{background:var(--bg-elevated);color:var(--text-primary)}   /* greyscale toggle rule */
  .bub-q{flex:1;min-width:110px;max-width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--primary);padding:6px 9px;font-size:12px;font-family:inherit;outline:none}
  .bub-q:focus{border-color:var(--accent)}
  .bub-del{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;cursor:pointer;user-select:none}
  .bub-meta{padding:8px 18px 0;color:var(--muted);font-size:11.5px;flex:0 0 auto}
  .bub-banner{margin:10px 18px 0;border:1px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--secondary);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
  .bub-banner .pdraft{margin-top:0}
  .bub-body{flex:1;overflow:auto;padding:12px 18px 30px}
  .bdt{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .bdt .bd-row{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
  .bdt .bd-row:hover{background:var(--panel2)}
  .bdt .nm{color:var(--primary);font-weight:600;font-size:12.5px}
  .bdt.deleted .nm{color:var(--muted);text-decoration:none;opacity:.75}
  .bdt .slug{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
  .bdt .sp{margin-left:auto}
  .badge{font-size:9.5px;letter-spacing:.4px;padding:2px 7px;border:1px solid var(--line);border-radius:10px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .badge.ok{color:var(--good);border-color:rgba(34,197,94,.35)}
  .badge.bad{color:var(--danger);border-color:rgba(239,68,68,.35)}
  .badge.warn{color:var(--warn);border-color:var(--warning)}
  .bdt .bd-detail{display:none;border-top:1px solid var(--line);padding:10px 12px 12px}
  .bdt.open .bd-detail{display:block}
  .bd-detail table{width:100%;border-collapse:collapse;font-size:11.5px}
  .bd-detail td{padding:4px 10px 4px 0;border-bottom:1px solid var(--line);color:var(--secondary);vertical-align:top}
  .bd-detail tr:last-child td{border-bottom:none}
  .bd-detail td.ft{color:var(--muted);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .bd-detail .dlbl{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
  .oschip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:0 5px 5px 0;font-size:11px;color:var(--secondary)}
  .oschip .db{color:var(--muted);font-family:var(--mono);font-size:9.5px}
  @media (max-width:900px){
    .bub-head{padding:10px 10px 8px;gap:7px}
    .bub-meta,.bub-banner{padding-left:10px;padding-right:10px;margin-left:10px;margin-right:10px}
    .bub-banner{margin-left:0;margin-right:0}
    .bub-body{padding:10px 10px 24px}
    .bub-q{max-width:none}
  }

  /* sidebar resizer (desktop only — on mobile .col.left is a fixed off-canvas drawer,
     so scoping position:relative here keeps it from overriding that and stealing a grid row) */
  @media (min-width:901px){ .col.left{position:relative} }
  .lresizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:25}
  .lresizer:hover,.lresizer.drag{background:var(--accent-tint)}
  /* equal-height controls inside the composer row */
  .composer-row button,.composer-row .sel{height:34px}
  .composer-row .attach-btn,.composer-row .send{width:34px}

  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes tokIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<script>
const $ = (id) => document.getElementById(id);
const svg = (name,cls) => `<svg class="ic ${cls||''}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${name}"/></svg>`;
let state = { tab:'chats', chatId:null, filePath:null, editing:false, sending:false, pending:[], queue:[], populating:false, abort:null, stopped:false, viewGen:0, live:null };
// Called whenever the center view changes (open a chat/file/dashboard). Lets an
// in-flight stream detect it's no longer the active view, and frees the composer.
function bumpView(){ state.viewGen++; if(!(state.live && !state.live.done)) return; state.sending=false; if(typeof setGenerating==='function') setGenerating(false); }
function setGenerating(on){
  const s=$('sendBtn'), st=$('stopBtn'), ig=$('ingestBtn');
  if(s) s.style.display = on?'none':'';
  if(st) st.style.display = on?'':'none';
  if(ig) ig.style.opacity = on?'.4':'';
  if(ig) ig.style.pointerEvents = on?'none':'';
}
function stopGen(){ if(state.abort){ state.stopped=true; try{ state.abort.abort(); }catch{} } }

// ---------- tiny markdown renderer (no external deps) ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const FILE_RE=/(^|[\s>(])((?:[\w][\w.-]*\/)+[\w][\w.-]*\.(?:md|html|css|js|py|json|txt|csv|ya?ml|png|jpe?g|gif|svg|webp|xlsx))(?=[\s)<.,;:!?]|$)/g;
function mdInline(s){
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,src)=>{
      if(/^https?:/.test(src)) return `<img class="md-img" alt="${alt}" src="${src}">`;   // external: plain img, no repo actions
      const enc=encodeURIComponent(src);
      // repo image → figure with hover actions: fullscreen (native) + download
      return `<span class="md-fig"><img class="md-img" alt="${alt}" src="/api/raw?path=${enc}"><span class="md-acts">`
        +`<button type="button" class="mda-fs" data-path="${src}" title="Fullscreen"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>`
        +`<a class="mda-dl" href="/api/raw?path=${enc}&dl=1" download title="Download"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></a>`
        +`</span></span>`;
    })
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,href)=>/^https?:/.test(href)
      ?`<a href="${href}" target="_blank" rel="noopener noreferrer">${t}</a>`
      :`<a href="#" data-path="${href}">${t}</a>`)
    .replace(FILE_RE,'$1<a href="#" data-path="$2">$2</a>');
}
// [chat-media + markdown region → js/chat-media.js (Phase-5 module split)]

let _toastTimer=null;
function toast(t,ms){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>el.classList.remove('show'),ms||2200); }
// In-app confirm (§5 modal, danger variant) — replaces native confirm(); resolves boolean.
function crsConfirm(o){ o=typeof o==='string'?{body:o}:(o||{});
  return new Promise(res=>{
    let w=$('confirmWrap');
    if(!w){ w=document.createElement('div'); w.className='modal-wrap'; w.id='confirmWrap'; document.body.appendChild(w); }
    w.innerHTML=`<div class="modal-box cfm-box" role="alertdialog" aria-modal="true">
      <div class="cfm-head"><h2>${esc(o.title||'Are you sure?')}</h2></div>
      ${o.body?`<div class="cfm-body">${esc(o.body)}</div>`:''}
      <div class="cfm-foot"><button class="mbtn2" id="cfmNo">Cancel</button><button class="mbtn2 ${o.danger===false?'primary':'danger'}" id="cfmYes">${esc(o.confirmLabel||'Delete')}</button></div></div>`;
    w.classList.add('show');
    const done=v=>{ w.classList.remove('show'); document.removeEventListener('keydown',onKey,true); res(v); };
    const onKey=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(false); } else if(e.key==='Enter'){ e.stopPropagation(); done(true); } };
    document.addEventListener('keydown',onKey,true);
    w.onclick=e=>{ if(e.target===w) done(false); };
    $('cfmNo').onclick=()=>done(false);
    $('cfmYes').onclick=()=>done(true);
    $('cfmYes').focus();
  });
}
async function api(path,opts){ const r=await fetch(path,opts); if(!r.ok){const e=await r.json().catch(()=>({error:r.status})); throw new Error(e.error||'error');} return r.json(); }
const isHtml=p=>/\.html?$/i.test(p), isImg=p=>/\.(png|jpe?g|gif|svg|webp)$/i.test(p);
// Open with the OS default app (html → default browser).
async function apiOpen(p){ if(!p) return;
  try{ await api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})}); toast('Opened in your browser  ·  '+p.split('/').pop()); }
  catch(e){ toast('Could not open: '+e.message); } }
// Route any file reference to the right opener.
function smartOpen(p){ if(isHtml(p)) apiOpen(p); else openDocWindow(p); }
// Open the embedded galaxy map straight to the folder kanban board.
function openKanban(){ showMap('board'); }
// ---------- resizable left sidebar ----------
(function(){
  const root=document.documentElement, saved=localStorage.leftW;
  if(saved) root.style.setProperty('--left-w',saved);
  const rz=document.getElementById('lresizer'); if(!rz) return;
  let dragging=false;
  const clamp=x=>Math.max(210,Math.min(480,x));
  rz.addEventListener('pointerdown',e=>{ dragging=true; rz.classList.add('drag'); rz.setPointerCapture(e.pointerId); e.preventDefault(); });
  rz.addEventListener('pointermove',e=>{ if(!dragging) return;
    const w=clamp(e.clientX)+'px'; root.style.setProperty('--left-w',w); localStorage.leftW=w; });
  rz.addEventListener('pointerup',e=>{ dragging=false; rz.classList.remove('drag'); try{ rz.releasePointerCapture(e.pointerId); }catch{} });
})();
// Clickable file paths inside chat replies and rendered docs.
document.addEventListener('click',(e)=>{ const a=e.target.closest('a[data-path]'); if(!a) return;
  e.preventDefault(); smartOpen(a.dataset.path); });

// ---------- mobile drawers ----------
function mob(side){
  const L=document.querySelector('.col.left'), R=document.querySelector('.col.right');
  const openL = side==='left' && L && !L.classList.contains('show');
  const openR = side==='right' && R && !R.classList.contains('show');
  if(L) L.classList.toggle('show', openL);
  if(R) R.classList.toggle('show', openR);
  $('mscrim').classList.toggle('show', openL||openR);
}
// ---------- desktop sidebar collapse ----------
function toggleCol(side){
  const cls = side==='left' ? 'lcol' : 'rcol';
  const app = document.querySelector('.app');
  const collapsed = app.classList.toggle(cls);
  localStorage.setItem('collapse_'+side, collapsed?'1':'0');
}
// Rail button → expand the panel back to full width.
function railExpand(side){
  document.querySelector('.app').classList.remove(side==='left'?'lcol':'rcol');
  localStorage.setItem('collapse_'+side, '0');
}
// Rail tab button → expand the sidebar, then switch to that tab.
function railTab(t){ railExpand('left'); setTab(t); }
(function restoreCols(){
  const app = document.querySelector('.app');
  if(localStorage.getItem('collapse_left')==='1') app.classList.add('lcol');
  if(localStorage.getItem('collapse_right')==='1') app.classList.add('rcol');
})();
// picking a chat/file on mobile closes the drawer
document.addEventListener('click',e=>{
  if(innerWidth>900) return;
  if(e.target.closest('.item')||e.target.closest('.tree .file')) setTimeout(()=>mob(null),150);
});

// ---------- tabs ----------
// The Conversations/Files tabs were removed — the sidebar is conversations-only and
// files live in the explorer. Kept as a safe entrypoint: callers (rail, dashboard
// KPI, bpTrack) just want the chat view surfaced. Ignores the old tab argument.
function setTab(t){
  state.tab='chats';
  if($('chatView') && $('chatView').style.display==='none'){ state.chatId ? openChat(state.chatId) : newChat(); }
}

// ---------- Project-only file filter ----------
// Project view (default): the CRS product files you actually work on.
// Hidden: the app that runs the brain (crs-brain/), build scripts, README/CLAUDE
// (the brain reads those, you don't), and the reference manuals inside brain/.
const CRS_DIRS=new Set(['brain','specs','design','data','demos','pricing','audits']);
const CRS_ROOT_FILES=new Set(['decisions.md']);        // README.md / CLAUDE.md are for the brain, not you
const MANUAL_DIRS=new Set(['bubble','buildprint','bubble-forum']);   // reference manuals — hidden in project view
state.crsOnly = localStorage.getItem('crsOnly')!=='0';  // default ON
// Project/All file filter — the toggle UI moved out with the Files tab; the CRS-only
// default still governs filterTree(). Kept callable (guarded) in case it's rewired.
function setFileFilter(crs){ state.crsOnly=crs; localStorage.setItem('crsOnly',crs?'1':'0');
  const fc=$('ffCrs'), fa=$('ffAll'); if(fc)fc.classList.toggle('on',crs); if(fa)fa.classList.toggle('on',!crs); loadFiles(); }
function filterTree(tree){ if(!state.crsOnly) return tree;
  return tree.filter(n=> n.type==='dir' ? CRS_DIRS.has(n.name) : CRS_ROOT_FILES.has(n.name))
    .map(n=> n.type==='dir'&&n.name==='brain'
      ? {...n, children:n.children.filter(c=>!(c.type==='dir'&&MANUAL_DIRS.has(c.name)))}
      : n); }

// ---------- chats ----------
function chatItemEl(c){
  const live=state.live && !state.live.done && state.live.chatId===c.id;
  const d=document.createElement('div'); d.className='item'+(c.id===state.chatId?' on':'')+(live?' live':'');
  d.dataset.chatId=c.id;
  // sidebar3 rest state = leading type mark + truncated title ONLY. Mark: "BP" chip =
  // the conversation ran with Buildprint CLI tooling (the bp flag — per-message tool
  // events are not persisted); plain chat icon otherwise. Hover reveals only the ⋮.
  d.innerHTML=`${c.bp?`<span class="bpchip">BP</span>`:`<svg class="ic sm chi" viewBox="0 0 24 24"><use href="#i-chat"/></svg>`}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'Untitled')}</span><button class="cmenu" title="Actions">⋮</button>`;
  d.onclick=(e)=>{ if(e.target.closest('.cmenu')){ chatMenuAt(e, c); return; } openChat(c.id); };
  return d;
}
// sidebar3: toggle the .live pulse on the sidebar row of the in-flight turn.
// Called when a stream starts, when it finishes/errors, and after every list render.
function syncLiveRow(){
  const id=(state.live && !state.live.done) ? state.live.chatId : null;
  document.querySelectorAll('#paneChats .item.live').forEach(el=>{ if(el.dataset.chatId!==id) el.classList.remove('live'); });
  if(id){ const el=document.querySelector('#paneChats .item[data-chat-id="'+CSS.escape(id)+'"]'); if(el) el.classList.add('live'); }
}
// Per-conversation ⋮ menu — same visual language as the explorer menu.
function chatMenuAt(e, c){
  e.stopPropagation();
  let m=$('chatMenu');
  if(!m){ m=document.createElement('div'); m.id='chatMenu'; m.className='expl-menu'; document.body.appendChild(m);
    document.addEventListener('pointerdown',(ev)=>{ if(!ev.target.closest('#chatMenu')) m.style.display='none'; },true); }
  m.innerHTML=`<button data-act="pin">${c.pinned?'Unpin':'Pin'}</button><button data-act="rename">Rename</button><div class="mdiv"></div><button data-act="delete">Delete</button>`;
  m.style.display='block';
  const r=e.target.closest('.cmenu').getBoundingClientRect();
  m.style.left=Math.min(r.left, innerWidth-170)+'px'; m.style.top=(r.bottom+4)+'px';
  m.onclick=async(ev)=>{ const b=ev.target.closest('button[data-act]'); if(!b) return; m.style.display='none';
    const act=b.dataset.act;
    if(act==='pin'){ await api('/api/chat/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,pinned:!c.pinned})}); loadChats(); }
    else if(act==='rename'){ const t=prompt('Rename conversation:', c.title||''); if(t&&t.trim()){ await api('/api/chat/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,title:t.trim()})}); loadChats(); if(c.id===state.chatId) $('centerTitle').textContent=t.trim(); } }
    else if(act==='delete'){ delChat(c.id); }
  };
}
// ---------- chat search (sidebar) ----------
let chatSearchT=null;
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark class="hl">'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function onChatSearch(q){ clearTimeout(chatSearchT);
  chatSearchT=setTimeout(async()=>{ q=q.trim();
    if(!q){ loadChats(); return; }
    try{ const {chats}=await api('/api/search-chats?q='+encodeURIComponent(q));
      const box=$('paneChats');
      box.innerHTML = chats.length? '' : '<div class="empty" style="padding:12px">No conversations match “'+esc(q)+'”.</div>';
      for(const c of chats){ const d=document.createElement('div'); d.className='item'+(c.id===state.chatId?' on':'');
        d.style.flexDirection='column'; d.style.alignItems='stretch';
        d.innerHTML=`<div style="display:flex;gap:8px;align-items:center">${c.bp?`<span class="bpchip">BP</span>`:''}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hl(c.title||'Untitled',q)}</span></div>`+(c.snippet?`<span class="snip">${hl(c.snippet,q)}</span>`:'');
        d.onclick=()=>openChat(c.id); box.appendChild(d); }
    }catch{}
  }, 180);
}

async function loadChats(){
  const {chats}=await api('/api/chats');
  state.chatList=chats;
  const box=$('paneChats');

// ---- read aloud: server TTS (Edge neural voices, mp3) + speechSynthesis fallback ----
// One shared Audio element — starting a new read stops the previous one; the
// button flips to a stop control while fetching/playing.
const TTS={audio:null,btn:null,url:null};
function speechText(md){
  let t=String(md||'');
  t=t.replace(/```[\s\S]*?```/g,' ');            // code fences dropped entirely
  t=t.replace(/^\s*\|.*\|\s*$/gm,' ');           // tables skipped
  t=t.replace(/!\[[^\]]*\]\([^)]*\)/g,' ');      // images dropped
  t=t.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1');    // links → link text
  t=t.replace(/`([^`]*)`/g,'$1');                // inline code → plain
  t=t.replace(/^#{1,6}\s+/gm,'');                // heading markers
  t=t.replace(/^\s*>\s?/gm,'');                  // blockquote markers
  t=t.replace(/^\s*([-*_]\s*){3,}$/gm,' ');      // hr lines
  t=t.replace(/^\s*(?:[-*+]|\d+[.)])\s+/gm,'');  // list markers
  t=t.replace(/(\*\*|__|~~)/g,'').replace(/(^|\s)[*_]([^*_]+)[*_](?=\s|[.,;:!?)]|$)/g,'$1$2');  // emphasis
  return t.replace(/\s+/g,' ').trim();
}
function speechLang(t){ return /[Ⴀ-ჿ]/.test(t)?'ka':(/[Ѐ-ӿ]/.test(t)?'ru':'en'); }
function ttsBtnState(btn,st){
  if(!btn) return;
  btn.classList.toggle('busy',st==='loading');
  btn.setAttribute('aria-pressed',st==='playing'?'true':'false');
  if(st==='playing') btn.innerHTML='<svg class="ic sm" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg> Stop';
  else btn.innerHTML=svg('i-volume','sm')+(st==='loading'?' Fetching…':' Read aloud');
  btn.title=st==='playing'?'Stop reading':'Read this reply aloud';
}
function stopReadAloud(){
  if(TTS.audio){ try{ TTS.audio.pause(); }catch{} TTS.audio.onended=TTS.audio.onerror=null; }
  if(TTS.url){ try{ URL.revokeObjectURL(TTS.url); }catch{} TTS.url=null; }
  try{ speechSynthesis.cancel(); }catch{}
  if(TTS.btn) ttsBtnState(TTS.btn,'idle');
  TTS.btn=null;
}
function ttsFallbackSpeak(btn,t,lang){
  const u=new SpeechSynthesisUtterance(t);
  u.lang={en:'en-US',ru:'ru-RU',ka:'ka-GE'}[lang]||'en-US';
  const v=(speechSynthesis.getVoices()||[]).find(x=>(x.lang||'').toLowerCase().startsWith(lang));
  if(v) u.voice=v;
  u.onend=u.onerror=()=>{ if(TTS.btn===btn) stopReadAloud(); };
  speechSynthesis.speak(u);
  ttsBtnState(btn,'playing');
}
async function toggleReadAloud(btn,md){
  if(TTS.btn===btn){ stopReadAloud(); return; }   // acting stop control
  stopReadAloud();                                 // a new read supersedes the old one
  const t=speechText(md);
  if(!t){ toast('Nothing readable in this reply'); return; }
  const lang=speechLang(t);
  TTS.btn=btn; ttsBtnState(btn,'loading');
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,lang})});
    if(!r.ok) throw new Error('tts '+r.status);
    const blob=await r.blob();
    if(TTS.btn!==btn) return;                      // superseded while fetching
    if(!TTS.audio) TTS.audio=new Audio();
    TTS.url=URL.createObjectURL(blob);
    TTS.audio.src=TTS.url;
    TTS.audio.onended=TTS.audio.onerror=()=>{ if(TTS.btn===btn) stopReadAloud(); };
    await TTS.audio.play();
    if(TTS.btn===btn) ttsBtnState(btn,'playing');
  }catch(e){
    if(TTS.btn!==btn) return;
    try{ ttsFallbackSpeak(btn,t,lang); }           // degrade to the browser voice
    catch(e2){ stopReadAloud(); toast('Read aloud failed: '+e.message); }
  }
}
// Regenerate (and, after a Stop, Continue) — only the newest reply keeps these;

  // model. `/help` lists them. Unknown /foo falls through to the model as normal text.
  const slash=text.match(/^\/(settle|chunk|send|todo|decide|gen|help)\b\s*(.*)$/is);
  if(slash && !atts.length){ input.value=''; input.style.height='auto'; runSlashCommand(slash[1].toLowerCase(), slash[2].trim()); return; }
  ensureChatView();  // sending from map/file/dashboard drops into the conversation

// ---------- voice dictation (Chrome Web Speech API + device picker) ----------
// Mic button: first click opens the mic/language popover, afterwards it toggles
// dictation with the remembered device (right-click reopens the popover).
// System-default device → continuous SpeechRecognition into #input (final
// results append with input event, interim results show as ghost text above the
// composer). NON-default device → Chrome can't point SpeechRecognition at it,
// so we capture that exact device with MediaRecorder and transcribe the blob
// via POST /api/transcribe (Gemini, key in Settings → General); no key → honest
// fallback to the system-default Web Speech path. No SpeechRecognition at all
// (non-Chrome) → the button stays hidden.
const DICT_LANGS=['en-US','ru-RU','ka-GE'];
const DICT={on:false,engine:null,rec:null,media:null,recorder:null,chunks:[],devices:null,stopTimer:null,restarts:0,err:null,
  lang:(()=>{ try{ const l=localStorage.getItem('crs-dict-lang'); return DICT_LANGS.includes(l)?l:'en-US'; }catch{ return 'en-US'; } })(),
  device:(()=>{ try{ const d=JSON.parse(localStorage.getItem('crs-dict-device')||'null'); return (d&&d.deviceId)?d:null; }catch{ return null; } })()};
function dictSR(){ return window.SpeechRecognition||window.webkitSpeechRecognition||null; }
function dictTag(){ return DICT.lang.slice(0,2).toUpperCase(); }
// Engine routing (honest): SpeechRecognition always records the system-default
// input, so only the default device may use it; anything else goes recorder→API.
function dictIsDefaultDevice(dev,devs){
  if(!dev||!dev.deviceId||dev.deviceId==='default') return true;
  const sys=(devs||[]).find(d=>d.deviceId==='default');
  return !!(sys&&sys.label&&dev.label&&sys.label.toLowerCase().includes(dev.label.toLowerCase()));
}
function dictEngine(dev,devs){ return dictIsDefaultDevice(dev,devs)?'webspeech':'recorder'; }
// Preferred default: the built-in mic when we can spot it, else the system default.
function dictPickDefault(devs){ return devs.find(d=>/macbook.*micro|built-in/i.test(d.label||''))||devs.find(d=>d.deviceId==='default')||devs[0]||null; }
async function dictListDevices(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices) return [];
  const ins=async()=> (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  let list=await ins();
  if(list.length&&list.every(d=>!d.label)){   // labels hidden until mic permission — ask once, release right away
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); list=await ins(); }catch{}
  }
  return list.map(d=>({deviceId:d.deviceId,label:d.label||('Microphone '+String(d.deviceId||'').slice(0,6))}));
}
function dictSaveDevice(dev){ DICT.device=dev; try{ localStorage.setItem('crs-dict-device',JSON.stringify(dev?{deviceId:dev.deviceId,label:dev.label}:null)); }catch{} }
function dictGhost(t){ const g=$('dictGhost'); if(!g) return; clearTimeout(g._t); g.textContent=t||''; g.classList.toggle('show',!!t); }
function dictGhostFlash(t){ const g=$('dictGhost'); if(!g) return; dictGhost(t); g._t=setTimeout(()=>dictGhost(''),1600); }
function dictAppendFinal(t){
  t=String(t||'').trim(); if(!t) return;
  const inp=$('input'); if(!inp) return;
  inp.value=(inp.value&&!/\s$/.test(inp.value)?inp.value+' ':inp.value)+t;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
// Chrome 139+ on-device models: probe availability and kick off a background
// install when the pack is merely downloadable — fire-and-forget, never blocks.
function dictProbeInstall(lang){
  try{
    const SR=dictSR();
    if(!SR||typeof SR.available!=='function') return;
    Promise.resolve(SR.available({langs:[lang],processLocally:true})).then(st=>{
      if(st==='downloadable'&&typeof SR.install==='function') Promise.resolve(SR.install({langs:[lang]})).catch(()=>{});
    }).catch(()=>{});
  }catch{}
}
function dictUpdateBtn(){
  const b=$('micBtn'); if(!b) return;
  b.classList.toggle('rec',DICT.on);
  const nonDefault=!!DICT.device&&dictEngine(DICT.device,DICT.devices||[])==='recorder';
  b.innerHTML='<svg class="ic" viewBox="0 0 24 24"><use href="#i-mic"/></svg>'+(nonDefault?'<span class="devdot"></span>':'');
  b.title=(DICT.on?'Stop dictation':'Dictate')+' — '+dictTag()
    +(DICT.device&&DICT.device.label?' · '+DICT.device.label:'')
    +' (right-click: mic & language)';
}
// ---- mic/language popover (same visual language as the explorer menus) ----
async function micMenuAt(){
  let m=$('micMenu');
  if(!m){ m=document.createElement('div'); m.id='micMenu'; m.className='expl-menu mic-menu'; document.body.appendChild(m);
    document.addEventListener('pointerdown',(ev)=>{ if(!ev.target.closest('#micMenu')&&!ev.target.closest('#micBtn')) m.style.display='none'; },true); }
  const place=()=>{ const r=$('micBtn').getBoundingClientRect(); m.style.left=Math.min(r.left,innerWidth-250)+'px'; m.style.top='auto'; m.style.bottom=(innerHeight-r.top+6)+'px'; };
  m.innerHTML='<div class="mm-t">Microphone</div><div class="mm-note">Looking for microphones…</div>';
  m.style.display='block'; place();
  const devs=await dictListDevices(); DICT.devices=devs;
  if(!DICT.device&&devs.length) dictSaveDevice(dictPickDefault(devs));
  const cur=DICT.device||{};
  const needKey=dictEngine(DICT.device,devs)==='recorder'&&!(SETTINGS&&SETTINGS.googleAiKeySet);
  m.innerHTML='<div class="mm-t">Microphone</div>'
    +(devs.length?devs.map((d,i)=>`<button data-dev="${i}" class="${d.deviceId===cur.deviceId?'on':''}"><span class="mm-radio"></span><span class="mm-lbl">${esc(d.label)}</span></button>`).join(''):'<div class="mm-note">No microphones found.</div>')
    +'<div class="mdiv"></div><div class="mm-t">Language</div>'
    +'<div class="mm-langs">'+DICT_LANGS.map(l=>`<button data-lang="${l}" class="${l===DICT.lang?'on':''}">${l.slice(0,2).toUpperCase()}</button>`).join('')+'</div>'
    +(needKey?'<div class="mm-note">This mic transcribes via Google AI — add the free key in Settings → General, or it falls back to the system-default mic.</div>':'')
    +'<div class="mdiv"></div><button data-act="start">'+(DICT.on?'Stop dictation':'Start dictation')+'</button>';
  place();
  m.onclick=(ev)=>{
    const b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.dev!=null){ dictSaveDevice(devs[+b.dataset.dev]); dictUpdateBtn(); micMenuAt(); }
    else if(b.dataset.lang){ setDictLang(b.dataset.lang); micMenuAt(); }
    else if(b.dataset.act==='start'){ m.style.display='none'; toggleDictation(true); }
  };
}
function micContext(e){ if(e) e.preventDefault(); micMenuAt(); return false; }
function setDictLang(l){
  if(!DICT_LANGS.includes(l)) return;
  DICT.lang=l; try{ localStorage.setItem('crs-dict-lang',l); }catch{}
  const wasOn=DICT.on&&DICT.engine==='webspeech';
  if(wasOn){ stopDictation(); startDictation(); }   // pick up the new lang mid-session
  dictUpdateBtn(); dictProbeInstall(l);
}
function startWebSpeech(){
  const SR=dictSR(); if(!SR||DICT.on) return;
  let r;
  try{ r=new SR(); }catch{ return; }
  r.continuous=true; r.interimResults=true; r.lang=DICT.lang;
  r.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal) dictAppendFinal(res[0]&&res[0].transcript); else interim+=(res[0]&&res[0].transcript)||'';
    }

  };

}
// ---- non-default device path: capture that exact mic, transcribe on stop ----
async function startRecorder(){
  if(DICT.on) return;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:DICT.device.deviceId}}}); }
  catch(e){ toast('Mic "'+(DICT.device&&DICT.device.label||'?')+'" unavailable — using the system-default mic'); startWebSpeech(); return; }
  const mime=(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))?'audio/webm;codecs=opus':'audio/webm';
  let mr;
  try{ mr=new MediaRecorder(stream,{mimeType:mime}); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); toast('Recording unsupported — using the system-default mic'); startWebSpeech(); return; }
  DICT.media=stream; DICT.recorder=mr; DICT.chunks=[]; DICT.on=true; DICT.engine='recorder';
  mr.ondataavailable=(ev)=>{ if(ev.data&&ev.data.size) DICT.chunks.push(ev.data); };
  mr.onstop=()=>dictTranscribe();
  mr.start();
  DICT.stopTimer=setTimeout(()=>{ if(DICT.on&&DICT.engine==='recorder') stopDictation(); },5*60*1000);   // safety cap
  dictUpdateBtn(); dictGhost('Listening — '+(DICT.device.label||'selected mic')+' · click the mic to stop & transcribe');
}
async function dictTranscribe(){
  const blob=new Blob(DICT.chunks,{type:(DICT.chunks[0]&&DICT.chunks[0].type)||'audio/webm'});
  DICT.chunks=[];
  if(!blob.size){ dictGhost(''); return; }
  dictGhost('Transcribing…');
  try{
    const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=rej; fr.readAsDataURL(blob); });
    const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,mime:blob.type,lang:DICT.lang.slice(0,2)})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    dictAppendFinal(j.text);
    dictGhost('');
  }catch(e){ dictGhostFlash('Transcription failed — '+e.message); }
}
function stopDictation(){
  DICT.on=false; clearTimeout(DICT.stopTimer);
  const r=DICT.rec; DICT.rec=null;
  if(r){ try{ r.stop(); }catch{} }
  const mr=DICT.recorder; DICT.recorder=null;
  if(mr){ try{ if(mr.state!=='inactive') mr.stop(); }catch{} }   // → onstop → dictTranscribe
  if(DICT.media){ try{ DICT.media.getTracks().forEach(t=>t.stop()); }catch{} DICT.media=null; }
  if(DICT.engine!=='recorder') dictGhost('');   // recorder path keeps its Transcribing… ghost
  dictUpdateBtn();
}

async function uploadFiles(files){
  if(!state.pending) state.pending=[];
  for(const f of files){
    const name=f.name||('pasted-'+Date.now()+'.png');
    // images get an instant local preview (object URL) while the upload runs
    const entry={name,path:null,blob:(f.type&&f.type.startsWith('image/'))?URL.createObjectURL(f):null};
    state.pending.push(entry); renderChips();
    try{
      const dataBase64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });
      const out=await api('/api/attach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,dataBase64})});
      entry.path=out.path;
      // if the message was sent mid-upload, this entry was dropped from pending — release its preview blob
      if(!(state.pending||[]).includes(entry) && entry.blob){ try{ URL.revokeObjectURL(entry.blob); }catch{} entry.blob=null; }
    }catch(e){ toast('Attach failed: '+e.message); if(entry.blob) try{ URL.revokeObjectURL(entry.blob); }catch{} state.pending=state.pending.filter(x=>x!==entry); }
    renderChips();
  }
}

        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const dl=chunk.split('\n').find(l=>l.startsWith('data: ')); if(!dl) continue;
        let ev; try{ ev=JSON.parse(dl.slice(6)); }catch{ continue; }
        if(ev.type==='meta'){ live.chatId=ev.id; live.startedAt=ev.startedAt; if(ev.startedAt) setTurnStart(turn, ev.startedAt); if(mine()){ state.chatId=ev.id; if(ev.title) $('centerTitle').textContent=(live.bp?'🔨 ':'')+ev.title; }
          if(state.planRef) markPlanPrompted(ev.id); }   // link plan step → this chat
        else if(ev.type==='block'){
          // Server-pushed lifecycle notes (prompt sent / CLI preflight / connected)
          // arrive complete with label+actor — render finished, never spinning.
          if(ev.kind==='note'){ addLifeNote(ev.label||'', ev.body||'', ev.actor); }
          else{
            // A new TOOL block means the text streamed so far was interim narration —
            // reclaim it from the answer body into a timeline note, then start the tool step.
            if(ev.kind==='tool' && full.trim()){ addNoteStep(full); full=''; revealed=0; answerEl.innerHTML=''; answerEl.appendChild(caret); }
            startCard(ev.kind, ev.tool, ev.actor);
            if(ev.kind==='tool') window.LIVEMAP&&LIVEMAP.ping(ev.actor==='buildprint'?'bp-step':'tool',{tool:ev.tool});   // live map: Model→Tools (→Buildprint→Bubble) + tool-name child molecule
          }
        }
        else if(ev.type==='actor'){
          // Lane upgrade: a Bash step turned out to be a buildprint/agent-browser
          // command once its input streamed in — re-tag the live card + divider.
          if(activeStep && activeStep.el.dataset.actor!==ev.actor){ activeStep.el.dataset.actor=ev.actor; laneMark(ev.actor, activeStep.el); }
          if(ev.actor==='buildprint') window.LIVEMAP&&LIVEMAP.ping('bp-step');   // live map: lane upgrade = Buildprint path
        }
        else if(ev.type==='think'){ appendThink(ev.text||''); }
        else if(ev.type==='label'){ if(activeStep&&ev.text){ activeStep.labelEl.textContent=ev.text; activeStep.icoEl.innerHTML=stepIco(activeStep.kind, ev.text); } }
        else if(ev.type==='detail'){ if(activeStep){ if(!activeStep.lmCmd&&activeStep.kind==='tool'&&ev.text){ activeStep.lmCmd=true; window.LIVEMAP&&LIVEMAP.ping('tool-detail',{cmd:String(ev.text).split('\n')[0]}); } setStepBody(activeStep.text + (activeStep.text?'\n':'') + (ev.text||'')); } }
        else if(ev.type==='status'){ /* superseded by work blocks */ }
        else if(ev.type==='question'){
          // session is BLOCKED on this — render the card right in the turn
          endStep();
          if(ev.status==='auto'){ body.insertBefore(askReceiptEl({status:'auto',answer:ev.answer,answeredAt:new Date().toISOString()}), answerEl); }
          else body.insertBefore(askCardEl({id:ev.id,chatId:live.chatId,question:ev.question,context:ev.context,options:ev.options,status:'pending',askedCount:ev.askedCount}), answerEl);
          if(nearBottom()) log.scrollTop=log.scrollHeight;
        }
        else if(ev.type==='question-answered'){
          // answered from another surface (phone/dashboard) — collapse the card here too
          const el=document.querySelector('.askcard[data-ask-id="'+ev.id+'"]');
          if(el){ el.replaceWith(askReceiptEl({status:'answered',answer:ev.answer,answeredAt:new Date().toISOString()})); if(ASK_LIVE_CARD&&ASK_LIVE_CARD.m.id===ev.id) ASK_LIVE_CARD=null; }
        }
        else if(ev.type==='model'){ genModel=ev.model||''; paintMeter(); window.LIVEMAP&&LIVEMAP.ping('model', genModel); }
        else if(ev.type==='model-switch'){
          genModel=ev.to||genModel; paintMeter(); window.LIVEMAP&&LIVEMAP.ping('model', genModel);
          const note=document.createElement('div'); note.className='switch-note';
          note.innerHTML='<span class="sw-bolt">⚡</span><span>'+esc(modelNice(ev.from))+' unavailable — switched to <b>'+esc(modelNice(ev.to))+'</b> to keep going</span>';
          body.insertBefore(note, blocksEl);
          if(nearBottom()) log.scrollTop=log.scrollHeight;
        }
        else if(ev.type==='memory-saved'){ const n=(ev.entries||[]).length; if(n){ const first=ev.entries[0]; toast('🧠 Saved to memory — '+first.category+': '+first.title+(n>1?`  (+${n-1} more)`:'')); } }
        else if(ev.type==='usage'){ genIn=ev.in||genIn; genOut=ev.out||genOut; paintMeter(); }
        else if(ev.type==='delta'){ endStep(); full+=ev.text; }   // text streaming → stop the last step spinning; keep the group open
        else if(ev.type==='done'){ live.chatId=ev.id; full=ev.reply||full; streamDone=true; live.startedAt=ev.startedAt||live.startedAt; live.completedAt=ev.completedAt; if(mine()){ state.chatId=ev.id; if(ev.title) $('centerTitle').textContent=(live.bp?'🔨 ':'')+ev.title; } }
        else if(ev.type==='stopped'){ live.chatId=ev.id; full=ev.reply||full; stoppedReply=true; streamDone=true; live.startedAt=ev.startedAt||live.startedAt; live.completedAt=ev.completedAt; if(mine()) state.chatId=ev.id; }
        else if(ev.type==='error'){ errored=true; clearInterval(timerIv); finalizeCard(); body.classList.add('err'); answerEl.remove(); const em=document.createElement('div'); em.innerHTML=svg('i-alert','sm')+'  '+esc(ev.error); body.appendChild(em); addRetryBar(a,false); }
      }
    }
    streamDone=true;
  }catch(e){
    if(e.name==='AbortError' || state.stopped){
      stoppedReply=true; streamDone=true;   // Stop button: keep partial, let pump finalize
    }else if(!errored){
      errored=true; clearInterval(timerIv); finalizeCard(); body.classList.add('err');
      answerEl.remove(); const em=document.createElement('div'); em.innerHTML=svg('i-alert','sm')+'  '+esc(e.message); body.appendChild(em); addRetryBar(a,false);
    }
  }finally{
    live.done=true; clearInterval(timerIv); clearInterval(meterIv); if(gm&&mine()) gm.classList.remove('show');
    syncLiveRow();   // sidebar3: stop the live pulse the moment the turn completes
    window.LIVEMAP&&LIVEMAP.ping('turn-end',{secs:Math.round((performance.now()-genStart)/1000)});   // live map: path back to idle + "✓ done · Ns" ticker
    try{ brainEl.remove(); }catch{}
    // Only touch the composer/queue if this stream still owns the active view —
    // otherwise the user has moved on and a different stream (or none) is in charge.
    if(mine()){ state.sending=false; state.abort=null; setGenerating(false); dequeue(); }
    // Outcome notification (bell + sound; toast only for failures — success is visible in the log).
    const elapsed=fmtDur(performance.now()-genStart);
    if(errored){ notifyT('task-failed',{title:'Generation failed',message:'The last request errored — you can retry from the reply.'}); }
    else if(stoppedReply){ notifyT('warning',{title:'Generation stopped',message:'Stopped after '+elapsed+'.',banner:false}); }
    else { notifyT('task-complete',{title:(live.bp?'Buildprint task complete':'Response ready'),message:elapsed+(genOut?' · ↓ '+fmtTok(genOut)+' tokens out':''),banner:false}); }
    loadChats(); loadProgress(); loadPlan();
    // Ingest & Buildprint chats write files into brain/ — refresh the tree,
    // Cmd+K index, and Recently-edited so new files appear without a reload.
    if(opts.ingest || live.bp){ loadFiles(); loadRecentEdited(); }
  }
}

// Tier 1 (text/code/json/csv): real in-app editing via PUT /api/file.
// Tier 2 (xlsx): SheetJS grid → PUT /api/file-binary writes a valid workbook.

const VENDOR={ xlsx:{src:'/vendor/xlsx.full.min.js', ok:()=>!!window.XLSX},
               mammoth:{src:'/vendor/mammoth.browser.min.js', ok:()=>!!window.mammoth} };
function loadVendor(k){ const v=VENDOR[k];
  if(v.ok()) return Promise.resolve();
  if(v.p) return v.p;
  v.p=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=v.src;   // local vendored build — runtime never touches a CDN
    s.onload=()=>v.ok()?res():rej(new Error('vendor did not initialise: '+v.src));
    s.onerror=()=>{ v.p=null; rej(new Error('could not load '+v.src)); };
    document.head.appendChild(s); });
  return v.p;
}

function dwBuildCsvEditor(w){
  const body=w.el.querySelector('.dp-body'), tsv=extOf(w.name)==='tsv';
  const grid=csvRows(w.text,tsv); if(!grid.length) grid.push(['']);

    <div class="dw-edtb">

    rowminus(){ if(w.ed.grid.length>1){ w.ed.grid.splice(Math.min(cur.r,w.ed.grid.length-1),1); cur.r=Math.min(cur.r,w.ed.grid.length-1); } },
    colplus(){ w.ed.grid.forEach(r=>r.splice(cur.c+1,0,'')); },
    colminus(){ if(w.ed.grid[0].length>1){ w.ed.grid.forEach(r=>r.splice(Math.min(cur.c,r.length-1),1)); cur.c=Math.min(cur.c,w.ed.grid[0].length-1); } },

async function dwSave(w){

function dwXlsxAoa(w,name){

function xlColName(n){ let s=''; n++; while(n){ n--; s=String.fromCharCode(65+n%26)+s; n=Math.floor(n/26); } return s; }
function dwXlsxRender(w){

  let rows='';

    for(let c=0;c<C;c++) rows+=`<td${edit?' contenteditable="true"':''} data-r="${r}" data-c="${c}">${esc(String(aoa[r][c]??''))}</td>`;

async function dwXlsxEditToggle(w){

// ===================== in-app page windows (single-app rule) =====================
// The tool pages (tree/activity/memory/wishlist/queue) open as DW windows with a
// same-origin iframe body — full chrome (drag/snap/resize/minimize/chip/Esc),
// cascade, dedupe-by-url → focus, and the shared soft cap. No browser tabs.
// Window policy (polish): ONE router decides by target type. App surfaces open
// full-area with a ← back; files open in their popup window/viewer.
const APP_SURFACES=['/tree.html','/wishlist.html','/queue.html','/memory.html','/activity.html','/protos.html','/app-preview.html','/entity.html','/cost.html','/playbook.html'];
function isSurface(url){ const base=(url||'').split('#')[0]; return APP_SURFACES.includes(base); }
function openTarget(target, opts){
  opts=opts||{};
  if(typeof target==='string' && isSurface(target)) return openSurface(target, opts.title);
  if(typeof target==='string' && target.startsWith('/')&&isHtml(target)) return openSurface(target, opts.title);   // any served app html surface
  return openDocWindow(target, opts);   // a repo FILE → popup/viewer
}
let surfaceReturn=null;
function currentViewRestore(){
  // snapshot which content view is showing so ← back returns exactly there
  const shown=['chatView','dashView','mapView','bubbleView'].find(id=>{ const el=$(id); return el && el.style.display!=='none'; });
  if(shown==='dashView') return ()=>showDashboard();
  if(shown==='mapView') return ()=>showMap();
  // (kanbanView removed — the map board is a mode of showMap)
  if(shown==='bubbleView') return ()=>showBubble();
  if(shown==='chatView') return ()=>ensureChatView();
  return ()=>showDashboard();
}
function openSurface(url, title){
  if(typeof hidePeek==='function') hidePeek();

  bumpView(); state.chatId=null;
  for(const id of ['chatView','dashView','mapView','bubbleView']) $(id).style.display='none';
  $('surfaceView').style.display='flex';
  $('centerCol').classList.remove('map-mode'); $('centerCol').classList.add('no-composer');
  const name=title||url.split('/').pop().replace(/\.html?$/i,'');
  $('surfaceTitle').textContent=name; $('centerTitle').textContent=name; markView('');
  const fr=$('surfaceFrame');

    // in-frame link loaded the app shell → app-in-app), reload the real surface.
    try{ if(new URL(fr.contentWindow.location.href).pathname!==new URL(url,location.origin).pathname) fr.src=url; }
    catch(e){ fr.src=url; }

}

      catch{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Content copied'); } }
    else if(act==='copyimage'){
      const blob=await (await fetch('/api/raw?path='+encodeURIComponent(target))).blob();
      const png=await new Promise((res)=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); c.toBlob(res,'image/png'); }; img.onerror=()=>res(null); img.src=URL.createObjectURL(blob); });

}
async function explNew(type,dir,ext){
  if(dir!=null && dir!==EX.path) explGoto(dir); const d=EX.path;
  // The server auto-suffixes on collision ("untitled 2.md") — the client never
  // guesses from its (possibly stale/filtered) tree, so no bogus "already exists".
  const name=type==='folder'?'New folder':('untitled.'+(ext||'md'));
  try{ const r=await FS.create(d, name, type, true); await explReload(); explSelectPath(r.path); explBeginRename(r.path); }
  catch(e){ toast(e.message); }
}
function explBeginRename(path){
  const el=$('explMain').querySelector(`[data-path="${CSS.escape(path)}"]`); if(!el) return;
  const nameEl=el.querySelector('.rn')||el.querySelector('.nm'); if(!nameEl) return;
  el.draggable=false;
  const cur=path.split('/').pop();
  const isDir=el.dataset.dir==='1';
  // Split on the LAST dot only. dot>0 means leading-dot names (.gitignore) count
  // as extension-less: the whole name is editable. Folders always full-name.
  const dot=cur.lastIndexOf('.');
  const hasExt=!isDir && dot>0;
  const base=hasExt?cur.slice(0,dot):cur, ext=hasExt?cur.slice(dot):'';
  const wrap=document.createElement('span'); wrap.className='ren-wrap';
  const inp=document.createElement('input'); inp.className='expl-rename'; inp.value=base;
  wrap.appendChild(inp);
  if(ext){ const g=document.createElement('span'); g.className='ext-ghost';
    g.textContent=ext; g.title='The extension can’t be changed here'; wrap.appendChild(g); }
  nameEl.replaceWith(wrap); inp.focus(); inp.select();
  let done=false;
  // outside=true → OS behavior: commit like Enter, but an empty/invalid value
  // reverts SILENTLY; and the selection the outside click just made is preserved
  // (no explSelectPath steal) — the click proceeds normally after the commit.
  const finish=async(selPath)=>{ await explReload(); selPath?explSelectPath(selPath):explPaintSel(); };
  const commit=async(save, outside)=>{ if(done) return;
    const nb=inp.value.trim();
    if(save && !nb){ if(outside){ done=true; EX._renameCommit=null; await finish(null); return; }
      inp.classList.add('err'); inp.focus(); return; }   // empty basename blocked inline (Enter)
    done=true; EX._renameCommit=null;
    const nn=nb+ext;   // extension ALWAYS reattached — cannot be edited or dropped
    if(save && nn!==cur){ try{ const r=await FS.rename(path,nn); await explReload();
      outside?explPaintSel():explSelectPath(r.path);
      toastUndo(`Renamed to “${nn}”`, ()=>FS.rename(r.path, cur)); return; }catch(e){ toast(e.message); } }
    await finish(outside?null:path); };
  EX._renameCommit=()=>commit(true,true);
  inp.addEventListener('keydown',(e)=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); commit(true,false); } else if(e.key==='Escape'){ e.preventDefault(); commit(false,false); } });
  inp.addEventListener('input',()=>inp.classList.remove('err'));
  inp.addEventListener('blur',()=>commit(true,true));   // backup path when blur does fire
}
// OS-clipboard paste: files copied in Windows Explorer/Finder → Ctrl+V uploads
// them into the current folder (screenshots arrive as image.png, auto-suffixed
// server-side). No files on the clipboard → the INTERNAL paste runs unchanged.
// Search/rename inputs keep native text paste (focus scoping from pass 2).
document.addEventListener('paste',(e)=>{
  if(!$('explWrap')?.classList.contains('show') || EX.min) return;
  if(e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]')) return;
  const inExpl=document.activeElement===$('explMain') || $('explMain')?.contains(document.activeElement) || (e.target.closest&&e.target.closest('.expl'));
  if(!inExpl) return;
  clearTimeout(EX._pasteWait);
  const files=Array.from((e.clipboardData&&e.clipboardData.files)||[]);
  if(files.length){ e.preventDefault(); explUploadBatch(files.map((f,i)=>({file:f, rel:f.name||('image'+(i?' '+i:'')+'.png')})), EX.path); }
  else explPaste();
});
// Outside-click commit (capture: runs BEFORE the marquee/window-drag handlers,
// whose preventDefault blocks the focus change that pass-2's blur-commit relied
// on). Inside the input (caret/selection) → keep editing.
document.addEventListener('pointerdown',(e)=>{
  if(!EX._renameCommit) return;
  if(e.target.closest('.ren-wrap')) return;
  EX._renameCommit();
}, true);
// ----- undo safety net: 6s toast with an inverse op (no trash system) -----
let undoTimer=null;
function ensureUToast(){ let u=$('uToast'); if(u) return u;
  u=document.createElement('div'); u.className='utoast'; u.id='uToast';
  u.innerHTML='<span class="ut-msg"></span><button type="button">Undo</button>'; document.body.appendChild(u); return u; }
function toastUndo(msg, fn){ const u=ensureUToast(); u.querySelector('.ut-msg').textContent=msg;
  clearTimeout(undoTimer); u.classList.add('show');
  u.querySelector('button').onclick=async()=>{ u.classList.remove('show');
    try{ await fn(); await explReload(); toast('Undone'); }catch(e){ toast('Undo failed: '+e.message); } };
  undoTimer=setTimeout(()=>u.classList.remove('show'), 6000); }
// inverse-move for a batch that landed in targetDir
function explUndoMove(paths, targetDir){
  const pairs=paths.map(p=>({ from:(targetDir?targetDir+'/':'')+p.split('/').pop(), back:p.split('/').slice(0,-1).join('/') }));
  return async()=>{ for(const u of pairs) await FS.move([u.from], u.back); };
}
async function explPaste(){ if(!EX.clip) return; const {mode,paths}=EX.clip;
  try{ if(mode==='cut'){ await FS.move(paths,EX.path); EX.clip=null; await explReload(); toastUndo('Moved here', explUndoMove(paths,EX.path)); }
    else { await FS.copy(paths,EX.path); await explReload(); toast('Pasted'); } }catch(e){ toast(e.message); } }
async function explDelete(){ const paths=[...EX.sel]; if(!paths.length) return;
  const label=paths.length===1?`“${paths[0].split('/').pop()}”`:`${paths.length} items`;
  if(!await crsConfirm({title:'Delete '+label+'?',body:'Small text files can be restored with Undo right after.'})) return;
  // snapshot small text files (and empty folders) so Undo can restore them
  const snap=[]; let unrecoverable=0;
  for(const p of paths){ const n=explNodeByPath(p);
    if(n&&n.type==='file' && (n.size||0)<=262144 && !/^(img|pdf|xls|doc|gen)$/.test(ICON_EXT2TYPE[extOf(n.name)]||'gen')){
      try{ snap.push({p, content:await FS.read(p)}); }catch{ unrecoverable++; } }
    else if(n&&n.type==='dir' && !(n.children||[]).length) snap.push({p, folder:true});
    else unrecoverable++; }
  try{ await FS.del(paths); EX.sel.clear(); EX.cur=null; await explReload(); }catch(e){ toast(e.message); return; }
  if(snap.length){
    toastUndo('Deleted '+label+(unrecoverable?'  ·  Undo partial (rest via git)':''), async()=>{
      for(const s of snap){ if(s.folder){ const dir=s.p.split('/').slice(0,-1).join('/'); await FS.create(dir, s.p.split('/').pop(), 'folder', false); } else await FS.write(s.p, s.content); } });
  } else toast('Deleted '+label+' — Undo unavailable, recover via git');
}

function explKey(e){
  if(e.target.closest && e.target.closest('.expl-rename')) return;   // rename input owns its keys
  if(e.key==='Escape'){ EX.sel.clear(); EX.cur=null; explPaintSel(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); EX.sel=new Set(explVisible().map(n=>n.path)); EX.cur=EX.cur||[...EX.sel][0]; explPaintSel(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); explUp(); return; }
  if(e.key==='F2'){ e.preventDefault(); if(EX.cur!=null) explBeginRename(EX.cur); return; }
  if(e.key==='Delete'){ e.preventDefault(); explDelete(); return; }
  const cmd=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(cmd&&k==='c'){ e.preventDefault(); if(EX.sel.size){ EX.clip={mode:'copy',paths:[...EX.sel]}; toast(EX.sel.size+' copied'); } return; }
  if(cmd&&k==='x'){ e.preventDefault(); if(EX.sel.size){ EX.clip={mode:'cut',paths:[...EX.sel]}; toast(EX.sel.size+' cut'); } return; }
  if(cmd&&k==='v'){ EX._pasteWait=setTimeout(()=>explPaste(), 90); return; }   // defer: the paste EVENT decides (OS files vs internal clipboard)
  if(cmd&&k==='n'){ e.preventDefault(); explNew('folder'); return; }
  const items=explVisible(); if(!items.length) return; const paths=items.map(n=>n.path);
  let idx=EX.cur!=null?paths.indexOf(EX.cur):-1;
  const cols=EX.view==='grid'?Math.max(1,Math.floor($('explMain').clientWidth/106)):1;
  const move=(ni)=>{ ni=Math.max(0,Math.min(paths.length-1,ni)); const p=paths[ni]; if(e.shiftKey&&EX.cur!=null) explSelectRange(EX.cur,p); else { EX.sel.clear(); EX.sel.add(p); } EX.cur=p; explPaintSel(); const el=$('explMain').querySelector(`[data-path="${CSS.escape(p)}"]`); el&&el.scrollIntoView({block:'nearest'}); };
  if(e.key==='ArrowDown'){ e.preventDefault(); move(idx<0?0:idx+cols); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); move(idx<0?0:idx-cols); return; }
  if(e.key==='ArrowRight'&&EX.view==='grid'){ e.preventDefault(); move(idx<0?0:idx+1); return; }
  if(e.key==='ArrowLeft'&&EX.view==='grid'){ e.preventDefault(); move(idx<0?0:idx-1); return; }
  if(e.key==='Home'){ e.preventDefault(); move(0); return; }
  if(e.key==='End'){ e.preventDefault(); move(paths.length-1); return; }
  if(e.key==='Enter'){ e.preventDefault(); if(EX.cur!=null){ const n=items[paths.indexOf(EX.cur)]; n&&(n.type==='dir'?explGoto(n.path):explOpenFile(n.path)); } return; }
  // type-ahead
  if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey){ EX.ta+=e.key.toLowerCase(); clearTimeout(EX.taT); EX.taT=setTimeout(()=>EX.ta='',700);
    const hit=items.find(n=>n.name.toLowerCase().startsWith(EX.ta)); if(hit){ EX.sel.clear(); EX.sel.add(hit.path); EX.cur=hit.path; explPaintSel(); $('explMain').querySelector(`[data-path="${CSS.escape(hit.path)}"]`)?.scrollIntoView({block:'nearest'}); } }
}

let peekTimer=null, peekPath=null, peekEl=null; const peekCache={};
function ensurePeek(){ if(!peekEl){ peekEl=document.createElement('div'); peekEl.className='filepeek'; document.body.appendChild(peekEl); } return peekEl; }
function hidePeek(){ clearTimeout(peekTimer); peekPath=null; if(peekEl) peekEl.classList.remove('show'); document.querySelectorAll('.peeking').forEach(el=>el.classList.remove('peeking')); }
// Delegated hover on the explorer grid — files (data-path) only, short delay to avoid flicker.
function setupExplPeek(){
  const grid=$('explMain'); if(!grid || grid._peekWired) return; grid._peekWired=true;
  const SEL='.expl-row[data-path],.expl-item[data-path]';   // files AND folders preview
  grid.addEventListener('mouseover',(e)=>{ const it=e.target.closest(SEL); if(!it) return; if(it.dataset.path===peekPath) return; clearTimeout(peekTimer); const p=it.dataset.path, mx=e.clientX; peekTimer=setTimeout(()=>showPeek(it,p,mx), 350); });
  grid.addEventListener('mouseout',(e)=>{ const it=e.target.closest(SEL); if(it && !it.contains(e.relatedTarget)) hidePeek(); });
  grid.addEventListener('scroll',hidePeek,{passive:true});
  grid.addEventListener('keydown',hidePeek,{capture:true});   // hides immediately on any key
}
// Anchor the card to the hovered item: above it when space allows, below when
// not — centered near the cursor X, never covering the item, never off-viewport.
function positionPeek(el, itemEl, mx){
  const r=itemEl.getBoundingClientRect(), pw=el.offsetWidth||300, ph=el.offsetHeight||270, gap=10;
  let left=(mx!=null? mx-pw/2 : r.left+r.width/2-pw/2);
  left=Math.max(8, Math.min(left, innerWidth-pw-8));
  let top=r.top-ph-gap;                                  // prefer above the item
  if(top<8) top=r.bottom+gap;                            // otherwise below
  if(top+ph>innerHeight-8) top=Math.max(8, r.top-ph-gap); // last resort: back above, clamped
  el.style.left=left+'px'; el.style.top=Math.max(8,top)+'px';
}
async function showPeek(itemEl, path, mx){
  const el=ensurePeek(); peekPath=path;
  document.querySelectorAll('.peeking').forEach(x=>x.classList.remove('peeking')); itemEl.classList.add('peeking');
  const name=path.split('/').pop(), ext=extOf(name);
  const isDir=itemEl.dataset.dir==='1';
  const ficon=isDir?`<span class="tico" style="color:var(--folder-icon)">${_EGL.folder}</span>`:fic(name,20);
  const mkFoot=(badge)=>`<div class="pk-foot">${ficon}<span class="nm">${esc(name)}</span><span class="pk-ext">${esc(badge)}</span></div>`;
  let foot=mkFoot((ext||'file').toUpperCase());
  const paint=(media)=>{ el.innerHTML=media+foot; positionPeek(el,itemEl,mx); el.classList.add('show'); };
  // folders: list the first 8 children + "N items"
  if(itemEl.dataset.dir==='1'){
    const node=explNodeByPath(path), kids=(node&&node.children)||[];
    foot=mkFoot(kids.length+' item'+(kids.length===1?'':'s'));
    const rows=kids.slice(0,8).map(k=>`<div class="pk-krow">${k.type==='dir'?ticon(k):fic(k.name,16)}<span>${esc(k.name)}</span></div>`).join('');
    paint(`<div class="pk-kids">${rows||'<div class="pk-kempty">Empty folder</div>'}</div>`); return;
  }
  if(isImg(name)){ paint(`<div class="pk-media"><img src="/api/raw?path=${encodeURIComponent(path)}" alt=""></div>`); return; }
  if(isHtml(name)){ paint(`<div class="pk-media"><iframe class="pk-frame" sandbox="allow-same-origin" src="/api/raw?path=${encodeURIComponent(path)}"></iframe></div>`); return; }
  if(/\.(pdf|xlsx?|zip|docx?|node|dll|exe|bin|ico|woff2?|ttf)$/i.test(name)){
    paint(`<div class="pk-none">${fileIcon(name,56)}No inline preview</div>`); return;
  }
  // text-like → fetch a snippet (cached)
  if(peekCache[path]===undefined){
    paint(`<div class="pk-media"><span class="pk-load">Loading preview…</span></div>`);
    try{ const {content}=await api('/api/file?path='+encodeURIComponent(path)); peekCache[path]=(content||'').slice(0,2000); }
    catch{ peekCache[path]=null; }
    if(peekPath!==path) return;   // hovered away while loading
  }
  const txt=peekCache[path];
  if(txt==null){ paint(`<div class="pk-none">Preview unavailable</div>`); return; }
  if(/^(md|markdown)$/.test(ext)) paint(`<div class="pk-md">${renderMd(txt)}</div>`);
  else paint(`<pre class="pk-text">${esc(txt)}</pre>`);
}

(function(){
  let sent=0;
  function report(message,stack,url){
    if(sent>50) return; sent++;   // don't flood on a render loop
    try{ navigator.sendBeacon ? navigator.sendBeacon('/api/client-error', new Blob([JSON.stringify({message,stack,url})],{type:'application/json'}))
      : fetch('/api/client-error',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,stack,url}),keepalive:true}); }catch{}
  }
  addEventListener('error',e=>{ if(e.message) report(e.message,(e.error&&e.error.stack)||'',location.hash||location.pathname); });
  addEventListener('unhandledrejection',e=>{ const r=e.reason; report((r&&r.message)||String(r),(r&&r.stack)||'','promise'); });
})();
