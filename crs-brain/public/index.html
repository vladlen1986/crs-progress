<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRS Brain</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="scrollbars.css">
<script src="js/scrollbars.js" defer></script>
<style>
  /* Canonical tokens + legacy aliases live in tokens.css (design system §2.10).
   * This block holds app-specific extras only. */
  :root{
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --grad:var(--accent); /* flat — CRS is border-only, no gradients or glows (§17) */
    /* themeable veils + code/prose surfaces — approved literals, no canonical token exists (judgment-calls.md #4) */
    --veil:rgba(255,255,255,.05); --veil-2:rgba(255,255,255,.03);
    --code-bg:#0b0b0e; --code-fg:#D4D4D8; --prose:#C9C9CE;
    --folder-icon:#5B9CF6; --hl-str:#7EC699; --hl-num:#E5C07B; --hl-kw:#61AFEF; /* code syntax — approved literals, light pairs below */
    --head-bg:rgba(24,24,24,.62); --overlay:rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    --veil:rgba(0,0,0,.04); --veil-2:rgba(0,0,0,.025);
    --code-bg:#F5F5F3; --code-fg:#2A2A2A; --prose:#232323;
    --folder-icon:#2563EB; --hl-str:#2F855A; --hl-num:#B7791F; --hl-kw:#1D4ED8;
    --icon-sheet:#E9E9EB; --icon-fold:#C8C8CB; --icon-line:#9B9BA1; /* file-icon artwork, light pairs */
    --head-bg:rgba(250,250,250,.78); --overlay:rgba(0,0,0,.30);
  }
  :root[data-theme="light"] body{ -webkit-font-smoothing:auto }
  *{box-sizing:border-box}
  .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex:0 0 auto}
  .ic.sm{width:13px;height:13px}
  .ic.spinning{animation:sp .7s linear infinite}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--secondary);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  /* scrollbars → shared /scrollbars.css (sidebar3: invisible until hover/scroll) */

  .app{display:grid;grid-template-columns:var(--left-w,280px) 1fr;height:100vh}   /* sidebar3: default 280px; user-dragged widths (localStorage.leftW) still win */
  .col{overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .col.left{border-right:1px solid var(--line);background:var(--panel)}
  .col.right{border-left:1px solid var(--line);background:var(--panel)}
  .col.center{background:transparent;position:relative}
  /* swappable views (chat/dashboard/file/map) fill the space above the persistent composer */
  .content-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .content-area > *{min-height:0}
  /* map mode: let the galaxy background fill the whole area, with the composer floating over its bottom */
  .col.center.map-mode .composer-wrap{position:absolute;left:0;right:0;bottom:0;z-index:5;background:transparent;pointer-events:none}
  .col.center.map-mode .composer-wrap > *{pointer-events:auto}

  /* sidebar collapse (desktop only) — collapses to a narrow icon rail, not hidden */
  @media (min-width:901px){
    .app.lcol{grid-template-columns:54px 1fr}
    /* hide the full panel content, reveal its icon rail */
    .app.lcol .col.left > :not(.side-rail){display:none}
    .app.lcol .col.left .side-rail{display:flex}
  }
  /* narrow icon rail shown when a panel is collapsed */
  .side-rail{display:none;flex-direction:column;align-items:center;gap:5px;padding:12px 0;overflow:hidden}
  .side-rail button{width:38px;height:38px;border-radius:9px;background:none;border:1px solid transparent;color:var(--secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);flex:0 0 auto;font-family:inherit}
  .side-rail button:hover{color:var(--primary);background:var(--panel2);border-color:var(--line)}
  .side-rail button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-rail .rsep{width:22px;height:1px;background:var(--line);margin:5px 0;flex:0 0 auto}
  /* collapse toggle: absolutely pinned right so it doesn't shift the logo's centering;
     invisible until the sidebar is hovered OR the button is keyboard-focused (a11y) */
  .col-collapse{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--elev);border:1px solid var(--line2);color:var(--secondary);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0;opacity:0;transition:opacity .16s ease-in-out,color var(--transition),border-color var(--transition),background var(--transition)}
  .col.left:hover .col-collapse,.col-collapse:focus-visible{opacity:1}
  .col-collapse:hover{color:var(--primary);border-color:var(--line2);background:var(--panel2)}
  .col-collapse svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .expand-handle{display:none;position:absolute;top:14px;z-index:20;background:var(--panel2);border:1px solid var(--line);color:var(--muted);width:24px;height:32px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition)}
  .expand-handle:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  .expand-handle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .expand-handle.left{left:10px}
  .expand-handle.right{right:10px}

  /* brand */
  .brand{position:relative;padding:16px 16px 12px;display:flex;align-items:center;justify-content:center;gap:11px}
  .wordwrap{position:relative;display:inline-block;flex:0 0 auto}
  .brand .wordmark{width:110px;height:35px;color:var(--primary);opacity:.72;display:block}
  .brainwrap{position:relative;display:inline-block;width:15px;height:15px}
  .brand .brainwrap{position:absolute;top:-8px;right:-14px}
  .brainmark{width:15px;height:15px;display:block;stroke:url(#g-ai)}   /* gradient via CSS (inherits into <use> shadow DOM) so finished steps can grey it */
  /* in-chat thinking indicator — tops the streaming reply, removed once the first work step or answer text arrives (thinking step's brain takes over) */
  .chat-brain{display:flex;align-items:center;padding:8px 0 8px 14px}
  /* molecule cloud — colored dots orbit the brain in different directions/speeds.
     Animated ONLY in chat scopes (.chat-brain while streaming, .wstep.run Thinking step); the sidebar badge stays static. */
  .brainwrap::after{content:'';position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.45),transparent 70%);filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .chat-brain .brainwrap::after,.wstep.run .brainwrap::after{opacity:1;animation:aipulse 1.6s ease-in-out infinite}
  .chat-brain .brainmark,.wstep.run .brainmark{animation:aihue 2.4s linear infinite}
  .brainwrap .mol{position:absolute;top:50%;left:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor;opacity:0;transition:opacity .3s;pointer-events:none}
  .brainwrap .m1{color:#EC4899;--r:9px}
  .brainwrap .m2{color:#22D3EE;--r:12px;width:2.5px;height:2.5px}
  .brainwrap .m3{color:#A855F7;--r:7px;width:2px;height:2px}
  .brainwrap .m4{color:#6366F1;--r:14px}
  .brainwrap .m5{color:#F59E0B;--r:11px;width:2px;height:2px}
  .chat-brain .mol,.wstep.run .mol{opacity:1}
  .chat-brain .m1,.wstep.run .m1{animation:molCW 1.1s linear infinite;animation-delay:-.2s}
  .chat-brain .m2,.wstep.run .m2{animation:molCCW 1.7s linear infinite;animation-delay:-.8s}
  .chat-brain .m3,.wstep.run .m3{animation:molCW .9s linear infinite;animation-delay:-.5s}
  .chat-brain .m4,.wstep.run .m4{animation:molCCW 2.2s linear infinite;animation-delay:-1.4s}
  .chat-brain .m5,.wstep.run .m5{animation:molCW 1.4s linear infinite;animation-delay:-1s}
  /* mini brain inside a work-step icon: tighter orbits so dots hug the row */
  .wstep-ico .brainwrap::after{inset:-5px}
  .wstep-ico .brainwrap .m1{--r:6.5px}
  .wstep-ico .brainwrap .m2{--r:8.5px}
  .wstep-ico .brainwrap .m3{--r:5px}
  .wstep-ico .brainwrap .m4{--r:10px}
  .wstep-ico .brainwrap .m5{--r:7.5px}
  @keyframes molCW{from{transform:rotate(0turn) translateX(var(--r))}to{transform:rotate(1turn) translateX(var(--r))}}
  @keyframes molCCW{from{transform:rotate(0turn) translateX(var(--r))}to{transform:rotate(-1turn) translateX(var(--r))}}
  @keyframes aihue{to{filter:hue-rotate(360deg)}}
  @keyframes aipulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}

  /* account */
  .account{display:flex;align-items:center;gap:9px;margin:2px 12px 6px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;font-size:12px}

  /* tabs (segmented) */
  .tabs{display:flex;gap:3px;margin:6px 12px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:7px;font-size:12px;font-weight:600;border-radius:8px;transition:var(--transition)}
  .tabs button.on{color:var(--primary);background:var(--elev)}
  .pane{flex:1;overflow:auto;padding:4px 12px 12px}
  .pane.hide{display:none}

  /* bottom-pinned settings entry (visually separated from primary nav) */
  .side-foot{flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid var(--line);margin-top:6px}
  .surface-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .surface-back{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-btn);padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .surface-back:hover{color:var(--primary);border-color:var(--line2)}
  .surface-title{color:var(--primary);font-size:13.5px;font-weight:600}
  /* sidebar3 density: overline caps get generous top rhythm (§15); first cap stays close to search */
  .pane-cap{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding:18px 12px 6px}
  .pane-cap:first-child{padding-top:6px}
  .item .chi{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}   /* 16px leading conversation type icon */
  /* sidebar3: Buildprint rows carry a mono "BP" wordmark chip (accent tint) instead of a glyph */
  .item .bpchip{font:600 9px/16px var(--mono);letter-spacing:.04em;color:var(--accent-soft);background:var(--accent-tint);border-radius:4px;height:16px;padding:0 4px;flex:0 0 auto}
  /* sidebar3: live-turn signal — the leading icon/chip pulses while that chat's turn streams */
  @keyframes sb-live{0%,100%{opacity:1}50%{opacity:.35}}
  .item.live .chi,.item.live .bpchip{animation:sb-live 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){
    .item.live .chi,.item.live .bpchip{animation:none}
    .item.live::after{content:'';position:absolute;left:24px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
  }
  .item .cmenu{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px;opacity:0;min-width:24px}
  .item:hover .cmenu{opacity:1}
  .item .cmenu:hover{background:var(--panel2);color:var(--primary)}
  .expl-menu .mdiv{height:1px;background:var(--line);margin:4px 0}
  .side-set{width:100%;display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;color:var(--secondary);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);text-align:left}
  .side-set:hover{background:var(--panel2);color:var(--primary);border-color:var(--line)}
  .side-set.on{background:var(--accent-glow);color:var(--primary)}
  .side-set svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--muted);flex:0 0 17px}
  .side-set:hover svg,.side-set.on svg{color:var(--accent2)}

  .item{position:relative;padding:6px 11px;border-radius:9px;color:var(--secondary);font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;transition:var(--transition);margin:1px 0}
  .item:hover{background:var(--panel2)}
  /* sidebar3: selected = accent wash + 2px accent bar (design-system selected-row language, §Tables) */
  .item.on{background:var(--accent-glow);color:var(--primary);box-shadow:inset 2px 0 0 var(--accent)}

  .tree .node{padding:4px 7px;border-radius:7px;font-size:13px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center;transition:.1s}
  .tree .node:hover{background:var(--panel2)}
  .tree .node.file.on{background:var(--accent-glow);color:var(--primary)}
  .tree .dir{color:var(--primary);font-weight:600}
  .tree .children{margin-left:11px;border-left:1px solid var(--line);padding-left:5px}
  .tree .chev{display:inline-flex;color:var(--muted);transition:transform .15s;flex:0 0 auto}
  .tree .chev.open{transform:rotate(90deg)}
  .tree .file .ic{color:var(--muted)}
  .tree .dir .ic{color:var(--secondary)}

  /* center header */
  .center-head{padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:58px;flex:0 0 58px;background:var(--head-bg);backdrop-filter:blur(10px)}
  .center-head .title{color:var(--primary);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .center-head .spacer{margin-left:auto}
  /* view switcher: Chat · Map · Kanban · List */
  .viewseg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:1px;flex:0 0 auto}
  .viewseg button{background:none;border:none;color:var(--secondary);font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:var(--transition);white-space:nowrap}
  .viewseg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .viewseg button:hover{color:var(--secondary)}
  .viewseg button.on{background:var(--bg-elevated);color:var(--text-primary)}   /* greyscale toggle rule — no accent fill on view/mode toggles */
  .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 13px;font-size:12px;transition:var(--transition)}
  .ghost:hover{border-color:var(--line3);color:var(--primary)}
  .ghost.on{color:var(--primary);background:var(--accent-glow)} /* active = bg+text only (CRS rule) */
  .sel{background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%236B6B6B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 9px center;border:1px solid var(--input-border);color:var(--secondary);border-radius:var(--radius-input);padding:6px 26px 6px 10px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:var(--transition);-webkit-appearance:none;appearance:none}
  [data-theme="light"] .sel{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%238E8E95" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>')} /* chevron = --text-muted per theme (§16) */
  .sel:hover{border-color:var(--line3);color:var(--primary)}
  .sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .sel option{background:var(--panel2);color:var(--primary)}

  /* header usage chip + popover (moved out of the old right rail) */
  .uchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:var(--transition);flex:0 0 auto;white-space:nowrap}
  .uchip:hover{border-color:var(--line3);color:var(--primary)}
  .uchip .ic{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
  .uchip .uv{color:var(--primary);font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600}
  /* polish: chip stays neutral in every state — severity lives in the dot + popover
     (was: .uchip.warn/.crit amber/red border tints at 75%/90% usage) */
  .upop{position:absolute;top:50px;right:16px;width:326px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-modal);z-index:45;display:none;overflow:hidden}
  .upop.show{display:block;animation:msgIn .16s ease both}
  .upop .usage{padding:14px 15px}
  /* account chip (header): connection dot + usage % only; detail lives in the popover */
  .uchip.acct{gap:7px}
  .acct-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 8px;display:inline-block}
  .acct-dot.warn{background:var(--warn)} .acct-dot.err{background:var(--danger)}
  /* account popover header block (§6 dropdown) */
  .apop{border-color:var(--line);box-shadow:var(--shadow-dropdown)}
  .apop-acct{padding:13px 15px 12px;border-bottom:1px solid var(--line)}
  .apop-acct .apop-email{color:var(--primary);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apop-acct .apop-plan{color:var(--muted);font-size:11.5px;margin-top:2px}
  .apop-acct .apop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--secondary)}
  .apop-acct .apop-row .apop-v{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .apop-acct .apop-out{display:flex;align-items:center;gap:8px;width:100%;margin-top:11px;background:none;border:1px solid var(--line);color:var(--secondary);border-radius:8px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer;transition:var(--transition)}
  .apop-acct .apop-out:hover{background:rgba(239,68,68,.1);border-color:var(--danger);color:var(--danger)}
  .apop-acct .apop-out svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
  .apop-acct .apop-connect{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;background:var(--accent);border:none;color:var(--white);border-radius:8px;padding:9px 11px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer;transition:var(--transition)}
  .apop-acct .apop-connect:hover{background:var(--accent-hover)}
  .apop-acct .apop-connect svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9}
  /* composer lives on chat AND dashboard (home = start screen) — hidden on files / map / bubble */
  .col.center.no-composer .composer-wrap{display:none}

  /* header icon buttons (bell, settings) + notification badge */
  .hicon{position:relative;background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-btn);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);flex:0 0 auto}
  .hicon:hover{border-color:var(--line3);color:var(--primary)}
  .hicon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nbadge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;font-family:var(--mono);border:2px solid var(--panel)}
  .nbadge.show{display:inline-flex}
  /* notifications inbox */
  .ninbox{position:absolute;top:50px;right:16px;width:370px;max-width:calc(100vw - 32px);max-height:72vh;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-dropdown);z-index:46;display:none;flex-direction:column;overflow:hidden}
  .ninbox.show{display:flex;animation:msgIn .16s ease both}
  .ninbox-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--primary);font-size:12.5px;font-weight:600}
  .ninbox-head .act{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:3px 7px;border-radius:6px;font-family:inherit}
  .ninbox-head .act:hover{color:var(--accent2);background:var(--panel2)}
  .ninbox-list{overflow:auto;padding:6px}
  .nitem{display:flex;gap:10px;padding:10px 11px;border-radius:8px;transition:var(--transition);cursor:default}
  .nitem:hover{background:var(--panel2)}
  .nitem.link{cursor:pointer}
  .nitem .nico{width:26px;height:26px;border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 26px;margin-top:1px} /* category icon, §16 role color via inline color */
  .nitem .nico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nitem .ntxt{min-width:0;flex:1}
  .nitem .nt{color:var(--primary);font-size:13px;font-weight:600}
  .nitem .nb{color:var(--secondary);font-size:12px;line-height:1.45;margin-top:2px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nitem .nm{color:var(--muted);font-size:10.5px;margin-top:3px;font-family:var(--mono)}
  .nitem .nunread{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;margin-top:7px} /* 6px accent unread dot */
  .ninbox-foot{display:flex;justify-content:flex-end;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
  .ninbox-foot .act{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:3px 7px;border-radius:6px;font-family:inherit}
  .ninbox-foot .act:hover{color:var(--accent2);background:var(--panel2)}
  .ninbox-dnd{display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .hicon.dnd{color:var(--warn)}
  .ninbox-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 16px}
  /* v2 notification settings — compact per-type channel controls */
  .mrow.ntype{flex-direction:column;align-items:stretch;gap:9px;padding:12px 0}
  .mrow.ntype .mctl{width:100%;justify-content:flex-start;gap:12px}
  .mrow.ntype .sel{margin-left:auto;max-width:160px}
  .chctl{display:flex;flex-direction:column;align-items:center;gap:3px}
  .chctl>span{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .switch.sm{width:30px;height:18px}
  .switch.sm .sl::before{width:12px;height:12px}
  .switch.sm input:checked+.sl::before{transform:translateX(12px)}
  .tbtn28{height:28px;padding:0 10px;display:inline-flex;align-items:center}
  .sync-stamp{color:var(--muted);font-size:10.5px;font-family:var(--mono);display:block;margin-top:5px}
  @keyframes nspin{to{transform:rotate(360deg)}}
  .nspin{display:inline-block;width:11px;height:11px;border:1.5px solid var(--line3);border-top-color:var(--accent2);border-radius:50%;animation:nspin .7s linear infinite;vertical-align:-1px;margin-right:5px}

  /* generic modal (settings) */
  .modal-wrap{position:fixed;inset:0;background:var(--overlay);z-index:380;display:none;align-items:center;justify-content:center;padding:24px}
  .modal-wrap.show{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius-modal);width:740px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-modal);overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:16px;color:var(--primary);font-weight:650;flex:1}
  .modal-head .mx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;width:30px;height:30px;border-radius:8px;transition:var(--transition)}
  .modal-head .mx:hover{color:var(--primary);background:var(--panel2)}
  .modal-body{display:flex;min-height:0;flex:1}
  .modal-nav{flex:0 0 180px;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--panel2)}
  .modal-nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--secondary);text-align:left;padding:9px 11px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition)}
  .modal-nav button:hover{background:var(--elev);color:var(--primary)}
  .modal-nav button.on{background:var(--accent-glow);color:var(--primary)}
  /* confirm dialog — §5: 420px, r12, footer 36px buttons; danger = --error fill */
  .cfm-box{width:420px}
  .cfm-head{padding:18px 22px 0}
  .cfm-head h2{margin:0;font-size:17px;font-weight:700;color:var(--primary)}
  .cfm-body{padding:10px 22px 4px;font-size:13px;color:var(--secondary);line-height:1.55}
  .cfm-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px 18px;border-top:1px solid var(--line);margin-top:14px}
  .cfm-foot .mbtn2{height:36px}
  .mbtn2.danger{background:var(--danger);border-color:var(--danger);color:var(--white)} /* approved literal — on-fill text */
  .mbtn2.danger:hover{filter:none;background:var(--error-soft)}
  .modal-nav button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--muted);flex:0 0 16px}
  .modal-nav button.on svg{color:var(--accent2)}
  .modal-pane{flex:1;overflow:auto;padding:18px 24px 24px}
  .msec-title{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 0 2px}
  .mrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .mlbl{flex:1;min-width:0}
  .mrow .mlbl b{color:var(--primary);font-size:13px;font-weight:600;display:block}
  .mrow .mlbl span{color:var(--muted);font-size:11.5px;line-height:1.5;display:block;margin-top:3px}
  .mrow .mctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
  /* switch */
  .switch{position:relative;width:38px;height:22px;flex:0 0 auto;display:inline-block}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .sl{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;cursor:pointer;transition:var(--transition)}
  .switch .sl::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:var(--transition)}
  .switch input:checked+.sl{background:var(--accent);border-color:var(--accent)}
  .switch input:checked+.sl::before{transform:translateX(16px);background:#fff}
  /* segmented control */
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:1px}
  .seg button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:var(--transition)}
  .seg button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
  .seg button.on{background:var(--elev);color:var(--primary)}
  [data-theme="light"] .seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.08)} /* §3.3: elevation = shadow in light */
  .tinput{background:var(--panel2);border:1px solid var(--input-border);color:var(--primary);border-radius:var(--radius-input);padding:8px 11px;font:inherit;font-size:12.5px;outline:none;min-width:210px}
  .tinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .mbtn2{background:var(--panel2);border:1px solid var(--line2);color:var(--secondary);border-radius:var(--radius-btn);padding:8px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap}
  .mbtn2:hover{border-color:var(--line3);color:var(--primary)}
  .mbtn2.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mbtn2.primary:hover{background:var(--accent-hover)}
  .mstat{font-size:11.5px;font-weight:600}
  .mstat.ok{color:var(--good)} .mstat.off{color:var(--muted)} .mstat.warn{color:var(--warn)}

  /* chat */
  .chat{flex:1;overflow:auto;padding:28px 18px 12px}
  /* Claude-style: no avatars, a tighter reading column, airy spacing */
  .msg{display:block;max-width:744px;margin:0 auto 26px;animation:msgIn .4s cubic-bezier(.2,.7,.2,1) both}
  .avatar{display:none}
  .content{min-width:0}
  /* user turn = subtle rounded bubble, right-aligned, content-width */
  .msg.user .content{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--panel2);border:none;border-radius:16px;padding:10px 15px;color:var(--primary);display:inline-block;max-width:88%;font-size:15px;line-height:1.6;text-align:left}
  /* assistant turn = clean bright prose, no bubble */
  .body{color:var(--secondary)}
  .msg.assistant .body{color:var(--prose);font-size:15px;line-height:1.72}
  .dim{color:var(--muted)}

  /* streaming reveal */
  .streaming{white-space:pre-wrap;word-break:break-word}
  .tok{opacity:0;animation:tokIn .42s cubic-bezier(.22,.61,.36,1) forwards}
  .caret{display:inline-block;width:7px;height:1.02em;background:var(--accent);border-radius:2px;vertical-align:text-bottom;margin-left:1px;animation:blink 1.05s steps(1) infinite}
  .body.err{color:var(--error-soft)}

  /* work blocks — Buildprint-style grouped activity: one "Worked for Xs" header
     folds a run of steps; each step is a clean icon+label row, expandable for detail */
  .wblocks{display:flex;flex-direction:column;gap:16px;margin-bottom:8px}
  .wblocks:empty{display:none}
  .wgroup{border:none;background:none}
  .wghead{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;padding:2px 0;color:var(--secondary);font:inherit;font-size:13px;text-align:left;cursor:pointer}
  .wghead:hover .wglabel{color:var(--primary)}
  .wgchev{order:9;margin-left:auto;width:13px;height:13px;flex:0 0 auto;color:var(--muted);transition:transform .18s}
  .wgroup.open .wgchev{transform:rotate(90deg)}
  .wglabel{font-weight:500;letter-spacing:.1px;font-variant-numeric:tabular-nums}
  .wgroup.run .wglabel{color:var(--accent2,#60A5FA);animation:wpulse 1.5s ease-in-out infinite}
  @keyframes wpulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* meshing watch gears in the group header — spin while the group runs, freeze when done */
  .wgears{position:relative;width:24px;height:20px;flex:0 0 24px}
  .wgears svg{position:absolute;display:block}
  .wgears .g1{width:14px;height:14px;left:0;bottom:1px;color:var(--muted)}
  .wgears .g2{width:10px;height:10px;right:0;top:0;color:var(--muted)}
  .wgroup.run .wgears .g1{color:var(--accent2,#60A5FA);animation:gearCW 3.2s linear infinite}
  .wgroup.run .wgears .g2{color:var(--accent2,#60A5FA);animation:gearCCW 2.3s linear infinite}
  @keyframes gearCW{to{transform:rotate(1turn)}}
  @keyframes gearCCW{to{transform:rotate(-1turn)}}
  /* per-type step icons: color + motion ONLY while the step runs; finished steps
     drop back to the default tone (rules below beat the generic .run accent color) */
  .wstep.run .wstep-ico .t-wrench{color:#FB923C;animation:aWrench .9s ease-in-out infinite}
  .wstep.run .wstep-ico .t-todo{color:#A78BFA}
  .wstep.run .wstep-ico .t-todo .ac1{animation:aTick 1.4s ease-in-out infinite}
  .wstep.run .wstep-ico .t-todo .ac2{animation:aTick 1.4s ease-in-out .25s infinite}
  .wstep.run .wstep-ico .t-todo .ac3{animation:aTick 1.4s ease-in-out .5s infinite}
  .wstep.run .wstep-ico .t-bot{color:#F472B6}
  .wstep.run .wstep-ico .t-bot .aant{animation:aAnt 1s ease-in-out infinite}
  .wstep.run .wstep-ico .t-bot .aeyes{animation:aEyes 2.2s infinite}
  .wstep.run .wstep-ico .t-term{color:#34D399}
  .wstep.run .wstep-ico .t-term .acur{animation:blink .9s step-end infinite}
  .wstep.run .wstep-ico .t-globe{color:#818CF8}
  .wstep.run .wstep-ico .t-globe .amer{stroke-dasharray:3 2.5;animation:aDash 1.1s linear infinite}
  .wstep.run .wstep-ico .t-search{color:#22D3EE;animation:aScan 1.2s ease-in-out infinite}
  .wstep.run .wstep-ico .t-pencil{color:#FBBF24;transform-origin:25% 80%;animation:aWrite .55s ease-in-out infinite}
  .wstep.run .wstep-ico .t-doc{color:#60A5FA}
  .t-doc .ascan{opacity:0}
  .wstep.run .wstep-ico .t-doc .ascan{transform-box:fill-box;animation:aRead 1.3s linear infinite}
  /* thinking brain follows the same rule: gradient while running, grey when done.
     Stroke must live on the svg (CSS inheritance crosses into <use> shadow DOM;
     document selectors like ".brainmark g" cannot) */
  .wstep-ico .brainmark{stroke:var(--muted)}
  .wstep.run .wstep-ico .brainmark{stroke:url(#g-ai)}
  @keyframes aWrench{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(12deg)}}
  @keyframes aTick{0%,15%{opacity:.15}45%,100%{opacity:1}}
  @keyframes aAnt{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes aEyes{0%,88%,100%{opacity:1}93%{opacity:.1}}
  @keyframes aDash{to{stroke-dashoffset:-11}}
  @keyframes aScan{0%,100%{transform:translate(-1.2px,-.6px) rotate(-8deg)}50%{transform:translate(1.2px,.6px) rotate(8deg)}}
  @keyframes aWrite{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg) translateX(1px)}}
  @keyframes aRead{0%{transform:translateY(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(5px);opacity:0}}
  .wsteps{display:none;flex-direction:column;gap:1px;margin:7px 0 1px;padding-left:5px}
  .wgroup.open .wsteps{display:flex}
  .wstep{display:flex;flex-direction:column}
  /* actor lanes: who did this step — Brain (app/analysis) vs Buildprint (Bubble side) */
  .wlane{display:flex;align-items:center;gap:8px;margin:7px 2px 2px;font:600 9px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .wlane.bp{color:var(--accent)}
  .wstep-head{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:7px;color:var(--secondary);font-size:12.5px;line-height:1.45;cursor:default}
  .wstep.has-body .wstep-head{cursor:pointer}
  .wstep.has-body .wstep-head:hover{background:var(--veil)}
  .wstep-ico{width:15px;height:15px;flex:0 0 auto;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .wstep-ico svg{width:15px;height:15px}
  .wstep-lbl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wstep.run .wstep-lbl,.wstep.run .wstep-ico{color:var(--accent2,#60A5FA)}
  .wstep.run .wstep-lbl{animation:wpulse 1.5s ease-in-out infinite}
  .wstep-exp{width:11px;height:11px;flex:0 0 auto;color:var(--muted);opacity:0;transition:transform .15s}
  .wstep.has-body .wstep-exp{opacity:.55}
  .wstep.open .wstep-exp{transform:rotate(90deg)}
  .wstep-body{display:none;white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:12px;line-height:1.62;padding:3px 8px 9px 33px}
  .wstep.open .wstep-body{display:block}

  /* auto-fallback note: shown when the chosen model was inaccessible and the app switched */
  .switch-note{display:flex;align-items:center;gap:8px;margin:2px 0 10px;padding:7px 11px;border:1px solid var(--line);border-left:3px solid #F59E0B;background:var(--veil);border-radius:8px;color:var(--secondary);font-size:12.5px;line-height:1.4}
  .switch-note b{color:var(--primary);font-weight:600}
  .sw-bolt{color:var(--warning);font-size:13px;line-height:1;flex:0 0 auto;animation:wpulse 1.5s ease-in-out infinite}

  /* prompt queue strip */
  .queue-strip{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:0 22px 8px;max-width:830px;margin:0 auto;width:100%}
  .queue-strip:empty{display:none}
  .queue-strip .ql{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .qchip{display:flex;align-items:center;justify-content:space-between;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 8px 6px 12px;font-size:12px;color:var(--secondary);width:100%}
  .qchip .qtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qchip .qx{cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;border-radius:50%}
  .qchip .qx:hover{color:var(--danger)}

  /* (2026-08-06) the Chat·Buildprint mode switch is gone — ONE chat that reaches
     the repo, the brain and the Buildprint CLI as each task requires. */
  /* chat starter template cards (mode-aware) */
  .tcards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:600px;margin:24px auto 0}
  .tcard{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;transition:var(--transition);font-family:inherit}
  .tcard:hover{border-color:var(--line2);background:var(--panel2)}
  .tcard .tct{color:var(--primary);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:9px}
  .tcard .tct svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;color:var(--accent2);flex:0 0 16px}
  .tcard .tcd{color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.45}
  @media (min-width:720px){.tcards{grid-template-columns:repeat(3,1fr);max-width:770px}}
  @media (max-width:520px){.tcards{grid-template-columns:1fr}}

  /* live generation meter — elapsed + running input/output tokens */
  .genmeter{display:none;align-items:center;gap:10px;max-width:830px;margin:0 auto 8px;padding:6px 13px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;font-size:11.5px;color:var(--secondary);width:max-content}
  .genmeter.show{display:inline-flex}
  .genmeter .gm-live{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:wpulse 1.2s ease-in-out infinite;flex:0 0 7px}
  .genmeter .gm-t{font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--primary);font-weight:600}
  .genmeter .gm-sep{width:1px;height:11px;background:var(--line3)}
  .genmeter .gm-tok{font-family:var(--mono);color:var(--muted)}
  .genmeter .gm-tok b{color:var(--secondary);font-weight:600}

  /* ───── full-window kanban / list board ───── */
  /* polish: native kb-* kanban removed — the map board (map.html right drawer) is the single kanban */

  /* composer */
  .composer-wrap{padding:12px 18px 30px}
  /* Map view: let the galaxy iframe fill the whole center (incl. behind the composer) and float the
     composer on top so its dark background extends below the chat input — no seam. */
  .col.center.map-mode .composer-wrap{position:absolute;left:0;right:0;bottom:0;background:transparent;z-index:10;pointer-events:none}
  .col.center.map-mode .composer-wrap > *{pointer-events:auto}
  /* Claude-app-style composer: text on top, controls row beneath */
  .composer{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:12px 12px 9px;transition:border-color .15s,box-shadow .15s;max-width:830px;margin:0 auto}
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .composer textarea{width:100%;resize:none;background:none;border:none;color:var(--primary);padding:2px 4px;font-family:inherit;font-size:15px;max-height:260px;min-height:48px;line-height:1.55}
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--muted)}
  .composer-row{display:flex;align-items:center;gap:6px}
  .composer-row .sel.mini{height:30px;padding:5px 22px 5px 9px;font-size:11.5px;max-width:118px;background-position:right 7px center}
  .attach-btn{background:none;border:none;color:var(--muted);width:38px;height:38px;border-radius:11px;font-size:16px;flex:0 0 auto;transition:var(--transition)}
  .attach-btn:hover{background:var(--elev);color:var(--primary)}
  /* voice dictation: mic button pulses while listening; ghost strip shows interim speech */
  .mic-btn{position:relative}
  .mic-btn.rec{color:var(--accent);background:var(--accent-tint);animation:micPulse 1.5s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 6px var(--accent-glow)}}
  @media (prefers-reduced-motion:reduce){.mic-btn.rec{animation:none}}
  .mic-btn .devdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1px solid var(--panel);pointer-events:none}
  /* mic/device popover — expl-menu base, anchored above the composer */
  .mic-menu{min-width:238px;max-width:320px}
  .mic-menu .mm-t{font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:7px 10px 5px}
  .mic-menu .mm-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mic-menu .mm-radio{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line3);flex:0 0 auto}
  .mic-menu button.on .mm-radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2.5px var(--panel)}
  .mic-menu .mm-langs{display:flex;gap:5px;padding:2px 10px 6px}
  .mic-menu .mm-langs button{width:auto;flex:1;justify-content:center;font-family:var(--mono);font-size:11px;padding:5px 0}
  .mic-menu .mm-langs button.on{background:var(--accent-tint);color:var(--accent)}
  .mic-menu .mm-note{padding:5px 10px 7px;font-size:11px;line-height:1.5;color:var(--muted)}
  .dict-ghost{display:none;max-width:830px;margin:0 auto;padding:0 22px 8px;width:100%;font-family:var(--mono);font-size:11px;color:var(--text-muted,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dict-ghost.show{display:block}
  .send{background:var(--grad);border:none;color:#fff;font-weight:700;border-radius:8px;width:38px;height:38px;font-size:17px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
  .send:hover{background:var(--accent-hover)}
  .send:disabled{opacity:.4;cursor:default}
  .send.stop{background:var(--panel2);border:1px solid var(--line3);color:var(--danger)}
  .send.stop:hover{background:var(--elev);border-color:var(--danger)}
  .stopped-note{color:var(--muted);font-size:12px;font-style:italic;margin-top:6px}
  .ingest-btn{display:none;align-items:center;gap:7px;background:var(--accent-tint);border:1px solid var(--line2);color:var(--accent2);font-weight:600;border-radius:8px;height:38px;padding:0 14px;font-size:12.5px;flex:0 0 auto;transition:var(--transition);white-space:nowrap}
  .ingest-btn.show{display:inline-flex}
  .ingest-btn:hover{background:var(--accent-glow);color:var(--primary)}
  .ingest-btn:disabled{opacity:.4;cursor:default}
  .attach-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 22px 10px;max-width:830px;margin:0 auto}
  .attach-chips:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--secondary)}
  .chip .rm{cursor:pointer;color:var(--muted);font-weight:700}
  .chip .rm:hover{color:var(--danger)}
  .chip.up{opacity:.6}
  /* composer image attachments: small preview tiles with ✕ (left of input start) */
  .chip-th{position:relative;width:54px;height:54px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel2);flex:0 0 auto}
  .chip-th img{width:100%;height:100%;object-fit:cover;display:block}
  .chip-th .rm{position:absolute;top:3px;right:3px;width:17px;height:17px;border:0;border-radius:6px;background:rgba(18,18,22,.75);color:#E0E0E0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .chip-th .rm:hover{background:var(--danger)}
  .chip-th.up{opacity:.6}
  .chip-th.up .spin{position:absolute;inset:0;margin:auto}

  .msg-atts{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
  .matt{font-size:11px;background:var(--veil);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--primary)}
  /* sent-message image attachments: clickable thumbs → same viewer as replies */
  .matt-th{width:76px;height:76px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2);cursor:zoom-in;flex:0 0 auto;transition:border-color .15s ease,filter .15s ease}
  .matt-th img{width:100%;height:100%;object-fit:cover;display:block}
  .matt-th:hover{border-color:var(--accent);filter:brightness(1.06)}
  /* ── Ask Protocol: inline question cards ── */
  .askcard{margin:10px 0;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:14px 16px;max-width:640px}
  .askcard.pending{border-color:var(--accent)}
  .ask-q{font-size:13.5px;font-weight:600;color:var(--primary);line-height:1.45}
  .ask-ctx{font-size:12px;color:var(--muted);margin-top:4px;cursor:pointer}
  .ask-ctx .full{display:none;white-space:pre-wrap}
  .ask-ctx.open .full{display:block}.ask-ctx.open .tease{display:none}
  .ask-opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .ask-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--primary);font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .ask-opt:hover{border-color:var(--accent);background:var(--accent-glow)}
  .ask-opt:disabled{opacity:.5;cursor:default}
  .ask-opt .n{flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--veil);color:var(--muted);font:600 10px/18px var(--mono);text-align:center}
  .ask-opt .hint{color:var(--muted);font-size:11px;margin-left:auto}
  .ask-div{height:1px;background:var(--line2);opacity:.6;margin:10px 0 0}
  .ask-standing-opts{margin-top:8px}
  .ask-standing-opts .ask-opt{color:var(--muted);border-style:dashed}
  .ask-other{display:none;margin-top:8px;gap:6px}
  .ask-other.show{display:flex}
  .ask-other input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--primary);padding:7px 10px;font:inherit;font-size:12.5px;outline:none}
  .ask-other input:focus{border-color:var(--accent)}
  .ask-stand{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
  .ask-hint3{display:inline-block;margin-left:8px;font-size:10.5px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 7px;vertical-align:middle;font-weight:500}
  .ask-receipt{margin:8px 0;font-size:12px;color:var(--muted)}
  .ask-receipt b{color:var(--primary);font-weight:600}
  /* ── learn toasts: the brain learning / applying knowledge (top-right, expandable) ── */
  #learnToasts{position:fixed;top:14px;right:14px;z-index:340;display:flex;flex-direction:column;gap:8px;width:330px;pointer-events:none}
  .ltoast{pointer-events:auto;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow-modal);font-size:12px;color:var(--secondary);overflow:hidden}
  .ltoast .lt-head{display:flex;align-items:center;gap:8px;cursor:pointer}
  .ltoast .lt-ic{width:22px;height:22px;border-radius:7px;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;font-size:12px}
  .ltoast .lt-t{font-weight:600;color:var(--primary);font-size:12.5px;flex:1;min-width:0}
  .ltoast .lt-x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;font-size:12px}
  .ltoast .lt-x:hover{color:var(--primary)}
  .ltoast .lt-d{margin-top:6px;white-space:pre-wrap;max-height:54px;overflow:hidden;word-break:break-word}
  .ltoast .lt-more{color:var(--muted);font-size:10.5px;margin-top:4px}
  .ltoast.expanded{position:fixed;top:14px;right:14px;bottom:14px;width:430px;overflow:auto;z-index:350}
  .ltoast.expanded .lt-d{max-height:none}
  .ltoast.expanded .lt-more{display:none}
  .ltoast.learning{border-left-color:var(--purple)}
  .ltoast.applied{border-left-color:var(--good)}
  .ltoast.recurrence{border-left-color:var(--danger)}
  /* staged learning toast — ONE toast per distill run, morphing in place:
     Stage A "Signal detected" (the actual failed thing) → Stage B "Analyzing…"
     (pulsing dots) → Stage C "Solution found" (PROBLEM → SOLUTION cards) or
     C-alt "Already known" (muted). Tokens only; cards are border-only per design rules. */
  .ltoast.staged .lt-body{margin-top:6px}
  .ltoast .lt-sig{font:500 11px/1.5 var(--mono);color:var(--warning);background:var(--warning-tint);border-radius:7px;padding:6px 8px;word-break:break-word;max-height:52px;overflow:hidden}
  .ltoast.expanded .lt-sig{max-height:none}
  .ltoast .lt-src{color:var(--muted);font-size:10.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ltoast .lt-think{display:inline-flex;gap:3px;margin-left:7px;vertical-align:middle}
  .ltoast .lt-think i{width:4px;height:4px;border-radius:50%;background:var(--purple);opacity:.6}
  .ltoast .lt-sol1{color:var(--secondary);max-height:40px;overflow:hidden;word-break:break-word}
  .ltoast .lt-cards{display:none}
  .ltoast.expanded .lt-cards{display:block}
  .ltoast.expanded .lt-sol1{display:none}
  .ltoast .lt-lesson{border:1px solid var(--line2);border-radius:9px;padding:9px 10px;margin-top:8px}
  .ltoast .lt-k{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
  .ltoast .lt-prob{color:var(--warning);background:var(--warning-tint);border-radius:6px;padding:5px 7px;word-break:break-word}
  .ltoast .lt-sol{color:var(--good);background:var(--success-tint);border-radius:6px;padding:5px 7px;margin-top:6px;word-break:break-word}
  .ltoast .lt-cat{color:var(--muted);font-size:10.5px;margin-top:6px}
  .ltoast.done{border-left-color:var(--good)}
  .ltoast.done .lt-ic{background:var(--success-tint);color:var(--good)}
  .ltoast.mutedc{border-left-color:var(--line3);opacity:.85}
  .ltoast.fading{opacity:0;transition:opacity .6s ease}
  @media (prefers-reduced-motion: no-preference){
    .ltoast .lt-think i{animation:ltPulse 1.05s ease-in-out infinite}
    .ltoast .lt-think i:nth-child(2){animation-delay:.16s}
    .ltoast .lt-think i:nth-child(3){animation-delay:.32s}
  }
  @keyframes ltPulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  /* ── unified turn: prompt → thinking → working → answer read as ONE action ── */
  .turn{max-width:744px;margin:0 auto 36px;animation:msgIn .42s cubic-bezier(.2,.7,.2,1) both}
  .turn>.msg{max-width:none;margin:0;animation:none}
  .turn>.msg.assistant{margin-top:15px}
  .turn .msg.user .content{justify-content:flex-start}
  .turn .msg.user .bubble{background:var(--accent-tint);border:1px solid var(--accent-glow);border-radius:13px;max-width:100%;color:var(--primary);font-size:14.5px;line-height:1.6}
  /* timestamps — Started (top-left) · Completed (bottom-left) · 24h · no icon · no line */
  .turn-time{font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--muted);display:flex;align-items:baseline;gap:8px;user-select:none}
  .turn-start{margin-bottom:14px}
  .turn-end{margin-top:16px;justify-content:space-between}
  .turn-meta{display:inline-flex;align-items:baseline;gap:8px;min-width:0}
  .turn-time .k{color:var(--secondary);font-weight:600;letter-spacing:.4px;text-transform:uppercase;font-size:10px}
  .turn-time .dur{color:var(--secondary)}
  /* row of controls to the RIGHT of the Completed stamp — revealed on turn hover */
  .turn-acts{display:flex;gap:6px;flex:0 0 auto;opacity:0;pointer-events:none;transition:opacity .16s}
  .turn:hover .turn-acts{opacity:1;pointer-events:auto}
  .turn-acts button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 11px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:var(--transition)}
  .turn-acts button:hover{border-color:var(--line3);color:var(--primary);background:var(--panel2)}
  .turn-acts button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  /* read aloud: stop control stays visible while fetching/playing (cluster is hover-revealed otherwise) */
  .act-tts[aria-pressed=true]{color:var(--accent);border-color:var(--accent-border-active)}
  .act-tts.busy .ic{animation:wpulse 1s ease-in-out infinite}
  .turn-acts:has(.act-tts[aria-pressed=true]),.turn-acts:has(.act-tts.busy){opacity:1;pointer-events:auto}

  /* hero / empty */
  .hero{max-width:800px;margin:7vh auto 0;text-align:center;animation:msgIn .5s ease both;padding:0 16px}
  .hero-s{max-width:520px;margin-left:auto;margin-right:auto}
  .hero-mark{width:54px;height:54px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 18px}
  .hero-t{color:var(--primary);font-size:20px;font-weight:650;margin-bottom:8px}
  .hero-s{color:var(--muted);font-size:13.5px;line-height:1.6}

  /* markdown */
  .md{line-height:1.62}
  .md>*:first-child{margin-top:0}
  .md h1,.md h2,.md h3{color:var(--primary);line-height:1.3;margin:1.3em 0 .5em;font-weight:650}
  .md h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:.3em}
  .md h2{font-size:18px}.md h3{font-size:15px}
  .md p,.md li{color:var(--secondary)}
  .md strong{color:var(--primary)}
  .md code{background:var(--veil);padding:1.5px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px;color:var(--accent2)}
  .md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:11px;padding:14px 16px;overflow:auto;margin:.9em 0}
  .md pre code{background:none;padding:0;color:var(--code-fg)}
  .md a{color:var(--accent2);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md-tbl{overflow-x:auto;border:1px solid var(--line2);border-radius:10px;margin:1.1em 0}
  .md-tbl table{border-collapse:collapse;width:100%;font-size:13.5px;margin:0}
  .md th,.md td{padding:9px 14px;text-align:left;vertical-align:top}
  .md thead th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line2);white-space:nowrap}
  .md tbody td{border-top:1px solid var(--line);color:var(--secondary)}
  .md tbody tr:first-child td{border-top:none}
  .md tbody tr:nth-child(even) td{background:var(--veil-2)}
  .md tbody tr:hover td{background:var(--veil)}
  .md blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:2px 0 2px 14px;color:var(--muted)}
  .md ul,.md ol{padding-left:22px}
  .md li{margin:.25em 0}
  .md .md-img{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:.5em 0;display:block;cursor:zoom-in;transition:border-color .15s ease,filter .15s ease}
  .md .md-img:hover{border-color:var(--accent);filter:brightness(1.05)}
  /* figure wrapper: hover reveals fullscreen + download without opening the viewer */
  .md .md-fig{position:relative;display:block;margin:.5em 0;max-width:100%;width:fit-content}
  .md .md-fig .md-img{margin:0}
  .md-acts{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s ease;z-index:2}
  .md-fig:hover .md-acts,.md-acts:focus-within{opacity:1}
  .md-acts button,.md-acts a{width:30px;height:30px;border:0;border-radius:8px;background:rgba(18,18,22,.72);color:#E0E0E0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .md-acts button:hover,.md-acts a:hover{background:rgba(18,18,22,.95)}
  .md a[data-path]{color:var(--accent2);border-bottom:1px dashed var(--accent-border-active)}
  .md a[data-path]:hover{border-bottom-style:solid;text-decoration:none}

  /* Claude-style chat prose — brighter, airier than the file viewer; scoped to chat */
  .msg.assistant .body p,.msg.assistant .body li{color:var(--prose)}
  .msg.assistant .body p{margin:0 0 1em}
  .msg.assistant .body>*:last-child{margin-bottom:0}
  .msg.assistant .body h1,.msg.assistant .body h2,.msg.assistant .body h3{margin:1.15em 0 .5em;border:none;padding:0}
  .msg.assistant .body h1{font-size:19px}
  .msg.assistant .body h2{font-size:16.5px}
  .msg.assistant .body h3{font-size:14.5px}
  .msg.assistant .body ul,.msg.assistant .body ol{margin:.55em 0;padding-left:24px}
  .msg.assistant .body li{margin:.32em 0}
  .msg.assistant .body pre{border-radius:10px;background:var(--code-bg);margin:1em 0}
  .msg.assistant .body code{font-size:13px}
  .msg.assistant .body>hr{border:none;border-top:1px solid var(--line);margin:1.4em 0}
  .msg.assistant .body tbody td{color:var(--prose)}
  .msg.assistant .body .md-tbl{border-color:var(--line3)}

  /* chat-media: inline image previews (thumbnail grid + solo) + file chips + dead refs */
  .cm-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .cm-shot{padding:0;margin:0;border:1px solid var(--border-default);border-radius:6px;background:var(--bg-secondary);cursor:pointer;overflow:hidden;width:104px;display:flex;flex-direction:column;font-family:inherit;text-align:left;transition:border-color .15s ease,filter .15s ease}
  .cm-shot:hover{border-color:var(--border-hover);filter:brightness(1.06)}
  .cm-shot:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .cm-shot img{width:104px;height:78px;object-fit:cover;display:block;background:var(--bg-tertiary)}
  .cm-cap{font-size:11px;line-height:1.3;color:var(--text-secondary);padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
  .cm-shot.cm-solo{width:auto;max-width:320px}
  .cm-shot.cm-solo img{width:auto;max-width:320px;height:auto;max-height:260px;object-fit:contain}
  .cm-shot.cm-solo .cm-cap{max-width:320px}
  .cm-more{width:104px;height:104px;border:1px dashed var(--border-default);border-radius:6px;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:border-color .15s ease,color .15s ease}
  .cm-more:hover{border-color:var(--border-hover);color:var(--text-primary)}
  .cm-more:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .cm-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border:1px solid var(--border-default);border-radius:var(--radius-pill);background:var(--bg-secondary);color:var(--text-secondary);font-size:12px;text-decoration:none;vertical-align:baseline;cursor:pointer;transition:border-color .15s ease,color .15s ease}
  .ent-chip{display:inline;color:var(--accent-text);text-decoration:none;border-bottom:1px dotted var(--accent-border-active);cursor:pointer}
  .ent-chip:hover{color:var(--accent);border-bottom-style:solid}
  .dp-backlinks{margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dp-backlinks .bl-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-right:4px}
  .dp-backlinks .bl-orphan{font-size:12px;color:var(--warning);background:var(--warning-tint);border:1px solid var(--warning);border-radius:var(--radius-btn);padding:5px 9px}
  .dp-backlinks .bl-chip{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-pill);padding:2px 9px;font-size:11px;font-family:var(--mono);cursor:pointer}
  .dp-backlinks .bl-chip:hover{color:var(--primary);border-color:var(--line2)}
  .dp-backlinks .bl-k{font-size:9px;color:var(--muted);text-transform:uppercase;margin-right:5px}
  .cm-chip:hover{border-color:var(--border-hover);color:var(--text-primary)}
  .cm-chip .cm-ic{display:inline-flex;width:16px;height:16px;flex:0 0 auto}
  .cm-chip .cm-ic svg{width:16px;height:16px}
  .cm-chip.cm-dead{cursor:default;color:var(--text-muted);border-style:dashed;background:none}
  .cm-chip.cm-dead:hover{border-color:var(--border-default);color:var(--text-muted)}
  .cm-chip .cm-dead-tag{font-size:10px;color:var(--text-muted);opacity:.85}
  /* file chip = [ open ][ download ]. Download stays visible (not hover-only) so it
     is discoverable on touch, where there is no hover. */
  .cm-chip{padding-right:3px}
  .md .cm-chip a.cm-open{display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none;border-bottom:none}
  .md .cm-chip a.cm-dl{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;flex:0 0 auto;margin-left:1px;border-radius:50%;border-bottom:none;color:var(--text-muted);text-decoration:none;transition:background .15s ease,color .15s ease}
  .md .cm-chip a.cm-dl:hover{background:var(--bg-tertiary);color:var(--accent-text)}
  .cm-chip.cm-dead{padding-right:9px}

  /* version guard: unobtrusive "app updated" banner (never yanks an in-use tab) */
  .ver-banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:8px 8px 8px 16px;box-shadow:0 6px 24px var(--overlay,rgba(0,0,0,.3));font-size:13px;color:var(--text-primary)}
  .ver-banner button{border:none;background:var(--accent);color:var(--white);border-radius:var(--radius-btn);padding:6px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .ver-banner button:hover{background:var(--accent-hover)}
  .ver-banner .ver-x{background:none;color:var(--text-muted);padding:6px 8px;font-weight:400}
  .ver-banner .ver-x:hover{background:var(--bg-tertiary);color:var(--text-primary)}

  /* file chips in chat: show a download button on hover */
  .matt{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;color:var(--primary);text-decoration:none}
  .matt .matt-name{color:var(--primary)}
  .matt-dl{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:var(--muted);opacity:0;transition:var(--transition);flex:0 0 auto}

  .pal .results{max-height:46vh;overflow:auto;padding:6px}
  .pal .res{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--secondary)}
  .pal .res .k{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .pal .pal-grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 11px 3px}

  .composer.dropping{border-color:var(--accent);background:var(--accent-tint)}

  /* ───── dashboard (home) ───── */
  .brand-home{display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer;flex:0 1 auto;min-width:0;border-radius:8px;transition:var(--transition)}
  .brand-home:hover{opacity:.85}
  .dash{flex:1;overflow:auto;padding:32px 40px 48px}
  .dash-inner{max-width:1120px;margin:0 auto}
  .dash-head{margin-bottom:30px}
  .dash h2{color:var(--primary);font-size:24px;font-weight:680;letter-spacing:-.02em;margin:0 0 4px}
  .dash .subline{color:var(--muted);font-size:13px}
  .dash section{margin-bottom:30px}
  .dash .lbl{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 13px}
  /* KPI row — even grid, calm monochrome numbers, thin accent bar per metric */
  /* Chief-of-staff board (P2) */
  .rowlbl{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .rowlbl::after{content:'';flex:1;height:1px;background:var(--line)}
  .rowlbl.warn{color:var(--warn)} .rowlbl.danger{color:var(--danger)}
  .dnum{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--primary);font-weight:600}
  .pmini{display:inline-block;width:64px;height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;vertical-align:middle;margin-right:6px}
  .pmini i{display:block;height:100%;background:var(--accent)}
  .tadd{display:flex;gap:6px;margin-bottom:8px}
  .tadd input{flex:1;background:var(--bg-tertiary);border:1px solid var(--input-border);color:var(--primary);border-radius:var(--radius-input);padding:7px 10px;font:inherit;font-size:12.5px;outline:none}
  .tadd input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .hbtn-sm{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-btn);padding:6px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .hbtn-sm:hover{color:var(--primary);border-color:var(--line2)}
  .trow{display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
  .trow:last-child{border-bottom:none}
  .trow.overdue{background:var(--warning-tint);border-radius:var(--radius-btn);padding-left:7px}
  .trow.overdue .ttitle{color:var(--warning)}
  .tchk{width:17px;height:17px;flex:0 0 auto;border-radius:5px;border:1.5px solid var(--input-border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--transparent);padding:0}
  .tchk:hover{border-color:var(--line3)}
  .tchk.on{border-color:var(--success);background:var(--success);color:var(--white) /* approved literal — check on --success fill */}
  .tchk svg{width:11px;height:11px}
  .ttitle{flex:1;min-width:70px;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tover{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--warning);text-transform:uppercase}
  .tchip{background:var(--panel2);border:1px solid var(--line);color:var(--secondary);border-radius:var(--radius-pill);padding:2px 8px;font:inherit;font-size:10.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
  .tchip:hover{color:var(--primary);border-color:var(--line2);background:var(--elev)}
  .tst{border:1px solid var(--line);background:var(--panel2);color:var(--secondary);border-radius:var(--radius-badge);padding:1px 7px;font:inherit;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;cursor:pointer}
  .tst.st-doing{background:var(--bg-elevated);color:var(--text-primary)}   /* greyscale active per override #36 */
  .tst.st-blocked{color:var(--warning);border-color:var(--warning)}
  .tdel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 4px;border-radius:4px;opacity:0}
  .trow:hover .tdel{opacity:1}
  .tdel:hover{color:var(--danger);background:var(--panel2)}
  .envlist{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:4px 2px;line-height:1.7}
  /* P10 — phone-width command post: reading + ruling only */
  @media (max-width:480px){

  }
  .mpo{position:fixed;inset:0;z-index:380;background:var(--bg);display:none;flex-direction:column}
  .mpo.show{display:flex}
  .mpo .mpo-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .mpo .mpo-bar b{flex:1;color:var(--primary);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mpo .mpo-bar button{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--secondary);border-radius:var(--radius-btn);font:inherit;cursor:pointer}
  .mpo .mpo-body{flex:1;overflow:auto;padding:16px;color:var(--secondary);font-size:13.5px;line-height:1.65;white-space:pre-wrap;font-family:var(--mono)}
  .mpo .mpo-acts{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .mpo .mpo-acts button{flex:1;min-height:48px;border-radius:var(--radius-btn);font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--secondary)}
  .mpo .mpo-acts button.ok{background:var(--good);border-color:var(--good);color:var(--white) /* approved literal — on-fill text */}
  .mpo .mpo-acts button.bad{background:var(--danger);border-color:var(--danger);color:var(--white) /* approved literal — on-fill text */}
  /* status pills — the old four card-rows compressed to one glanceable strip */
  .dstrip{display:flex;flex-wrap:wrap;gap:9px}
  .dpill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-pill);padding:8px 14px;color:var(--secondary);font-size:12px;font-family:inherit;cursor:pointer;transition:var(--transition)}
  .dpill:hover{border-color:var(--line2);background:var(--elev);color:var(--primary)}
  .dpill .ic{width:14px;height:14px;color:var(--muted)}
  .dpill .psep{color:var(--muted);margin:0 1px}
  .dpill .pfocus{color:var(--accent2);font-weight:600}
  .dpill .pbad{color:var(--danger);font-weight:600;font-family:var(--mono)}
  /* two-column body: continue (chats) + todos */
  .dash-two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
  .chatnew{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .chatnew .np-draft{margin-top:0}
  /* attention tags — text+border only (no fill: not an active state) */
  .atag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:var(--radius-badge);border:1px solid var(--line);color:var(--secondary);flex:0 0 auto}
  .atag.ask,.atag.decide{color:var(--accent2);border-color:var(--accent-border-active)}
  .atag.over{color:var(--warning);border-color:var(--warning)}
  .atag.fail{color:var(--danger);border-color:var(--danger)}
  .atag.verify{color:var(--purple);border-color:var(--purple)}
  /* Secondary tools — compact pills, distinct icon tint */
  .tools{display:flex;flex-wrap:wrap;gap:9px}
  .tool{display:inline-flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 14px 9px 11px;color:var(--secondary);font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;transition:var(--transition)}
  .tool:hover{border-color:var(--line3);color:var(--primary);background:var(--elev)}
  .tool .ti{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--qc-bg,var(--accent-tint));color:var(--qc,var(--accent2));flex:0 0 26px}
  .tool .ti .ic{width:15px;height:15px}
  .dash-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  /* min-width:0 lets grid items shrink below their nowrap content (long chat titles) */
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px 18px;min-width:0}
  .drow .rt{min-width:0}
  .dcard h3{color:var(--primary);font-size:12.5px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .dcard h3 .ic{color:var(--muted)}
  .dcard h3 .cnt{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500;font-family:var(--mono)}
  .drow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--secondary);cursor:pointer}
  .drow.static{cursor:default}
  .drow:hover:not(.static){background:var(--panel2)}
  .drow .pill{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .drow .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .rmeta{margin-left:auto;color:var(--muted);font-size:11px;flex:0 0 auto;font-family:var(--mono)}
  .np-mod{color:var(--accent2);font-size:11px;font-weight:600;margin:2px 0 3px}
  .np-title{color:var(--primary);font-size:13px;font-weight:600;line-height:1.4}
  .np-draft{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:var(--accent-tint);border:1px solid var(--accent-border-active);color:var(--accent2);border-radius:var(--radius-btn);padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--transition);height:32px}
  .np-draft:hover{background:var(--accent-glow);color:var(--accent2)}
  .dempty{color:var(--muted);font-size:12px;padding:9px 0;font-style:italic}
  @media (max-width:900px){.dash-two{grid-template-columns:1fr}}
  @media (max-width:760px){.dash{padding:22px 16px}.dash-cols{grid-template-columns:1fr}}

  /* recent files (right panel) */
  .recent{padding:0 12px 4px}
  .recent .rf{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--secondary);cursor:pointer;white-space:nowrap;overflow:hidden}
  .recent .rf:hover{background:var(--panel2);color:var(--primary)}
  .recent .rf .ic{color:var(--muted);flex:0 0 auto}
  .recent .rf .nm{overflow:hidden;text-overflow:ellipsis}
  .recent .rf .ago{margin-left:auto;color:var(--muted);font-size:10px;flex:0 0 auto}
  .recent .rempty{color:var(--muted);font-size:11.5px;padding:5px 8px;font-style:italic}

  /* file-type icon tiles */
  .ftile{display:inline-flex;align-items:center;justify-content:center;width:18px;height:22px;border-radius:3px;font-size:7px;font-weight:800;color:#fff;letter-spacing:.2px;flex:0 0 auto;line-height:1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)} /* approved literal — badge depth cue on colored fills, theme-independent */
  .ftile.lg{width:46px;height:56px;border-radius:7px;font-size:13px}
  .ftile.folder{background:none;box-shadow:none;color:var(--accent2)}
  .ftile.folder svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6}
  .ftile.lg.folder svg{stroke-width:1.3}
  .ftile img{width:100%;height:100%;object-fit:cover;border-radius:inherit}

  /* OS-style file explorer (Finder/Windows Explorer) — non-modal, draggable, resizable */
  .expl-wrap{position:fixed;inset:0;z-index:70;display:none;pointer-events:none}
  .expl-wrap.show{display:block}
  .expl{position:fixed;pointer-events:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-modal);display:grid;grid-template-columns:var(--sidew,204px) 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"tb tb" "side main" "side status";overflow:hidden;font-family:var(--sans)}
  .expl-tb{grid-area:tb;display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:grab}
  .expl-tb:active{cursor:grabbing}
  .expl-rs{position:absolute;z-index:6}
  .expl-rs-n{top:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
  .expl-rs-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:ns-resize}
  .expl-rs-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
  .expl-rs-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:ew-resize}
  .expl-rs-ne{top:-4px;right:-4px;width:13px;height:13px;cursor:nesw-resize}
  .expl-rs-nw{top:-4px;left:-4px;width:13px;height:13px;cursor:nwse-resize}
  .expl-rs-se{bottom:-4px;right:-4px;width:13px;height:13px;cursor:nwse-resize}
  .expl-rs-sw{bottom:-4px;left:-4px;width:13px;height:13px;cursor:nesw-resize}
  .expl-nav{display:flex;gap:1px}
  .expl-nav button{width:32px;height:32px;border-radius:8px;background:none;border:1px solid transparent;color:var(--secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
  .expl-nav button:hover:not(:disabled){background:var(--panel2);color:var(--primary);border-color:var(--line)}
  .expl-nav button:disabled{opacity:.3;cursor:default}
  .expl-nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .expl-crumb{display:flex;align-items:center;gap:1px;font-size:12.5px;color:var(--secondary);overflow:hidden;flex:1;white-space:nowrap;min-width:40px}
  .expl-crumb b{color:var(--primary);padding:2px 5px;overflow:hidden;text-overflow:ellipsis}
  .expl-crumb a{color:var(--secondary);cursor:pointer;padding:2px 5px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
  .expl-crumb a:hover{background:var(--panel2);color:var(--primary)}
  .expl-crumb .sep{color:var(--muted);opacity:.6;flex:0 0 auto}
  .expl-crumb a.dragover,.expl-tree .en.dragover,.expl-row.dir.dragover,.expl-item.dir.dragover{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
  .expl-search{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--input-border);border-radius:8px;height:32px;padding:0 9px;width:190px;flex:0 0 auto}
  .expl-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .expl-search svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
  .expl-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--primary);font:inherit;font-size:12.5px}
  .expl-search .clr{cursor:pointer;color:var(--muted);border:0;background:none;font-size:14px;display:none;padding:0 2px}
  .expl-search.has .clr{display:block}
  .expl-search .rc{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;letter-spacing:.5px}
  .expl-search .rc.on{background:var(--bg-elevated);color:var(--text-primary)}   /* greyscale toggle rule */
  .expl-viewtog{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto;height:32px}
  .expl-viewtog button{width:32px;height:30px;background:none;border:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .expl-viewtog button.on{background:var(--bg-elevated);color:var(--text-primary)}   /* greyscale toggle rule */
  .expl-viewtog svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
  .expl-side{grid-area:side;border-right:1px solid var(--line);overflow:auto;padding:8px 6px;font-size:12.5px}
  .expl-side .shead{display:flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px 4px;cursor:pointer;user-select:none;border-radius:6px}
  .expl-side .shead:hover{color:var(--secondary)}
  .expl-side .shead .sch{width:10px;height:10px;display:inline-flex;transition:transform .12s}
  .expl-side .shead.closed .sch{transform:rotate(-90deg)}
  .expl-side .shead .sch svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.6}
  .expl-side .sbody.closed{display:none}
  .expl-tree .en.broken{opacity:.45}
  .expl-tree .en .fx{margin-left:auto;flex:0 0 auto;width:16px;height:16px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:11px;padding:0}
  .expl-tree .en:hover .fx{display:inline-flex}
  .expl-tree .en .fx:hover{color:var(--danger)}
  .expl-tree .en{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;color:var(--secondary);cursor:default;white-space:nowrap;user-select:none}
  .expl-tree .en:hover{background:var(--panel2)}
  .expl-tree .en.on{background:var(--accent-tint);color:var(--primary)}
  .expl-tree .en .tw{width:14px;height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:transform .12s}
